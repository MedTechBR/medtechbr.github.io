<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório de Alta de Enfermagem — Checklist de Orientações</title>
<style>
  :root{
    --petrol:#0e4f52;
    --petrol-dark:#093a3c;
    --petrol-soft:#e4efee;
    --ink:#17282a;
    --muted:#5d6f70;
    --line:#d3dedd;
    --paper:#ffffff;
    --bg:#eef2f1;
    --accent:#c0632a;
    --alert:#b4362f;
    --alert-soft:#fbecea;
    --ok:#1f7a4d;
    --radius:10px;
    --sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:var(--bg);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--petrol);
    color:#fff;
    border-bottom:3px solid var(--accent);
  }
  .topbar-inner{
    max-width:1280px;margin:0 auto;
    padding:12px 20px;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  }
  .brand-logo{display:flex;align-items:center;flex:none;
    background:#fff;border-radius:12px;padding:4px;box-shadow:0 1px 3px rgba(0,0,0,.18);}
  .brand{display:flex;flex-direction:column;line-height:1.2;margin-right:auto;}
  .brand b{font-size:16px;letter-spacing:.3px;}
  .brand span{font-size:12px;opacity:.82;letter-spacing:.4px;text-transform:uppercase;}
  .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    font-family:inherit;font-size:13.5px;font-weight:600;
    border:1px solid rgba(255,255,255,.32);
    background:rgba(255,255,255,.08);
    color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;transition:.15s;
  }
  .btn:hover{background:rgba(255,255,255,.2);}
  .btn.primary{background:var(--accent);border-color:var(--accent);}
  .btn.primary:hover{background:#a9531f;}
  .btn:focus-visible{outline:3px solid #ffd9a8;outline-offset:2px;}

  /* ---------- Layout ---------- */
  .layout{
    max-width:1280px;margin:0 auto;padding:22px 20px 60px;
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:26px;align-items:start;
  }
  @media(max-width:940px){.layout{grid-template-columns:1fr;}}

  /* ---------- Controls (left) ---------- */
  .controls{min-width:0;}
  .card{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:16px;overflow:hidden;
  }
  .card > h2{
    margin:0;font-size:13px;letter-spacing:.6px;text-transform:uppercase;
    color:var(--petrol);background:var(--petrol-soft);
    padding:11px 16px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:8px;
  }
  .card-body{padding:14px 16px;}

  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
  .field-grid .full{grid-column:1/-1;}
  @media(max-width:520px){.field-grid{grid-template-columns:1fr;}}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
  .field input,.field textarea{
    width:100%;font-family:inherit;font-size:14px;color:var(--ink);
    border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#fbfdfc;
  }
  .field textarea{resize:vertical;min-height:64px;}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--petrol);box-shadow:0 0 0 3px var(--petrol-soft);}

  /* checklist groups */
  .group + .group{border-top:1px solid var(--line);}
  .group-head{
    width:100%;text-align:left;background:none;border:none;cursor:pointer;
    font-family:inherit;padding:12px 16px;display:flex;align-items:center;gap:10px;
    font-size:13.5px;font-weight:700;color:var(--ink);
  }
  .group-head:hover{background:#f6faf9;}
  .group-head .chev{margin-left:auto;transition:transform .18s;color:var(--muted);font-size:12px;}
  .group.collapsed .chev{transform:rotate(-90deg);}
  .group-count{
    font-size:11px;font-weight:700;color:var(--petrol);background:var(--petrol-soft);
    border-radius:20px;padding:1px 9px;min-width:20px;text-align:center;
  }
  .group-count.zero{color:var(--muted);background:#eef1f0;}
  .group-items{padding:2px 16px 12px;}
  .group.collapsed .group-items{display:none;}

  .opt{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px dashed #e7eeec;}
  .opt:first-child{border-top:none;}
  .opt input[type=checkbox]{
    width:18px;height:18px;margin-top:2px;accent-color:var(--petrol);cursor:pointer;flex:none;
  }
  .opt label{font-size:14px;cursor:pointer;user-select:none;}
  .opt small{display:block;color:var(--muted);font-size:12px;margin-top:1px;}
  .opt.is-alert label b{color:var(--alert);}

  /* ---------- Preview (right) ---------- */
  .preview-wrap{position:sticky;top:78px;}
  @media(max-width:940px){.preview-wrap{position:static;}}
  .paper{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:30px 34px;min-height:400px;box-shadow:0 1px 3px rgba(0,0,0,.05);
    font-size:14px;
  }
  .doc-header{border-bottom:none;padding-bottom:0;margin-bottom:16px;}
  .doc-table{width:100%;border-collapse:collapse;}
  .doc-table > thead > tr > td,
  .doc-table > tfoot > tr > td,
  .doc-table > tbody > tr > td{padding:0;border:none;vertical-align:top;}
  .doc-hdr-img{display:block;width:100%;height:auto;margin-bottom:14px;}
  .doc-ftr-img{display:block;width:100%;height:auto;margin-top:26px;}
  .doc-brand{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
  .doc-brand svg{flex:none;}
  .doc-brand-text{line-height:1.08;}
  .doc-brand-text .l1{font-size:17px;font-weight:800;color:#5b6670;letter-spacing:.4px;}
  .doc-brand-text .l2{font-size:17px;font-weight:800;color:var(--accent);letter-spacing:.4px;}
  .doc-hospital{font-size:13px;font-weight:700;color:var(--petrol-dark);letter-spacing:.2px;margin-bottom:2px;}
  .doc-title{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);font-weight:700;margin-top:2px;}
  .doc-id{display:grid;grid-template-columns:1fr 1fr;gap:4px 26px;margin-bottom:20px;font-size:13px;}
  .doc-id .full{grid-column:1/-1;}
  .doc-id .row b{color:var(--muted);font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.4px;display:block;}
  .doc-id .row span{color:var(--ink);}
  @media(max-width:520px){.doc-id{grid-template-columns:1fr;}}

  .block{margin-bottom:18px;break-inside:avoid;}
  .block h3{
    font-size:13.5px;margin:0 0 6px;color:var(--petrol-dark);
    display:flex;align-items:center;gap:8px;
    border-left:4px solid var(--petrol);padding-left:9px;
  }
  .block ul{margin:0;padding-left:20px;}
  .block li{margin:3px 0;line-height:1.5;}
  .block.alert{background:var(--alert-soft);border:1px solid #f0cdc9;border-radius:8px;padding:12px 14px 12px;}
  .block.alert h3{color:var(--alert);border-left-color:var(--alert);}

  .doc-footer{margin-top:30px;padding-top:8px;font-size:13px;}
  .sign-line{margin-top:44px;border-top:1px solid var(--ink);width:320px;padding-top:5px;color:var(--muted);font-size:12.5px;}
  .empty{color:var(--muted);text-align:center;padding:60px 20px;font-style:italic;}

  .hint{font-size:12px;color:var(--muted);margin:0 0 14px;}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:11px 20px;border-radius:8px;font-size:14px;
    opacity:0;pointer-events:none;transition:.25s;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- Print ---------- */
  @media print{
    /* margem 0 remove o cabeçalho/rodapé do navegador (URL do arquivo e número de página) */
    @page{margin:0;}
    html,body{background:#fff;}
    .topbar,.controls,.hint,.toast{display:none !important;}
    .layout{display:block;padding:0;max-width:none;}
    .preview-wrap{position:static;}
    .paper{border:none;box-shadow:none;border-radius:0;padding:0;}
    /* cabeçalho e rodapé oficiais ocupam a largura total (full bleed) e se repetem em cada página */
    .doc-hdr-img{margin:0;}
    .doc-ftr-img{margin:0;}
    /* margens internas do conteúdo (thead/tfoot já reservam o espaço do cabeçalho/rodapé) */
    .doc-table > tbody > tr > td{padding:8mm 14mm 10mm;}
    .block{break-inside:avoid;}
    .block.alert{background:#fff !important;border:1.5px solid var(--alert);}
  }
</style>

</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <span class="brand-logo" aria-hidden="true">
      <svg viewBox="0 0 100 100" width="42" height="42" role="img">
        <defs>
          <linearGradient id="tbLogoG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3fb6ac"/><stop offset="1" stop-color="#0c6b62"/>
          </linearGradient>
          <clipPath id="tbLogoClip"><rect x="6" y="6" width="88" height="88" rx="22"/></clipPath>
        </defs>
        <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#tbLogoG)"/>
        <g clip-path="url(#tbLogoClip)">
          <circle cx="20" cy="78" r="34" fill="#2ba7cf" opacity=".55"/>
          <path d="M60 6 L94 6 L94 40 Z" fill="#0a5b53" opacity=".7"/>
          <circle cx="86" cy="90" r="30" fill="#0a544c" opacity=".55"/>
        </g>
        <path d="M42 26 h16 v16 h16 v16 h-16 v16 h-16 v-16 h-16 v-16 h16 z" fill="#fff"/>
      </svg>
    </span>
    <div class="brand">
      <b>Relatório de Alta de Enfermagem</b>
      <span>Hospital Regional do Sertão Central</span>
    </div>
    <div class="actions">
      <button class="btn" id="btnClear">Limpar</button>
      <button class="btn" id="btnCopy">Copiar texto</button>
      <button class="btn primary" id="btnPrint">Imprimir / PDF</button>
    </div>
  </div>
</div>

<div class="layout">
  <!-- ============ CONTROLES ============ -->
  <div class="controls">
    <p class="hint">Preencha a identificação e marque os itens que se aplicam ao paciente. As orientações correspondentes são geradas automaticamente no relatório ao lado.</p>

    <div class="card">
      <h2>Identificação</h2>
      <div class="card-body">
        <div class="field-grid">
          <div class="field full"><label>Unidade / Hospital</label><input id="f_hospital" type="text" placeholder="Nome da instituição"></div>
          <div class="field full"><label>Nome do paciente</label><input id="f_nome" type="text" placeholder="Nome completo"></div>
          <div class="field"><label>Data de nascimento</label><input id="f_nasc" type="text" placeholder="__/__/____"></div>
          <div class="field"><label>Idade</label><input id="f_idade" type="text" placeholder="Ex.: 68 anos"></div>
          <div class="field"><label>Registro / Prontuário</label><input id="f_pront" type="text"></div>
          <div class="field"><label>Setor / Leito</label><input id="f_setor" type="text"></div>
          <div class="field"><label>Data da alta</label><input id="f_alta" type="text" placeholder="__/__/____"></div>
          <div class="field"><label>Acompanhante / Cuidador</label><input id="f_cuidador" type="text"></div>
          <div class="field full"><label>Diagnóstico / Motivo da internação</label><input id="f_dx" type="text"></div>
          <div class="field full"><label>Enfermeiro(a) responsável — COREN</label><input id="f_enf" type="text"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Riscos e situações</h2>
      <div id="groups"></div>
    </div>

    <div class="card">
      <h2>Orientações adicionais</h2>
      <div class="card-body">
        <div class="field"><textarea id="f_extra" placeholder="Digite orientações específicas para este paciente (opcional). Aparecem ao final do relatório."></textarea></div>
      </div>
    </div>
  </div>

  <!-- ============ RELATÓRIO ============ -->
  <div class="preview-wrap">
    <div class="paper" id="doc"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   BASE DE CONHECIMENTO — grupos, itens e orientações
   Fácil de editar: cada item tem id, label, hint (opcional),
   alert (destaque) e o array "or" com as orientações.
============================================================ */
const DATA = [
 { g:"Cuidados gerais", open:true, items:[
   { id:"repouso", label:"Repouso e retorno às atividades",
     or:["Nos primeiros 3 a 7 dias, alternar repouso com pequenas caminhadas dentro de casa; aumentar a distância e o tempo um pouco a cada dia, conforme a tolerância.",
         "Não levantar peso acima de 2 kg (ex.: sacola de compras, criança de colo, balde com água) até liberação da equipe — em geral por 4 a 6 semanas após cirurgia abdominal.",
         "Evitar dirigir enquanto estiver usando analgésicos que causem sonolência ou enquanto houver dor que limite o movimento rápido dos braços e pernas.",
         "Se surgir tontura, falta de ar, palpitação, dor ou cansaço acima do habitual durante uma atividade, parar imediatamente, sentar-se e descansar antes de continuar."] },
   { id:"hidratacao", label:"Hidratação",
     or:["Beber cerca de 6 a 8 copos de água por dia (aproximadamente 1,5 a 2 litros), salvo restrição de líquidos orientada pela equipe (ex.: insuficiência cardíaca ou renal).",
         "Distribuir a ingestão ao longo do dia e reduzir à noite para não atrapalhar o sono com idas ao banheiro.",
         "Aumentar a oferta de líquidos em dias quentes e nos episódios de febre, diarreia ou vômitos, oferecendo também soro caseiro ou de reidratação.",
         "Sinais de que está bebendo pouco: urina escura e com cheiro forte, boca seca, tontura ao levantar — nesses casos, aumentar os líquidos."] },
   { id:"alimentacao", label:"Alimentação",
     or:["Fazer de 5 a 6 refeições menores por dia (3 principais + 2 a 3 lanches), em horários regulares, mastigando bem e comendo devagar.",
         "Priorizar frutas, verduras, legumes, cereais integrais e fontes de proteína (ovo, frango, peixe, feijão) para favorecer a cicatrização e a recuperação.",
         "Reduzir sal, açúcar, frituras, embutidos (salsicha, presunto) e ultraprocessados; evitar refrigerantes e alimentos muito gordurosos.",
         "Lavar as mãos e higienizar frutas e verduras com água tratada (deixar de molho 10 min em solução com 1 colher de sopa de água sanitária própria para alimentos por litro, depois enxaguar)."] },
   { id:"higiene", label:"Higiene e ambiente",
     or:["Tomar banho diário com água morna e sabão neutro; secar bem as dobras da pele (virilha, axilas, entre os dedos) para prevenir assaduras e micoses.",
         "Lavar as mãos com água e sabão por pelo menos 20 segundos antes das refeições, antes de manusear feridas/dispositivos e após usar o banheiro.",
         "Manter o quarto arejado, com janela aberta parte do dia, e a roupa de cama trocada quando suja ou úmida.",
         "Manter o ambiente organizado, sem acúmulo de poeira, para reduzir risco de infecções e alergias respiratórias."] },
 ]},

 { g:"Risco de queda", items:[
   { id:"queda", label:"Prevenção de quedas", hint:"Idoso, mobilidade reduzida, sedativos, tontura",
     or:["Retirar tapetes soltos, fios no chão e objetos no caminho; fixar tapetes com fita antiderrapante quando não for possível removê-los.",
         "Deixar uma luz acesa ou uma lâmpada de tomada no trajeto do quarto até o banheiro durante a noite.",
         "Usar sempre calçado fechado, firme e com sola antiderrapante, inclusive dentro de casa — não andar de meias ou chinelo frouxo.",
         "Ao sair da cama, sentar-se primeiro na beira por 1 a 2 minutos, depois levantar devagar para evitar tontura por queda de pressão.",
         "Instalar barras de apoio no box e ao lado do vaso sanitário; usar cadeira ou banco no banho se houver fraqueza ou cansaço fácil.",
         "Manter à mão (na mesa de cabeceira) celular, óculos, água e itens de uso frequente para evitar deslocamentos desnecessários.",
         "Pedir ajuda para caminhar sempre que houver fraqueza, tontura ou uso de remédios que dão sono (calmantes, alguns analgésicos)."] },
 ]},

 { g:"Ferida e curativo", items:[
   { id:"ferida", label:"Ferida operatória / cirúrgica",
     or:["Lavar as mãos antes de tocar a ferida; limpar a incisão apenas com água e sabão neutro no banho, deixando a água escorrer, sem esfregar com bucha ou esponja.",
         "Secar a região dando leves batidinhas com toalha limpa ou gaze, no sentido de cima para baixo, sem friccionar.",
         "Não aplicar pomadas, álcool, mertiolate, pó de café, borra, ervas ou qualquer produto caseiro sem orientação da equipe.",
         "Manter a incisão protegida do sol por pelo menos 6 meses para evitar escurecimento da cicatriz.",
         "Procurar atendimento se a ferida abrir, se a vermelhidão ao redor aumentar (mais de 1 cm), ou se surgir calor, inchaço, dor crescente, saída de pus ou secreção com mau cheiro e febre acima de 37,8 °C."] },
   { id:"curativo", label:"Cuidados com o curativo / troca",
     or:["Lavar bem as mãos e reunir o material limpo (gaze, soro fisiológico 0,9%, fita) antes de iniciar a troca; nunca reutilizar gaze ou luva.",
         "Limpar a ferida com soro fisiológico, do centro para fora, usando cada gaze uma única vez; trocar o curativo na frequência orientada (habitualmente 1 vez ao dia ou sempre que sujar/molhar).",
         "Para o banho, proteger o curativo com plástico/filme e trocá-lo em seguida se ainda assim molhar.",
         "Comparecer à UBS para as trocas quando indicado e guardar o material em local limpo e seco.",
         "Comunicar à equipe se a ferida piorar de aspecto, tiver mais secreção que o habitual ou se o curativo não estiver mais aderindo."] },
   { id:"pontos", label:"Retirada de pontos / grampos",
     or:["Retornar à unidade de saúde na data indicada para retirada — em geral 7 a 10 dias para pontos de pele; feridas em áreas de dobra ou costas podem precisar de mais tempo, conforme orientação.",
         "Não cortar nem puxar os pontos/grampos em casa por conta própria.",
         "Até a retirada, evitar molhar em excesso, esfregar a área e fazer movimentos que estiquem a cicatriz (agachar, alongar demais a região).",
         "Se um ponto se soltar sozinho antes da data, ou a ferida abrir, procurar a unidade de saúde."] },
 ]},

 { g:"Pele e lesão por pressão", items:[
   { id:"acamado", label:"Paciente acamado / restrito ao leito",
     or:["Mudar a posição (decúbito) a cada 2 horas, revezando: barriga para cima, lado direito e lado esquerdo — anotar os horários ajuda a não esquecer.",
         "Usar travesseiros ou coxins para aliviar a pressão em calcanhares, cotovelos, quadril e região das costas/sacro; não apoiar diretamente sobre proeminências ósseas.",
         "Manter a pele limpa, seca e hidratada com creme; trocar fralda e roupa úmida assim que perceber, secando bem a região.",
         "Deixar o lençol bem esticado, sem dobras, migalhas ou objetos sob o corpo, e evitar arrastar o paciente ao reposicionar (levantar, não puxar, para não ferir a pele).",
         "Inspecionar a pele todos os dias, principalmente nas áreas de apoio; comunicar se aparecer vermelhidão que não some ao aliviar a pressão, bolha ou pele endurecida.",
         "Manter a cabeceira elevada no máximo 30° quando possível, para reduzir o cisalhamento na região do sacro."] },
   { id:"lpp", label:"Cuidados com lesão por pressão existente",
     or:["Realizar o curativo da lesão exatamente na técnica, no produto e na frequência orientados pela equipe.",
         "Aliviar totalmente a pressão sobre a lesão: não deitar sobre ela e usar coxins/travesseiros de reposicionamento.",
         "Manter a região limpa e proteger a pele ao redor da umidade (urina, fezes, suor).",
         "Reforçar a alimentação rica em proteínas (carnes, ovo, feijão, leite) e a hidratação, pois isso acelera a cicatrização.",
         "Comunicar se a lesão aumentar de tamanho ou profundidade, tiver mais secreção, mau cheiro, ou se a pele ao redor ficar vermelha, quente ou dolorida."] },
 ]},

 { g:"Dispositivos urinários", items:[
   { id:"svd", label:"Sonda vesical de demora (SVD)",
     or:["Manter a bolsa coletora sempre abaixo do nível da bexiga (inclusive ao andar ou sentar) e nunca encostada no chão, para evitar refluxo de urina e infecção.",
         "Fixar a sonda na coxa ou no abdome com fita/fixador, deixando uma folga para não tracionar a uretra ao se mover.",
         "Não dobrar, torcer nem desconectar a sonda da bolsa; se precisar desconectar, limpar as conexões com álcool 70%.",
         "Higienizar a região íntima e a sonda com água e sabão 2 vezes ao dia e após evacuação, no sentido de dentro para fora.",
         "Esvaziar a bolsa pela torneira inferior quando atingir cerca de 2/3 da capacidade, sem encostar a ponta em superfícies; lavar as mãos antes e depois.",
         "Observar a urina: comunicar se parar de sair urina por mais de 4 a 6 horas, se houver sangue, urina turva com mau cheiro, febre, calafrios ou dor no pé das costas (região lombar)."] },
   { id:"coletor", label:"Cateterismo intermitente / coletor",
     or:["Realizar o cateterismo nos horários orientados (habitualmente a cada 4 a 6 horas) para não deixar a bexiga muito cheia.",
         "Lavar bem as mãos e higienizar a região íntima antes de cada cateterismo; usar sonda nova ou higienizada conforme a técnica ensinada.",
         "Anotar horário e volume de urina drenada quando a equipe solicitar, para acompanhamento.",
         "No coletor externo (dispositivo tipo camisinha), trocar diariamente e observar a pele do pênis, comunicando vermelhidão ou ferida.",
         "Comunicar dor ou dificuldade para passar a sonda, sangramento, urina turva com mau cheiro ou febre."] },
 ]},

 { g:"Nutrição por sonda", items:[
   { id:"sonda", label:"Sonda nasoenteral / nasogástrica",
     or:["Manter a cabeceira elevada entre 30° e 45° durante a dieta e por pelo menos 30 a 60 minutos após, para evitar que o alimento retorne e vá para o pulmão (broncoaspiração).",
         "Antes de cada dieta, conferir se a marca de fixação da sonda continua na mesma posição do início — se mudou, não administrar e comunicar a equipe.",
         "Lavar a sonda com 20 a 40 mL de água filtrada/fervida (com seringa) antes e depois da dieta e de cada medicação, para não entupir.",
         "Administrar a dieta em temperatura ambiente e na velocidade orientada (correr devagar, sem empurrar rápido); medicações trituradas e diluídas uma a uma, lavando entre elas.",
         "Manter a fixação no nariz limpa e trocada quando descolar, revezando o ponto de apoio para não ferir a narina.",
         "Interromper e comunicar imediatamente se houver tosse, engasgo, falta de ar, vômito, saída/deslocamento da sonda ou barriga muito estufada e dolorida."] },
   { id:"gtt", label:"Gastrostomia (GTT)",
     or:["Limpar a pele ao redor do estoma diariamente com água e sabão neutro e secar bem; observar vermelhidão, secreção, mau cheiro, sangramento ou dor.",
         "Girar suavemente a sonda 360° uma vez ao dia (quando orientado) para evitar aderências, mantendo o disco/fixador externo justo à pele, sem apertar.",
         "Administrar dieta e medicações com a cabeceira elevada (30–45°), lavando a sonda com água antes e depois para não entupir.",
         "Não tracionar a sonda; se houver risco de puxão, prender a extensão à roupa.",
         "Comunicar saída acidental da sonda (é urgência — o orifício fecha em poucas horas), vazamento importante de dieta ao redor, ferida ou pele avermelhada que piora."] },
 ]},

 { g:"Estomias", items:[
   { id:"estomia", label:"Colostomia / Ileostomia / Urostomia",
     or:["Esvaziar a bolsa quando estiver entre 1/3 e 1/2 cheia (não deixar encher demais, pois o peso descola a placa); trocar o sistema conforme o tipo — em geral a cada 3 a 5 dias ou se houver vazamento.",
         "Na troca, remover a placa com cuidado (de cima para baixo, apoiando a pele), lavar a região só com água e sabão neutro sem esfregar, e secar completamente antes de aplicar a nova placa.",
         "Recortar a abertura da placa no tamanho exato do estoma (cerca de 2 a 3 mm além da borda) para proteger a pele ao redor; usar o molde/medidor fornecido.",
         "Observar o estoma, que deve ser rosado/avermelhado e úmido: comunicar se ficar pálido, roxo/escuro, com sangramento que não para, ou se a pele ao redor ficar vermelha, ferida ou com bolhas.",
         "Na ileostomia, atenção redobrada à hidratação e ao sal, pois a perda de líquidos é maior; procurar atendimento se a bolsa encher de líquido muito frequentemente (diarreia de alto débito) ou se não sair nada por horas com dor e inchaço na barriga."] },
 ]},

 { g:"Drenos e cateteres", items:[
   { id:"dreno", label:"Dreno (portovac, penrose, tubular)",
     or:["Manter o dreno bem fixo à pele/roupa e o coletor sempre abaixo do nível de inserção, sem tracionar; no portovac, manter o sistema comprimido (a sanfona murcha) para funcionar como sucção.",
         "Esvaziar e registrar volume, cor e aspecto da drenagem conforme orientado (habitualmente 1 vez ao dia), lavando as mãos antes e depois.",
         "Manter o curativo ao redor do dreno limpo e seco, trocando se sujar ou molhar.",
         "Comunicar saída acidental ou parcial do dreno, aumento súbito do volume, drenagem que fica avermelhada/sanguinolenta de novo, secreção com pus, mau cheiro ou febre."] },
   { id:"picc", label:"Acesso venoso central / PICC",
     or:["Manter o curativo do cateter limpo, seco e bem colado; protegê-lo com plástico durante o banho e nunca deixar molhar.",
         "Não cortar, dobrar nem tracionar o cateter; evitar carregar peso, medir pressão ou fazer esforço com o braço do PICC.",
         "Trocar o curativo apenas na unidade de saúde, na frequência orientada (em geral a cada 7 dias ou antes se descolar/sujar).",
         "Comunicar imediatamente vermelhidão, inchaço, dor ou endurecimento no trajeto da veia, saída de secreção, febre/calafrios, ou se o cateter sair, rachar ou vazar."] },
 ]},

 { g:"Hemodiálise", items:[
   { id:"cateter_hd", label:"Cateter de hemodiálise (duplo lúmen / permcath)", hint:"Cateter venoso central para diálise",
     or:["O cateter é de uso EXCLUSIVO da hemodiálise: nunca abrir as tampas, manipular, coletar sangue ou administrar soro/medicações por ele fora da sessão de diálise.",
         "Manter o curativo sempre limpo, seco e bem fixo; a troca deve ser feita apenas na unidade de diálise/saúde, com técnica estéril, na frequência orientada (em geral a cada sessão ou se molhar, sujar ou descolar).",
         "Nunca molhar o cateter: no banho, proteger com plástico/filme impermeável bem vedado; não tomar banho de imersão (banheira), mar ou piscina.",
         "Manter os clamps (travas) sempre fechados quando o cateter não estiver em uso; se uma conexão se soltar ou houver sangramento, fechar o clamp, comprimir o local com gaze limpa e procurar atendimento IMEDIATAMENTE (risco de perda de sangue e de entrada de ar na circulação).",
         "Evitar roupas apertadas no pescoço/tórax, não puxar o cateter e não dormir sobre ele; manter o cateter preso ao curativo para não tracionar.",
         "Observar e comunicar sinais de infecção — febre ou calafrios (principalmente durante ou logo após a diálise), vermelhidão, calor, inchaço, dor ou saída de pus/secreção no local de inserção: a infecção de cateter é grave e exige atendimento rápido.",
         "Comunicar também se o cateter sair do lugar, rachar ou vazar, ou se houver dificuldade de fluxo (o sangue não circula bem) durante a sessão.",
         "Comparecer a TODAS as sessões de hemodiálise nos dias e horários agendados, sem faltar, e seguir as orientações da equipe de nefrologia sobre restrição de líquidos, sal, potássio e fósforo."] },
   { id:"fav_hd", label:"Fístula arteriovenosa (FAV) / enxerto para hemodiálise", hint:"Acesso no braço para diálise",
     or:["Sentir o frêmito (a vibração/‘ronronar’ do sangue passando) sobre a fístula pelo menos 2 a 3 vezes ao dia, colocando a ponta dos dedos sobre o acesso; se a vibração sumir ou enfraquecer, ou o braço ficar frio, pálido, dormente ou muito doloroso, procurar atendimento IMEDIATAMENTE — a fístula pode ter coagulado (trombose) e há poucas horas para tentar recuperá-la.",
         "NÃO deixar aferir pressão arterial, coletar sangue, puncionar, colocar acesso venoso ou soro no braço da fístula — avisar sempre a qualquer profissional que for mexer no braço.",
         "Não usar relógio, pulseira, faixas nem roupa de manga apertada no braço da fístula; não carregar peso, não apoiar a cabeça sobre o braço e não dormir sobre ele.",
         "Manter a pele do braço sempre limpa e hidratada; lavar o local do acesso com água e sabão antes de cada sessão de hemodiálise.",
         "Após a diálise, manter os curativos dos pontos de punção por algumas horas; se sangrar, comprimir suavemente com gaze limpa por alguns minutos SEM apertar a ponto de parar o frêmito — se o sangramento não parar, procurar atendimento.",
         "Fazer os exercícios de fortalecimento do braço (ex.: apertar uma bolinha) quando orientado pela equipe, para ajudar a fístula a se desenvolver.",
         "Observar e comunicar vermelhidão, calor, dor, inchaço, pus ou um abaulamento (dilatação) que aumenta de tamanho sobre a fístula.",
         "Comparecer a todas as sessões de hemodiálise nos dias e horários agendados."] },
 ]},

 { g:"Respiratório", items:[
   { id:"o2", label:"Oxigenoterapia domiciliar",
     or:["Usar o oxigênio exatamente no fluxo prescrito (litros/minuto) e pelo tempo indicado — não aumentar nem diminuir por conta própria, mesmo sentindo falta de ar.",
         "Manter o equipamento a pelo menos 2 metros de fogão, vela, aquecedor e qualquer chama; proibir totalmente fumar no ambiente (risco de incêndio/explosão).",
         "Lavar a cânula/máscara com água e sabão neutro a cada 1 a 2 dias e trocar a água do umidificador diariamente por água filtrada/fervida.",
         "Passar creme hidratante ao redor do nariz e orelhas para evitar feridas da cânula; se a narina ressecar, umidificar conforme orientação.",
         "Procurar atendimento se a falta de ar piorar mesmo com o oxigênio, se lábios/unhas ficarem arroxeados, se houver confusão, agitação ou sonolência excessiva."] },
   { id:"tqt", label:"Traqueostomia",
     or:["Lavar bem as mãos antes e depois de qualquer manipulação da cânula, cadarço ou curativo.",
         "Manter a cânula bem fixa pelo cadarço, com folga de 1 a 2 dedos no pescoço; ao trocar o cadarço ou o curativo, segurar firme a cânula para que ela NÃO saia do lugar.",
         "Limpar a cânula interna (endocânula) e a pele ao redor do estoma na frequência orientada, mantendo a região limpa e seca; trocar a gaze/curativo sempre que umedecer ou sujar.",
         "Aspirar as secreções quando houver ruído, chiado, tosse ou dificuldade para respirar, usando técnica limpa e sonda adequada, por no máximo 10 a 15 segundos por vez, sem forçar.",
         "Umidificar o ar (nebulização com soro fisiológico conforme orientação) e aumentar a ingestão de líquidos, se permitido; se a secreção estiver espessa, instilar soro fisiológico antes de aspirar para facilitar a saída.",
         "Proteger a traqueostomia da entrada de água, poeira e insetos: usar um protetor/‘babador’ próprio de traqueostomia (que filtra e umidifica o ar sem bloquear a respiração); no banho, evitar que a água entre no orifício e NUNCA mergulhar a cabeça na água.",
         "Não cobrir o orifício com roupas de gola alta, colares, lenços, algodão ou talco/pó que possam obstruir a passagem de ar.",
         "Manter boa higiene da boca (escovação e enxágue) e não fumar nem permitir fumaça no ambiente.",
         "Manter sempre por perto uma cânula reserva do mesmo número (e uma de número menor), além do material de aspiração, para uma eventual troca de urgência.",
         "Procurar atendimento URGENTE se houver muita dificuldade para respirar, saída acidental da cânula, sangramento pela traqueostomia, secreção espessa/amarelo-esverdeada ou com sangue, vermelhidão/dor/mau cheiro no estoma ou febre."] },
 ]},

 { g:"Condições clínicas", items:[
   { id:"diabetes", label:"Diabetes / controle glicêmico",
     or:["Medir a glicemia capilar nos horários orientados (ex.: jejum e 2 h após as principais refeições) e anotar os valores num caderno para levar à consulta.",
         "Aplicar a insulina na dose e horário prescritos, alternando o local (barriga, coxa, braço) a cada aplicação para não formar caroços; manter a insulina fechada na geladeira e a em uso em temperatura ambiente por até ~28 dias.",
         "Reconhecer a hipoglicemia (tremor, suor frio, tontura, fome súbita, confusão): se glicemia abaixo de 70 mg/dL ou sintomas, ingerir na hora 15 g de açúcar rápido (1 colher de sopa de açúcar em água, ou 150 mL de suco/refrigerante comum) e remedir em 15 minutos; se não melhorar, repetir e procurar ajuda.",
         "Inspecionar os pés todos os dias (inclusive entre os dedos e a sola, com espelho se necessário) procurando feridas, bolhas ou rachaduras; usar calçado fechado e confortável e não andar descalço.",
         "Procurar atendimento se a glicemia estiver persistentemente alta (acima de 250–300 mg/dL), se houver vômitos, muita sede e urina, hálito adocicado, ou ferida no pé que não cicatriza."] },
   { id:"has", label:"Hipertensão / controle da pressão",
     or:["Aferir a pressão nos horários orientados, sentado, em repouso de 5 minutos, sem ter fumado ou tomado café antes, e anotar os valores com data e horário.",
         "Tomar os anti-hipertensivos todos os dias, no mesmo horário, mesmo com a pressão normal ou sentindo-se bem — não suspender por conta própria.",
         "Reduzir o sal para menos de 1 colher de chá rasa por dia no total: evitar temperos prontos, caldos em cubo, embutidos e enlatados; temperar com alho, cebola, limão e ervas.",
         "Evitar excesso de álcool, manter peso adequado e praticar atividade física leve conforme liberação médica.",
         "Procurar atendimento se a pressão estiver muito alta (ex.: acima de 180/110 mmHg) com dor de cabeça forte, dor no peito, falta de ar, alteração na visão ou fraqueza/dormência em um lado do corpo."] },
   { id:"anticoag", label:"Anticoagulação (varfarina / outros)",
     or:["Tomar o anticoagulante todos os dias no mesmo horário, exatamente na dose prescrita; se esquecer uma dose, não dobrar a próxima — seguir a orientação da bula/equipe.",
         "Realizar o exame de controle (INR) nas datas marcadas quando usar varfarina (Marevan®); a dose pode mudar conforme o resultado, então guardar os laudos.",
         "Manter constância na alimentação de folhas verde-escuras (couve, brócolis, espinafre) quando usar varfarina — não é preciso cortar, mas evitar variações bruscas de quantidade.",
         "Usar escova de dentes macia e barbeador elétrico, e ter cuidado com objetos cortantes para reduzir sangramentos.",
         "Informar que usa anticoagulante em qualquer consulta, dentista, exame ou procedimento, e antes de tomar qualquer remédio novo (inclusive anti-inflamatórios como diclofenaco/ibuprofeno, que aumentam o risco de sangramento).",
         "Procurar atendimento se houver sangramento que não para, sangue na urina ou nas fezes (fezes pretas), vômito com sangue, manchas roxas espontâneas, dor de cabeça forte e súbita ou após qualquer queda/batida na cabeça."] },
   { id:"respiratorio", label:"Doença respiratória (DPOC / asma)",
     or:["Usar as bombinhas (inaladores) na técnica correta: agitar, expirar, disparar sincronizado com a inspiração lenta e profunda, prender a respiração por 10 segundos — usar espaçador quando disponível.",
         "Após corticoide inalatório, enxaguar a boca e cuspir para prevenir candidíase (sapinho) e rouquidão.",
         "Diferenciar as medicações de manutenção (uso diário contínuo) das de alívio/resgate (usar na falta de ar) e não abandonar as de manutenção quando estiver bem.",
         "Evitar fumaça de cigarro, poeira, produtos de limpeza com cheiro forte, mofo e mudanças bruscas de temperatura; manter as vacinas de gripe e pneumonia em dia.",
         "Procurar atendimento se a falta de ar piorar, se precisar da bombinha de alívio com frequência muito maior que o habitual, se houver chiado intenso, ou se a secreção aumentar e ficar amarelada/esverdeada com febre."] },
 ]},

 { g:"Medicações e dor", items:[
   { id:"medicacao", label:"Uso correto das medicações",
     or:["Seguir a lista de medicamentos da alta: nome, para que serve, dose e horário; conferir com a equipe se algum remédio que usava antes foi suspenso ou substituído.",
         "Usar um organizador semanal de comprimidos ou uma tabela de horários colada em local visível; associar às refeições ajuda a não esquecer.",
         "Se esquecer uma dose, tomar assim que lembrar; se já estiver perto do próximo horário, pular a esquecida e não dobrar a dose.",
         "Guardar os remédios em local fresco, seco e longe do alcance de crianças e animais; não guardar no banheiro (umidade) e conferir a validade.",
         "Não tomar chás, fitoterápicos ou remédios por conta própria sem avisar a equipe, pelo risco de interação."] },
   { id:"atb", label:"Antibiótico — completar o tratamento",
     or:["Tomar o antibiótico até o último dia prescrito, mesmo que os sintomas melhorem antes — parar cedo favorece a volta da infecção e a resistência bacteriana.",
         "Respeitar rigorosamente o intervalo entre as doses (ex.: de 8 em 8 h significa manhã, tarde e noite em horários fixos) para manter o efeito no sangue.",
         "Verificar se o antibiótico deve ser tomado com ou sem alimento e evitar bebida alcoólica durante o tratamento.",
         "Comunicar reações como manchas/coceira na pele, inchaço no rosto ou lábios e falta de ar (podem ser alergia — procurar atendimento imediato), ou diarreia intensa e prolongada."] },
   { id:"dor", label:"Controle da dor",
     or:["Tomar o analgésico prescrito nos horários fixos indicados (não esperar a dor ficar forte para tomar) e nunca ultrapassar a dose máxima diária.",
         "Não associar por conta própria dois remédios com a mesma substância (ex.: vários com paracetamol/dipirona) para não exceder a dose.",
         "Usar medidas de conforto: posicionamento adequado, compressa, repouso e apoio da região dolorida ao tossir ou se mover.",
         "Comunicar à equipe se a dor não aliviar com a medicação, se piorar progressivamente ou se mudar de característica (ex.: ficar em pontada, com febre ou inchaço)."] },
 ]},

 { g:"Sinais de alerta e retorno", open:true, items:[
   { id:"alerta", label:"Sinais de alerta — quando procurar atendimento", alert:true,
     or:["Procurar imediatamente o serviço de saúde se apresentar: febre acima de 38 °C persistente ou com calafrios; falta de ar ou cansaço para respirar; dor no peito; sangramento que não para; confusão mental, desmaio ou muita sonolência.",

         "Em situação de emergência (dor no peito, falta de ar grave, desmaio, sinais de AVC como boca torta/fraqueza em um lado/fala enrolada), acionar o SAMU 192 ou ir à emergência mais próxima imediatamente."] },
   { id:"retorno", label:"Retorno e acompanhamento",
     or:["Comparecer à consulta de retorno/reavaliação na data agendada, levando este relatório de alta, a lista de medicamentos e os exames realizados.",
         "Agendar o acompanhamento na Unidade Básica de Saúde (UBS/ESF) de referência para dar continuidade ao tratamento e às trocas de curativo/receitas.",
         "Levar os resultados de exames pendentes ao médico assim que ficarem prontos.",
         "Manter o cartão de vacinas atualizado e garantir os medicamentos de uso contínuo antes que acabem, evitando ficar sem doses."] },
 ]},

/* ============================================================
   RENDERIZAÇÃO DOS CONTROLES
============================================================ */
const groupsEl = document.getElementById('groups');
DATA.forEach((grp,gi)=>{
  const g = document.createElement('div');
  g.className = 'group' + (grp.open?'':' collapsed');
  const total = grp.items.length;

  const head = document.createElement('button');
  head.className='group-head';
  head.type='button';
  head.innerHTML = `<span class="group-count zero" data-count>0</span><span>${grp.g}</span><span class="chev">▼</span>`;
  head.addEventListener('click', ()=> g.classList.toggle('collapsed'));

  const box = document.createElement('div');
  box.className='group-items';
  grp.items.forEach(it=>{
    const row = document.createElement('div');
    row.className = 'opt' + (it.alert?' is-alert':'');
    const cbId = 'cb_'+it.id;
    row.innerHTML = `
      <input type="checkbox" id="${cbId}" data-id="${it.id}">
      <label for="${cbId}">${it.alert?'<b>':''}${it.label}${it.alert?'</b>':''}
        ${it.hint?`<small>${it.hint}</small>`:''}
      </label>`;
    box.appendChild(row);
  });

  g.appendChild(head);
  g.appendChild(box);
  groupsEl.appendChild(g);
});

/* pré-preenche a unidade */
if(!val('f_hospital')) ID('f_hospital').value = 'Hospital Regional do Sertão Central';

function selectedItems(){
  const out = [];
  DATA.forEach(grp => grp.items.forEach(it => {
    const cb = document.getElementById('cb_'+it.id);
    if(cb && cb.checked) out.push(it);
  }));
  return out;
}

function render(){
  // atualizar contadores por grupo
  document.querySelectorAll('.group').forEach((g,gi)=>{
    const c = DATA[gi].items.filter(it=>document.getElementById('cb_'+it.id).checked).length;
    const badge = g.querySelector('[data-count]');
    badge.textContent = c;
    badge.classList.toggle('zero', c===0);
  });

  const items = selectedItems();
  const hosp = val('f_hospital');

  /* ---- corpo do documento (vai no <tbody>) ---- */
  let body = '';
  if(hosp && hosp.toLowerCase()!=='hospital regional do sertão central')
    body += `<div class="doc-hospital">${esc(hosp)}</div>`;
  body += `<div class="doc-title">Relatório de Alta — Orientações de Enfermagem</div>`;

  const idRows = [];
  const push = (label,v,full)=>{ if(v) idRows.push(`<div class="row ${full?'full':''}"><b>${label}</b><span>${v}</span></div>`); };
  push('Paciente', esc(val('f_nome')), true);
  push('Data de nascimento', esc(val('f_nasc')));
  push('Idade', esc(val('f_idade')));
  push('Registro / Prontuário', esc(val('f_pront')));
  push('Setor / Leito', esc(val('f_setor')));
  push('Data da alta', esc(val('f_alta')));
  push('Acompanhante / Cuidador', esc(val('f_cuidador')));
  push('Diagnóstico / Motivo', esc(val('f_dx')), true);
  if(idRows.length) body += `<div class="doc-id">${idRows.join('')}</div>`;

  if(items.length===0 && !val('f_extra')){
    body += `<div class="empty">Marque os riscos e situações no painel ao lado para gerar as orientações.</div>`;
  } else {
    items.forEach(it=>{
      const cls = it.alert ? 'block alert' : 'block';
      const lis = it.or.map(o=>`<li>${esc(o)}</li>`).join('');
      body += `<div class="${cls}"><h3>${it.alert?'⚠ ':''}${esc(it.label)}</h3><ul>${lis}</ul></div>`;
    });
    const extra = val('f_extra');
    if(extra){
      const lines = extra.split(/\n+/).filter(Boolean).map(l=>`<li>${esc(l)}</li>`).join('');
      body += `<div class="block"><h3>Orientações específicas</h3><ul>${lines}</ul></div>`;
    }
    body += `<div class="doc-footer"><div class="sign-line">Enfermeiro(a) responsável — ${esc(val('f_enf'))||'________________'}</div></div>`;
  }

  /* ---- monta a tabela: thead (cabeçalho) e tfoot (rodapé) repetem em cada página impressa ---- */
  doc.innerHTML = `<table class="doc-table">
    <thead><tr><td><img class="doc-hdr-img" src="${HDR_IMG}" alt="Hospital Regional do Sertão Central — ISGH — Governo do Estado do Ceará / Secretaria da Saúde"></td></tr></thead>
    <tfoot><tr><td><img class="doc-ftr-img" src="${FTR_IMG}" alt="CNPJ 05.268.526/0016-57 — Rodovia CE 060, KM 198 — Quixeramobim/CE — Fone (88) 3406.1300"></td></tr></tfoot>
    <tbody><tr><td>${body}</td></tr></tbody>
  </table>`;
}
function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* ============================================================
   TEXTO SIMPLES (copiar)
============================================================ */
function plainText(){
  let t = [];
  const hosp = val('f_hospital'); if(hosp) t.push(hosp.toUpperCase());
  t.push('RELATÓRIO DE ALTA — ORIENTAÇÕES DE ENFERMAGEM');
  t.push('');
  const line=(l,v)=>{ if(v) t.push(l+': '+v); };
  line('Paciente', val('f_nome'));
  line('Data de nascimento', val('f_nasc'));
  line('Idade', val('f_idade'));
  line('Registro/Prontuário', val('f_pront'));
  line('Setor/Leito', val('f_setor'));
  line('Data da alta', val('f_alta'));
  line('Acompanhante/Cuidador', val('f_cuidador'));
  line('Diagnóstico/Motivo', val('f_dx'));
  t.push('');
  selectedItems().forEach(it=>{
    t.push((it.alert?'⚠ ':'')+it.label.toUpperCase());
    it.or.forEach(o=>t.push('  • '+o));
    t.push('');
  });
  const extra = val('f_extra');
  if(extra){ t.push('ORIENTAÇÕES ESPECÍFICAS'); extra.split(/\n+/).filter(Boolean).forEach(l=>t.push('  • '+l)); t.push(''); }
  t.push('Enfermeiro(a) responsável: '+(val('f_enf')||'____________________'));
  return t.join('\n');
}

/* ============================================================
   EVENTOS
============================================================ */
/* Rascunho automático (localStorage) — o formulário é longo e preenchido à beira-leito;
   sem isto, recarregar a aba ou o Safari reciclar a página apagava tudo. */
const DRAFT_KEY='altaenf_draft_v1';
function collectDraft(){const d={fields:{},checks:[]};document.querySelectorAll('[id]').forEach(el=>{if(!el.matches('input, textarea, select'))return;if(el.type==='checkbox'||el.type==='radio'){if(el.checked)d.checks.push(el.id);}else if(el.id)d.fields[el.id]=el.value;});return d;}
function saveDraft(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify(collectDraft()));}catch(e){}}
function loadDraft(){let d;try{d=JSON.parse(localStorage.getItem(DRAFT_KEY));}catch(e){}if(!d)return;if(d.fields)for(const k in d.fields){const el=document.getElementById(k);if(el)el.value=d.fields[k];}if(Array.isArray(d.checks))d.checks.forEach(id=>{const c=document.getElementById(id);if(c)c.checked=true;});}
/* re-render por tecla reconstrói o #doc inteiro (com os 2 PNG do cabeçalho/rodapé) —
   debounce evita o travamento no celular ao digitar nas orientações. */
let _renderTimer=null;
function scheduleRender(){if(_renderTimer)clearTimeout(_renderTimer);_renderTimer=setTimeout(()=>{_renderTimer=null;render();},150);}
document.addEventListener('input', ()=>{saveDraft();scheduleRender();});
document.addEventListener('change', ()=>{saveDraft();render();});

document.getElementById('btnPrint').addEventListener('click', ()=>window.print());

document.getElementById('btnCopy').addEventListener('click', async ()=>{
  const txt=plainText();
  try{ await navigator.clipboard.writeText(txt); toast('Texto copiado para a área de transferência'); return; }
  catch(e){}
  // fallback p/ webview / contexto sem a API de clipboard
  try{
    const ta=document.createElement('textarea'); ta.value=txt;
    ta.style.cssText='position:fixed;left:-9999px;top:0'; document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok=document.execCommand('copy'); ta.remove();
    toast(ok?'Texto copiado para a área de transferência':'Não consegui copiar — selecione o texto e copie manualmente');
  }catch(e){ toast('Não consegui copiar — selecione o texto e copie manualmente'); }
});

document.getElementById('btnClear').addEventListener('click', ()=>{
  if(!confirm('Limpar todos os campos e marcações?')) return;
  document.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=false);
  document.querySelectorAll('input[type=text], textarea').forEach(i=>i.value='');
  try{localStorage.removeItem(DRAFT_KEY);}catch(e){}
  render();
  toast('Formulário limpo');
});

let toastTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}

loadDraft();
render();
</script>
