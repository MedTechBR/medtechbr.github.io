<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MedTech — seus apps médicos</title>
<meta name="description" content="Portal MedTech: todos os seus apps médicos em um só lugar, com uma conta.">
<meta name="theme-color" content="#0A0E14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MedTech">
<script>window.MT_APP={id:"portal",name:"MedTech"};</script>
<script src="_mtfb.js?v=1"></script>
<script type="module" src="_mtauth.js?v=9"></script>
<style>
:root{--accent:#4C8DFF;--accent-d:#2f6ae0;--accent2:#38E1C6;--glow:rgba(76,141,255,.42);
--petrol:#4C8DFF;--petrol-dark:#2f6ae0;--mint:#38E1C6;--ink:#E7EEF7;--muted:#8A98AC;--dim:#5A6B80;
--bg:#0A0E14;--surface:#111823;--panel2:#0E141D;--soft:rgba(76,141,255,.12);--line:rgba(88,166,255,.12);--line-strong:rgba(140,160,185,.16);--ok:#3FB950;--danger:#F85149;
--disp:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--shadow:0 10px 34px -14px rgba(0,0,0,.65)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;letter-spacing:-.011em;background-image:radial-gradient(1100px 460px at 84% -10%,rgba(76,141,255,.12),transparent 60%),radial-gradient(840px 460px at 4% 110%,rgba(56,225,198,.06),transparent 55%),linear-gradient(rgba(140,160,185,.032) 1px,transparent 1px),linear-gradient(90deg,rgba(140,160,185,.032) 1px,transparent 1px);background-size:auto,auto,34px 34px,34px 34px;background-attachment:fixed}
header{background:rgba(10,14,20,.72);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 0;padding-top:calc(12px + env(safe-area-inset-top));position:sticky;top:0;z-index:20}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:11px;font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:-.02em;color:var(--ink)}
.logo .mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-d));display:grid;place-items:center;flex:0 0 auto;box-shadow:0 6px 20px var(--glow),inset 0 1px 0 rgba(255,255,255,.25)}
.logo .mark svg{width:21px;height:21px}
.logo .wm b{color:var(--accent)}
.subtitle{color:var(--muted);font-size:11px;margin-top:3px;font-family:var(--mono);letter-spacing:.03em;text-transform:uppercase}
.usr{display:flex;align-items:center;gap:9px}
.usr .who{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.3;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usr button{color:var(--ink);font-size:13px;font-weight:500;background:rgba(140,160,185,.06);border:1px solid var(--line-strong);border-radius:10px;padding:8px 12px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.usr button:hover{background:rgba(76,141,255,.12);border-color:var(--accent);color:#fff}
main{max-width:1060px;margin:0 auto;padding:26px 20px calc(30px + env(safe-area-inset-bottom))}
.hello-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.hello-row h1{font-family:var(--disp);font-size:24px;color:var(--ink);font-weight:600;letter-spacing:-.02em}
.btnrow{display:flex;gap:9px;align-items:center}
.install{background:linear-gradient(145deg,var(--accent),var(--accent-d));color:#fff;border:none;border-radius:11px;padding:10px 15px;font-weight:600;font-size:13.5px;font-family:var(--disp);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;box-shadow:0 8px 22px var(--glow)}
.install:hover{filter:brightness(1.08)}
.ghost{background:rgba(140,160,185,.05);color:var(--ink);border:1px solid var(--line-strong);border-radius:11px;padding:9px 14px;font-weight:500;font-size:13.5px;cursor:pointer;font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.ghost:hover{background:rgba(76,141,255,.10);border-color:var(--accent)}
.ghost i,.install i{font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:15px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:13px;text-decoration:none;color:inherit;padding:17px;border-radius:15px;background:linear-gradient(160deg,var(--surface),var(--panel2));border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .14s,border-color .14s,box-shadow .14s;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;inset:0;border-radius:15px;background:radial-gradient(120px 70px at 88% 0,rgba(76,141,255,.12),transparent 70%);opacity:0;transition:opacity .18s;pointer-events:none}
.card:hover{transform:translateY(-3px);border-color:rgba(76,141,255,.4);box-shadow:0 14px 40px -14px rgba(76,141,255,.35)}
.card:hover::after{opacity:1}
.card .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:23px;background:rgba(76,141,255,.12);color:var(--accent);border:1px solid rgba(76,141,255,.18);box-shadow:inset 0 0 14px rgba(76,141,255,.10)}
.card:active{transform:scale(.99)}
.card .nm{font-family:var(--disp);font-weight:600;font-size:14px;text-align:left;color:var(--ink);line-height:1.2;letter-spacing:-.01em}
.card .nm b{color:var(--accent)}
.note{background:rgba(56,225,198,.06);border:1px solid rgba(56,225,198,.18);border-radius:12px;padding:12px 15px;font-size:12.5px;color:#bfeee6;margin-top:24px;display:flex;align-items:center;gap:10px;font-family:var(--mono)}
.note b{color:var(--accent2);font-weight:600}
.note i{font-size:18px;color:var(--accent2);flex:0 0 auto}
footer{text-align:center;color:var(--dim);font-size:12px;padding:22px;font-family:var(--mono)}
footer a{color:var(--muted);font-weight:500;text-decoration:none}footer a:hover{color:var(--accent)}
.sug-modal{position:fixed;inset:0;background:rgba(4,7,12,.7);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:80}
.sug-box{background:linear-gradient(160deg,var(--surface),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:22px;max-width:460px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 24px 60px -20px #000}
.sug-box h3{margin-bottom:6px;color:var(--ink);font-family:var(--disp)}
.sug-box p.sub{color:var(--muted);font-size:13px;margin-bottom:8px;line-height:1.5}
.sug-box label{display:block;font-weight:600;font-size:13px;margin:10px 0 5px;color:var(--muted)}
.sug-box select,.sug-box input,.sug-box textarea{width:100%;padding:11px 12px;border:1px solid var(--line-strong);border-radius:10px;font-size:16px;font-family:inherit;background:var(--panel2);color:var(--ink)}
.sug-box textarea{min-height:110px;resize:vertical;line-height:1.5}
.sug-box select:focus,.sug-box input:focus,.sug-box textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,141,255,.15)}
.sug-row{display:flex;gap:10px;margin-top:16px}
.sug-row .b{flex:1;border:none;border-radius:10px;padding:11px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.sug-row .ok{background:linear-gradient(145deg,var(--accent),var(--accent-d));color:#fff;box-shadow:0 8px 22px var(--glow)}
.sug-row .ok:hover{filter:brightness(1.08)}
.sug-row .cancel{background:rgba(140,160,185,.06);color:var(--ink);border:1px solid var(--line-strong)}
.cfg-sec{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:rgba(140,160,185,.03)}
.cfg-sec h4{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px;display:flex;align-items:center;gap:7px;font-family:var(--disp)}
.cfg-sec .desc{font-size:12.5px;color:var(--muted);margin:2px 0 8px;line-height:1.5}
.cfg-msg{font-size:12.5px;margin-top:8px;min-height:14px;line-height:1.5}
.cfg-msg.ok{color:var(--ok)}.cfg-msg.err{color:var(--danger)}
@media(max-width:560px){main{padding:16px 14px calc(18px + env(safe-area-inset-bottom))}.hello-row{margin-bottom:15px}.hello-row h1{font-size:18px}.subtitle{display:none}.grid{grid-template-columns:repeat(3,1fr);gap:11px}.card{padding:13px;gap:10px;border-radius:13px}.card .ic{width:40px;height:40px;font-size:20px;border-radius:11px}.card .nm{font-size:12px}.note{font-size:11.5px;margin-top:17px;padding:11px 13px}footer{padding:16px;font-size:11px}}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div>
      <div class="logo"><span class="mark"><svg viewBox="0 0 96 96"><path d="M18 50 h13 l7 -20 9 38 8 -26 5 8 h13" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="wm">Med<b>Tech</b></span></div>
      <div class="subtitle">Todos os seus apps, uma conta só</div>
    </div>
    <div class="usr" id="usr"></div>
  </div>
</header>

<main>
  <div class="hello-row">
    <h1 id="hello">Bem-vindo</h1>
    <div class="btnrow">
      <button class="ghost" id="btnSug" onclick="openSug()"><i class="ti ti-bulb" aria-hidden="true"></i>Sugestão</button>
      <button class="install" id="btnInstall" hidden><i class="ti ti-download" aria-hidden="true"></i>Instalar</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="note"><i class="ti ti-shield-check" aria-hidden="true"></i><span><b>Login único:</b> entre uma vez e todos os apps abrem logados, na mesma janela.</span></div>
</main>

<footer>© 2026 <a href="index.html">MedTech</a> · <a href="privacidade.html">Privacidade</a> · <a href="termos.html">Termos</a></footer>

<script>
const BASE = 'https://medtechbr.github.io/';
const APPS = [
  { nm:'Foco',       ic:'ti-target-arrow',   url:BASE+'foco.html' },
  { nm:'Granaê',     ic:'ti-wallet',         url:BASE+'granae.html' },
  { nm:'MedProvas',  ic:'ti-clipboard-text', url:BASE+'medprovas.html' },
  { nm:'LaudAI',     ic:'ti-report-medical', url:BASE+'laudai.html' },
  { nm:'CondutAI',   ic:'ti-stethoscope',    url:BASE+'condutai.html' },
  { nm:'PaliAI',     ic:'ti-heart-handshake',url:BASE+'paliai.html' },
  { nm:'Guia do Interno', ic:'ti-school',   url:BASE+'guiainterno.html' },
  { nm:'ConsultAI',  ic:'ti-calendar-event', url:BASE+'consultai.html' },
  { nm:'EnfermarIA', ic:'ti-bed',            url:BASE+'enfermaria.html' },
  { nm:'PocusAI',    ic:'ti-scan',           url:BASE+'pocusai.html' },
  { nm:'ATBguia',    ic:'ti-pill',           url:BASE+'atbguia.html' },
  { nm:'PlantãoHub', ic:'ti-clock',          url:BASE+'plantaohub.html' },
  { nm:'CalcMed',    ic:'ti-calculator',     url:BASE+'calcmed.html' },
  { nm:'FlashMed',   ic:'ti-cards',          url:BASE+'flashmed.html' }
];
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function fmtName(nm){ return /(AI|IA)$/.test(nm) ? esc(nm.slice(0,-2))+'<b>'+nm.slice(-2)+'</b>' : esc(nm); }
function card(a){
  // Mesma janela: todos os apps estão no mesmo domínio (medtechbr.github.io),
  // então a navegação fica DENTRO do PWA, sem abrir uma nova janela.
  return `<a class="card" href="${a.url}">
    <span class="ic"><i class="ti ${a.ic}" aria-hidden="true"></i></span>
    <span class="nm">${fmtName(a.nm)}</span>
  </a>`;
}
document.getElementById('grid').innerHTML = APPS.map(card).join('');

/* ===== Sugestões de funções (vão por e-mail para a equipe MedTech) ===== */
const SUG_EMAIL = 'medtechbr1@gmail.com';
function openSug(){
  const u = window.MT && window.MT.user;
  const opts = ['Geral / portal'].concat(APPS.map(a=>a.nm)).map(n=>`<option>${esc(n)}</option>`).join('');
  const wrap = document.createElement('div'); wrap.className='sug-modal'; wrap.id='sugModal';
  wrap.innerHTML = `<div class="sug-box">
    <h3 style="display:flex;align-items:center;gap:8px"><i class="ti ti-bulb" aria-hidden="true"></i>Sugerir uma função</h3>
    <p class="sub">Conte o que você gostaria de ver nos apps MedTech. Sua ideia vai direto para a equipe.</p>
    <label>App</label><select id="sugApp">${opts}</select>
    <label>Sua sugestão</label><textarea id="sugTxt" placeholder="Ex.: no EnfermarIA, poder ordenar os leitos por gravidade..."></textarea>
    <label>Seu contato (opcional)</label><input id="sugContato" value="${esc((u&&u.email)||'')}" placeholder="e-mail ou WhatsApp para retorno">
    <p class="sub" style="margin:10px 0 0">Ao enviar, abre seu app de e-mail com a mensagem já pronta — é só tocar em enviar.</p>
    <div class="sug-row"><button class="b ok" onclick="enviarSug()">Enviar sugestão</button><button class="b cancel" onclick="closeSug()">Cancelar</button></div>
  </div>`;
  wrap.onclick = e => { if(e.target===wrap) closeSug(); };
  document.body.appendChild(wrap);
  setTimeout(()=>{const t=document.getElementById('sugTxt'); if(t) t.focus();},50);
}
function closeSug(){ const m=document.getElementById('sugModal'); if(m) m.remove(); }
function enviarSug(){
  const app = document.getElementById('sugApp').value;
  const txt = document.getElementById('sugTxt').value.trim();
  const contato = document.getElementById('sugContato').value.trim();
  if(!txt){ alert('Escreva sua sugestão antes de enviar.'); return; }
  const u = window.MT && window.MT.user;
  const subject = 'Sugestão MedTech — ' + app;
  const body = 'App: '+app+'\n\nSugestão:\n'+txt+'\n\nContato: '+(contato||'(não informado)')+'\nUsuário logado: '+((u&&u.email)||'(não logado)');
  window.location.href = 'mailto:'+SUG_EMAIL+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  closeSug();
}

/* ===== Configurações (perfil, senha, assinatura) ===== */
const KIWIFY_PORTAL_URL = ''; // portal do cliente Kiwify (definir quando os pagamentos forem configurados)
const SUPORTE_EMAIL = 'medtechbr1@gmail.com';
function cfgVal(id){ const e = document.getElementById(id); return e ? e.value.trim() : ''; }
function openCfg(){
  const u = window.MT && window.MT.user;
  if (!u || u.demo){ alert('Entre na sua conta MedTech para acessar as configurações.'); return; }
  const perfil = (window.MT && MT._data && MT._data.perfil) || {};
  const wrap = document.createElement('div'); wrap.className='sug-modal'; wrap.id='cfgModal';
  wrap.innerHTML = `<div class="sug-box">
    <h3 style="display:flex;align-items:center;gap:8px"><i class="ti ti-settings" aria-hidden="true"></i>Configurações</h3>
    <div class="cfg-sec">
      <h4><i class="ti ti-user" aria-hidden="true"></i>Perfil e cadastro</h4>
      <div class="desc">Seu nome aparece em todos os apps MedTech.</div>
      <label>Nome</label><input id="cfgNome" value="${esc(u.displayName||'')}" placeholder="Seu nome">
      <label>E-mail (login)</label><input value="${esc(u.email||'')}" disabled style="opacity:.65">
      <label>Telefone / WhatsApp</label><input id="cfgFone" value="${esc(perfil.fone||'')}" placeholder="(11) 99999-9999">
      <label>CRM</label><input id="cfgCrm" value="${esc(perfil.crm||'')}" placeholder="Ex.: 123456/SP">
      <label>Especialidade</label><input id="cfgEsp" value="${esc(perfil.esp||'')}" placeholder="Ex.: Clínica Médica">
      <label>Instituição</label><input id="cfgInst" value="${esc(perfil.inst||'')}" placeholder="Hospital / faculdade">
      <div class="sug-row"><button class="b ok" onclick="salvarPerfil()">Salvar perfil</button></div>
      <div class="cfg-msg" id="cfgPerfilMsg"></div>
    </div>
    <div class="cfg-sec">
      <h4><i class="ti ti-lock" aria-hidden="true"></i>Senha</h4>
      <div class="desc">Defina uma nova senha (mín. 6 caracteres) ou receba um link de redefinição por e-mail.</div>
      <label>Nova senha</label><input id="cfgPass1" type="password" placeholder="Nova senha" autocomplete="new-password">
      <label>Confirmar nova senha</label><input id="cfgPass2" type="password" placeholder="Repita a nova senha" autocomplete="new-password">
      <div class="sug-row"><button class="b ok" onclick="alterarSenha()">Alterar senha</button><button class="b cancel" onclick="enviarResetSenha()">Link por e-mail</button></div>
      <div class="cfg-msg" id="cfgSenhaMsg"></div>
    </div>
    <div class="cfg-sec">
      <h4><i class="ti ti-credit-card" aria-hidden="true"></i>Assinatura e pagamento</h4>
      <div class="desc">Seu pagamento é processado com segurança pela Kiwify. Para trocar o cartão, ver faturas ou cancelar, use o portal do cliente — <b>nunca pedimos o número do cartão aqui</b>.</div>
      <div class="sug-row"><button class="b ok" onclick="abrirPagamento()">Gerenciar assinatura / pagamento</button></div>
      <div class="cfg-msg" id="cfgPagMsg"></div>
    </div>
    <div class="sug-row"><button class="b cancel" onclick="closeCfg()">Fechar</button></div>
  </div>`;
  wrap.onclick = e => { if (e.target===wrap) closeCfg(); };
  document.body.appendChild(wrap);
}
function closeCfg(){ const m=document.getElementById('cfgModal'); if (m) m.remove(); }
async function salvarPerfil(){
  const msg=document.getElementById('cfgPerfilMsg'); msg.className='cfg-msg'; msg.textContent='Salvando…';
  try{
    const nome=cfgVal('cfgNome');
    if (window.MT && MT._fb && MT.user && nome && nome!==(MT.user.displayName||'')) { await MT._fb.A.updateProfile(MT.user, {displayName:nome}); }
    const perfil={fone:cfgVal('cfgFone'),crm:cfgVal('cfgCrm'),esp:cfgVal('cfgEsp'),inst:cfgVal('cfgInst')};
    const base=(window.MT && MT._data && typeof MT._data==='object')?MT._data:{};
    if (window.MT && MT.save) await MT.save(Object.assign({}, base, {perfil}));
    msg.className='cfg-msg ok'; msg.textContent='✓ Perfil salvo.';
    refreshUser();
  }catch(e){ msg.className='cfg-msg err'; msg.textContent='Erro ao salvar: '+(e.message||e); }
}
async function alterarSenha(){
  const msg=document.getElementById('cfgSenhaMsg'); msg.className='cfg-msg';
  const p1=cfgVal('cfgPass1'), p2=cfgVal('cfgPass2');
  if (p1.length<6){ msg.className='cfg-msg err'; msg.textContent='A senha deve ter ao menos 6 caracteres.'; return; }
  if (p1!==p2){ msg.className='cfg-msg err'; msg.textContent='As senhas não conferem.'; return; }
  if (!(window.MT && MT._fb && MT.user)){ msg.className='cfg-msg err'; msg.textContent='Sessão indisponível.'; return; }
  const A=MT._fb.A; msg.textContent='Alterando…';
  try{
    await A.updatePassword(MT.user, p1);
    msg.className='cfg-msg ok'; msg.textContent='✓ Senha alterada com sucesso.';
    document.getElementById('cfgPass1').value=''; document.getElementById('cfgPass2').value='';
  }catch(e){
    if (e && e.code==='auth/requires-recent-login'){
      const cur=prompt('Por segurança, confirme sua senha ATUAL para concluir a alteração:');
      if (!cur){ msg.className='cfg-msg err'; msg.textContent='Alteração cancelada.'; return; }
      try{
        const cred=A.EmailAuthProvider.credential(MT.user.email, cur);
        await A.reauthenticateWithCredential(MT.user, cred);
        await A.updatePassword(MT.user, p1);
        msg.className='cfg-msg ok'; msg.textContent='✓ Senha alterada com sucesso.';
        document.getElementById('cfgPass1').value=''; document.getElementById('cfgPass2').value='';
      }catch(e2){ const w=(e2.code==='auth/wrong-password'||e2.code==='auth/invalid-credential'); msg.className='cfg-msg err'; msg.textContent=w?'Senha atual incorreta.':('Não foi possível: '+(e2.message||e2)); }
    } else { msg.className='cfg-msg err'; msg.textContent='Não foi possível: '+(e.message||e); }
  }
}
async function enviarResetSenha(){
  const msg=document.getElementById('cfgSenhaMsg'); msg.className='cfg-msg';
  if (!(window.MT && MT._fb && MT.user)){ msg.className='cfg-msg err'; msg.textContent='Sessão indisponível.'; return; }
  try{ await MT._fb.A.sendPasswordResetEmail(MT._fb.auth, MT.user.email); msg.className='cfg-msg ok'; msg.textContent='✓ Link enviado para '+MT.user.email+'.'; }
  catch(e){ msg.className='cfg-msg err'; msg.textContent='Erro: '+(e.message||e); }
}
function abrirPagamento(){
  const msg=document.getElementById('cfgPagMsg');
  if (KIWIFY_PORTAL_URL){ window.open(KIWIFY_PORTAL_URL,'_blank','noopener'); return; }
  msg.className='cfg-msg'; msg.innerHTML='A área de assinatura está sendo finalizada. Para trocar pagamento, ver faturas ou cancelar, fale com a gente: <a href="mailto:'+SUPORTE_EMAIL+'?subject=Assinatura%20MedTech" style="color:var(--petrol);font-weight:700">'+SUPORTE_EMAIL+'</a>.';
}

/* saudação + sair (via login central MedTech) */
function refreshUser(){
  const u = window.MT && window.MT.user;
  const el = document.getElementById('usr');
  const hello = document.getElementById('hello');
  if (u && !u.demo){
    const nm = u.displayName || u.email || 'Conta';
    el.innerHTML = `<span class="who">${esc(nm)}</span><button id="btnCfg" title="Configurações" aria-label="Configurações"><i class="ti ti-settings" aria-hidden="true"></i></button><button id="btnOut"><i class="ti ti-logout" aria-hidden="true"></i>Sair</button>`;
    document.getElementById('btnOut').onclick = () => window.MT.signOut();
    document.getElementById('btnCfg').onclick = openCfg;
    const first = (u.displayName||'').split(' ')[0];
    hello.textContent = first ? ('Olá, '+first) : 'Bem-vindo';
  } else {
    el.innerHTML = '';
    hello.textContent = 'Bem-vindo';
  }
}
(function waitMT(){ if(window.MT){ MT.onData(refreshUser); refreshUser(); } else setTimeout(waitMT,40); })();

/* PWA: service worker + botão instalar */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferredPrompt = e;
  const b = document.getElementById('btnInstall'); b.hidden = false;
  b.onclick = async () => { b.hidden = true; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; };
});
window.addEventListener('appinstalled', () => { const b=document.getElementById('btnInstall'); if(b) b.hidden=true; });
</script>
