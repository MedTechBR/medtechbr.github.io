<style>
:root{--ink:#fff;--muted:rgba(255,255,255,.6);--dim:rgba(255,255,255,.6);--paper:#000;--line:rgba(255,255,255,.12);--line-strong:rgba(255,255,255,.2);--accent:#fff;--ok:#4ADE80;--danger:#F87171;--fg6:rgba(255,255,255,.06);--fg12:rgba(255,255,255,.12);--fg20:rgba(255,255,255,.2);--ease:cubic-bezier(.16,1,.3,1)}
*{margin:0;padding:0;box-sizing:border-box}
html{background:#000}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--paper);min-height:100vh;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
:focus-visible{outline:2px solid rgba(255,255,255,.6);outline-offset:3px;border-radius:8px}
::selection{background:#fff;color:#000}
/* cabeçalho no vocabulário da landing: preto com blur, fio embaixo, pílulas */
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;min-height:calc(64px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.wrap{max-width:920px;margin:0 auto;padding:0 24px;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wm{font-weight:600;font-size:19px;letter-spacing:-.02em;white-space:nowrap}
.wm b{font-weight:600;color:#fff}
.top-r{display:flex;align-items:center;gap:8px}
.usr{display:flex;align-items:center;gap:8px}
.usr .who{font-size:13px;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usr button,.ghost{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 16px;border-radius:40px;border:0;background:var(--fg12);color:#fff;font:500 13.5px 'Inter',system-ui,sans-serif;cursor:pointer;white-space:nowrap;transition:background-color .2s,color .2s}
.usr button:hover,.ghost:hover{background:var(--fg20);color:#fff}
.usr button i,.ghost i,.install i{font-size:17px;line-height:1}
.install{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 18px;border-radius:40px;border:0;background:#fff;color:#000;font:500 13.5px 'Inter',system-ui,sans-serif;cursor:pointer;white-space:nowrap;transition:background-color .2s}
.install:hover{background:#e6e6e6}
main{padding:56px 0 calc(24px + env(safe-area-inset-bottom))}
.hello{text-align:center;margin-bottom:44px}
.hello h1{font-size:clamp(28px,4vw,38px);font-weight:500;letter-spacing:-.03em;line-height:1.1}
.hello .dt{font-size:14px;color:var(--muted);margin-top:8px}
/* launcher: só os ícones, tiles neutros que acendem no hover */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:32px 14px;justify-items:center;max-width:780px;margin:0 auto;padding:0 22px}
.app{display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:inherit;width:100%}
.app .ic{width:68px;height:68px;border-radius:18px;display:grid;place-items:center;font-size:31px;color:#fff;background:var(--fg12);transition:background-color .2s,color .2s,transform .35s var(--ease)}
.app:hover .ic{background:#fff;color:#000;transform:translateY(-3px)}
.app:active .ic{transform:scale(.97)}
.app .nm{font-size:13px;font-weight:500;color:var(--ink);text-align:center;line-height:1.25}
.app .nm b{font-weight:500;color:inherit}
.fine{text-align:center;font-size:13px;color:var(--muted);margin-top:44px;padding:0 22px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:24px 22px calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--line);margin-top:56px}
footer a{color:var(--muted);text-decoration:none;display:inline-block;padding:10px 2px}footer a:hover{color:#fff}
/* modais: fundo escurecido, caixa opaca com fio */
.sug-modal{position:fixed;inset:0;background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:80}
.sug-box{background:#0F0F0F;border:1px solid var(--line);border-radius:16px;padding:24px;max-width:460px;width:100%;max-height:92vh;overflow:auto}
.sug-box h3{margin-bottom:6px;color:#fff;font-weight:500;font-size:18px;letter-spacing:-.02em}
.sug-box p.sub{color:var(--muted);font-size:13.5px;margin-bottom:8px;line-height:1.5}
.sug-box label{display:block;font-weight:500;font-size:13px;margin:12px 0 6px;color:var(--muted)}
.sug-box select,.sug-box input,.sug-box textarea{width:100%;padding:11px 12px;border:1px solid var(--fg20);border-radius:12px;font-size:16px;font-family:inherit;background:#1F1F1F;color:#fff}
.sug-box textarea{min-height:110px;resize:vertical;line-height:1.5}
.sug-box select:focus,.sug-box input:focus,.sug-box textarea:focus{outline:none;border-color:rgba(255,255,255,.6);box-shadow:none}
.sug-row{display:flex;gap:10px;margin-top:18px}
.sug-row .b{flex:1;border:0;border-radius:999px;padding:11px 14px;min-height:44px;font-weight:500;font-size:14px;cursor:pointer;font-family:inherit;transition:background-color .2s}
.sug-row .ok{background:#fff;color:#000}
.sug-row .ok:hover{background:#e6e6e6}
.sug-row .cancel{background:var(--fg12);color:#fff}
.sug-row .cancel:hover{background:var(--fg20)}
.cfg-sec{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;background:var(--fg6)}
.cfg-sec h4{font-size:14.5px;font-weight:500;color:#fff;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.cfg-sec h4 i{color:var(--muted);font-size:17px}
.cfg-sec .desc{font-size:13px;color:var(--muted);margin:2px 0 8px;line-height:1.5}
.cfg-msg{font-size:13px;margin-top:8px;min-height:14px;line-height:1.5}
.cfg-msg.ok{color:var(--ok)}.cfg-msg.err{color:var(--danger)}
/* Meus apps: catálogo com interruptores */
.link{background:none;border:0;color:var(--muted);font:500 13px 'Inter',system-ui,sans-serif;cursor:pointer;padding:10px 6px;border-radius:999px}
.link:hover{color:#fff}
.apps-cat{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.apps-cat:first-child{margin-top:4px}
.sug-box .apps-row{display:flex;align-items:center;gap:12px;padding:10px 0;margin:0;border-bottom:1px solid var(--line);cursor:pointer;color:#fff;font-size:14px;font-weight:400}
.sug-box .apps-row:hover{background:var(--fg6)}
.sug-box .apps-row:last-child{border-bottom:0}
.apps-row .k{width:38px;height:38px;border-radius:11px;background:var(--fg12);display:grid;place-items:center;font-size:19px;color:#fff;flex:0 0 auto}
.apps-row .t{flex:1;min-width:0}
.apps-row .t b{display:block;font-weight:500;font-size:14.5px}
.apps-row .t small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.sw{position:relative;width:44px;height:26px;flex:0 0 auto}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--fg20);transition:background-color .2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s var(--ease),background-color .2s}
.sw input:checked+span{background:#fff}
.sw input:checked+span::after{transform:translateX(18px);background:#000}
.sw input:focus-visible+span{outline:2px solid rgba(255,255,255,.6);outline-offset:3px}
.perfis{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
.perfil{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--fg12);color:#fff;font:500 13px 'Inter',system-ui,sans-serif;cursor:pointer;transition:background-color .2s,color .2s}
.perfil i{font-size:16px;color:var(--muted)}
.perfil:hover{background:var(--fg20)}
.sug-box .perfil.on{background:#fff;color:#000}.sug-box .perfil.on i{color:#000}
.apps-tools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
.apps-tools .b{flex:0 0 auto;min-height:44px;padding:0 16px;font-size:13px}
.apps-vazio{grid-column:1/-1;text-align:center;color:var(--muted);padding:34px 16px;border:1px dashed var(--fg20);border-radius:16px;font-size:14px;line-height:1.5}
.apps-vazio .b{display:inline-flex;align-items:center;justify-content:center;margin-top:14px;min-height:44px;padding:0 18px;border-radius:999px;background:#fff;color:#000;border:0;font:500 14px 'Inter',system-ui,sans-serif;cursor:pointer}
@media(max-width:560px){.ghost .lbl{display:none}.ghost{width:44px;padding:0;justify-content:center}.ghost i{font-size:19px}}
@media(max-width:560px){.wrap{padding:0 18px}.grid{grid-template-columns:repeat(4,1fr);gap:26px 8px}.app .ic{width:62px;height:62px;border-radius:16px;font-size:29px}.app .nm{font-size:11.5px}.hello{margin-bottom:30px}.hello h1{font-size:26px}main{padding-top:36px}.usr .who{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const BASE = 'https://medtechbr.github.io/';
/* Catálogo de TUDO que o MedTech oferece. O id é o mesmo do trocador de funções (_mtauth.js).
   O que aparece na página é a escolha do usuário (salva na conta, sincroniza entre aparelhos). */
const CATALOGO = [
  { id:'agendaai',      nm:'ConsultAI',        ic:'ti-calendar-event',   url:BASE+'consultai.html',        cat:'Atendimento',          linha:'clinica' },
  { id:'enfermaria',    nm:'EnfermarIA',       ic:'ti-bed',              url:BASE+'enfermaria.html',       cat:'Atendimento',          linha:'clinica' },
  { id:'clinicar',      nm:'Clinicar',         ic:'ti-calendar-heart',   url:BASE+'clinicar/',             cat:'Atendimento',          linha:'clinica', sub:'sistema da clínica · login próprio' },
  { id:'condutai',      nm:'CondutAI',         ic:'ti-stethoscope',      url:BASE+'condutai.html',         cat:'Referência clínica',   linha:'clinica' },
  { id:'atbguia',       nm:'ATBguia',          ic:'ti-pill',             url:BASE+'atbguia.html',          cat:'Referência clínica',   linha:'clinica' },
  { id:'calcmed',       nm:'CalcMed',          ic:'ti-calculator',       url:BASE+'calcmed.html',          cat:'Referência clínica',   linha:'clinica' },
  { id:'paliai',        nm:'PaliAI',           ic:'ti-heart-handshake',  url:BASE+'paliai.html',           cat:'Referência clínica',   linha:'clinica' },
  { id:'guiainterno',   nm:'Guia do Interno',  ic:'ti-school',           url:BASE+'guiainterno.html',      cat:'Referência clínica',   linha:'clinica' },
  { id:'pocusai',       nm:'PocusAI',          ic:'ti-scan',             url:BASE+'pocusai.html',          cat:'Hospital e imagem',    linha:'clinica' },
  { id:'laudai',        nm:'LaudAI',           ic:'ti-report-medical',   url:BASE+'laudai.html',           cat:'Hospital e imagem',    linha:'clinica' },
  { id:'foco',          nm:'Foco',             ic:'ti-target-arrow',     url:BASE+'foco.html',             cat:'Rotina do médico',     linha:'clinica' },
  { id:'plantaohub',    nm:'PlantãoHub',       ic:'ti-clock',            url:BASE+'plantaohub.html',       cat:'Rotina do médico',     linha:'clinica' },
  { id:'granae',        nm:'Granaê',           ic:'ti-wallet',           url:BASE+'granae.html',           cat:'Rotina do médico',     linha:'clinica' },
  { id:'logbook',       nm:'Logbook',          ic:'ti-notebook',         url:BASE+'logbook.html',          cat:'Rotina do médico',     linha:'clinica' },
  { id:'clinicamed',    nm:'ClínicaMed',       ic:'ti-heartbeat',        url:BASE+'clinicamed/',           cat:'Prova de título',      linha:'provas', sub:'título de Clínica Médica (TECM) e acesso R+' },
  { id:'trafegotitulo', nm:'TráfegoTítulo',    ic:'ti-car',              url:BASE+'trafego-titulo/',       cat:'Prova de título',      linha:'provas', sub:'título de Medicina do Tráfego' },
  { id:'medprovas',     nm:'MedProvas',        ic:'ti-clipboard-text',   url:BASE+'medprovas.html',        cat:'Residência e concursos', linha:'provas' },
  { id:'flashmed',      nm:'FlashMed',         ic:'ti-cards',            url:BASE+'flashmed.html',         cat:'Residência e concursos', linha:'provas' }
];
/* Linha deste portal. provas.html é GERADO deste arquivo por _gera_provas.py — editar aqui. */
const LINHA = 'clinica';
const CATALOGO_LINHA = CATALOGO.filter(a => a.linha === LINHA);
const CATEGORIAS = LINHA === 'provas' ? ['Prova de título','Residência e concursos'] : ['Atendimento','Referência clínica','Hospital e imagem','Rotina do médico'];
/* Quem nunca escolheu vê o conjunto padrão da linha. */
const PADRAO = LINHA === 'provas'
  ? ['clinicamed','trafegotitulo','medprovas','flashmed']
  : ['agendaai','condutai','atbguia','enfermaria','pocusai','laudai','paliai','calcmed','guiainterno','foco','plantaohub','granae','logbook'];
/* Perfis por público: atalhos que marcam um conjunto; o usuário ajusta e salva o seu. */
const PERFIS = LINHA === 'provas' ? [
  { id:'titulo',     nm:'Prova de título',       ic:'ti-certificate',       apps:['clinicamed','trafegotitulo'] },
  { id:'residencia', nm:'Residência e R+',       ic:'ti-school',            apps:['medprovas','flashmed','clinicamed'] },
  { id:'professor',  nm:'Professor / preceptor', ic:'ti-presentation',      apps:['medprovas','flashmed'] }
] : [
  { id:'interno',    nm:'Interno',              ic:'ti-school',            apps:['condutai','atbguia','guiainterno','enfermaria','calcmed','logbook'] },
  { id:'residente',  nm:'Residente',            ic:'ti-stethoscope',       apps:['condutai','atbguia','enfermaria','pocusai','paliai','calcmed','logbook','plantaohub'] },
  { id:'hospital',   nm:'Médico do hospital',   ic:'ti-building-hospital', apps:['condutai','atbguia','enfermaria','pocusai','paliai','calcmed','laudai','plantaohub','granae'] },
  { id:'consultorio',nm:'Consultório',          ic:'ti-calendar-event',    apps:['agendaai','condutai','atbguia','calcmed','granae','foco','clinicar'] }
];
const CACHE_APPS = 'mt.portal.apps.' + LINHA;   // lido também pelo trocador de funções (_mtauth.js), mesmo domínio
const CAMPO_SEL = LINHA === 'provas' ? 'appsProvas' : 'apps';   // no doc da conta, um campo por linha

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function fmtName(nm){ return /(AI|IA)$/.test(nm) ? esc(nm.slice(0,-2))+'<b>'+nm.slice(-2)+'</b>' : esc(nm); }
function dados(){ return (window.MT && MT._data && typeof MT._data==='object') ? MT._data : null; }
/* Contratação: se a conta tiver `contratados` (lista de ids), o catálogo só oferece esses.
   Sem o campo, tudo está disponível — é onde a cobrança se encaixa quando existir. */
function disponiveis(){
  const d = dados(); const c = d && Array.isArray(d.contratados) ? d.contratados : null;
  return c ? CATALOGO_LINHA.filter(a => c.includes(a.id)) : CATALOGO_LINHA;
}
function selecao(){
  const d = dados();
  let sel = (d && d[CAMPO_SEL] && Array.isArray(d[CAMPO_SEL].sel)) ? d[CAMPO_SEL].sel : null;
  if (!sel) { try { const c = JSON.parse(localStorage.getItem(CACHE_APPS)||'null'); if (Array.isArray(c)) sel = c; } catch(e){} }
  if (!sel) sel = PADRAO;
  const ok = new Set(disponiveis().map(a=>a.id));
  return sel.filter(id => ok.has(id));
}
function appItem(a){
  return `<a class="app" href="${a.url}">
    <span class="ic"><i class="ti ${a.ic}" aria-hidden="true"></i></span>
    <span class="nm">${fmtName(a.nm)}</span>
  </a>`;
}
function renderGrid(){
  const sel = new Set(selecao());
  const lista = disponiveis().filter(a => sel.has(a.id));
  const g = document.getElementById('grid');
  g.innerHTML = lista.length ? lista.map(appItem).join('')
    : `<div class="apps-vazio">Nenhum app na sua página ainda.<br><button class="b" onclick="openMeusApps()"><i class="ti ti-layout-grid-add" aria-hidden="true"></i>&nbsp;Escolher apps</button></div>`;
  try { localStorage.setItem(CACHE_APPS, JSON.stringify([...sel])); } catch(e){}
}
function openMeusApps(){
  const sel = new Set(selecao());
  const disp = disponiveis();
  const wrap = document.createElement('div'); wrap.className='sug-modal'; wrap.id='appsModal';
  const linhas = CATEGORIAS.map(cat => {
    const itens = disp.filter(a => a.cat===cat);
    if (!itens.length) return '';
    return `<div class="apps-cat">${esc(cat)}</div>` + itens.map(a => `
      <label class="apps-row">
        <span class="k"><i class="ti ${a.ic}" aria-hidden="true"></i></span>
        <span class="t"><b>${esc(a.nm)}</b>${a.sub?`<small>${esc(a.sub)}</small>`:''}</span>
        <span class="sw"><input type="checkbox" data-id="${esc(a.id)}" ${sel.has(a.id)?'checked':''}><span></span></span>
      </label>`).join('');
  }).join('');
  wrap.innerHTML = `<div class="sug-box">
    <h3 style="display:flex;align-items:center;gap:8px"><i class="ti ti-layout-grid-add" aria-hidden="true"></i>Meus apps</h3>
    <p class="sub">Escolha o que aparece na sua página. Vale em todos os seus aparelhos.</p>
    <div class="apps-cat">Comece por um perfil</div>
    <div class="perfis">${PERFIS.map(p=>`<button type="button" class="perfil" onclick="marcarPerfil('${p.id}')"><i class="ti ${p.ic}" aria-hidden="true"></i>${esc(p.nm)}</button>`).join('')}</div>
    <div class="apps-cat">Ou ajuste um a um</div>
    <div class="apps-tools"><button class="b cancel" onclick="marcarApps(true)">Todos</button><button class="b cancel" onclick="marcarApps(false)">Nenhum</button><button class="b cancel" onclick="marcarApps('padrao')">Padrão</button></div>
    <div id="appsLista">${linhas}</div>
    <div class="sug-row"><button class="b ok" onclick="salvarApps()">Salvar</button><button class="b cancel" onclick="closeApps()">Cancelar</button></div>
    <div class="cfg-msg" id="appsMsg"></div>
  </div>`;
  wrap.onclick = e => { if (e.target===wrap) closeApps(); };
  document.body.appendChild(wrap);
}
function marcarApps(modo){
  document.querySelectorAll('#appsLista input[type=checkbox]').forEach(i => {
    i.checked = modo===true ? true : modo===false ? false : PADRAO.includes(i.dataset.id);
  });
}
function marcarPerfil(id){
  const p = PERFIS.find(x => x.id===id); if (!p) return;
  const ok = new Set(disponiveis().map(a=>a.id));
  document.querySelectorAll('#appsLista input[type=checkbox]').forEach(i => { i.checked = p.apps.includes(i.dataset.id) && ok.has(i.dataset.id); });
  document.querySelectorAll('.perfil').forEach(b => b.classList.toggle('on', b.textContent.trim()===p.nm));
}
function closeApps(){ const m=document.getElementById('appsModal'); if (m) m.remove(); }
async function salvarApps(){
  const sel = [...document.querySelectorAll('#appsLista input[type=checkbox]:checked')].map(i => i.dataset.id);
  const msg = document.getElementById('appsMsg'); msg.className='cfg-msg'; msg.textContent='Salvando…';
  try { localStorage.setItem(CACHE_APPS, JSON.stringify(sel)); } catch(e){}
  try {
    const base = dados() || {};
    if (window.MT && MT.save) await MT.save(Object.assign({}, base, { [CAMPO_SEL]: { sel, v:1, updatedAt: Date.now() } }));
    closeApps(); renderGrid();
  } catch(e) { msg.className='cfg-msg err'; msg.textContent='Não foi possível salvar: '+(e.message||e); }
}
renderGrid();
document.getElementById('issueDate').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});

/* ===== Sugestões de funções (vão por e-mail para a equipe MedTech) ===== */
const SUG_EMAIL = 'medtechbr1@gmail.com';
function openSug(){
  const u = window.MT && window.MT.user;
  const opts = ['Geral / portal'].concat(CATALOGO_LINHA.map(a=>a.nm)).map(n=>`<option>${esc(n)}</option>`).join('');
  const wrap = document.createElement('div'); wrap.className='sug-modal'; wrap.id='sugModal';
  wrap.innerHTML = `<div class="sug-box">
    <h3 style="display:flex;align-items:center;gap:8px"><i class="ti ti-bulb" aria-hidden="true"></i>Sugerir uma função</h3>
    <p class="sub">Conte o que você gostaria de ver nos apps MedTech. Sua ideia vai direto para a equipe.</p>
    <label>App</label><select id="sugApp">${opts}</select>
    <label>Sua sugestão</label><textarea id="sugTxt" placeholder="Ex.: no EnfermarIA, poder ordenar os leitos por gravidade..."></textarea>
    <label>Seu contato (opcional)</label><input id="sugContato" value="${esc((u&&u.email)||'')}" placeholder="e-mail ou WhatsApp para retorno">
    <div class="sug-row"><button class="b ok" onclick="enviarSug()">Enviar sugestão</button><button class="b cancel" onclick="closeSug()">Cancelar</button></div>
  </div>`;
  wrap.onclick = e => { if(e.target===wrap) closeSug(); };
  document.body.appendChild(wrap);
  setTimeout(()=>{const t=document.getElementById('sugTxt'); if(t) t.focus();},50);
}
function closeSug(){ const m=document.getElementById('sugModal'); if(m) m.remove(); }
function enviarSug(){
  const app = document.getElementById('sugApp').value;
  const txt = document.getElementById('sugTxt').value.trim();
  const contato = document.getElementById('sugContato').value.trim();
  if(!txt){ alert('Escreva sua sugestão antes de enviar.'); return; }
  const u = window.MT && window.MT.user;
  const subject = 'Sugestão MedTech — ' + app;
  const body = 'App: '+app+'\n\nSugestão:\n'+txt+'\n\nContato: '+(contato||'(não informado)')+'\nUsuário logado: '+((u&&u.email)||'(não logado)');
  window.location.href = 'mailto:'+SUG_EMAIL+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  closeSug();
}

/* ===== Configurações (perfil, senha, assinatura) ===== */
const KIWIFY_PORTAL_URL = ''; // portal do cliente Kiwify (definir quando os pagamentos forem configurados)
const SUPORTE_EMAIL = 'medtechbr1@gmail.com';
function cfgVal(id){ const e = document.getElementById(id); return e ? e.value.trim() : ''; }
function openCfg(){
  const u = window.MT && window.MT.user;
  if (!u || u.demo){ alert('Entre na sua conta MedTech para acessar as configurações.'); return; }
  const perfil = (window.MT && MT._data && MT._data.perfil) || {};
  const wrap = document.createElement('div'); wrap.className='sug-modal'; wrap.id='cfgModal';
  wrap.innerHTML = `<div class="sug-box">
    <h3 style="display:flex;align-items:center;gap:8px"><i class="ti ti-settings" aria-hidden="true"></i>Configurações</h3>
    <div class="cfg-sec">
      <h4><i class="ti ti-user" aria-hidden="true"></i>Perfil e cadastro</h4>
      <div class="desc">Seu nome aparece em todos os apps MedTech.</div>
      <label>Nome</label><input id="cfgNome" value="${esc(u.displayName||'')}" placeholder="Seu nome">
      <label>E-mail (login)</label><input value="${esc(u.email||'')}" disabled style="opacity:.65">
      <label>Telefone / WhatsApp</label><input id="cfgFone" value="${esc(perfil.fone||'')}" placeholder="(11) 99999-9999">
      <label>CRM</label><input id="cfgCrm" value="${esc(perfil.crm||'')}" placeholder="Ex.: 123456/SP">
      <label>Especialidade</label><input id="cfgEsp" value="${esc(perfil.esp||'')}" placeholder="Ex.: Clínica Médica">
      <label>Instituição</label><input id="cfgInst" value="${esc(perfil.inst||'')}" placeholder="Hospital / faculdade">
      <div class="sug-row"><button class="b ok" onclick="salvarPerfil()">Salvar perfil</button></div>
      <div class="cfg-msg" id="cfgPerfilMsg"></div>
    </div>
    <div class="cfg-sec">
      <h4><i class="ti ti-lock" aria-hidden="true"></i>Senha</h4>
      <div class="desc">Defina uma nova senha (mín. 6 caracteres) ou receba um link de redefinição por e-mail.</div>
      <label>Nova senha</label><input id="cfgPass1" type="password" placeholder="Nova senha" autocomplete="new-password">
      <label>Confirmar nova senha</label><input id="cfgPass2" type="password" placeholder="Repita a nova senha" autocomplete="new-password">
      <div class="sug-row"><button class="b ok" onclick="alterarSenha()">Alterar senha</button><button class="b cancel" onclick="enviarResetSenha()">Link por e-mail</button></div>
      <div class="cfg-msg" id="cfgSenhaMsg"></div>
    </div>
    <div class="cfg-sec">
      <h4><i class="ti ti-credit-card" aria-hidden="true"></i>Assinatura e pagamento</h4>
      <div class="desc">Seu pagamento é processado com segurança pela Kiwify. Para trocar o cartão, ver faturas ou cancelar, use o portal do cliente — <b>nunca pedimos o número do cartão aqui</b>.</div>
      <div class="sug-row"><button class="b ok" onclick="abrirPagamento()">Gerenciar assinatura / pagamento</button></div>
      <div class="cfg-msg" id="cfgPagMsg"></div>
    </div>
    <div class="sug-row"><button class="b cancel" onclick="closeCfg()">Fechar</button></div>
  </div>`;
  wrap.onclick = e => { if (e.target===wrap) closeCfg(); };
  document.body.appendChild(wrap);
}
function closeCfg(){ const m=document.getElementById('cfgModal'); if (m) m.remove(); }
async function salvarPerfil(){
  const msg=document.getElementById('cfgPerfilMsg'); msg.className='cfg-msg'; msg.textContent='Salvando…';
  try{
    const nome=cfgVal('cfgNome');
    if (window.MT && MT._fb && MT.user && nome && nome!==(MT.user.displayName||'')) { await MT._fb.A.updateProfile(MT.user, {displayName:nome}); }
    const perfil={fone:cfgVal('cfgFone'),crm:cfgVal('cfgCrm'),esp:cfgVal('cfgEsp'),inst:cfgVal('cfgInst')};
    const base=(window.MT && MT._data && typeof MT._data==='object')?MT._data:{};
    if (window.MT && MT.save) await MT.save(Object.assign({}, base, {perfil}));
    msg.className='cfg-msg ok'; msg.textContent='✓ Perfil salvo.';
    refreshUser();
  }catch(e){ msg.className='cfg-msg err'; msg.textContent='Erro ao salvar: '+(e.message||e); }
}
async function alterarSenha(){
  const msg=document.getElementById('cfgSenhaMsg'); msg.className='cfg-msg';
  const p1=cfgVal('cfgPass1'), p2=cfgVal('cfgPass2');
  if (p1.length<6){ msg.className='cfg-msg err'; msg.textContent='A senha deve ter ao menos 6 caracteres.'; return; }
  if (p1!==p2){ msg.className='cfg-msg err'; msg.textContent='As senhas não conferem.'; return; }
  if (!(window.MT && MT._fb && MT.user)){ msg.className='cfg-msg err'; msg.textContent='Sessão indisponível.'; return; }
  const A=MT._fb.A; msg.textContent='Alterando…';
  try{
    await A.updatePassword(MT.user, p1);
    msg.className='cfg-msg ok'; msg.textContent='✓ Senha alterada com sucesso.';
    document.getElementById('cfgPass1').value=''; document.getElementById('cfgPass2').value='';
  }catch(e){
    if (e && e.code==='auth/requires-recent-login'){
      const cur=prompt('Por segurança, confirme sua senha ATUAL para concluir a alteração:');
      if (!cur){ msg.className='cfg-msg err'; msg.textContent='Alteração cancelada.'; return; }
      try{
        const cred=A.EmailAuthProvider.credential(MT.user.email, cur);
        await A.reauthenticateWithCredential(MT.user, cred);
        await A.updatePassword(MT.user, p1);
        msg.className='cfg-msg ok'; msg.textContent='✓ Senha alterada com sucesso.';
        document.getElementById('cfgPass1').value=''; document.getElementById('cfgPass2').value='';
      }catch(e2){ const w=(e2.code==='auth/wrong-password'||e2.code==='auth/invalid-credential'); msg.className='cfg-msg err'; msg.textContent=w?'Senha atual incorreta.':('Não foi possível: '+(e2.message||e2)); }
    } else { msg.className='cfg-msg err'; msg.textContent='Não foi possível: '+(e.message||e); }
  }
}
async function enviarResetSenha(){
  const msg=document.getElementById('cfgSenhaMsg'); msg.className='cfg-msg';
  if (!(window.MT && MT._fb && MT.user)){ msg.className='cfg-msg err'; msg.textContent='Sessão indisponível.'; return; }
  try{ await MT._fb.A.sendPasswordResetEmail(MT._fb.auth, MT.user.email); msg.className='cfg-msg ok'; msg.textContent='✓ Link enviado para '+MT.user.email+'.'; }
  catch(e){ msg.className='cfg-msg err'; msg.textContent='Erro: '+(e.message||e); }
}
function abrirPagamento(){
  const msg=document.getElementById('cfgPagMsg');
  if (KIWIFY_PORTAL_URL){ window.open(KIWIFY_PORTAL_URL,'_blank','noopener'); return; }
  msg.className='cfg-msg'; msg.innerHTML='A área de assinatura está sendo finalizada. Para trocar pagamento, ver faturas ou cancelar, fale com a gente: <a href="mailto:'+SUPORTE_EMAIL+'?subject=Assinatura%20MedTech" style="color:var(--petrol);font-weight:700">'+SUPORTE_EMAIL+'</a>.';
}

/* saudação + sair (via login central MedTech) */
function refreshUser(){
  const u = window.MT && window.MT.user;
  const el = document.getElementById('usr');
  const hello = document.getElementById('hello');
  if (u && !u.demo){
    const nm = u.displayName || u.email || 'Conta';
    el.innerHTML = `<span class="who">${esc(nm)}</span><button id="btnCfg" title="Configurações" aria-label="Configurações"><i class="ti ti-settings" aria-hidden="true"></i></button><button id="btnOut"><i class="ti ti-logout" aria-hidden="true"></i>Sair</button>`;
    document.getElementById('btnOut').onclick = () => window.MT.signOut();
    document.getElementById('btnCfg').onclick = openCfg;
    const first = (u.displayName||'').split(' ')[0];
    hello.textContent = first ? ('Olá, '+first) : 'Bem-vindo';
  } else {
    el.innerHTML = '';
    hello.textContent = 'Bem-vindo';
  }
}
let perfilOferecido = false;
(function waitMT(){ if(window.MT){ MT.onData(function(){
  refreshUser(); renderGrid();
  // primeira vez na conta: ainda não escolheu → oferece os perfis
  const u = MT.user, d = dados();
  if (!perfilOferecido && u && !u.demo && !(d && d[CAMPO_SEL] && Array.isArray(d[CAMPO_SEL].sel))) { perfilOferecido = true; setTimeout(() => { if (!document.getElementById('appsModal')) openMeusApps(); }, 500); }
}); refreshUser(); } else setTimeout(waitMT,40); })();

/* PWA: service worker + botão instalar */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferredPrompt = e;
  const b = document.getElementById('btnInstall'); b.hidden = false;
  b.onclick = async () => { b.hidden = true; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; };
});
window.addEventListener('appinstalled', () => { const b=document.getElementById('btnInstall'); if(b) b.hidden=true; });
</script>
