<style>
/* ============================================================
   Portal no tema vivo (23/09/2026), modelo ClínicaMed "camada viva".
   A grade compacta de ícones continua (pedido dele: grade, não cartões);
   cada app agora tem o ícone em círculo na cor do próprio app (--c, vindo
   do catálogo). Cadeados, "Meus apps" e Assinatura seguem iguais.
   Cor do portal: índigo (MedTech App) ou laranja (MedTech Provas), via --ac.
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:clip}
.install[hidden]{display:none}
body{font-size:15px;line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit}
.ti{line-height:1}

/* ---------- cabeçalho: uma linha ---------- */
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;min-height:calc(64px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top)}
.wrap{max-width:960px;margin:0 auto;padding:0 24px;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wm{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.02em;white-space:nowrap}
.wm .mk{width:36px;height:36px;border-radius:50%;background:var(--ac);color:var(--acTxt);display:grid;place-items:center;font-size:19px;box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 35%,transparent)}
.wm b{font-weight:700;color:var(--acInk)}
.top-r{display:flex;align-items:center;gap:8px}
.usr{display:flex;align-items:center;gap:8px}
.usr .who{font-size:13px;color:var(--tinta2);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usr button,.ghost{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--sup2);color:var(--tinta);
  font-weight:500;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:background-color .2s,color .2s,transform .18s var(--mola)}
.usr button:hover,.ghost:hover{background:var(--acSup);color:var(--acInk)}
.usr button i,.ghost i,.install i{font-size:18px;line-height:1}
.install{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--ac);color:var(--acTxt);
  font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 28%,transparent)}
.install:hover{filter:brightness(1.08);transform:translateY(-1px)}

/* ---------- saudação ---------- */
main{padding:44px 0 calc(24px + env(safe-area-inset-bottom))}
.hello{text-align:center;margin-bottom:36px}
.hello h1{font-size:clamp(28px,4vw,36px);font-weight:750;letter-spacing:-.035em;line-height:1.1}
.hello .dt{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--acInk);background:var(--acSup);padding:5px 14px;border-radius:999px;margin-top:12px}
.hello .dt:empty{display:none}

/* ---------- grade de apps: compacta, ícone em círculo na cor do app ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:28px 12px;justify-items:center;max-width:800px;margin:0 auto;padding:0 22px}
.app{--c:var(--ac);--t:#fff;display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:inherit;width:100%;border-radius:22px;padding:6px 2px}
.app .ic{position:relative;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:30px;color:var(--t);background:var(--c);
  box-shadow:0 10px 22px color-mix(in srgb,var(--c) 30%,transparent);transition:transform .3s var(--mola),box-shadow .25s}
.app:hover .ic{transform:translateY(-4px) scale(1.04) rotate(-5deg);box-shadow:0 16px 30px color-mix(in srgb,var(--c) 38%,transparent)}
.app:active .ic{transform:scale(.94)}
.app .nm{font-size:13px;font-weight:600;color:var(--tinta);text-align:center;line-height:1.25}
.app .nm b{font-weight:600;color:inherit}
.app:focus-visible{outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 28%,transparent)}
.grid.anima>*{animation:vvSobe .5s var(--suave) both;animation-delay:calc(var(--i,0) * 35ms)}
/* fora do plano: ícone apagado com cadeado */
.app.trav .ic{background:var(--sup3);color:var(--tinta2);box-shadow:none}
.app.trav .nm{color:var(--tinta2)}
.app .lk{position:absolute;right:-4px;top:-4px;width:24px;height:24px;border-radius:50%;background:var(--tinta);color:var(--sup);display:grid;place-items:center;font-size:13px;box-shadow:0 0 0 3px var(--papel)}
.fine{text-align:center;font-size:13px;color:var(--tinta2);margin-top:36px;padding:0 22px}
footer{text-align:center;font-size:13px;padding:24px 22px calc(24px + env(safe-area-inset-bottom));margin-top:48px}
footer a{text-decoration:none;display:inline-block;padding:10px 2px}

/* ---------- modais ---------- */
.sug-modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;z-index:80}
.sug-box{padding:24px;max-width:480px;width:100%;max-height:92vh;overflow:auto}
.sug-box h3{margin-bottom:6px;font-weight:700;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.sug-box h3 .ti{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--acSup);color:var(--acInk);font-size:19px;flex:0 0 auto}
.sug-box p.sub{color:var(--tinta2);font-size:13.5px;margin-bottom:8px;line-height:1.5}
.sug-box label{display:block;font-weight:600;font-size:13px;margin:12px 0 6px;color:var(--tinta2)}
html[data-viva^=portal][lang] body .sug-box :is(select,input,textarea){width:100%;padding:11px 14px;font-size:16px}
.sug-box textarea{min-height:110px;resize:vertical;line-height:1.5}
.sug-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.sug-box .b{border:1.5px solid transparent;border-radius:999px;padding:10px 16px;min-height:44px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:filter .2s,transform .18s var(--mola),background-color .2s}
.sug-row .b{flex:1}
.sug-box .ok{background:var(--ac);color:var(--acTxt);box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 28%,transparent)}
.sug-box .ok:hover{filter:brightness(1.08);transform:translateY(-1px)}
.sug-box .cancel{background:var(--sup);color:var(--tinta);border-color:var(--fioF)}
.sug-box .cancel:hover{background:var(--acSup);color:var(--acInk)}
.sug-box .perigo{background:var(--errSup);color:color-mix(in srgb,var(--errV) 70%,var(--tinta))}
.sug-box .perigo:hover{filter:brightness(.97)}
/* .cfg-msg.ok dentro do modal herdava o fundo do botão .ok */
.sug-box .cfg-msg.ok{background:none;box-shadow:none;filter:none;transform:none}
.sug-row.dados .b{flex:1 1 170px}
.sug-box ul.lista{margin:4px 0 10px 20px;font-size:13.5px;color:var(--tinta2);line-height:1.5}
.sug-box ul.lista li{margin-bottom:3px}
.cfg-sec .desc a,.sug-box p.sub a{color:var(--acInk);font-weight:600}
.cfg-sec{border-radius:20px;padding:16px;margin-bottom:12px;background:var(--sup2)}
.cfg-sec h4{font-size:15px;font-weight:650;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.cfg-sec h4 i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--sup);color:var(--acInk);font-size:16px}
.cfg-sec .desc{font-size:13px;color:var(--tinta2);margin:2px 0 8px;line-height:1.5}
.cfg-msg{font-size:13px;margin-top:8px;min-height:14px;line-height:1.5}
.cfg-msg.ok{color:color-mix(in srgb,var(--okV) 70%,var(--tinta))}.cfg-msg.err{color:color-mix(in srgb,var(--errV) 80%,var(--tinta))}
/* Meus apps: catálogo com interruptores */
.link{background:none;border:0;color:var(--acInk);font-weight:600;font-size:13.5px;cursor:pointer;padding:10px 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.link:hover{background:var(--acSup)}
.apps-cat{font-size:13px;font-weight:650;color:var(--tinta2);margin:16px 0 4px}
.apps-cat:first-child{margin-top:4px}
.sug-box .apps-row{display:flex;align-items:center;gap:12px;padding:7px 6px;margin:0;cursor:pointer;color:var(--tinta);font-size:14px;font-weight:400;border-radius:14px}
.sug-box .apps-row:hover{background:var(--sup2)}

.apps-row .k{--c:var(--ac);--t:#fff;width:38px;height:38px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:19px;color:var(--t);flex:0 0 auto}
.apps-row .t{flex:1;min-width:0}
.apps-row .t b{display:block;font-weight:600;font-size:14.5px}
.apps-row .t small{display:block;font-size:12.5px;color:var(--tinta2);margin-top:1px}
.sw{position:relative;width:46px;height:28px;flex:0 0 auto}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--sup3);transition:background-color .2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s var(--mola)}
.sw input:checked+span{background:var(--ac)}
.sw input:checked+span::after{transform:translateX(18px)}
.sw input:disabled+span{opacity:.45}
.sw input:focus-visible+span{box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 28%,transparent)}
.apps-tools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
.apps-tools .b{flex:0 0 auto;min-height:40px;padding:0 16px;font-size:13px}
.apps-vazio{grid-column:1/-1;text-align:center;color:var(--tinta2);padding:34px 16px;background:var(--sup);border:1px solid var(--fio);border-radius:var(--rG);font-size:14px;line-height:1.5;box-shadow:var(--sombraV)}
.apps-vazio .b{display:inline-flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;min-height:44px;padding:0 20px;border-radius:999px;background:var(--ac);color:var(--acTxt);border:0;font-weight:600;font-size:14px;cursor:pointer}
#cfgAssinBt{flex-wrap:wrap}#cfgAssinBt .b{flex:1 1 150px}
.aviso{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(20px + env(safe-area-inset-bottom));z-index:90;max-width:min(520px,calc(100vw - 32px));padding:12px 18px;border-radius:18px;
  background:var(--tinta);color:var(--sup);font-size:14px;line-height:1.45;box-shadow:var(--sombraM);animation:vvSobe .35s var(--suave) both}
@media(max-width:560px){
  .ghost .lbl{display:none}.ghost{width:44px;padding:0;justify-content:center}.ghost i{font-size:19px}
  .wrap{padding:0 16px}.wm{font-size:17px}.wm .mk{width:32px;height:32px;font-size:17px}.top-r{gap:6px}.install .lbl{display:none}.install{width:44px;padding:0}.usr button{width:44px;padding:0}#btnOut{display:none}
  .grid{grid-template-columns:repeat(4,1fr);gap:22px 6px;padding:0 12px}.app .ic{width:60px;height:60px;font-size:27px}.app .nm{font-size:11.5px}
  .hello{margin-bottom:28px}.hello h1{font-size:26px}main{padding-top:30px}.usr .who{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.grid.anima>*,.aviso{animation:none!important}}
</style>

<body>
<header>
  <div class="wrap top">
    <span class="wm"><span class="mk" aria-hidden="true"><i class="ti ti-apps"></i></span><span>MedTech <b>App</b></span></span>
    <div class="top-r">
      <button class="ghost" id="btnApps" onclick="openMeusApps()" title="Escolher quais apps aparecem aqui" aria-label="Meus apps"><i class="ti ti-layout-grid-add" aria-hidden="true"></i><span class="lbl">Meus apps</span></button>
      <button class="ghost" id="btnSug" onclick="openSug()" aria-label="Sugestão"><i class="ti ti-bulb" aria-hidden="true"></i><span class="lbl">Sugestão</span></button>
      <button class="install" id="btnInstall" hidden aria-label="Instalar o app" title="Instalar o app"><i class="ti ti-download" aria-hidden="true"></i><span class="lbl">Instalar</span></button>
      <div class="usr" id="usr"></div>
    </div>
  </div>
</header>

<main>
  <div class="hello"><h1 id="hello">Bem-vindo</h1><div class="dt" id="issueDate"></div></div>
  <div class="grid" id="grid"></div>
  <div class="fine"><button class="link" onclick="openMeusApps()"><i class="ti ti-layout-grid-add" aria-hidden="true"></i> Escolher quais apps aparecem aqui</button></div>
</main>

<footer>© 2026 <a href="index.html">MedTech</a> · <a href="privacidade.html">Privacidade</a> · <a href="termos.html">Termos</a></footer>

<script>
const BASE = 'https://medtechbr.com.br/';
/* Catálogo de TUDO que o MedTech oferece. O id é o mesmo do trocador de funções (_mtauth.js).
   O que aparece na página é a escolha do usuário (salva na conta, sincroniza entre aparelhos). */
const CATALOGO = [
  { id:'condutai',      nm:'CondutAI',         ic:'ti-stethoscope',      url:BASE+'condutai.html',         cat:'Referência clínica',   linha:'clinica' , c:'var(--c-azul)' },
  { id:'paliai',        nm:'PaliAI',           ic:'ti-heart-handshake',  url:BASE+'paliai.html',           cat:'Referência clínica',   linha:'clinica' , c:'var(--c-rosa)' },
  { id:'laudai',        nm:'LaudAI',           ic:'ti-report-medical',   url:BASE+'laudai.html',           cat:'Hospital e imagem',    linha:'clinica' , c:'var(--c-cobalto)' },
  { id:'plantaohub',    nm:'PlantãoHub',       ic:'ti-clock',            url:BASE+'plantaohub.html',       cat:'Rotina do médico',     linha:'clinica' , c:'#4D7C0F' },
  { id:'granae',        nm:'Granaê',           ic:'ti-wallet',           url:BASE+'granae.html',           cat:'Rotina do médico',     linha:'clinica' , c:'#7C4DE8' },
  { id:'clinicamed',    nm:'ClínicaMed',       ic:'ti-heartbeat',        url:BASE+'clinicamed/',           cat:'Prova de título',      linha:'provas', sub:'título de Clínica Médica (TECM) e acesso R+' , c:'var(--c-indigo)' },
  { id:'cirurgiamed',   nm:'CirurgiaMed',      ic:'ti-cut',              url:BASE+'cirurgiamed/',          cat:'Prova de título',      linha:'provas', sub:'título de Cirurgia Geral (CBC), R+ cirúrgico e concursos' , c:'#33479E' },
  { id:'trafegotitulo', nm:'TráfegoTítulo',    ic:'ti-car',              url:BASE+'trafego-titulo/',       cat:'Prova de título',      linha:'provas', sub:'título de Medicina do Tráfego' , c:'var(--c-teal)' },
  { id:'flashmed',      nm:'FlashMed',         ic:'ti-cards',            url:BASE+'flashmed/',         cat:'Residência e concursos', linha:'provas' , c:'var(--c-coral)' }
];
/* Linha deste portal. provas.html é GERADO deste arquivo por _gera_provas.py — editar aqui. */
const LINHA = 'clinica';
const CATALOGO_LINHA = CATALOGO.filter(a => a.linha === LINHA);
const CATEGORIAS = LINHA === 'provas' ? ['Prova de título','Residência e concursos'] : ['Referência clínica','Hospital e imagem','Rotina do médico'];
/* Quem nunca escolheu vê o conjunto padrão da linha. */
const PADRAO = LINHA === 'provas'
  ? ['clinicamed','cirurgiamed','trafegotitulo','flashmed']
  : ['condutai','laudai','paliai','plantaohub','granae'];
const CACHE_APPS = 'mt.portal.apps.' + LINHA;   // lido também pelo trocador de funções (_mtauth.js), mesmo domínio
const CAMPO_SEL = LINHA === 'provas' ? 'appsProvas' : 'apps';   // no doc da conta, um campo por linha

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function fmtName(nm){ return /(AI|IA)$/.test(nm) ? esc(nm.slice(0,-2))+'<b>'+nm.slice(-2)+'</b>' : esc(nm); }
function dados(){ return (window.MT && MT._data && typeof MT._data==='object') ? MT._data : null; }
/* Contratação: se a conta tiver `contratados` (lista de ids), o catálogo só oferece esses.
   Sem o campo, tudo está disponível — é onde a cobrança se encaixa quando existir. */
function disponiveis(){
  const d = dados(); const c = d && Array.isArray(d.contratados) ? d.contratados : null;
  return c ? CATALOGO_LINHA.filter(a => c.includes(a.id)) : CATALOGO_LINHA;
}
function selecao(){
  const d = dados();
  let sel = (d && d[CAMPO_SEL] && Array.isArray(d[CAMPO_SEL].sel)) ? d[CAMPO_SEL].sel : null;
  if (!sel) { try { const c = JSON.parse(localStorage.getItem(CACHE_APPS)||'null'); if (Array.isArray(c)) sel = c; } catch(e){} }
  if (!sel) sel = PADRAO;
  const ok = new Set(disponiveis().map(a=>a.id));
  return sel.filter(id => ok.has(id));
}
/* acesso por produto: ACESSO = {P, venda, mt} vindo do _mtacesso.js (null até carregar) */
let ACESSO = null;
function travado(id){
  if (!ACESSO || !ACESSO.venda || ACESSO.falha || !window.MTAcesso) return null;
  const r = MTAcesso.liberado(ACESSO.P, ACESSO.mt, id);
  return r.ok ? null : r;
}
function appItem(a){
  const tv = travado(a.id);
  return `<a class="app${tv?' trav':''}" href="${a.url}" data-id="${esc(a.id)}" style="${corApp(a)}"${tv?' aria-label="'+esc(a.nm)+' (fora do seu plano)"':''}>
    <span class="ic"><i class="ti ${a.ic}" aria-hidden="true"></i>${tv?'<span class="lk"><i class="ti ti-lock" aria-hidden="true"></i></span>':''}</span>
    <span class="nm">${fmtName(a.nm)}</span>
  </a>`;
}
/* cor do app: círculo na cor dele, com o ícone em branco (ou escuro, no âmbar) */
function corApp(a){ return a.c ? `--c:${a.c};--t:${a.t||'#fff'}` : ''; }
let _gradeAnimada=false;
function renderGrid(){
  const sel = new Set(selecao());
  const lista = disponiveis().filter(a => sel.has(a.id));
  const g = document.getElementById('grid');
  g.innerHTML = lista.length ? lista.map(appItem).join('')
    : `<div class="apps-vazio">Nenhum app na sua página ainda.<br><button class="b" onclick="openMeusApps()"><i class="ti ti-layout-grid-add" aria-hidden="true"></i> Escolher apps</button></div>`;
  /* entrada escalonada só na primeira pintura (os re-render da nuvem não piscam) */
  if (!_gradeAnimada && lista.length && !matchMedia('(prefers-reduced-motion: reduce)').matches) { _gradeAnimada = true; [...g.children].forEach((c,k)=>c.style.setProperty('--i',k)); g.classList.add('anima'); }
  try { localStorage.setItem(CACHE_APPS, JSON.stringify([...sel])); } catch(e){}
}
function openMeusApps(){
  const sel = new Set(selecao());
  const disp = disponiveis();
  const wrap = document.createElement('div'); wrap.className='sug-modal'; wrap.id='appsModal';
  const linhas = CATEGORIAS.map(cat => {
    const itens = disp.filter(a => a.cat===cat);
    if (!itens.length) return '';
    return `<div class="apps-cat">${esc(cat)}</div>` + itens.map(a => `
      <label class="apps-row">
        <span class="k" style="${corApp(a)}"><i class="ti ${a.ic}" aria-hidden="true"></i></span>
        <span class="t"><b>${esc(a.nm)}</b>${a.sub?`<small>${esc(a.sub)}</small>`:''}</span>
        <span class="sw"><input type="checkbox" data-id="${esc(a.id)}" ${sel.has(a.id)?'checked':''}><span></span></span>
      </label>`).join('');
  }).join('');
  wrap.innerHTML = `<div class="sug-box">
    <h3><i class="ti ti-layout-grid-add" aria-hidden="true"></i>Meus apps</h3>
    <p class="sub">Escolha o que aparece na sua página. Vale em todos os seus aparelhos.</p>
    <div class="apps-tools"><button class="b cancel" onclick="marcarApps(true)">Todos</button><button class="b cancel" onclick="marcarApps(false)">Nenhum</button><button class="b cancel" onclick="marcarApps('padrao')">Padrão</button></div>
    <div id="appsLista">${linhas}</div>
    <div class="sug-row"><button class="b ok" onclick="salvarApps()">Salvar</button><button class="b cancel" onclick="closeApps()">Cancelar</button></div>
    <div class="cfg-msg" id="appsMsg"></div>
  </div>`;
  wrap.onclick = e => { if (e.target===wrap) closeApps(); };
  document.body.appendChild(wrap);
}

/* ---------- Seus dados: baixar (LGPD art. 18, II e V) e pedir exclusão ----------
   Só LEITURA no Firestore: users/{uid} e users/{uid}/apps/{app} de cada app conhecido,
   mais a subcoleção sync dos apps de estudo (mtsync.js). A exclusão não apaga pelo
   cliente (deixaria subcoleções órfãs e exige login recente): monta um e-mail pronto. */
const MEUS_DADOS_APPS = ['portal','portal-provas','enfermaria','condutai','atbguia','calcmed','paliai','guiainterno','pocusai',
  'laudai','foco','plantaohub','granae','granae_of','logbook','medprovas','flashmed','flashmed_resumo','clinicamed','clinicamed_resumo',
  'clinicamed_coord','cirurgiamed','cirurgiamed_resumo','trafego-titulo','radio-titulo'];
const MEUS_DADOS_SYNC = ['flashmed','clinicamed','cirurgiamed','trafego-titulo','radio-titulo'];   // users/{uid}/apps/<app>/sync
function dataLocalISO(d){ d = d || new Date(); const p = n => String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
/* Timestamp do Firestore e afins viram texto ISO; o resto passa igual */
function limpaFs(v){
  if (v == null || typeof v !== 'object') return v;
  if (typeof v.toDate === 'function') { try { return v.toDate().toISOString(); } catch(e) { return String(v); } }
  if (Array.isArray(v)) return v.map(limpaFs);
  const o = {}; Object.keys(v).forEach(k => { o[k] = limpaFs(v[k]); }); return o;
}
function docDoApp(raw){
  const r = limpaFs(raw) || {}; const out = {};
  if (r.updatedAt) out.atualizadoEm = r.updatedAt;
  if (typeof r.json === 'string') { try { out.dados = JSON.parse(r.json); } catch(e) { out.dados = r.json; } }
  const resto = Object.keys(r).filter(k => k !== 'json' && k !== 'updatedAt');
  if (resto.length) { const o = {}; resto.forEach(k => { o[k] = r[k]; }); out[typeof r.json === 'string' ? 'outrosCampos' : 'dados'] = o; }
  return out;
}
async function coletarMeusDados(){
  const u = window.MT && MT.user, fb = window.MT && MT._fb;
  if (!u || u.demo || !fb || !fb.db || !fb.F) throw new Error('Entre na sua conta MedTech para baixar seus dados.');
  const { db, F } = fb, uid = u.uid;
  const md = u.metadata || {};
  const out = {
    formato: 'medtech-meus-dados', versao: 1, geradoEm: new Date().toISOString(),
    conta: { uid, email: u.email || null, nome: u.displayName || null, emailVerificado: !!u.emailVerified,
      criadaEm: md.creationTime || null, ultimoAcesso: md.lastSignInTime || null,
      provedores: (u.providerData || []).map(p => p && p.providerId).filter(Boolean) },
    perfil: null, registroDaConta: null, apps: {}, naoLidos: []
  };
  const falha = (onde, e) => out.naoLidos.push({ onde, erro: (e && (e.code || e.message)) || String(e) });
  const tarefas = [];
  tarefas.push((async () => { try { const s = await F.getDoc(F.doc(db, 'users', uid)); if (s.exists()) out.registroDaConta = limpaFs(s.data()); } catch(e) { falha('users/'+uid, e); } })());
  MEUS_DADOS_APPS.forEach(id => tarefas.push((async () => {
    try { const s = await F.getDoc(F.doc(db, 'users', uid, 'apps', id)); if (s.exists()) out.apps[id] = Object.assign(out.apps[id] || {}, docDoApp(s.data())); }
    catch(e) { falha('apps/'+id, e); }
  })()));
  MEUS_DADOS_SYNC.forEach(id => tarefas.push((async () => {
    try {
      const q = await F.getDocs(F.collection(db, 'users', uid, 'apps', id, 'sync'));
      if (!q.empty) { const itens = {}; q.forEach(d => { itens[d.id] = limpaFs(d.data()); }); out.apps[id] = Object.assign(out.apps[id] || {}, { sync: itens }); }
    } catch(e) { falha('apps/'+id+'/sync', e); }
  })()));
  await Promise.all(tarefas);
  const ord = {}; Object.keys(out.apps).sort().forEach(k => { ord[k] = out.apps[k]; }); out.apps = ord;
  const pdoc = id => out.apps[id] && out.apps[id].dados && out.apps[id].dados.perfil;
  out.perfil = pdoc('portal') || pdoc('portal-provas') || ((MT._data && MT._data.perfil) || null);
  return out;
}
function baixarArquivo(nome, texto, tipo){
  const blob = new Blob([texto], { type: tipo || 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = nome; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

  try {
    const d = await coletarMeusDados();
    const nome = 'medtech-meus-dados-' + dataLocalISO() + '.json';
    baixarArquivo(nome, JSON.stringify(d, null, 2));
    const n = Object.keys(d.apps).length;
    if (msg) { msg.className = 'cfg-msg ok'; msg.textContent = 'Arquivo baixado: ' + nome + ' (' + (n === 1 ? '1 app' : n + ' apps') + ' com dados).' + (d.naoLidos.length ? ' Alguns itens não puderam ser lidos; a lista está no arquivo.' : ''); }
  } catch(e) {
    if (msg) { msg.className = 'cfg-msg err'; msg.textContent = 'Não foi possível baixar: ' + ((e && e.message) || e); }
  } finally { if (bt) bt.disabled = false; }
}

      <div class="sug-row"><button class="b cancel" data-cancelar="${esc(a.produto)}" data-nome="${esc(a.nome)}">Cancelar assinatura</button></div>`).join('');
    box.querySelectorAll('[data-cancelar]').forEach(b => b.onclick = () => cancelarAssinatura(b.dataset.cancelar, b.dataset.nome, b));
  } catch(e) { console.warn('assinaturas do Mercado Pago', e && e.message); box.innerHTML = ''; }
  finally { delete box.dataset.carregando; }
}
async function cancelarAssinatura(produto, nome, bt){
  const msg = document.getElementById('cfgPagMsg');
  if (!confirm(`Cancelar a assinatura mensal de ${nome}?\n\nAs próximas cobranças param. O acesso continua até o fim do período pago.`)) return;
  if (bt) bt.disabled = true;
  msg.className = 'cfg-msg'; msg.textContent = 'Cancelando a assinatura';
  try {
    const r = await MTAcesso.chamar('mpCancelar', { produto }, MT.user);
    msg.className = 'cfg-msg ok';
    msg.textContent = 'Assinatura cancelada. Nenhuma nova cobrança será feita.' + (r && r.valeAte ? ` O acesso continua até ${MTAcesso.dataBR(r.valeAte)}.` : ' O acesso continua até o fim do período pago.');
    assinaturasMP();
  } catch(e) {
    if (bt) bt.disabled = false;
    msg.className = 'cfg-msg err'; msg.textContent = (e && e.message) || 'Não foi possível cancelar agora. Tente de novo ou escreva para ' + SUPORTE_EMAIL + '.';
  }
}
function abrirPlanos(){
  const msg = document.getElementById('cfgPagMsg');
  if (!ACESSO || !ACESSO.venda) { location.href = '/index.html#planos'; return; }
  const prods = (ACESSO.P.produtos || []).filter(p => !p.interno && p.linha === LINHA && Object.values(p.checkout||{}).some(Boolean));
  const ops = [].concat(...prods.map(p => MTAcesso.opcoes(ACESSO.P, p)));
  const itens = ops.map((op, i) => op.mp
    ? `<button class="b ok" data-op="${i}" style="display:flex;justify-content:space-between;gap:12px;text-align:left;height:auto;padding:10px 14px"><span>${esc(op.prod.nome||op.produto)}<br><small style="font-weight:400;opacity:.85">${esc(op.como)}</small></span><span>${esc(op.rotulo)}</span></button>`
    : `<a class="b ok" style="display:flex;justify-content:space-between;text-decoration:none" href="${esc(MTAcesso.checkoutUrl(op.prod, op.periodo, MT.user))}"><span>${esc(op.prod.nome||op.produto)}</span><span>${MTAcesso.brl(op.preco)}${op.periodo==='anual'?'/ano':'/mês'}</span></a>`).join('');
  msg.className = 'cfg-msg'; msg.innerHTML = itens ? `<div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">${itens}</div>` : 'Os planos desta linha abrem em breve.';
  msg.querySelectorAll('[data-op]').forEach(b => b.onclick = () => abrirCompra(ops[Number(b.dataset.op)], b));
}
/* botão Assinar do Mercado Pago: o servidor cria o link e o portal redireciona */
async function abrirCompra(op, bt){
  const msg = document.getElementById('cfgPagMsg');
  if (bt) bt.disabled = true;
  aviso('Abrindo o pagamento seguro do Mercado Pago…');
  try { await MTAcesso.comprar(op, MT.user); }
  catch(e) { if (bt) bt.disabled = false; if (msg) { msg.className = 'cfg-msg err'; msg.textContent = (e && e.message) || 'Não foi possível abrir o pagamento.'; } else aviso((e && e.message) || 'Não foi possível abrir o pagamento.'); }
}
function escolherAppsPlano(){
  const P = ACESSO.P, mt = ACESSO.mt || {}, vg = MTAcesso.vagas(P, mt, LINHA);
  const atuais = new Set(MTAcesso.escolhidos(P, mt, LINHA).slice(0, vg));
  const wrap = document.createElement('div'); wrap.className = 'sug-modal'; wrap.id = 'escModal';
  wrap.innerHTML = `<div class="sug-box"><h3><i class="ti ti-apps" aria-hidden="true"></i>Apps do seu plano</h3><p class="sub">Escolha ${vg===1?'1 app':vg+' apps'}. Trocar um app já escolhido só é possível uma vez a cada ${P.troca_dias||30} dias; preencher uma vaga livre é sempre possível.</p>` +
    CATALOGO_LINHA.filter(a => (P.linhas[LINHA]||[]).includes(a.id)).map(a => `<label class="apps-row"><span class="k" style="${corApp(a)}"><i class="ti ${a.ic}" aria-hidden="true"></i></span><span class="t"><b>${esc(a.nm)}</b></span><span class="sw"><input type="checkbox" data-id="${esc(a.id)}" ${atuais.has(a.id)?'checked':''}><span></span></span></label>`).join('') +
    `<div class="cfg-msg" id="escMsg"></div><div class="sug-row"><button class="b ok" id="escSalvar">Salvar</button><button class="b cancel" onclick="document.getElementById('escModal').remove()">Cancelar</button></div></div>`;
  document.body.appendChild(wrap);
  const caixas = [...wrap.querySelectorAll('input[type=checkbox]')];
  const limita = () => { const n = caixas.filter(c => c.checked).length; caixas.forEach(c => { c.disabled = !c.checked && n >= vg; }); };
  caixas.forEach(c => c.addEventListener('change', limita)); limita();
  wrap.querySelector('#escSalvar').onclick = async () => {
    const m = wrap.querySelector('#escMsg'); m.className = 'cfg-msg'; m.textContent = 'Salvando';
    try { await MTAcesso.chamar('mtEscolherApps', { linha: LINHA, apps: caixas.filter(c => c.checked).map(c => c.dataset.id) }, MT.user);
      await MT.user.getIdToken(true); ACESSO.mt = await MTAcesso.lerMt(MT.user, false); wrap.remove(); renderGrid(); preencheAssinatura();
    } catch (e) { m.className = 'cfg-msg err'; m.textContent = e.message || 'Não foi possível salvar.'; }
  };
}
/* chegada pela calculadora de planos do site: ?plano=<id>&periodo=<mensal|anual>&apps=<ids> */
function planoDaURL(){
  const q = new URLSearchParams(location.search), id = q.get('plano');
  if (!id || !ACESSO) return;
  history.replaceState(null, '', location.pathname);
  const per = q.get('periodo') || 'mensal', apps = (q.get('apps') || '').split(',').filter(Boolean);
  const p = MTAcesso.produtoPorId(ACESSO.P, id);
  if (apps.length) { try { localStorage.setItem('mt.escolha.pendente', JSON.stringify({ linha: p && p.linha, apps })); } catch(e){} }
  const op = p ? MTAcesso.opcoes(ACESSO.P, p).find(o => o.periodo === per && !o.modo) : null;
  if (op && op.mp) { abrirCompra(op); return; }
  const url = p ? MTAcesso.checkoutUrl(p, per, MT.user) : '';
  if (url) { location.href = url; return; }
  aviso('As assinaturas abrem em breve. Enquanto isso, use à vontade: todos os apps estão liberados na sua conta.');
}
/* apps escolhidos na calculadora do site: aplicados assim que a compra liberar vagas */
async function escolhaPendente(){
  let pend = null; try { pend = JSON.parse(localStorage.getItem('mt.escolha.pendente') || 'null'); } catch(e){}
  if (!pend || !ACESSO || !ACESSO.venda || !ACESSO.mt || pend.linha !== LINHA) return;
  const vg = MTAcesso.vagas(ACESSO.P, ACESSO.mt, LINHA); if (!vg) return;
  const atuais = MTAcesso.escolhidos(ACESSO.P, ACESSO.mt, LINHA);
  const novos = [...new Set(atuais.concat(pend.apps))].slice(0, vg);
  try { await MTAcesso.chamar('mtEscolherApps', { linha: LINHA, apps: novos }, MT.user); await MT.user.getIdToken(true); ACESSO.mt = await MTAcesso.lerMt(MT.user, false); localStorage.removeItem('mt.escolha.pendente'); renderGrid(); } catch(e) { console.warn('escolha pendente', e); }
}
function aviso(txt){
  const d = document.createElement('div'); d.className = 'aviso'; d.setAttribute('role', 'status'); d.textContent = txt;
  document.body.appendChild(d); setTimeout(() => d.remove(), 7000);
}
async function carregaAcesso(){
  if (ACESSO !== null || !window.MT || !MT.user || MT.user.demo) return;
  ACESSO = false;   // em andamento
  try { ACESSO = (await MT.acessoEstado()) || { venda: false }; } catch(e) { ACESSO = { venda: false }; }
  renderGrid(); preencheAssinatura(); planoDaURL(); escolhaPendente(); chegadaPagamento();
}
/* volta do Mercado Pago: ?pago=1 (aprovado ou em processamento) ou ?pago=0.
   O token é renovado até a liberação chegar (o webhook costuma levar segundos). */
async function chegadaPagamento(){
  const q = new URLSearchParams(location.search), pago = q.get('pago');
  if (!pago) return;
  history.replaceState(null, '', location.pathname);
  if (pago === '0') { aviso('O pagamento não foi concluído e nada foi cobrado. Tente de novo quando quiser.'); return; }
  const st = (q.get('status') || q.get('collection_status') || '').toLowerCase();
  if (st === 'pending' || st === 'in_process') { aviso('Pagamento em processamento. Pix confirma em minutos; boleto leva até 3 dias úteis. O acesso libera sozinho.'); return; }
  if (!ACESSO || !ACESSO.venda || !MT.user) return;
  let antes = {};
  try { const a = JSON.parse(localStorage.getItem('mt.pag.antes') || 'null'); if (a && Date.now() - a.em < 3 * 86400000) antes = a.p || {}; } catch(e){}
  const mudou = mt => Object.entries((mt && mt.p) || {}).some(([id, ate]) => ate > (antes[id] || 0));
  if (mudou(ACESSO.mt)) { try { localStorage.removeItem('mt.pag.antes'); } catch(e){} aviso('Pagamento recebido: acesso liberado.'); return; }
  aviso('Pagamento recebido, liberando o seu acesso…');
  for (let i = 0; i < 9; i++) {
    await new Promise(r => setTimeout(r, i ? 5000 : 2500));
    try {
      const mt = await MTAcesso.lerMt(MT.user, true);
      if (mudou(mt)) { ACESSO.mt = mt; try { localStorage.removeItem('mt.pag.antes'); } catch(e){} renderGrid(); preencheAssinatura(); aviso('Pronto: acesso liberado.'); return; }
    } catch(e) {}
  }
  aviso('Ainda não chegou a confirmação do Mercado Pago. Assim que chegar, o acesso libera sozinho; se demorar, escreva para ' + SUPORTE_EMAIL + '.');
}
function abrirPagamento(){
  const msg=document.getElementById('cfgPagMsg');
  const AREA_CLIENTE_URL = (ACESSO && ACESSO.P && ACESSO.P.area_cliente) || '';
  if (AREA_CLIENTE_URL){ window.open(AREA_CLIENTE_URL,'_blank','noopener'); return; }
  if (vendeMP()) { msg.className='cfg-msg'; msg.innerHTML='Os pagamentos são feitos pelo Mercado Pago. Para parar a assinatura mensal, use <b>Cancelar assinatura</b> acima: o acesso continua até o fim do período pago. Para trocar o cartão ou ver recibos, entre na sua conta do Mercado Pago, em Assinaturas. Arrependimento em até 7 dias e outras dúvidas: <a href="mailto:'+SUPORTE_EMAIL+'?subject=Assinatura%20MedTech" style="color:var(--petrol);font-weight:700">'+SUPORTE_EMAIL+'</a>.'; return; }
  msg.className='cfg-msg'; msg.innerHTML='A área de assinatura está sendo finalizada. Para trocar pagamento, ver faturas ou cancelar, fale com a gente: <a href="mailto:'+SUPORTE_EMAIL+'?subject=Assinatura%20MedTech" style="color:var(--petrol);font-weight:700">'+SUPORTE_EMAIL+'</a>.';
}

/* saudação + sair (via login central MedTech) */
function refreshUser(){
  const u = window.MT && window.MT.user;
  const el = document.getElementById('usr');
  const hello = document.getElementById('hello');
  if (u && !u.demo){
    const nm = u.displayName || u.email || 'Conta';
    el.innerHTML = `<span class="who">${esc(nm)}</span><button id="btnCfg" title="Configurações" aria-label="Configurações"><i class="ti ti-settings" aria-hidden="true"></i></button><button id="btnOut" aria-label="Sair" title="Sair"><i class="ti ti-logout" aria-hidden="true"></i><span class="lbl">Sair</span></button>`;
    document.getElementById('btnOut').onclick = () => window.MT.signOut();
    document.getElementById('btnCfg').onclick = openCfg;
    const first = (u.displayName||'').split(' ')[0];
    hello.textContent = first ? ('Olá, '+first) : 'Bem-vindo';
  } else {
    el.innerHTML = '';
    hello.textContent = 'Bem-vindo';
  }
}
let perfilOferecido = false;
document.addEventListener('click', e => {
  const a = e.target.closest('.app.trav'); if (!a) return;
  const r = travado(a.dataset.id); if (!r) return;
  e.preventDefault();
  MTAcesso.paywall({ P: ACESSO.P, mt: ACESSO.mt, appId: a.dataset.id, motivo: r.motivo, livres: r.livres, user: MT.user, signOut: () => MT.signOut(), onOk: () => { location.href = a.getAttribute('href'); } });
});
(function waitMT(){ if(window.MT){ MT.onData(function(){
  refreshUser(); renderGrid(); carregaAcesso();
  // primeira vez na conta: ainda não escolheu → oferece os perfis
  const u = MT.user, d = dados();
  if (!perfilOferecido && u && !u.demo && !(d && d[CAMPO_SEL] && Array.isArray(d[CAMPO_SEL].sel))) { perfilOferecido = true; setTimeout(() => { if (!document.getElementById('appsModal')) openMeusApps(); }, 500); }
}); refreshUser(); } else setTimeout(waitMT,40); })();

/* PWA: service worker + botão instalar */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferredPrompt = e;
  const b = document.getElementById('btnInstall'); b.hidden = false;
  b.onclick = async () => { b.hidden = true; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; };
});
window.addEventListener('appinstalled', () => { const b=document.getElementById('btnInstall'); if(b) b.hidden=true; });
</script>
