<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MedTech — seus apps médicos</title>
<meta name="description" content="Portal MedTech: todos os seus apps médicos em um só lugar, com uma conta.">
<meta name="theme-color" content="#FAFAF8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MedTech">
<script>window.MT_APP={id:"portal",name:"MedTech"};</script>
<script src="_mtfb.js?v=1"></script>
<script type="module" src="_mtauth.js?v=16"></script>
<style>
:root{--ink:#23272E;--muted:#6B7178;--dim:#9AA0A6;--paper:#FAFAF8;--line:#ECECE7;--line-strong:#D8D8D0;--accent:#2B5CE6;--ok:#0E8A63;--danger:#C6453D}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--paper);min-height:100vh;-webkit-font-smoothing:antialiased}
:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(43,92,230,.3);border-radius:10px}
header{padding:16px 0 0;padding-top:calc(14px + env(safe-area-inset-top))}
.wrap{max-width:760px;margin:0 auto;padding:0 22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wm{font-weight:700;font-size:17px;letter-spacing:-.01em}
.wm b{color:var(--accent)}
.top-r{display:flex;align-items:center;gap:7px}
.usr{display:flex;align-items:center;gap:7px}
.usr .who{font-size:12px;color:var(--dim);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usr button,.ghost{background:transparent;border:1px solid var(--line-strong);color:var(--muted);border-radius:9px;padding:7px 11px;font:500 12.5px 'Figtree',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.usr button:hover,.ghost:hover{color:var(--ink);border-color:var(--dim)}
.install{background:var(--ink);color:#fff;border:none;border-radius:9px;padding:8px 13px;font:600 12.5px 'Figtree',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.install:hover{background:#000}
main{padding:34px 0 calc(30px + env(safe-area-inset-bottom))}
.hello{text-align:center;margin-bottom:34px}
.hello h1{font-size:23px;font-weight:600;letter-spacing:-.015em}
.hello .dt{font-size:13.5px;color:var(--muted);margin-top:3px}
/* launcher: só os ícones */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:30px 14px;justify-items:center;max-width:680px;margin:0 auto;padding:0 22px}
.app{display:flex;flex-direction:column;align-items:center;gap:9px;text-decoration:none;color:inherit;width:100%}
.app .ic{width:68px;height:68px;border-radius:17px;display:grid;place-items:center;font-size:33px;color:#fff;background:var(--c,#2B5CE6);box-shadow:0 2px 6px rgba(35,39,46,.14),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .13s,box-shadow .13s}
.app:hover .ic{transform:translateY(-4px) scale(1.05);box-shadow:0 10px 22px -8px rgba(35,39,46,.3)}
.app:active .ic{transform:scale(.97)}
.app .nm{font-size:12.5px;font-weight:500;color:var(--ink);text-align:center;line-height:1.25}
.app .nm b{font-weight:600;color:inherit}
.fine{text-align:center;font-size:12px;color:var(--dim);margin-top:38px;padding:0 22px}
footer{text-align:center;color:var(--dim);font-size:11.5px;padding:18px 22px calc(20px + env(safe-area-inset-bottom))}
footer a{color:var(--muted);text-decoration:none}footer a:hover{color:var(--ink)}
.sug-modal{position:fixed;inset:0;background:rgba(35,39,46,.4);display:flex;align-items:center;justify-content:center;padding:18px;z-index:80}
.sug-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;max-width:460px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 50px -18px rgba(35,39,46,.4)}
.sug-box h3{margin-bottom:6px;color:var(--ink);font-weight:700}
.sug-box p.sub{color:var(--muted);font-size:13px;margin-bottom:8px;line-height:1.5}
.sug-box label{display:block;font-weight:600;font-size:13px;margin:10px 0 5px;color:var(--muted)}
.sug-box select,.sug-box input,.sug-box textarea{width:100%;padding:11px 12px;border:1px solid var(--line-strong);border-radius:9px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
.sug-box textarea{min-height:110px;resize:vertical;line-height:1.5}
.sug-box select:focus,.sug-box input:focus,.sug-box textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(43,92,230,.13)}
.sug-row{display:flex;gap:10px;margin-top:16px}
.sug-row .b{flex:1;border:none;border-radius:9px;padding:11px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
.sug-row .ok{background:var(--accent);color:#fff}
.sug-row .ok:hover{filter:brightness(.93)}
.sug-row .cancel{background:#fff;color:var(--ink);border:1px solid var(--line-strong)}
.cfg-sec{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--paper)}
.cfg-sec h4{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:4px;display:flex;align-items:center;gap:7px}
.cfg-sec .desc{font-size:12.5px;color:var(--muted);margin:2px 0 8px;line-height:1.5}
.cfg-msg{font-size:12.5px;margin-top:8px;min-height:14px;line-height:1.5}
.cfg-msg.ok{color:var(--ok)}.cfg-msg.err{color:var(--danger)}
@media(max-width:560px){.grid{grid-template-columns:repeat(4,1fr);gap:24px 8px}.app .ic{width:62px;height:62px;border-radius:16px;font-size:30px}.app .nm{font-size:11.5px}.hello{margin-bottom:26px}.hello h1{font-size:20px}main{padding-top:24px}}
</style>
<link rel="stylesheet" href="_mttokens.css?v=1">
</head>
<body>
<header>
  <div class="wrap top">
    <span class="wm">Med<b>Tech</b></span>
    <div class="top-r">
      <button class="ghost" id="btnSug" onclick="openSug()"><i class="ti ti-bulb" aria-hidden="true"></i>Sugestão</button>
      <button class="install" id="btnInstall" hidden><i class="ti ti-download" aria-hidden="true"></i>Instalar</button>
      <div class="usr" id="usr"></div>
    </div>
  </div>
</header>

<main>
  <div class="hello"><h1 id="hello">Bem-vindo</h1><div class="dt" id="issueDate"></div></div>
  <div class="grid" id="grid"></div>
  <p class="fine">Login único — entre uma vez e todos os apps abrem já autenticados.</p>
</main>

<footer>© 2026 <a href="index.html">MedTech</a> · <a href="privacidade.html">Privacidade</a> · <a href="termos.html">Termos</a></footer>

<script>
const BASE = 'https://medtechbr.github.io/';
const APPS = [
  { nm:'ConsultAI',  ic:'ti-calendar-event', c:'#2B5CE6', url:BASE+'consultai.html' },
  { nm:'CondutAI',   ic:'ti-stethoscope',    c:'#1D6FD0', url:BASE+'condutai.html' },
  { nm:'ATBguia',    ic:'ti-pill',           c:'#0E8A9C', url:BASE+'atbguia.html' },
  { nm:'EnfermarIA', ic:'ti-bed',            c:'#3B7BE0', url:BASE+'enfermaria.html' },
  { nm:'PocusAI',    ic:'ti-scan',           c:'#2456B8', url:BASE+'pocusai.html' },
  { nm:'LaudAI',     ic:'ti-report-medical', c:'#4166D6', url:BASE+'laudai.html' },
  { nm:'PaliAI',     ic:'ti-heart-handshake',c:'#B84A86', url:BASE+'paliai.html' },
  { nm:'CalcMed',    ic:'ti-calculator',     c:'#4C7A99', url:BASE+'calcmed.html' },
  { nm:'MedProvas',  ic:'ti-clipboard-text', c:'#C07C0A', url:BASE+'medprovas.html' },
  { nm:'FlashMed',   ic:'ti-cards',          c:'#D0902A', url:BASE+'flashmed.html' },
  { nm:'Guia do Interno', ic:'ti-school',    c:'#A8730F', url:BASE+'guiainterno.html' },
  { nm:'Foco',       ic:'ti-target-arrow',   c:'#0E8A63', url:BASE+'foco.html' },
  { nm:'PlantãoHub', ic:'ti-clock',          c:'#15966F', url:BASE+'plantaohub.html' },
  { nm:'Granaê',     ic:'ti-wallet',         c:'#6D46D8', url:BASE+'granae.html' },
  { nm:'Logbook',    ic:'ti-notebook',       c:'#B0532F', url:BASE+'logbook.html' }
];
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function fmtName(nm){ return /(AI|IA)$/.test(nm) ? esc(nm.slice(0,-2))+'<b>'+nm.slice(-2)+'</b>' : esc(nm); }
function appItem(a){
  return `<a class="app" href="${a.url}" style="--c:${a.c}">
    <span class="ic"><i class="ti ${a.ic}" aria-hidden="true"></i></span>
    <span class="nm">${fmtName(a.nm)}</span>
  </a>`;
}
document.getElementById('grid').innerHTML = APPS.map(appItem).join('');
document.getElementById('issueDate').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});

/* ===== Sugestões de funções (vão por e-mail para a equipe MedTech) ===== */
const SUG_EMAIL = 'medtechbr1@gmail.com';
function openSug(){
  const u = window.MT && window.MT.user;
  const opts = ['Geral / portal'].concat(APPS.map(a=>a.nm)).map(n=>`<option>${esc(n)}</option>`).join('');
  const wrap = document.createElement('div'); wrap.className='sug-modal'; wrap.id='sugModal';
  wrap.innerHTML = `<div class="sug-box">
    <h3 style="display:flex;align-items:center;gap:8px"><i class="ti ti-bulb" aria-hidden="true"></i>Sugerir uma função</h3>
    <p class="sub">Conte o que você gostaria de ver nos apps MedTech. Sua ideia vai direto para a equipe.</p>
    <label>App</label><select id="sugApp">${opts}</select>
    <label>Sua sugestão</label><textarea id="sugTxt" placeholder="Ex.: no EnfermarIA, poder ordenar os leitos por gravidade..."></textarea>
    <label>Seu contato (opcional)</label><input id="sugContato" value="${esc((u&&u.email)||'')}" placeholder="e-mail ou WhatsApp para retorno">
    <p class="sub" style="margin:10px 0 0">Ao enviar, abre seu app de e-mail com a mensagem já pronta — é só tocar em enviar.</p>
    <div class="sug-row"><button class="b ok" onclick="enviarSug()">Enviar sugestão</button><button class="b cancel" onclick="closeSug()">Cancelar</button></div>
  </div>`;
  wrap.onclick = e => { if(e.target===wrap) closeSug(); };
  document.body.appendChild(wrap);
  setTimeout(()=>{const t=document.getElementById('sugTxt'); if(t) t.focus();},50);
}
function closeSug(){ const m=document.getElementById('sugModal'); if(m) m.remove(); }
function enviarSug(){
  const app = document.getElementById('sugApp').value;
  const txt = document.getElementById('sugTxt').value.trim();
  const contato = document.getElementById('sugContato').value.trim();
  if(!txt){ alert('Escreva sua sugestão antes de enviar.'); return; }
  const u = window.MT && window.MT.user;
  const subject = 'Sugestão MedTech — ' + app;
  const body = 'App: '+app+'\n\nSugestão:\n'+txt+'\n\nContato: '+(contato||'(não informado)')+'\nUsuário logado: '+((u&&u.email)||'(não logado)');
  window.location.href = 'mailto:'+SUG_EMAIL+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  closeSug();
}

/* ===== Configurações (perfil, senha, assinatura) ===== */
const KIWIFY_PORTAL_URL = ''; // portal do cliente Kiwify (definir quando os pagamentos forem configurados)
const SUPORTE_EMAIL = 'medtechbr1@gmail.com';
function cfgVal(id){ const e = document.getElementById(id); return e ? e.value.trim() : ''; }
function openCfg(){
  const u = window.MT && window.MT.user;
  if (!u || u.demo){ alert('Entre na sua conta MedTech para acessar as configurações.'); return; }
  const perfil = (window.MT && MT._data && MT._data.perfil) || {};
  const wrap = document.createElement('div'); wrap.className='sug-modal'; wrap.id='cfgModal';
  wrap.innerHTML = `<div class="sug-box">
    <h3 style="display:flex;align-items:center;gap:8px"><i class="ti ti-settings" aria-hidden="true"></i>Configurações</h3>
    <div class="cfg-sec">
      <h4><i class="ti ti-user" aria-hidden="true"></i>Perfil e cadastro</h4>
      <div class="desc">Seu nome aparece em todos os apps MedTech.</div>
      <label>Nome</label><input id="cfgNome" value="${esc(u.displayName||'')}" placeholder="Seu nome">
      <label>E-mail (login)</label><input value="${esc(u.email||'')}" disabled style="opacity:.65">
      <label>Telefone / WhatsApp</label><input id="cfgFone" value="${esc(perfil.fone||'')}" placeholder="(11) 99999-9999">
      <label>CRM</label><input id="cfgCrm" value="${esc(perfil.crm||'')}" placeholder="Ex.: 123456/SP">
      <label>Especialidade</label><input id="cfgEsp" value="${esc(perfil.esp||'')}" placeholder="Ex.: Clínica Médica">
      <label>Instituição</label><input id="cfgInst" value="${esc(perfil.inst||'')}" placeholder="Hospital / faculdade">
      <div class="sug-row"><button class="b ok" onclick="salvarPerfil()">Salvar perfil</button></div>
      <div class="cfg-msg" id="cfgPerfilMsg"></div>
    </div>
    <div class="cfg-sec">
      <h4><i class="ti ti-lock" aria-hidden="true"></i>Senha</h4>
      <div class="desc">Defina uma nova senha (mín. 6 caracteres) ou receba um link de redefinição por e-mail.</div>
      <label>Nova senha</label><input id="cfgPass1" type="password" placeholder="Nova senha" autocomplete="new-password">
      <label>Confirmar nova senha</label><input id="cfgPass2" type="password" placeholder="Repita a nova senha" autocomplete="new-password">
      <div class="sug-row"><button class="b ok" onclick="alterarSenha()">Alterar senha</button><button class="b cancel" onclick="enviarResetSenha()">Link por e-mail</button></div>
      <div class="cfg-msg" id="cfgSenhaMsg"></div>
    </div>
    <div class="cfg-sec">
      <h4><i class="ti ti-credit-card" aria-hidden="true"></i>Assinatura e pagamento</h4>
      <div class="desc">Seu pagamento é processado com segurança pela Kiwify. Para trocar o cartão, ver faturas ou cancelar, use o portal do cliente — <b>nunca pedimos o número do cartão aqui</b>.</div>
      <div class="sug-row"><button class="b ok" onclick="abrirPagamento()">Gerenciar assinatura / pagamento</button></div>
      <div class="cfg-msg" id="cfgPagMsg"></div>
    </div>
    <div class="sug-row"><button class="b cancel" onclick="closeCfg()">Fechar</button></div>
  </div>`;
  wrap.onclick = e => { if (e.target===wrap) closeCfg(); };
  document.body.appendChild(wrap);
}
function closeCfg(){ const m=document.getElementById('cfgModal'); if (m) m.remove(); }
async function salvarPerfil(){
  const msg=document.getElementById('cfgPerfilMsg'); msg.className='cfg-msg'; msg.textContent='Salvando…';
  try{
    const nome=cfgVal('cfgNome');
    if (window.MT && MT._fb && MT.user && nome && nome!==(MT.user.displayName||'')) { await MT._fb.A.updateProfile(MT.user, {displayName:nome}); }
    const perfil={fone:cfgVal('cfgFone'),crm:cfgVal('cfgCrm'),esp:cfgVal('cfgEsp'),inst:cfgVal('cfgInst')};
    const base=(window.MT && MT._data && typeof MT._data==='object')?MT._data:{};
    if (window.MT && MT.save) await MT.save(Object.assign({}, base, {perfil}));
    msg.className='cfg-msg ok'; msg.textContent='✓ Perfil salvo.';
    refreshUser();
  }catch(e){ msg.className='cfg-msg err'; msg.textContent='Erro ao salvar: '+(e.message||e); }
}
async function alterarSenha(){
  const msg=document.getElementById('cfgSenhaMsg'); msg.className='cfg-msg';
  const p1=cfgVal('cfgPass1'), p2=cfgVal('cfgPass2');
  if (p1.length<6){ msg.className='cfg-msg err'; msg.textContent='A senha deve ter ao menos 6 caracteres.'; return; }
  if (p1!==p2){ msg.className='cfg-msg err'; msg.textContent='As senhas não conferem.'; return; }
  if (!(window.MT && MT._fb && MT.user)){ msg.className='cfg-msg err'; msg.textContent='Sessão indisponível.'; return; }
  const A=MT._fb.A; msg.textContent='Alterando…';
  try{
    await A.updatePassword(MT.user, p1);
    msg.className='cfg-msg ok'; msg.textContent='✓ Senha alterada com sucesso.';
    document.getElementById('cfgPass1').value=''; document.getElementById('cfgPass2').value='';
  }catch(e){
    if (e && e.code==='auth/requires-recent-login'){
      const cur=prompt('Por segurança, confirme sua senha ATUAL para concluir a alteração:');
      if (!cur){ msg.className='cfg-msg err'; msg.textContent='Alteração cancelada.'; return; }
      try{
        const cred=A.EmailAuthProvider.credential(MT.user.email, cur);
        await A.reauthenticateWithCredential(MT.user, cred);
        await A.updatePassword(MT.user, p1);
        msg.className='cfg-msg ok'; msg.textContent='✓ Senha alterada com sucesso.';
        document.getElementById('cfgPass1').value=''; document.getElementById('cfgPass2').value='';
      }catch(e2){ const w=(e2.code==='auth/wrong-password'||e2.code==='auth/invalid-credential'); msg.className='cfg-msg err'; msg.textContent=w?'Senha atual incorreta.':('Não foi possível: '+(e2.message||e2)); }
    } else { msg.className='cfg-msg err'; msg.textContent='Não foi possível: '+(e.message||e); }
  }
}
async function enviarResetSenha(){
  const msg=document.getElementById('cfgSenhaMsg'); msg.className='cfg-msg';
  if (!(window.MT && MT._fb && MT.user)){ msg.className='cfg-msg err'; msg.textContent='Sessão indisponível.'; return; }
  try{ await MT._fb.A.sendPasswordResetEmail(MT._fb.auth, MT.user.email); msg.className='cfg-msg ok'; msg.textContent='✓ Link enviado para '+MT.user.email+'.'; }
  catch(e){ msg.className='cfg-msg err'; msg.textContent='Erro: '+(e.message||e); }
}
function abrirPagamento(){
  const msg=document.getElementById('cfgPagMsg');
  if (KIWIFY_PORTAL_URL){ window.open(KIWIFY_PORTAL_URL,'_blank','noopener'); return; }
  msg.className='cfg-msg'; msg.innerHTML='A área de assinatura está sendo finalizada. Para trocar pagamento, ver faturas ou cancelar, fale com a gente: <a href="mailto:'+SUPORTE_EMAIL+'?subject=Assinatura%20MedTech" style="color:var(--petrol);font-weight:700">'+SUPORTE_EMAIL+'</a>.';
}

/* saudação + sair (via login central MedTech) */
function refreshUser(){
  const u = window.MT && window.MT.user;
  const el = document.getElementById('usr');
  const hello = document.getElementById('hello');
  if (u && !u.demo){
    const nm = u.displayName || u.email || 'Conta';
    el.innerHTML = `<span class="who">${esc(nm)}</span><button id="btnCfg" title="Configurações" aria-label="Configurações"><i class="ti ti-settings" aria-hidden="true"></i></button><button id="btnOut"><i class="ti ti-logout" aria-hidden="true"></i>Sair</button>`;
    document.getElementById('btnOut').onclick = () => window.MT.signOut();
    document.getElementById('btnCfg').onclick = openCfg;
    const first = (u.displayName||'').split(' ')[0];
    hello.textContent = first ? ('Olá, '+first) : 'Bem-vindo';
  } else {
    el.innerHTML = '';
    hello.textContent = 'Bem-vindo';
  }
}
(function waitMT(){ if(window.MT){ MT.onData(refreshUser); refreshUser(); } else setTimeout(waitMT,40); })();

/* PWA: service worker + botão instalar */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferredPrompt = e;
  const b = document.getElementById('btnInstall'); b.hidden = false;
  b.onclick = async () => { b.hidden = true; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; };
});
window.addEventListener('appinstalled', () => { const b=document.getElementById('btnInstall'); if(b) b.hidden=true; });
</script>
</body>
</html>
