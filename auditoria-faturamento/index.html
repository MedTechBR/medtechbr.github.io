<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Auditoria de faturamento</title>
<style>
:root{color-scheme:light;--bg:#f3f5fa;--sup:#fff;--tinta:#101828;--sec:#5d6679;--fio:#e6e9f1;--ac:#2563eb;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;
--sombra:0 1px 2px rgba(16,24,40,.04),0 10px 30px -14px rgba(16,24,40,.14);--mola:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}html,body{margin:0}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tinta);-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
button{font:inherit}
:focus-visible{outline:2px solid var(--c,var(--ac));outline-offset:2px}

/* ícones em círculo */
.ic{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--ac)) 14%,#fff);color:var(--c,var(--ac));transition:transform .3s var(--mola),background .2s,color .2s}
.ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.g{width:54px;height:54px}.ic.g svg{width:27px;height:27px}
.ic.p{width:34px;height:34px}.ic.p svg{width:18px;height:18px}
.ic.xs{width:24px;height:24px}.ic.xs svg{width:14px;height:14px}
.ic.cheio{background:var(--c,var(--ac));color:#fff}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* barra lateral */
nav{width:240px;flex:none;background:var(--sup);border-right:1px solid var(--fio);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;z-index:10}
.marca{display:flex;gap:11px;align-items:center;margin:0 6px 22px;font-weight:700;font-size:15.5px;line-height:1.15}
.marca small{display:block;font-weight:400;color:var(--sec);font-size:13px}
.nb{all:unset;position:relative;display:flex;gap:12px;align-items:center;padding:6px 12px 6px 6px;border-radius:999px;cursor:pointer;color:var(--sec);font-weight:500;transition:background .2s,color .2s}
.nb:hover{background:color-mix(in srgb,var(--c) 8%,#fff);color:var(--tinta)}
.nb:hover .ic{transform:scale(1.1) rotate(-6deg)}
.nb[aria-current=page]{background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--tinta);font-weight:650}
.nb[aria-current=page] .ic{background:var(--c);color:#fff}
.nb .cont{margin-left:auto;font-size:12px;background:var(--c);color:#fff;border-radius:999px;padding:1px 8px;font-weight:650;min-width:24px;text-align:center}
.oper{margin-top:auto;display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:999px;padding:5px 6px 5px 5px;transition:box-shadow .2s}
.oper span{font-size:12.5px;color:var(--sec)}
.oper input{all:unset;min-width:0;flex:1;font-size:14px;padding:4px 6px;border-radius:999px;background:var(--sup)}
.oper:focus-within{box-shadow:0 0 0 2px var(--ac)}

main{flex:1;min-width:0;padding:26px 34px 70px;max-width:1260px}
.topo{display:flex;gap:14px;align-items:center;margin:0 0 20px}
.topo h2{font-size:25px;margin:0;font-weight:750;letter-spacing:-.015em;line-height:1.2}
.sub{color:var(--sec);margin:2px 0 0}
.aviso{display:flex;gap:12px;align-items:center;background:#fff8eb;border:1px solid #f6dfae;border-radius:999px;padding:6px 18px 6px 6px;margin-bottom:18px;font-size:14px}

/* herói */
.heroi{--c:var(--ac);background:color-mix(in srgb,var(--c) 9%,#fff);border:1px solid color-mix(in srgb,var(--c) 18%,#fff);border-radius:30px;padding:24px 28px;margin-bottom:18px;display:grid;grid-template-columns:1fr auto;gap:16px 24px;align-items:start}
.heroi .r{color:var(--sec);font-weight:550}
.heroi .gg{font-size:46px;font-weight:780;letter-spacing:-.025em;line-height:1.08;margin:4px 0;font-variant-numeric:tabular-nums}
.heroi .gg.sm{font-size:32px}
.heroi .n{color:var(--sec);font-size:14px}
.comps{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:620px}
.divide{grid-column:1/-1;display:flex;gap:3px;height:18px;border-radius:999px;overflow:hidden;background:color-mix(in srgb,var(--c) 12%,#fff)}
.divide span{height:100%}
.heroi .leg{grid-column:1/-1;margin:0}
.anelbox{position:relative;width:140px;height:140px;flex:none}
.anelbox .anelv{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:30px;font-weight:780;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.anelbox small{display:block;font-size:12.5px;font-weight:500;color:var(--sec);letter-spacing:0}
.arco{transition:stroke-dashoffset 1.3s var(--mola)}
.heroi.comanel{grid-template-columns:auto 1fr;align-items:center}
.chips-st{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.stc{--c:var(--ac);display:inline-flex;align-items:center;gap:8px;background:var(--sup);border-radius:999px;padding:4px 14px 4px 4px;font-size:13.5px;color:var(--sec);box-shadow:var(--sombra)}
.stc b{color:var(--tinta);font-weight:700;font-variant-numeric:tabular-nums}

/* pílulas e controles */
.pill{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;background:var(--sup);border:1px solid var(--fio);font-size:13.5px;font-weight:560;color:var(--tinta);transition:transform .18s var(--mola),background .2s,border-color .2s,color .2s,box-shadow .2s;white-space:nowrap}
.pill:hover{border-color:var(--c,var(--ac));transform:translateY(-1px);box-shadow:0 6px 16px -10px var(--c,var(--ac))}
.pill:active{transform:scale(.95)}
.pill.on{background:var(--c,var(--ac));border-color:var(--c,var(--ac));color:#fff}
.pill b{font-weight:700;opacity:.7}
.pill .ic{margin-left:-8px}
.seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:3px;gap:2px;flex:none}
.seg button{all:unset;cursor:pointer;padding:5px 11px;border-radius:999px;color:var(--sec);display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:560;transition:background .2s,color .2s,box-shadow .2s}
.seg button:hover{color:var(--tinta)}
.seg button[aria-pressed=true]{background:var(--sup);color:var(--tinta);box-shadow:0 1px 3px rgba(16,24,40,.14)}
.seg button b{background:color-mix(in srgb,var(--c,var(--ac)) 14%,#fff);color:var(--tinta);border-radius:999px;padding:0 7px;font-size:12px}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.bt{all:unset;cursor:pointer;display:inline-flex;gap:8px;align-items:center;padding:10px 18px;border-radius:999px;background:var(--c,var(--ac));color:#fff;font-weight:620;font-size:14px;transition:transform .15s var(--mola),box-shadow .2s,filter .2s}
.bt:hover{transform:translateY(-1px);box-shadow:0 10px 22px -12px var(--c,var(--ac));filter:brightness(1.05)}
.bt:active{transform:scale(.96)}
.bt[disabled]{opacity:.6;pointer-events:none}

/* indicadores */
.tiles{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:14px;margin-bottom:18px}
.tile{background:var(--sup);border-radius:24px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;box-shadow:var(--sombra);border:1px solid var(--fio);transition:transform .3s var(--mola),box-shadow .3s}
.tile:hover{transform:translateY(-4px);box-shadow:0 18px 34px -18px color-mix(in srgb,var(--c) 60%,transparent)}
.tile:hover .ic{transform:scale(1.12) rotate(-8deg)}
.tile .tx{min-width:0}
.tile .r{font-size:13px;color:var(--sec)}
.tile .v{font-size:24px;font-weight:750;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.25;margin:2px 0}
.tile .v.nd{font-size:14px;font-weight:500;color:var(--sec)}
.tile .n{font-size:12.5px;color:var(--sec)}

/* cartões */
.cartao{background:var(--sup);border:1px solid var(--fio);border-radius:26px;padding:18px 20px 20px;box-shadow:var(--sombra);margin-bottom:18px;overflow:hidden;transition:box-shadow .3s}
.cartao:hover{box-shadow:0 1px 2px rgba(16,24,40,.04),0 18px 40px -20px rgba(16,24,40,.25)}
.cartao .ch{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.cartao h3{font-size:16px;margin:0;font-weight:680}
.cartao .d{color:var(--sec);font-size:13.5px;margin:1px 0 0}
.cartao .tt{flex:1;min-width:0}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:18px;margin-bottom:18px}.grade .cartao{margin:0}
.grade.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.grade.lado{grid-template-columns:minmax(0,1fr) minmax(0,1.7fr)}
.rolar{overflow-x:auto;margin:0 -4px;padding:0 4px}
.vazio{text-align:center;padding:40px 20px}.vazio .ic{margin:0 auto 12px}

/* gráficos */
svg.g{display:block;width:100%;height:auto;overflow:visible}
svg.g text{font-size:11.5px;fill:var(--sec);font-variant-numeric:tabular-nums}
svg.g text.forte{fill:var(--tinta);font-weight:650}
.barra-g{transition:opacity .2s}
svg.g:has(.barra-g:hover) .barra-g:not(:hover){opacity:.32}
.cv{transform-box:fill-box;transform-origin:50% 100%;animation:cv .8s var(--mola) both;animation-delay:calc(var(--k,0)*60ms + 120ms)}
.cx{transform-box:fill-box;transform-origin:0 50%;animation:cx .8s var(--mola) both;animation-delay:calc(var(--k,0)*55ms + 120ms)}
.traca{stroke-dasharray:1;stroke-dashoffset:1;animation:traca 1.2s .15s cubic-bezier(.4,0,.2,1) forwards}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s 1.15s cubic-bezier(.3,1.6,.5,1) both}
.surge{animation:surge .8s .7s both}
.guia{stroke:var(--sec);stroke-dasharray:3 3;opacity:0;transition:opacity .15s}.guia.on{opacity:.6}
.leg{display:flex;gap:14px;font-size:13px;color:var(--sec);margin:0 0 8px;flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.w{width:0;transition:width 1s var(--mola)}
.bw{display:inline-block;width:120px;height:9px;background:color-mix(in srgb,var(--c,var(--ac)) 10%,#fff);border-radius:999px;vertical-align:middle;margin-right:10px;overflow:hidden}
.bw span{display:block;height:100%;border-radius:999px}
.bw.g{width:100%;height:16px;margin:0}
.st{display:flex;gap:2px;height:10px;border-radius:999px;overflow:hidden;background:var(--bg);min-width:170px}
.st span{height:100%}

/* barras horizontais (HTML: não encolhem dentro de cartão estreito) */
.hb{display:grid;gap:9px}
.hr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) auto;gap:10px;align-items:center;font-size:13.5px;transition:opacity .2s}
.hb:has(.hr:hover) .hr:not(:hover){opacity:.38}
.hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar{height:14px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--ac)) 8%,#fff);overflow:hidden}
.hbar span{display:block;height:100%;border-radius:999px}
.hv{font-variant-numeric:tabular-nums;color:var(--sec);font-size:13px;text-align:right;min-width:62px}
/* tabelas */
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:600;text-align:left;color:var(--sec);font-size:12.5px;padding:8px 10px 8px 0;border-bottom:1px solid var(--fio)}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--fio);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}tbody tr:hover{background:color-mix(in srgb,var(--c,var(--ac)) 6%,#fff)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.rotic{display:inline-flex;align-items:center;gap:8px;font-weight:560}

/* documentação: prevalência */
.prevs{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.prevc{all:unset;cursor:pointer;display:block;background:var(--sup);border:1px solid var(--fio);border-radius:24px;padding:14px 16px 12px;box-shadow:var(--sombra);transition:transform .3s var(--mola),box-shadow .3s,border-color .2s}
.prevc:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--c) 40%,#fff);box-shadow:0 18px 34px -18px color-mix(in srgb,var(--c) 60%,transparent)}
.prevc:hover .ic{transform:scale(1.1) rotate(-8deg)}
.pc-t{display:flex;gap:10px;align-items:center}
.pc-t div{flex:1;min-width:0;line-height:1.25}.pc-t b{display:block;font-size:14px}.pc-t span{font-size:12.5px;color:var(--sec);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-v{font-size:24px;font-weight:780;font-variant-numeric:tabular-nums}
.pc-a{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--c);opacity:0;transform:translateX(-4px);transition:opacity .2s,transform .2s}
.prevc:hover .pc-a{opacity:1;transform:none}
.cruz .lin{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 76px;gap:4px 14px;align-items:center;margin:10px 0}
.cruz .r{font-weight:560}.cruz .v{font-size:20px;font-weight:750;text-align:right;font-variant-numeric:tabular-nums}
.cruz .n{grid-column:2/-1;font-size:12.5px;color:var(--sec);margin-top:-4px}

/* fila */
.item{display:flex;gap:14px;padding:16px 18px;background:var(--sup);border:1px solid var(--fio);border-radius:24px;margin-bottom:10px;box-shadow:var(--sombra);transition:transform .3s var(--mola),box-shadow .3s,border-color .3s}
.item:hover{transform:translateX(4px);border-color:color-mix(in srgb,var(--c) 30%,#fff)}
.item .corpo{flex:1;min-width:0}
.item .t{font-size:14px;color:var(--sec)}.item .t b{color:var(--tinta)}
.item p{margin:4px 0 6px;font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:680;padding:1px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,#fff);color:color-mix(in srgb,var(--c) 70%,#000);margin-left:6px;vertical-align:1px}
.tag.cinza{--c:#475569}
.m{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--sec)}.m span{display:inline-flex;gap:6px;align-items:center}
.a{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.pill.ok{--c:#059669}.pill.nao{--c:#64748b}.pill.ghost{border-color:transparent;background:var(--bg)}
.quem{font-size:12.5px;color:var(--sec)}
.item.procede{border-color:color-mix(in srgb,#059669 35%,#fff)}.item.procede>.ic{background:#059669;color:#fff}
.item.nao_procede{opacity:.72}.item.nao_procede>.ic{background:#64748b;color:#fff}
.lastro{margin-top:10px;padding:10px 12px;background:var(--bg);border-radius:16px;font-size:13px;color:var(--sec);animation:sobe .3s var(--mola)}
.lastro div{display:flex;gap:8px;align-items:flex-start;margin:3px 0}

/* inserir dados */
.acoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin-bottom:18px}
.acao{background:var(--sup);border:1px solid var(--fio);border-radius:28px;padding:22px;box-shadow:var(--sombra);display:flex;flex-direction:column;gap:12px}
.acao h3{margin:6px 0 0;font-size:17px}.acao .d{color:var(--sec);font-size:13.5px;margin:0}
.drop{display:flex;flex-direction:column;align-items:center;gap:3px;padding:16px;border:2px dashed color-mix(in srgb,var(--c) 38%,#fff);border-radius:22px;background:color-mix(in srgb,var(--c) 5%,#fff);cursor:pointer;text-align:center;transition:background .2s,border-color .2s,transform .2s var(--mola);color:var(--c)}
.drop:hover,.drop.sobre{background:color-mix(in srgb,var(--c) 12%,#fff);border-color:var(--c);transform:scale(1.015)}
.drop.tem{border-style:solid;background:color-mix(in srgb,var(--c) 10%,#fff)}
.drop .dn{font-weight:620;color:var(--tinta);font-size:14px;word-break:break-all}.drop small{color:var(--sec);font-size:12.5px}
.drop svg.i{width:26px;height:26px}
.sw{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:14px}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw .trilho{width:44px;height:26px;border-radius:999px;background:#d5dae4;position:relative;flex:none;transition:background .2s}
.sw .trilho::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.sw input:checked+.trilho{background:var(--c)}.sw input:checked+.trilho::after{transform:translateX(18px)}
.sw input:focus-visible+.trilho{outline:2px solid var(--c);outline-offset:2px}
.estado{display:flex;gap:8px;flex-wrap:wrap}
.msg{font-size:14px}.msg.e{color:#b42318}
pre{white-space:pre-wrap;font:13px/1.55 ui-monospace,Menlo,monospace;background:var(--bg);padding:16px;border-radius:18px;max-height:560px;overflow:auto;margin:0}

/* registro */
.ev{display:flex;gap:12px;align-items:center;padding:11px 6px;border-radius:16px;transition:background .15s}
.ev:hover{background:var(--bg)}
.ev .tx{flex:1;min-width:0}.ev .tx b{font-weight:650}.ev .tx div{font-size:13px;color:var(--sec);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .qd{color:var(--sec);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* movimento */
.entra{animation:sobe .55s var(--mola) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes sobe{from{opacity:0;transform:translateY(12px)}}
@keyframes cv{from{transform:scaleY(0)}}@keyframes cx{from{transform:scaleX(0)}}
@keyframes traca{to{stroke-dashoffset:0}}@keyframes pop{from{transform:scale(0)}}@keyframes surge{from{opacity:0}}
.bate{animation:bate .5s cubic-bezier(.3,1.6,.5,1)}@keyframes bate{40%{transform:scale(1.14)}}
.treme{animation:treme .45s}@keyframes treme{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.gira{animation:gira .9s linear infinite}@keyframes gira{to{transform:rotate(360deg)}}

#dica{position:fixed;pointer-events:none;background:var(--tinta);color:#fff;font-size:12.5px;padding:7px 11px;border-radius:12px;z-index:30;max-width:300px;white-space:pre-line;box-shadow:0 10px 24px -10px rgba(0,0,0,.4)}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:25;align-items:flex-end}
.toast{display:flex;gap:10px;align-items:center;background:var(--tinta);color:#fff;padding:6px 18px 6px 6px;border-radius:999px;box-shadow:0 14px 30px -12px rgba(0,0,0,.45);animation:tin .4s cubic-bezier(.3,1.3,.5,1) both;font-size:14px;max-width:460px}
.toast.sai{animation:tout .3s forwards}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.95)}}@keyframes tout{to{opacity:0;transform:translateY(10px)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.traca{stroke-dashoffset:0}}
@media (max-width:1180px){.grade.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.grade.lado{grid-template-columns:minmax(0,1fr)}.tiles{--n:3!important}}
@media (max-width:900px){.grade,.grade.g3,.acoes{grid-template-columns:1fr}.tiles{--n:2!important}}
@media (max-width:820px){
 .app{display:block}
 nav{position:fixed;inset:auto 0 0 0;height:auto;width:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--fio);gap:0;background:rgba(255,255,255,.97)}
 .marca{display:none}
 .nb{flex-direction:column;gap:3px;padding:4px 6px;font-size:11px;border-radius:18px}
 .nb[aria-current=page]{background:transparent}
 .nb .cont{position:absolute;top:0;right:2px;font-size:10.5px;padding:0 6px;min-width:0}
 .oper{position:fixed;top:10px;right:12px;margin:0;background:var(--sup);box-shadow:var(--sombra);max-width:190px}
 .oper span{display:none}
 main{padding:62px 16px 104px}
 .heroi,.heroi.comanel{grid-template-columns:1fr;padding:20px}
 .comps{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;max-width:none;margin:0 -20px;padding:2px 20px}.heroi .gg{font-size:36px}

  return `<section class="cartao entra" style="--c:${o.cor||'var(--ac)'}"><header class="ch">${ic(o.ic||'grafico',o.cor,'p')}<div class="tt"><h3>${o.tit}</h3><p class="d">${o.desc}</p></div>${o.t?`<div class="seg" data-alvo="${id}"><button aria-pressed="true" data-vis="g" title="Ver gráfico">${svgI('linha')}</button><button aria-pressed="false" data-vis="t" title="Ver tabela">${svgI('tabela')}</button></div>`:''}</header><div id="${id}g">${o.g}</div>${o.t?`<div id="${id}t" hidden>${o.t}</div>`:''}</section>`}
function tabela(cab,linhas){return `<div class="rolar"><table><thead><tr>${cab.map(c=>`<th class="${c.n?'num':''}">${c.t}</th>`).join('')}</tr></thead><tbody>${linhas.map(l=>`<tr>${l.map((v,i)=>`<td class="${cab[i].n?'num':''}">${v??'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
const tiles=(arr,n)=>`<div class="tiles" style="--n:${n||Math.min(arr.length,3)}">${arr.map(tile).join('')}</div>`;
const barra=(frac,cor,dd)=>`<span class="bw"><span class="w" data-w="${100*(frac||0)}" style="background:${cor}"${dd?` data-d="${esc(dd)}"`:''}></span></span>`;
const legenda=ss=>`<div class="leg">${ss.map(k=>`<span><i style="background:${k.cor}"></i>${k.n}</span>`).join('')}</div>`;
const vazio=(i,t,x,cor)=>`<section class="cartao entra vazio" style="--c:${cor}">${ic(i,cor,'g')}<h3>${t}</h3><p class="d">${x}</p></section>`;
function anel(v,cor,tam=140){const r=(tam-16)/2,C=2*Math.PI*r,off=C*(1-Math.max(0,Math.min(v??0,1)));
  return `<svg viewBox="0 0 ${tam} ${tam}" width="${tam}" height="${tam}" aria-hidden="true"><circle cx="${tam/2}" cy="${tam/2}" r="${r}" fill="none" style="stroke:color-mix(in srgb,${cor} 16%,#fff)" stroke-width="13"/><circle class="arco" cx="${tam/2}" cy="${tam/2}" r="${r}" fill="none" stroke="${cor}" stroke-width="13" stroke-linecap="round" stroke-dasharray="${C}" style="stroke-dashoffset:${C}" data-off="${off}" transform="rotate(-90 ${tam/2} ${tam/2})"/></svg>`}
document.addEventListener('click',e=>{const b=e.target.closest('.seg[data-alvo] button');if(!b)return;const s=b.parentElement,id=s.dataset.alvo,t=b.dataset.vis=='t';
  $$('button',s).forEach(x=>x.setAttribute('aria-pressed',x===b));$('#'+id+'g').hidden=t;$('#'+id+'t').hidden=!t;if(!t)vivo($('#'+id+'g'))});

// ---------- gráficos (SVG à mão: roda sem internet, dentro do hospital)
const estreito=()=>innerWidth<700;
function teto(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));return Math.ceil(v/p*2)/2*p}
function eixoY(max,alt,fmt,W,esq){let o='';for(let k=0;k<=4;k++){const v=max*k/4,y=alt-10-(alt-30)*k/4;o+=`<line x1="${esq}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--fio)" ${k?'stroke-dasharray="2 4"':''}/><text x="${esq-7}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`}return o}
function colunasEmpilhadas(dados,series,fmt){const W=estreito()?380:640,H=estreito()?230:250,E=estreito()?48:60,max=teto(Math.max(...dados.map(d=>series.reduce((s,k)=>s+(d[k.c]||0),0))));
  const lw=(W-E)/dados.length,bw=Math.min(44,lw*.58);let o=eixoY(max,H,fmt,W,E);
  dados.forEach((d,i)=>{let y=H-10;const x=E+lw*i+(lw-bw)/2,vis=series.filter(k=>(d[k.c]||0)>0);o+=`<g class="cv" style="--k:${i}">`;
    vis.forEach((k,j)=>{const h=(H-30)*(d[k.c]||0)/max;y-=h;const topo=j==vis.length-1,r=Math.min(7,h);
      o+=`<path class="barra-g" d="M${x},${y+h} V${y+(topo?r:0)} ${topo?`q0,-${r} ${r},-${r} H${x+bw-r} q${r},0 ${r},${r}`:`H${x+bw}`} V${y+h}Z" fill="${k.cor}" data-d="${esc(d.rot+'\n'+k.n+': '+fmt(d[k.c]||0))}"/>`;
      if(!topo)o+=`<line x1="${x}" x2="${x+bw}" y1="${y}" y2="${y}" stroke="var(--sup)" stroke-width="2"/>`});
    o+=`</g><text x="${x+bw/2}" y="${H+7}" text-anchor="middle">${d.rot}</text>`});
  return legenda(series)+`<svg class="g" viewBox="0 0 ${W} ${H+14}" role="img">${o}</svg>`}
function linhas(dados,series,fmt,opt={}){const W=opt.W||(estreito()?380:640),H=opt.H||220,E=opt.E??46,D=opt.D??(estreito()?74:80),vals=dados.flatMap(d=>series.map(k=>d[k.c]).filter(v=>v!=null));
  const max=teto(Math.max(...vals,0.0001)),n=dados.length,px=i=>E+(W-E-D)*(n>1?i/(n-1):.5),py=v=>H-10-(H-30)*v/max;
  let o=eixoY(max,H,fmt,W-D,E)+`<line class="guia" x1="-9" x2="-9" y1="12" y2="${H-10}"/>`;
  series.forEach(k=>{const pts=dados.map((d,i)=>d[k.c]==null?null:[px(i),py(d[k.c])]).filter(Boolean);if(!pts.length)return;
    if(series.length==1)o+=`<path class="surge" d="M${pts[0][0]},${H-10} L${pts.map(p=>p.join(',')).join(' L')} L${pts.at(-1)[0]},${H-10}Z" fill="${k.cor}" opacity=".09"/>`;
    o+=`<polyline class="traca" pathLength="1" points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${k.cor}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
    const u=pts.at(-1);o+=`<circle class="pop" cx="${u[0]}" cy="${u[1]}" r="5" fill="${k.cor}" stroke="var(--sup)" stroke-width="2.5"/>`;
    if(!opt.semFim)o+=`<text class="forte" x="${u[0]+10}" y="${u[1]+4}">${series.length>1?k.n+' ':''}${fmt(dados.filter(d=>d[k.c]!=null).at(-1)[k.c])}</text>`});
  const passo=Math.ceil(n/(opt.ticks||6));dados.forEach((d,i)=>{if(i%passo==0||i==n-1)o+=`<text x="${px(i)}" y="${H+7}" text-anchor="middle">${d.rot}</text>`});
  const lw=(W-E-D)/Math.max(n-1,1);dados.forEach((d,i)=>{o+=`<rect x="${px(i)-lw/2}" y="10" width="${lw}" height="${H-20}" fill="transparent" data-x="${px(i)}" data-d="${esc(d.rot+'\n'+series.map(k=>k.n+': '+(d[k.c]==null?'sem dado':fmt(d[k.c]))).join('\n')+(d.extra?'\n'+d.extra:''))}"/>`});
  return (series.length>1?legenda(series):'')+`<svg class="g" viewBox="0 0 ${W} ${H+14}" role="img">${o}</svg>`}
function barrasH(itens,fmt,cor){if(!itens.length)return '<p class="d">Sem dados nesta competência.</p>';const max=Math.max(...itens.map(i=>i.valor))||1;
  return `<div class="hb">${itens.map((it,i)=>`<div class="hr" data-d="${esc(it.rotulo+'\n'+fmt(it.valor)+(it.n?' · '+it.n+' ocorrência(s)':''))}"><span class="hl">${esc(it.rotulo)}</span><span class="hbar"><span class="w" data-w="${100*it.valor/max}" style="background:${cor};transition-delay:${i*55}ms"></span></span><span class="hv">${fmt(it.valor)}</span></div>`).join('')}</div>`}
const milhar=v=>v>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:0})+' mil':v.toFixed(0);

// ---------- páginas
const P={};
const TIPO_GLOSA={tecnica:'técnica',linear:'linear',administrativa:'administrativa'};
const SERIES_FAT=[{c:'liquido',n:'Líquido',cor:'var(--s1)'},{c:'glosado',n:'Glosado',cor:'var(--s2)'},{c:'rejeitado',n:'Rejeitado',cor:'var(--s3)'},{c:'pendente',n:'Pendente',cor:'var(--s4)'},{c:'corte',n:'Corte na aprovação',cor:'var(--s5)'}];
P.fat=async(comp)=>{const comps=META.competencias;
  if(!comps.length){M.innerHTML=cab('fat','Valores apresentados, aprovados e glosados por competência.')+vazio('planilha','Nenhuma conta importada','Os valores aparecem depois que o faturamento importar o arquivo de contas em Inserir dados. O sistema não estima o que não recebeu.',COR.azul);vivo();return}
  comp=comp||comps.at(-1);const d=await api('/api/financeiro?competencia='+comp),f=d.atual;
  const s=d.serie.map(x=>{const liq=x.aprovado==null?null:x.aprovado-x.glosado;return {...x,rot:mes(x.competencia),liquido:liq,corte:liq==null?0:Math.max(x.apresentado-liq-x.glosado-(x.rejeitado||0)-(x.pendente||0),0)}});
  const series=SERIES_FAT.filter(k=>s.some(x=>(x[k.c]||0)>0.5)), liq=f.valor_liquido;
  let h=cab('fat','Tudo calculado das contas e glosas importadas. Glosa é medida sobre o valor apresentado.');
  let divide='';
  if(liq!=null){const partes={liquido:liq,glosado:f.valor_glosado,rejeitado:f.valor_rejeitado,pendente:f.valor_pendente||0};partes.corte=Math.max(f.valor_apresentado-Object.values(partes).reduce((a,b)=>a+b,0),0);
    const vis=SERIES_FAT.filter(k=>partes[k.c]>0.5),base=Math.max(f.valor_apresentado,1);
    divide=`<div class="divide">${vis.map(k=>`<span class="w" data-w="${100*partes[k.c]/base}" style="background:${k.cor}" data-d="${esc(k.n+': '+R$(partes[k.c])+' ('+pct(partes[k.c]/base)+' do apresentado)')}"></span>`).join('')}</div><div class="leg">${vis.map(k=>`<span><i style="background:${k.cor}"></i>${k.n} ${pct(partes[k.c]/base)}</span>`).join('')}</div>`}
  h+=`<section class="heroi entra" style="--c:${COR.azul}"><div><div class="r">${liq!=null?'Líquido de '+mesL(comp):'Apresentado em '+mesL(comp)}</div><div class="gg">${conta(liq??f.valor_apresentado,'brl')}</div><div class="n">${liq!=null?`de ${R$(f.valor_apresentado)} apresentados em ${f.n_apresentadas} contas`:esc(f.valor_aprovado_motivo)}</div></div>
    <div class="comps" role="group" aria-label="Competência">${comps.slice(-8).map(c=>`<button class="pill ${c==comp?'on':''}" data-comp="${c}">${mes(c)}</button>`).join('')}</div>${divide}</section>`;
  h+=tiles([
    {rot:'Apresentado',v:conta(f.valor_apresentado,'brl'),nota:f.n_apresentadas+' contas',ic:'moeda',cor:COR.indigo},
    {rot:'Glosado',v:conta(f.valor_glosado,'brl'),nota:pct(f.taxa_glosa_valor.valor)+' do apresentado · '+pct(f.taxa_glosa_contas.valor,0)+' das contas',ic:'corte',cor:COR.laranja},
    {rot:'Rejeitado na crítica',v:conta(f.valor_rejeitado,'brl'),nota:pct(f.taxa_rejeicao.valor)+' das contas',ic:'xis',cor:COR.verdeagua},
    {rot:'Perdido por prazo',v:conta(f.valor_perdido_prazo,'brl'),nota:f.n_perdidas_prazo+' conta(s) não apresentada(s)',ic:'ampulheta',cor:COR.rosa},
    {rot:'Da alta à apresentação',v:conta(f.dias_alta_apresentacao.mediana,'dias'),nota:'mediana de '+(f.dias_alta_apresentacao.n??0)+' contas',motivo:f.dias_alta_apresentacao.motivo,ic:'calendario',cor:COR.ciano},
    {rot:'Valor médio por conta',v:conta(f.ticket_medio,'brl'),ic:'recibo',cor:COR.violeta}]);
  h+=`<div class="grade">`+cartao({tit:'Para onde vai o valor apresentado',desc:'Por competência. As partes somam o apresentado.',ic:'grafico',cor:COR.azul,g:colunasEmpilhadas(s,series,milhar),
      t:tabela([{t:'Competência'},{t:'Apresentado',n:1},...series.map(k=>({t:k.n,n:1}))],s.map(x=>[x.rot,R$(x.apresentado),...series.map(k=>R$(x[k.c]))]))})
    +cartao({tit:'Taxa de glosa e de rejeição',desc:'Glosa sobre o valor apresentado; rejeição sobre o número de contas.',ic:'linha',cor:COR.laranja,g:linhas(s,[{c:'taxa_glosa',n:'Glosa',cor:'var(--s1)'},{c:'taxa_rejeicao',n:'Rejeição',cor:'var(--s2)'}],v=>pct(v,v<.1?1:0)),
      t:tabela([{t:'Competência'},{t:'Glosa',n:1},{t:'Rejeição',n:1}],s.map(x=>[x.rot,pct(x.taxa_glosa),pct(x.taxa_rejeicao)]))})+`</div>`;
  h+=`<div class="grade g3">`+cartao({tit:'Glosa por tipo',desc:'Técnica e linear nascem no prontuário; administrativa, no processo.',ic:'corte',cor:COR.laranja,g:barrasH(f.glosa_por_tipo.map(x=>({...x,rotulo:TIPO_GLOSA[x.rotulo]||x.rotulo})),R$,'var(--s2)'),t:tabela([{t:'Tipo'},{t:'Glosas',n:1},{t:'Valor',n:1}],f.glosa_por_tipo.map(x=>[TIPO_GLOSA[x.rotulo]||x.rotulo,x.n,R$(x.valor)]))})
    +cartao({tit:'Motivos de glosa',desc:'Os oito maiores em valor, em '+mes(comp)+'.',ic:'alerta',cor:COR.rosa,g:barrasH(f.glosa_por_motivo,R$,'var(--s2)'),t:tabela([{t:'Motivo'},{t:'Glosas',n:1},{t:'Valor',n:1}],f.glosa_por_motivo.map(x=>[x.rotulo,x.n,R$(x.valor)]))})
    +cartao({tit:'Motivos de rejeição na crítica',desc:'Conta rejeitada pode ser corrigida e reapresentada dentro do prazo.',ic:'xis',cor:COR.verdeagua,g:barrasH(f.rejeicao_por_motivo,R$,'var(--s3)'),t:tabela([{t:'Motivo'},{t:'Contas',n:1},{t:'Valor',n:1}],f.rejeicao_por_motivo.map(x=>[x.rotulo,x.n,R$(x.valor)]))})+`</div><div class="grade lado">`;
  const c=d.cruzamento;
  h+=cartao({tit:'Lacuna no prontuário e glosa',desc:'Contas de internações acompanhadas pelas rodadas. Conta glosada = glosa técnica ou linear.',ic:'elo',cor:COR.violeta,

      return `<div class="cruz">${[['Saiu com lacuna aberta',c.com_lacuna,'var(--s2)'],['Saiu sem lacuna',c.sem_lacuna,'var(--s1)']].map(([n,x,cor])=>`<div class="lin"><div class="r">${n}</div><span class="bw g"><span class="w" data-w="${100*(x.valor||0)/mx}" style="background:${cor}"></span></span><div class="v">${conta(x.valor,'pct')}</div><div class="n">${x.num} de ${x.contas} contas glosadas</div></div>`).join('')}</div><p class="d">${esc(c.nota)}${META.demo?' Na base de demonstração esta diferença foi embutida no sorteio, então aqui ela não prova nada.':''}</p>`})()});
  const mx=Math.max(...f.por_setor.map(x=>x.taxa_glosa||0))||1;
  h+=cartao({tit:'Por setor',desc:'Setor da alta, conforme o arquivo de contas.',ic:'setor',cor:COR.azul,
    g:tabela([{t:'Setor'},{t:'Contas',n:1},{t:'Apresentado',n:1},{t:'Glosado',n:1},{t:'Taxa de glosa'}],f.por_setor.map(x=>[`<span class="rotic">${ic('setor',COR.azul,'xs')}${esc(x.setor)}</span>`,x.contas,R$(x.apresentado),R$(x.glosado),barra((x.taxa_glosa||0)/mx,'var(--s2)')+pct(x.taxa_glosa)]))})+`</div>`;
  h+=`<div class="tiles" style="--n:1">${tile({rot:'Produção acima do teto',v:null,motivo:'o sistema não conhece o teto do gestor; produção acima dele não aparece aqui como perda',ic:'teto',cor:COR.ardosia})}</div>`;
  M.innerHTML=h;vivo();
  $$('[data-comp]').forEach(b=>b.onclick=()=>{const y=scrollY;P.fat(b.dataset.comp).then(()=>scrollTo(0,y))})};

  M.innerHTML=h;vivo();$$('[data-regra]').forEach(b=>b.onclick=()=>ir('fila',{regra:b.dataset.regra}))};

let FILTRO={};
P.fila=async(f=FILTRO)=>{FILTRO=f||{};const q=new URLSearchParams(Object.entries(FILTRO).filter(([,v])=>v)),d=await api('/api/fila?'+q),k=d.contagem;
  let h=cab('fila','Achados abertos. Cada um diz o registro que falta e onde foi lido. Marcar se procede é o que mede a precisão do sistema.');
  h+=`<div class="filtros entra"><div class="seg" role="group" aria-label="Destino" style="--c:${COR.laranja}">${[['','Todos',k.total],['setor','Para o setor',k.setor],['faturamento','Para o faturamento',k.faturamento]].map(([v,n,c])=>`<button aria-pressed="${(FILTRO.destino||'')==v}" data-f="destino" data-v="${v}">${n} <b>${c}</b></button>`).join('')}</div></div>`;
  h+=`<div class="chips entra">${Object.entries(k.por_setor).map(([s,c])=>`<button class="pill ${FILTRO.setor==s?'on':''}" style="--c:${COR.laranja}" data-f="setor" data-v="${FILTRO.setor==s?'':esc(s)}">${esc(s)} <b>${c}</b></button>`).join('')}${FILTRO.regra?`<button class="pill on" style="--c:${visRegra(FILTRO.regra)[1]}" data-f="regra" data-v="">${esc(FILTRO.regra)} ${svgI('fechar')}</button>`:''}</div>`;
  h+=d.itens.length?d.itens.map(a=>{const [ii,cc]=visRegra(a.regra_id),idade=difDias(a.aberto_em,a.ultimo_visto_em||a.aberto_em),st=a.disp_status!='pendente'?a.disp_status:'';
    return `<article class="item entra ${st}" data-id="${a.id}" style="--c:${cc}">${ic(st=='procede'?'check':st=='nao_procede'?'fechar':ii,cc)}<div class="corpo"><div class="t"><b>${esc(a.setor||'—')}</b> · leito ${esc(a.leito||'—')} · pront. ${esc(a.prontuario)}<span class="tag">${a.regra_id}</span>${a.acionavel?'':'<span class="tag cinza">faturamento</span>'}</div><p>${esc(a.resumo)}</p>
      <div class="m">${a.onde?`<span>${svgI('raio')}${esc(a.onde)}</span>`:''}<span>${svgI('calendario')}${idade>0?'aberto há '+idade+' dia'+(idade>1?'s':''):'aberto hoje'}</span></div>
      <div class="lastro" hidden>${a.evidencias.map(e=>`<div>${svgI('olho')}<span>${esc(e.localizador)}${e.trecho?' — “'+esc(e.trecho)+'”':''}</span></div>`).join('')}</div>
      <div class="a"><button class="pill ok ${st=='procede'?'on':''}" data-disp="procede">${svgI('check')}Procede</button><button class="pill nao ${st=='nao_procede'?'on':''}" data-disp="nao_procede">${svgI('fechar')}Não procede</button><button class="pill ghost" data-lastro>${svgI('olho')}Ver lastro</button><span class="quem">${st?'avaliado por '+esc(a.disp_por):''}</span></div></div></article>`}).join('')
    :vazio('ok','Nada aberto com esse filtro','Quando a rodada seguinte encontra o registro feito, o achado sai daqui sozinho.',COR.verde);
  M.innerHTML=h;vivo();
  M.onclick=async e=>{const fb=e.target.closest('[data-f]');if(fb){FILTRO={...FILTRO,[fb.dataset.f]:fb.dataset.v};return P.fila(FILTRO)}
    const lb=e.target.closest('[data-lastro]');if(lb){const l=$('.lastro',lb.closest('.item'));l.hidden=!l.hidden;lb.classList.toggle('on',!l.hidden);return}
    const b=e.target.closest('[data-disp]');if(!b)return;const it=b.closest('.item'),[ii]=visRegra($('.tag',it).textContent);
    try{await api('/api/disposicao',{achado_id:+it.dataset.id,status:b.dataset.disp});const s=b.dataset.disp;
      it.classList.remove('procede','nao_procede');it.classList.add(s);$$('[data-disp]',it).forEach(x=>x.classList.toggle('on',x===b));
      const ico=$('.ic',it);ico.querySelector('svg').innerHTML=ICON[s=='procede'?'check':'fechar'];ico.classList.remove('bate');void ico.offsetWidth;ico.classList.add('bate');
      $('.quem',it).textContent='avaliado por '+(op.value.trim()||'visitante');toast(s=='procede'?'Registrado: o achado procede.':'Registrado: o achado não procede.')}
    catch(err){falhou(err)}}};

const b64=f=>new Promise(r=>{const l=new FileReader();l.onload=()=>r(l.result.split(',')[1]);l.readAsDataURL(f)});
P.ins=async()=>{const E=window.ESTATICO;
  const drop=(id,ac,icone,txt)=>`<label class="drop" data-drop="${id}">${svgI(icone)}<input type="file" id="${id}" accept="${ac}" hidden><span class="dn">${txt}</span><small>ou arraste o arquivo aqui</small></label>`;
  M.innerHTML=cab('ins','Tudo o que entra aqui fica nesta máquina. Cada envio é registrado com o nome do operador.')+`<div class="acoes">
   <section class="acao entra" style="--c:${COR.azul}">${ic('pdf',COR.azul,'g')}<h3>Prontuário digitalizado</h3><p class="d">PDF mais a extração em JSON. Sem o atestado, o sistema só verifica o que viu, nunca o que falta.${E?' Nesta apresentação o botão audita o prontuário sintético de exemplo.':''}</p>
    ${drop('pp','application/pdf','pdf','Escolher o PDF')}${drop('pe','application/json','doc','Escolher a extração (JSON)')}
    <label class="sw"><input type="checkbox" id="pa"><span class="trilho"></span>Atesto que o prontuário foi digitalizado inteiro</label>
    <div><button class="bt" id="pb">${svgI('olho')}Auditar prontuário</button></div><div id="pm" class="msg"></div></section>
   <section class="acao entra" style="--c:${COR.verde}">${ic('planilha',COR.verde,'g')}<h3>Contas e glosas</h3><p class="d">CSV no layout de docs/LAYOUT-CONTAS.md. Reimportar o mesmo arquivo substitui, não duplica.</p>
    ${drop('cc','.csv,text/csv','planilha','Contas apresentadas')}<div><button class="bt" id="cb">${svgI('ins')}Importar contas</button></div>
    ${drop('gg','.csv,text/csv','corte','Glosas recebidas')}<div><button class="bt" id="gb">${svgI('ins')}Importar glosas</button></div><div id="cm" class="msg"></div></section>
   <section class="acao entra" style="--c:${COR.laranja}">${ic('servidor',COR.laranja,'g')}<h3>Rodada pelo prontuário eletrônico</h3><p class="d">Busca os internados na API do prontuário, só leitura. Em produção quem dispara é o próprio prontuário, pelo gatilho.</p>
    <div class="estado"><span class="stc" style="--c:${META.pep_configurado?COR.verde:COR.ardosia}">${ic(META.pep_configurado?'check':'fechar',META.pep_configurado?COR.verde:COR.ardosia,'xs')}Configuração<b>${META.pep_configurado?'presente':'ausente'}</b></span><span class="stc" style="--c:${META.gatilho_ativo?COR.verde:COR.ardosia}">${ic(META.gatilho_ativo?'check':'fechar',META.gatilho_ativo?COR.verde:COR.ardosia,'xs')}Gatilho<b>${META.gatilho_ativo?'ativo':'desligado'}</b></span></div>
    <div><button class="bt" id="rb">${svgI('atualiza')}Rodar agora</button></div><div id="rm" class="msg"></div></section></div><div id="rel"></div>`;
  $$('[data-drop]').forEach(z=>{const inp=$('input',z),dn=$('.dn',z),mostra=()=>{if(inp.files[0]){dn.textContent=inp.files[0].name;z.classList.add('tem')}};inp.onchange=mostra;
    z.ondragover=e=>{e.preventDefault();z.classList.add('sobre')};z.ondragleave=()=>z.classList.remove('sobre');z.ondrop=e=>{e.preventDefault();z.classList.remove('sobre');inp.files=e.dataTransfer.files;mostra()}});
  const tenta=async(btn,el,fn)=>{const orig=btn.innerHTML;btn.disabled=true;btn.innerHTML=`<svg viewBox="0 0 24 24" class="i gira">${ICON.carrega}</svg>Processando…`;el.className='msg';el.textContent='';
    try{const m=await fn();el.textContent='';toast(m)}catch(e){el.className='msg e';el.textContent=e.message;falhou(e)}finally{btn.disabled=false;btn.innerHTML=orig}};
  $('#pb').onclick=()=>tenta($('#pb'),$('#pm'),async()=>{let p=$('#pp').files[0],x=$('#pe').files[0],r;
    if(E){p={name:'prontuario_sintetico.pdf'};r=await api('/api/prontuario',{})}else{if(!p||!x)throw new Error('Escolha o PDF e a extração.');r=await api('/api/prontuario',{nome:p.name,pdf_b64:await b64(p),extracao:JSON.parse(await x.text()),atesto_completo:$('#pa').checked})}
    $('#rel').innerHTML=`<section class="cartao entra" style="--c:${COR.azul}"><header class="ch">${ic('pdf',COR.azul,'p')}<div class="tt"><h3>Revisão de ${esc(p.name)}</h3><p class="d">${r.achados} achado(s) · ${r.descartes} item(ns) da extração descartado(s) por falta de lastro</p></div></header><pre>${esc(r.relatorio_md)}</pre></section>`;vivo($('#rel'));$('#rel').scrollIntoView({behavior:MOV?'smooth':'auto',block:'start'});
    return r.achados+' achado(s); '+r.descartes+' item(ns) descartado(s) por falta de lastro.'});
  const imp=(inp,rota,btn)=>tenta(btn,$('#cm'),async()=>{const f=$(inp).files[0];if(!f)throw new Error('Escolha o arquivo.');const r=await api(rota,{nome:f.name,conteudo_b64:await b64(f)});META=await api('/api/meta');return r.contas!=null?r.contas+' conta(s) importada(s).':r.glosas+' glosa(s) importada(s)'+(r.sem_conta_correspondente?.length?'; '+r.sem_conta_correspondente.length+' sem conta correspondente.':'.')});
  $('#cb').onclick=()=>imp('#cc','/api/importar/contas',$('#cb'));$('#gb').onclick=()=>imp('#gg','/api/importar/glosas',$('#gb'));
  $('#rb').onclick=()=>tenta($('#rb'),$('#rm'),async()=>{const r=await api('/api/rodada/pep',{});META=await api('/api/meta');contaFila();return r.internacoes+' internação(ões), '+r.achados+' achado(s), '+r.nao_avaliados+' verificação(ões) não lida(s).'});
  vivo()};

const ACAO={rodada_matinal:['Rodada matinal','atualiza',COR.azul],rodada_prontuario:['Prontuário auditado','pdf',COR.violeta],disposicao:['Avaliou um achado','check',COR.verde],importar_contas:['Importou contas','planilha',COR.ciano],importar_glosas:['Importou glosas','corte',COR.laranja]};
let FLOG='';
P.log=async()=>{const d=await api('/api/log'),tipos=[...new Set(d.map(x=>x.acao))];
  const det=x=>{if(x.acao.startsWith('rodada')){try{const j=JSON.parse(x.detalhe);return `${j.internacoes} internação(ões) · ${j.achados} achado(s)`+(j.resolvido!=null?` · ${j.resolvido} corrigido(s)`:'')+(j.nao_avaliados?` · ${j.nao_avaliados} não lida(s)`:'')}catch(e){}}return (x.alvo?x.alvo+' · ':'')+(x.detalhe||'')};
  const lista=()=>d.filter(x=>!FLOG||x.acao==FLOG).map(x=>{const [n,i,c]=ACAO[x.acao]||[x.acao,'info',COR.ardosia];return `<div class="ev">${ic(i,c,'p')}<div class="tx"><b>${esc(x.quem)}</b> · ${n}<div>${esc(det(x))}</div></div><span class="qd">${dia(x.quando)} ${x.quando.slice(11,16)}</span></div>`}).join('')||'<p class="d">Nada registrado com esse filtro.</p>';
  M.innerHTML=cab('log','Quem fez o quê e quando. As 300 ações mais recentes.')+`<div class="chips entra"><button class="pill ${FLOG?'':'on'}" data-t="">Todas <b>${d.length}</b></button>${tipos.map(t=>{const [n,i,c]=ACAO[t]||[t,'info',COR.ardosia];return `<button class="pill ${FLOG==t?'on':''}" style="--c:${c}" data-t="${t}">${n} <b>${d.filter(x=>x.acao==t).length}</b></button>`}).join('')}</div><section class="cartao entra" style="--c:${COR.ardosia}" id="lg">${lista()}</section>`;
  vivo();$$('[data-t]').forEach(b=>b.onclick=()=>{FLOG=b.dataset.t;P.log()})};

function contaFila(){const n=$('#nfila');if(!n)return;const v=META.abertos;n.hidden=!v;n.textContent=v>99?'99+':v}
async function ir(p,f){if(!P[p])p='fat';document.body.dataset.p=p;document.documentElement.style.setProperty('--ac',SECAO[p].c);
  $$('.nb').forEach(b=>b.setAttribute('aria-current',b.dataset.p==p?'page':'false'));M.onclick=null;dica.hidden=true;
  if(location.hash.slice(1)!=p)history.replaceState(null,'','#'+p);scrollTo(0,0);
  try{await P[p](p=='fila'?(f||{}):f)}catch(e){M.innerHTML=cab(p,'')+`<section class="cartao entra">${esc(e.message)}</section>`;vivo()}}
$$('.nb').forEach(b=>b.onclick=()=>ir(b.dataset.p));
addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(P[p]&&p!=document.body.dataset.p)ir(p)});
(async()=>{META=await api('/api/meta');contaFila();ir(location.hash.slice(1))})();
</script></body></html>
