<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Auditoria de faturamento</title>
<style>
:root{color-scheme:light;--bg:#f3f5f8;--sup:#fff;--tinta:#10151f;--sec:#566072;--fio:#e3e7ee;--pri:#2563eb;--pri-f:#e8f0fe;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--critico:#d03b3b;--bom:#0ca30c}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tinta);display:flex}
nav{width:216px;flex:none;background:var(--sup);border-right:1px solid var(--fio);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
nav h1{font-size:15px;margin:2px 10px 16px;font-weight:600}
nav button{all:unset;display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--sec)}
nav button:hover{background:var(--bg)}nav button[aria-current=page]{background:var(--pri-f);color:var(--pri);font-weight:600}
nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav .pe{margin-top:auto;font-size:13px;color:var(--sec);padding:10px}nav .pe input{width:100%;margin-top:4px}
main{flex:1;min-width:0;padding:22px 28px 60px;max-width:1180px}
h2{font-size:22px;margin:0 0 4px;font-weight:600}.sub{color:var(--sec);margin:0 0 18px}
.aviso{background:#fff7e6;border:1px solid #f1d59a;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.cartao{background:var(--sup);border:1px solid var(--fio);border-radius:14px;padding:18px 20px;margin-bottom:16px;overflow:hidden}
.cartao h3{font-size:16px;margin:0 0 2px;font-weight:600}.cartao .d{color:var(--sec);font-size:13.5px;margin:0 0 12px}
.regua{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:16px 0;overflow:hidden;margin-left:-19px}
.regua>div{padding:2px 18px;border-left:1px solid var(--fio);margin-left:-1px;margin-left:0}.regua>div{box-shadow:none}
.regua .r{font-size:13px;color:var(--sec)}.regua .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin:2px 0}
.regua .n{font-size:12.5px;color:var(--sec)}.nd{font-size:13px!important;font-weight:400!important;color:var(--sec)}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}.grade .cartao{margin:0}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px 26px}
.mini h4{font-size:13.5px;font-weight:600;margin:0}.mini .d{font-size:12.5px;color:var(--sec);margin:0 0 4px}
svg.g{display:block;width:100%;height:auto;overflow:visible}svg.g text{font-size:11.5px;fill:var(--sec);font-variant-numeric:tabular-nums}
.leg{display:flex;gap:16px;font-size:13px;color:var(--sec);margin:0 0 6px;flex-wrap:wrap}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.alt{all:unset;cursor:pointer;color:var(--pri);font-size:13px;float:right}
table{border-collapse:collapse;width:100%;font-size:14px}th{font-weight:600;text-align:left;color:var(--sec);font-size:13px}
th,td{padding:7px 10px 7px 0;border-bottom:1px solid var(--fio);vertical-align:top}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.barra{display:inline-block;height:8px;border-radius:0 4px 4px 0;background:var(--s1);vertical-align:middle;margin-right:8px}
#dica{position:fixed;pointer-events:none;background:var(--tinta);color:#fff;font-size:12.5px;padding:6px 9px;border-radius:7px;z-index:9;max-width:280px;white-space:pre-line}
select,input[type=text],input[type=file]{font:inherit;padding:7px 9px;border:1px solid var(--fio);border-radius:8px;background:var(--sup);color:var(--tinta)}
.bt{all:unset;cursor:pointer;padding:7px 13px;border-radius:8px;border:1px solid var(--fio);font-size:14px;background:var(--sup)}
.bt:hover{border-color:var(--pri)}.bt.p{background:var(--pri);color:#fff;border-color:var(--pri)}.bt:focus-visible,nav button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.item{padding:13px 0;border-bottom:1px solid var(--fio)}.item:last-child{border:0}.item .t{font-weight:600}.item .m{color:var(--sec);font-size:13.5px;margin-top:3px}
.item .a{margin-top:9px;display:flex;gap:8px}.filtros{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
pre{white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);padding:14px;border-radius:10px;max-height:520px;overflow:auto}
.msg{font-size:14px;margin-top:10px}.msg.e{color:var(--critico)}label.l{display:block;font-size:13.5px;color:var(--sec);margin:10px 0 4px}
@media(max-width:760px){body{display:block}nav{position:static;width:auto;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--fio)}nav h1,nav .pe{display:none}main{padding:16px}}
</style></head><body>

// ---------- gráficos (SVG à mão: roda sem internet, dentro do hospital)
function eixoY(max,alt,fmt,W,esq){let o='';for(let k=0;k<=4;k++){const v=max*k/4,y=alt-10-(alt-30)*k/4;o+=`<line x1="${esq}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--fio)"/><text x="${esq-6}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`}return o}
function teto(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));return Math.ceil(v/p*2)/2*p}
function colunasEmpilhadas(dados,series,fmt){const W=640,H=250,E=58,max=teto(Math.max(...dados.map(d=>series.reduce((s,k)=>s+(d[k.c]||0),0))));
  const lw=(W-E)/dados.length,bw=Math.min(46,lw*.6);let o=eixoY(max,H,fmt,W,E);
  dados.forEach((d,i)=>{let y=H-10;const x=E+lw*i+(lw-bw)/2;series.forEach((k,j)=>{const h=(H-30)*(d[k.c]||0)/max;if(h<=0)return;y-=h;const topo=j==series.length-1;
    o+=`<path d="M${x},${y+h-1} V${y+(topo?4:0)} ${topo?`q0,-4 4,-4 H${x+bw-4} q4,0 4,4`:`H${x+bw}`} V${y+h-1}Z" fill="${k.cor}" data-d="${esc(d.rot+'\n'+k.n+': '+fmt(d[k.c]||0))}"/>`});
    o+=`<text x="${x+bw/2}" y="${H+6}" text-anchor="middle">${d.rot}</text>`});
  return `<div class="leg">${series.map(k=>`<span><i style="background:${k.cor}"></i>${k.n}</span>`).join('')}</div><svg class="g" viewBox="0 0 ${W} ${H+12}" role="img">${o}</svg>`}
function linhas(dados,series,fmt,opt={}){const W=opt.W||640,H=opt.H||220,E=opt.E??46,D=opt.D??64,vals=dados.flatMap(d=>series.map(k=>d[k.c]).filter(v=>v!=null));
  const max=teto(Math.max(...vals,0.0001)),px=i=>E+(W-E-D)*(dados.length>1?i/(dados.length-1):.5),py=v=>H-10-(H-30)*v/max;let o=eixoY(max,H,fmt,W-D,E);
  series.forEach(k=>{const pts=dados.map((d,i)=>d[k.c]==null?null:[px(i),py(d[k.c])]).filter(Boolean);if(!pts.length)return;
    o+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${k.cor}" stroke-width="2" stroke-linejoin="round"/>`;
    const u=pts[pts.length-1];o+=`<circle cx="${u[0]}" cy="${u[1]}" r="4" fill="${k.cor}" stroke="var(--sup)" stroke-width="2"/><text x="${u[0]+8}" y="${u[1]+4}" style="fill:var(--tinta)">${opt.rotulo!==false&&series.length>1?k.n+' ':''}${fmt(dados.filter(d=>d[k.c]!=null).pop()[k.c])}</text>`});
  const passo=Math.ceil(dados.length/(opt.ticks||6));dados.forEach((d,i)=>{if(i%passo==0||i==dados.length-1)o+=`<text x="${px(i)}" y="${H+6}" text-anchor="middle">${d.rot}</text>`});
  dados.forEach((d,i)=>{const lw=(W-E-D)/Math.max(dados.length-1,1);o+=`<rect x="${px(i)-lw/2}" y="10" width="${lw}" height="${H-20}" fill="transparent" data-d="${esc(d.rot+'\n'+series.map(k=>k.n+': '+(d[k.c]==null?'sem dado':fmt(d[k.c]))+(d.extra?'\n'+d.extra:'')).join('\n'))}"/>`});
  const leg=series.length>1?`<div class="leg">${series.map(k=>`<span><i style="background:${k.cor}"></i>${k.n}</span>`).join('')}</div>`:'';
  return leg+`<svg class="g" viewBox="0 0 ${W} ${H+12}" role="img">${o}</svg>`}
function barrasH(itens,fmt){if(!itens.length)return '<p class="d">Sem dados.</p>';const W=640,L=230,alt=26,max=Math.max(...itens.map(i=>i.valor))||1;let o='';
  itens.forEach((it,i)=>{const y=i*alt+4,w=Math.max((W-L-90)*it.valor/max,2),rot=it.rotulo.length>34?it.rotulo.slice(0,33)+'…':it.rotulo;
    o+=`<text x="${L-8}" y="${y+13}" text-anchor="end" style="fill:var(--tinta)">${esc(rot)}</text><path d="M${L},${y+2} H${L+w-4} q4,0 4,4 v6 q0,4 -4,4 H${L}Z" fill="var(--s1)" data-d="${esc(it.rotulo+'\n'+fmt(it.valor)+(it.n?' · '+it.n+' ocorrência(s)':''))}"/><text x="${L+w+6}" y="${y+13}">${fmt(it.valor)}</text>`});
  return `<svg class="g" viewBox="0 0 ${W} ${itens.length*alt+8}" role="img">${o}</svg>`}

P.fat=async(comp)=>{const d=await api('/api/financeiro'+(comp?'?competencia='+comp:'')), comps=META.competencias;
  if(!comps.length){M.innerHTML=cab('Faturamento','Valores apresentados, aprovados e glosados por competência.')+`<div class="cartao"><h3>Nenhuma conta importada</h3><p class="d">Os valores aparecem depois que o faturamento importar o arquivo de contas em Inserir dados. O sistema não estima o que não recebeu.</p></div>`;return}
  if(!comp)return P.fat(comps[comps.length-1]); const f=d.atual,s=d.serie.map(x=>({...x,rot:mes(x.competencia),liquido:x.aprovado==null?null:x.aprovado-x.glosado,rejeitado:Math.max(x.apresentado-(x.aprovado??x.apresentado),0)}));
  let h=cab('Faturamento','Tudo calculado das contas e glosas importadas. Glosa é medida sobre o valor apresentado.')+`<div class="filtros"><label>Competência <select id="cp">${comps.map(c=>`<option value="${c}" ${c==comp?'selected':''}>${mes(c)}</option>`).join('')}</select></label></div>`;
  h+=`<section class="cartao"><div class="regua">${fig('Apresentado',R$(f.valor_apresentado),f.n_apresentadas+' contas')}${fig('Líquido (aprovado − glosado)',R$(f.valor_liquido),null,f.valor_aprovado_motivo)}${fig('Glosado',R$(f.valor_glosado),pct(f.taxa_glosa_valor.valor)+' do apresentado · '+pct(f.taxa_glosa_contas.valor,0)+' das contas')}${fig('Rejeitado na crítica',R$(f.valor_rejeitado),pct(f.taxa_rejeicao.valor)+' das contas')}${fig('Perdido por prazo',R$(f.valor_perdido_prazo),f.n_perdidas_prazo+' conta(s) não apresentada(s)')}</div></section>`;
  h+=`<div class="grade">`+cartao('Para onde vai o valor apresentado','Por competência. A soma das três partes é o apresentado.',colunasEmpilhadas(s,[{c:'liquido',n:'Líquido',cor:'var(--s1)'},{c:'glosado',n:'Glosado',cor:'var(--s2)'},{c:'rejeitado',n:'Rejeitado',cor:'var(--s3)'}],v=>v>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:0})+' mil':v.toFixed(0)),tabela([{t:'Competência'},{t:'Apresentado',n:1},{t:'Líquido',n:1},{t:'Glosado',n:1},{t:'Rejeitado',n:1}],s.map(x=>[x.rot,R$(x.apresentado),R$(x.liquido),R$(x.glosado),R$(x.rejeitado)])))
    +cartao('Taxa de glosa e de rejeição','Glosa sobre o valor apresentado; rejeição sobre o número de contas.',linhas(s,[{c:'taxa_glosa',n:'Glosa',cor:'var(--s1)'},{c:'taxa_rejeicao',n:'Rejeição',cor:'var(--s2)'}],v=>pct(v,v<.1?1:0)),tabela([{t:'Competência'},{t:'Glosa',n:1},{t:'Rejeição',n:1}],s.map(x=>[x.rot,pct(x.taxa_glosa),pct(x.taxa_rejeicao)])))+`</div>`;
  h+=`<div class="grade">`+cartao('Glosa por tipo','Técnica e linear nascem no prontuário; administrativa, no processo.',barrasH(f.glosa_por_tipo,R$),tabela([{t:'Tipo'},{t:'Glosas',n:1},{t:'Valor',n:1}],f.glosa_por_tipo.map(x=>[x.rotulo,x.n,R$(x.valor)])))
    +cartao('Motivos de glosa','Os oito maiores em valor, em '+mes(comp)+'.',barrasH(f.glosa_por_motivo,R$),tabela([{t:'Motivo'},{t:'Glosas',n:1},{t:'Valor',n:1}],f.glosa_por_motivo.map(x=>[x.rotulo,x.n,R$(x.valor)])))
    +cartao('Motivos de rejeição na crítica','Conta rejeitada pode ser corrigida e reapresentada dentro do prazo.',barrasH(f.rejeicao_por_motivo,R$),tabela([{t:'Motivo'},{t:'Contas',n:1},{t:'Valor',n:1}],f.rejeicao_por_motivo.map(x=>[x.rotulo,x.n,R$(x.valor)])))+`</div>`;
  const mx=Math.max(...f.por_setor.map(x=>x.taxa_glosa||0))||1;
  h+=`<section class="cartao"><h3>Por setor</h3><p class="d">Setor da alta, conforme o arquivo de contas.</p>${tabela([{t:'Setor'},{t:'Contas',n:1},{t:'Apresentado',n:1},{t:'Glosado',n:1},{t:'Taxa de glosa'}],f.por_setor.map(x=>[esc(x.setor),x.contas,R$(x.apresentado),R$(x.glosado),`<span class="barra" style="width:${120*(x.taxa_glosa||0)/mx}px"></span>${pct(x.taxa_glosa)}`]))}</section>`;
  const c=d.cruzamento; h+=`<section class="cartao"><h3>Lacuna no prontuário e glosa</h3><p class="d">Contas de internações acompanhadas pelas rodadas. Conta glosada = glosa técnica ou linear.</p>`+(c.vazio?`<p class="d">Não disponível: ${esc(c.motivo)}.</p>`:`<div class="regua">${fig('Saiu com lacuna aberta',pct(c.com_lacuna.valor),c.com_lacuna.num+' de '+c.com_lacuna.contas+' contas glosadas')}${fig('Saiu sem lacuna',pct(c.sem_lacuna.valor),c.sem_lacuna.num+' de '+c.sem_lacuna.contas+' contas glosadas')}</div><p class="d" style="margin-top:12px">${esc(c.nota)}${META.demo?' Na base de demonstração esta diferença foi embutida no sorteio, então aqui ela não prova nada.':''}</p>`)+`</section>`;
  h+=`<section class="cartao"><div class="regua">${fig('Valor médio por conta',R$(f.ticket_medio))}${fig('Da alta à apresentação',f.dias_alta_apresentacao.mediana!=null?f.dias_alta_apresentacao.mediana+' dias':null,'mediana, n='+(f.dias_alta_apresentacao.n??0),f.dias_alta_apresentacao.motivo)}${fig('Produção acima do teto',null,null,'o sistema não conhece o teto do gestor')}</div></section>`;
  M.innerHTML=h; $('#cp').onchange=e=>P.fat(e.target.value)};

P.doc=async()=>{const d=await api('/api/documentacao'); let h=cab('Documentação','O que as rodadas matinais encontraram, o que foi corrigido e o que o sistema não conseguiu ler.');
  if(d.vazio){M.innerHTML=h+`<div class="cartao"><h3>Nenhuma rodada gravada</h3><p class="d">${esc(d.motivo)}. As rodadas entram pelo gatilho do prontuário ou por <code>rodar.py --gravar</code>.</p></div>`;return}
  const a=d.aderencia,t=x=>x.valor==null?null:pct(x.valor,0);
  h+=`<section class="cartao"><div class="regua">${fig('Corrigido em 1 dia',t(a.resolvido_1d),a.resolvido_1d.num+' de '+a.n+' achados do setor',a.resolvido_1d.motivo)}${fig('Corrigido em 3 dias',t(a.resolvido_3d))}${fig('Saiu sem corrigir',t(a.saiu_sem_resolver),'alta com o achado aberto')}${fig('Abertos hoje',String(a.abertos),a.idade_mediana_abertos!=null?'idade mediana '+a.idade_mediana_abertos+' dia(s)':'')}${fig('Leitura completa',t(d.cobertura_coleta),'das verificações de '+dia(d.ultimo_dia),d.cobertura_coleta.motivo)}${fig('Achados que procedem',t(d.precisao),d.precisao.pendentes+' sem avaliação humana',d.precisao.motivo)}</div></section>`;
  h+=`<section class="cartao"><h3>Prevalência por regra</h3><p class="d">Internações com o achado, sobre as internações em que a regra pôde rodar. ${d.dias.length} dia(s), até ${dia(d.ultimo_dia)}.</p><div class="mini">`;
  for(const [rid,serie] of Object.entries(d.prevalencia)){const u=serie[serie.length-1],pts=serie.map(x=>({rot:dia(x.dia),taxa:x.taxa,extra:x.achados+' de '+x.avaliadas+(x.nao_avaliadas?' · '+x.nao_avaliadas+' não lidas':'')}));
    h+=`<div><h4>${rid} · ${pct(u.taxa,0)??'—'}</h4><p class="d">${esc(META.regras[rid]||'')}</p>${linhas(pts,[{c:'taxa',n:'Prevalência',cor:'var(--s1)'}],v=>pct(v,0),{W:300,H:120,E:34,D:40,ticks:3,rotulo:false})}</div>`}
  h+=`</div></section><div class="grade"><section class="cartao"><h3>Correção por regra</h3><p class="d">Achados dirigidos ao setor que já tiveram um dia seguinte.</p>${tabela([{t:'Regra'},{t:'Achados',n:1},{t:'Corrigidos',n:1},{t:'Saíram abertos',n:1},{t:'Ainda abertos',n:1}],d.aderencia_por_regra.map(x=>[x.regra_id,x.n,x.resolvidos+' ('+pct(x.resolvidos/x.n,0)+')',x.sairam,x.abertos]))}</section>
  <section class="cartao"><h3>Por setor em ${dia(d.ultimo_dia)}</h3><p class="d">Verificação não lida é falha de coleta, não ausência de registro.</p>${tabela([{t:'Setor'},{t:'Verificações',n:1},{t:'Achados',n:1},{t:'Não lidas',n:1}],d.por_setor_ultimo_dia.map(x=>[esc(x.setor),x.avaliadas,x.achados,x.nao_avaliadas]))}</section></div>`;
  M.innerHTML=h};

P.fila=async(f={})=>{const q=new URLSearchParams(f),d=await api('/api/fila?'+q);
  let h=cab('Fila','Achados abertos. Cada um traz onde foi lido. Marcar se procede é o que mede a precisão do sistema.')+`<div class="filtros"><select id="fd"><option value="">Todos os destinos</option><option value="setor" ${f.destino=='setor'?'selected':''}>Para o setor</option><option value="faturamento" ${f.destino=='faturamento'?'selected':''}>Para o faturamento</option></select><select id="fs"><option value="">Todos os setores</option>${d.setores.map(s=>`<option ${f.setor==s?'selected':''}>${esc(s)}</option>`).join('')}</select><span class="d" style="color:var(--sec)">${d.itens.length} item(ns)</span></div><section class="cartao">`;
  h+=d.itens.length?d.itens.map(a=>`<div class="item"><div class="t">${esc(a.setor||'—')} · leito ${esc(a.leito||'—')} · pront. ${esc(a.prontuario)} · ${a.regra_id}</div><div>${esc(a.resumo)}</div><div class="m">${a.onde?'Onde: '+esc(a.onde)+' · ':''}Lastro: ${esc(a.evidencias[0]?.localizador||'—')}${a.evidencias[0]?.trecho?' — “'+esc(a.evidencias[0].trecho)+'”':''} · aberto em ${dia(a.aberto_em)}${a.disp_status!='pendente'?' · avaliado: '+a.disp_status.replace('_',' ')+' ('+esc(a.disp_por)+')':''}</div><div class="a"><button class="bt" data-disp="procede" data-id="${a.id}">Procede</button><button class="bt" data-disp="nao_procede" data-id="${a.id}">Não procede</button></div></div>`).join(''):'<p class="d">Nada aberto com esse filtro.</p>';

const b64=f=>new Promise(r=>{const l=new FileReader();l.onload=()=>r(l.result.split(',')[1]);l.readAsDataURL(f)});
P.ins=async()=>{M.onclick=null; M.innerHTML=cab('Inserir dados','Tudo o que entra aqui fica nesta máquina. Cada envio é registrado com o nome do operador.')+`<div class="grade">
  <section class="cartao"><h3>Prontuário digitalizado</h3><p class="d">PDF mais a extração em JSON. Sem o atestado, o sistema só verifica o que viu, nunca o que falta.${window.ESTATICO?' Nesta apresentação o botão audita o prontuário sintético de exemplo.':''}</p><label class="l">PDF do prontuário</label><input type="file" id="pp" accept="application/pdf"><label class="l">Extração (JSON)</label><input type="file" id="pe" accept="application/json"><label class="l"><input type="checkbox" id="pa"> Atesto que o prontuário foi digitalizado inteiro</label><p><button class="bt p" id="pb">Auditar prontuário</button></p><div id="pm" class="msg"></div></section>
  <section class="cartao"><h3>Contas e glosas</h3><p class="d">CSV no layout de docs/LAYOUT-CONTAS.md. Reimportar o mesmo arquivo substitui, não duplica.</p><label class="l">Contas apresentadas</label><input type="file" id="cc" accept=".csv,text/csv"> <button class="bt" id="cb">Importar</button><label class="l">Glosas recebidas</label><input type="file" id="gg" accept=".csv,text/csv"> <button class="bt" id="gb">Importar</button><div id="cm" class="msg"></div></section>
  <section class="cartao"><h3>Rodada pelo prontuário eletrônico</h3><p class="d">Busca os internados na API do prontuário, só leitura. Em produção quem dispara é o próprio prontuário, pelo gatilho.</p><p class="d">Configuração: ${META.pep_configurado?'presente':'ausente (config/pep_api.yaml)'} · Gatilho: ${META.gatilho_ativo?'ativo':'desativado (sem token)'}</p><p><button class="bt" id="rb">Rodar agora</button></p><div id="rm" class="msg"></div></section></div><div id="rel"></div>`;
  const tenta=async(el,fn)=>{el.className='msg';el.textContent='Processando…';try{el.textContent=await fn()}catch(e){el.className='msg e';el.textContent=e.message}};
  $('#pb').onclick=()=>tenta($('#pm'),async()=>{let p=$('#pp').files[0],x=$('#pe').files[0],r;if(window.ESTATICO){p={name:'prontuario_sintetico.pdf'};r=await api('/api/prontuario',{})}else{if(!p||!x)throw new Error('Escolha o PDF e a extração.');r=await api('/api/prontuario',{nome:p.name,pdf_b64:await b64(p),extracao:JSON.parse(await x.text()),atesto_completo:$('#pa').checked})}$('#rel').innerHTML=`<section class="cartao"><h3>Revisão de ${esc(p.name)}</h3><pre>${esc(r.relatorio_md)}</pre></section>`;return r.achados+' achado(s); '+r.descartes+' item(ns) da extração descartado(s) por falta de lastro.'});
  const imp=(inp,rota)=>tenta($('#cm'),async()=>{const f=$(inp).files[0];if(!f)throw new Error('Escolha o arquivo.');const r=await api(rota,{nome:f.name,conteudo_b64:await b64(f)});META=await api('/api/meta');return JSON.stringify(r)});
  $('#cb').onclick=()=>imp('#cc','/api/importar/contas'); $('#gb').onclick=()=>imp('#gg','/api/importar/glosas');
  $('#rb').onclick=()=>tenta($('#rm'),async()=>{const r=await api('/api/rodada/pep',{});return r.internacoes+' internação(ões), '+r.achados+' achado(s), '+r.nao_avaliados+' verificação(ões) não lida(s).'})};

P.log=async()=>{const d=await api('/api/log');M.innerHTML=cab('Registro','Quem fez o quê e quando. As 300 ações mais recentes.')+`<section class="cartao">${tabela([{t:'Quando'},{t:'Quem'},{t:'Ação'},{t:'Alvo'},{t:'Detalhe'}],d.map(x=>[x.quando.replace('T',' '),esc(x.quem),esc(x.acao),esc(x.alvo),esc(x.detalhe)]))}</section>`};

function cab(t,s){return (META.demo?'<div class="aviso"><b>Base de demonstração.</b> Todos os números desta tela são sintéticos, gerados para mostrar o sistema funcionando. Nenhum é do hospital.</div>':'')+`<h2>${t}</h2><p class="sub">${s}</p>`}
async function ir(p){document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.p==p?'page':'false'));M.onclick=null;scrollTo(0,0);try{if(location.hash.slice(1)!=p)history.replaceState(null,'','#'+p);await P[p]()}catch(e){M.innerHTML=cab('Erro','')+`<div class="cartao msg e">${esc(e.message)}</div>`}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>ir(b.dataset.p));
addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(P[p])ir(p)});
(async()=>{META=await api('/api/meta');ir(P[location.hash.slice(1)]?location.hash.slice(1):'fat')})();
