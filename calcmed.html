<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CalcMed — Calculadoras e escores clínicos | MedTech</title>
<meta name="description" content="CalcMed: calculadoras e escores clínicos essenciais em um só lugar. IMC, clearance, CKD-EPI, CHA2DS2-VASc, HAS-BLED, qSOFA, Glasgow e mais.">
<meta name="theme-color" content="#0E5A6D">
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{--petrol:#0E5A6D;--petrol-dark:#083845;--ink:#0E2A31;--mint:#2DD4A8;--mint-dark:#14b894;--bg:#F6FAFB;--soft:#EAF3F4;--line:#dbe8ea;--muted:#5B7882}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{background:linear-gradient(135deg,var(--petrol),var(--petrol-dark));color:#fff;padding:18px 0}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.5px}
.logo .mark{width:34px;height:34px;border-radius:10px;background:#2DD4A8;display:grid;place-items:center;flex:0 0 auto}
.logo .mark svg{width:22px;height:22px}
.logo b{color:var(--mint)}
.top a{color:#cfe3e6;text-decoration:none;font-size:14px;font-weight:600}
.subtitle{color:#bcd6db;font-size:13px;margin-top:4px}
.layout{display:grid;grid-template-columns:280px 1fr;gap:22px;padding:24px 0}
.list{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;height:fit-content;position:sticky;top:18px}
.list .search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:14px}
.list button{display:block;width:100%;text-align:left;background:none;border:none;padding:11px 12px;border-radius:10px;cursor:pointer;font-size:14.5px;color:var(--ink);font-weight:600}
.list button:hover{background:var(--soft)}
.list button.active{background:var(--petrol);color:#fff}
.list .cat{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 12px 4px;font-weight:700}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;min-height:420px}
.panel h1{font-size:24px;margin-bottom:4px}
.panel .desc{color:var(--muted);font-size:14.5px;margin-bottom:20px}
.field{margin-bottom:16px}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field input,.field select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
.field input:focus,.field select:focus{outline:none;border-color:var(--mint)}
.checks{display:grid;gap:8px}
.check{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:14.5px}
.check:hover{border-color:var(--mint)}
.check input{margin-top:3px;flex:0 0 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.result{margin-top:20px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center}
.result .val{font-size:38px;font-weight:800;color:var(--petrol);font-family:'Sora',system-ui}
.result .unit{font-size:16px;color:var(--muted);font-weight:600}
.result .interp{margin-top:8px;font-size:15px;font-weight:700}
.result .note{margin-top:8px;font-size:13px;color:var(--muted)}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:800;font-size:13px;margin-top:6px}
.b-green{background:#e7f7f1;color:#14794f} .b-amber{background:#fdf0e0;color:#c97a17} .b-red{background:#fde8e8;color:#c0392b}
.disclaimer{background:#fff8ed;border:1px solid #f4d9a8;color:#8a5a16;border-radius:12px;padding:13px 16px;font-size:13px;margin-top:18px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:24px}
footer a{color:var(--petrol);font-weight:600;text-decoration:none}
@media(max-width:820px){.layout{grid-template-columns:1fr}.list{position:static}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div>
      <div class="logo"><span class="mark"><svg viewBox="0 0 96 96"><path d="M18 50 h13 l7 -20 9 38 8 -26 5 8 h13" fill="none" stroke="#062a33" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></span> Calc<b>Med</b></div>
      <div class="subtitle">Calculadoras e escores clínicos · por MedTech</div>
    </div>
    <a href="index.html">← MedTech</a>
  </div>
</header>

<div class="wrap layout">
  <nav class="list">
    <input class="search" id="search" placeholder="Buscar calculadora…" oninput="filterList()">
    <div id="menu"></div>
  </nav>
  <main class="panel" id="panel"></main>
</div>

<footer>
  CalcMed é uma ferramenta de apoio. As decisões clínicas são de responsabilidade do profissional.<br>
  © 2026 <a href="index.html">MedTech</a> · <a href="privacidade.html">Privacidade</a>
</footer>

<script>
const fmt = (n,d=1)=> (isFinite(n)? Number(n).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}) : '—');
const num = id => parseFloat(document.getElementById(id).value.replace(',','.'));
const checked = id => document.getElementById(id).checked;

const CALCS = [
 {cat:'Antropometria', id:'imc', name:'IMC', desc:'Índice de massa corporal e classificação (OMS).',
  fields:`<div class="grid2"><div class="field"><label>Peso (kg)</label><input id="p" type="number" oninput="run()"></div><div class="field"><label>Altura (cm)</label><input id="a" type="number" oninput="run()"></div></div>`,
  calc(){const p=num('p'),a=num('a')/100; if(!p||!a) return null; const v=p/(a*a);
   let c='Peso normal',b='b-green'; if(v<18.5){c='Abaixo do peso';b='b-amber'} else if(v<25){c='Peso normal';b='b-green'} else if(v<30){c='Sobrepeso';b='b-amber'} else {c='Obesidade';b='b-red'}
   return {val:fmt(v), unit:'kg/m²', interp:c, badge:b};}},

 {cat:'Antropometria', id:'bsa', name:'Superfície corporal (Mosteller)', desc:'Área de superfície corporal (BSA) — fórmula de Mosteller.',
  fields:`<div class="grid2"><div class="field"><label>Peso (kg)</label><input id="p" type="number" oninput="run()"></div><div class="field"><label>Altura (cm)</label><input id="a" type="number" oninput="run()"></div></div>`,
  calc(){const p=num('p'),a=num('a'); if(!p||!a) return null; const v=Math.sqrt(a*p/3600); return {val:fmt(v,2), unit:'m²', interp:'Superfície corporal', badge:''};}},

 {cat:'Nefrologia', id:'cg', name:'Clearance de creatinina (Cockcroft-Gault)', desc:'Estimativa do clearance de creatinina.',
  fields:`<div class="grid2"><div class="field"><label>Idade (anos)</label><input id="i" type="number" oninput="run()"></div><div class="field"><label>Peso (kg)</label><input id="p" type="number" oninput="run()"></div></div><div class="grid2"><div class="field"><label>Creatinina (mg/dL)</label><input id="cr" type="number" step="0.01" oninput="run()"></div><div class="field"><label>Sexo</label><select id="s" onchange="run()"><option value="m">Masculino</option><option value="f">Feminino</option></select></div></div>`,
  calc(){const i=num('i'),p=num('p'),cr=num('cr'); if(!i||!p||!cr) return null; let v=((140-i)*p)/(72*cr); if(document.getElementById('s').value==='f') v*=0.85;
   let c='Normal',b='b-green'; if(v<15){c='Falência renal';b='b-red'} else if(v<30){c='TFG muito reduzida';b='b-red'} else if(v<60){c='TFG reduzida';b='b-amber'} else if(v<90){c='Leve redução';b='b-amber'}
   return {val:fmt(v), unit:'mL/min', interp:c, badge:b};}},

 {cat:'Nefrologia', id:'ckdepi', name:'TFG — CKD-EPI 2021 (sem raça)', desc:'Taxa de filtração glomerular estimada (creatinina, 2021).',
  fields:`<div class="grid2"><div class="field"><label>Idade (anos)</label><input id="i" type="number" oninput="run()"></div><div class="field"><label>Creatinina (mg/dL)</label><input id="cr" type="number" step="0.01" oninput="run()"></div></div><div class="field"><label>Sexo</label><select id="s" onchange="run()"><option value="m">Masculino</option><option value="f">Feminino</option></select></div>`,
  calc(){const i=num('i'),cr=num('cr'); if(!i||!cr) return null; const f=document.getElementById('s').value==='f';
   const k=f?0.7:0.9, al=f?-0.241:-0.302; const v=142*Math.pow(Math.min(cr/k,1),al)*Math.pow(Math.max(cr/k,1),-1.200)*Math.pow(0.9938,i)*(f?1.012:1);
   let c='G1 — normal',b='b-green'; if(v<15){c='G5 — falência';b='b-red'} else if(v<30){c='G4';b='b-red'} else if(v<45){c='G3b';b='b-amber'} else if(v<60){c='G3a';b='b-amber'} else if(v<90){c='G2';b='b-green'}
   return {val:fmt(v), unit:'mL/min/1,73m²', interp:'Estágio '+c, badge:b};}},

 {cat:'Cardiologia', id:'chads', name:'CHA₂DS₂-VASc', desc:'Risco tromboembólico na fibrilação atrial.',
  fields:`<div class="checks">
   ${chk('c1','Insuficiência cardíaca / disfunção VE')}${chk('c2','Hipertensão')}${chk('c3','Idade ≥ 75 anos (2 pts)')}${chk('c4','Diabetes')}${chk('c5','AVC / AIT / tromboembolismo prévio (2 pts)')}${chk('c6','Doença vascular (IAM, DAP, placa aórtica)')}${chk('c7','Idade 65–74 anos')}${chk('c8','Sexo feminino')}</div>`,
  calc(){let s=0; s+=checked('c1')?1:0; s+=checked('c2')?1:0; s+=checked('c3')?2:0; s+=checked('c4')?1:0; s+=checked('c5')?2:0; s+=checked('c6')?1:0; s+=checked('c7')?1:0; s+=checked('c8')?1:0;
   let c='Baixo risco',b='b-green'; if(s>=2){c='Alto risco — considerar anticoagulação';b='b-red'} else if(s===1){c='Risco intermediário';b='b-amber'}
   return {val:s, unit:'pontos', interp:c, badge:b};}},

 {cat:'Cardiologia', id:'hasbled', name:'HAS-BLED', desc:'Risco de sangramento em anticoagulação.',
  fields:`<div class="checks">
   ${chk('h1','Hipertensão (PAS > 160)')}${chk('h2','Função renal anormal')}${chk('h3','Função hepática anormal')}${chk('h4','AVC prévio')}${chk('h5','Sangramento prévio / predisposição')}${chk('h6','INR lábil')}${chk('h7','Idade > 65 anos')}${chk('h8','Drogas (AINE/antiplaq.)')}${chk('h9','Álcool (≥8 doses/sem)')}</div>`,
  calc(){let s=0; for(let i=1;i<=9;i++) s+=checked('h'+i)?1:0;
   let c='Risco baixo',b='b-green'; if(s>=3){c='Risco alto — cautela e monitorização';b='b-red'} else if(s===2){c='Risco moderado';b='b-amber'}
   return {val:s, unit:'pontos', interp:c, badge:b};}},

 {cat:'Emergência', id:'qsofa', name:'qSOFA', desc:'Triagem rápida de risco na suspeita de sepse.',
  fields:`<div class="checks">${chk('q1','Frequência respiratória ≥ 22 irpm')}${chk('q2','PA sistólica ≤ 100 mmHg')}${chk('q3','Alteração do nível de consciência (Glasgow < 15)')}</div>`,
  calc(){let s=(checked('q1')?1:0)+(checked('q2')?1:0)+(checked('q3')?1:0);
   let c='Baixo risco',b='b-green'; if(s>=2){c='≥2: maior risco de desfecho ruim — reavaliar';b='b-red'}
   return {val:s, unit:'pontos', interp:c, badge:b};}},

 {cat:'Emergência', id:'glasgow', name:'Escala de Coma de Glasgow', desc:'Nível de consciência (ocular + verbal + motor).',
  fields:`<div class="field"><label>Abertura ocular</label><select id="o" onchange="run()"><option value="4">Espontânea (4)</option><option value="3">Ao chamado (3)</option><option value="2">À dor (2)</option><option value="1">Ausente (1)</option></select></div>
   <div class="field"><label>Resposta verbal</label><select id="v" onchange="run()"><option value="5">Orientada (5)</option><option value="4">Confusa (4)</option><option value="3">Palavras inapropriadas (3)</option><option value="2">Sons incompreensíveis (2)</option><option value="1">Ausente (1)</option></select></div>
   <div class="field"><label>Resposta motora</label><select id="m" onchange="run()"><option value="6">Obedece comandos (6)</option><option value="5">Localiza dor (5)</option><option value="4">Retirada à dor (4)</option><option value="3">Flexão anormal (3)</option><option value="2">Extensão (2)</option><option value="1">Ausente (1)</option></select></div>`,
  calc(){const s=num('o')+num('v')+num('m'); let c='Leve (13–15)',b='b-green'; if(s<=8){c='Grave (≤8) — proteção de via aérea';b='b-red'} else if(s<=12){c='Moderado (9–12)';b='b-amber'}
   return {val:s, unit:'/ 15', interp:c, badge:b};}},

 {cat:'Distúrbios', id:'aniongap', name:'Ânion gap', desc:'Ânion gap (com correção opcional por albumina).',
  fields:`<div class="grid2"><div class="field"><label>Na⁺ (mEq/L)</label><input id="na" type="number" oninput="run()"></div><div class="field"><label>Cl⁻ (mEq/L)</label><input id="cl" type="number" oninput="run()"></div></div><div class="grid2"><div class="field"><label>HCO₃⁻ (mEq/L)</label><input id="hco" type="number" oninput="run()"></div><div class="field"><label>Albumina (g/dL, opc.)</label><input id="alb" type="number" step="0.1" oninput="run()"></div></div>`,
  calc(){const na=num('na'),cl=num('cl'),hco=num('hco'); if(!na||!cl||!hco) return null; let v=na-(cl+hco); const alb=num('alb');
   let extra=''; if(alb){const corr=v+2.5*(4-alb); extra=' · corrigido: '+fmt(corr)+' mEq/L';}
   let c='Normal (8–12)',b='b-green'; if(v>12){c='Elevado — acidose com AG aumentado';b='b-amber'} else if(v<8){c='Diminuído';b='b-amber'}
   return {val:fmt(v), unit:'mEq/L'+extra, interp:c, badge:b};}},

 {cat:'Distúrbios', id:'nacorr', name:'Sódio corrigido (hiperglicemia)', desc:'Correção do sódio para glicemia elevada.',
  fields:`<div class="grid2"><div class="field"><label>Na⁺ medido (mEq/L)</label><input id="na" type="number" oninput="run()"></div><div class="field"><label>Glicemia (mg/dL)</label><input id="gli" type="number" oninput="run()"></div></div>`,
  calc(){const na=num('na'),gli=num('gli'); if(!na||!gli) return null; const v=na+1.6*((gli-100)/100);
   return {val:fmt(v), unit:'mEq/L', interp:'Sódio corrigido (fator 1,6)', badge:''};}},
];

function chk(id,label){return `<label class="check"><input type="checkbox" id="${id}" onchange="run()"><span>${label}</span></label>`}

let current = CALCS[0].id;
function renderMenu(filter=''){
  const m=document.getElementById('menu'); m.innerHTML='';
  let lastCat='';
  CALCS.filter(c=>(c.name+c.desc).toLowerCase().includes(filter.toLowerCase())).forEach(c=>{
    if(c.cat!==lastCat){const d=document.createElement('div');d.className='cat';d.textContent=c.cat;m.appendChild(d);lastCat=c.cat;}
    const b=document.createElement('button'); b.textContent=c.name; b.className=(c.id===current?'active':''); b.onclick=()=>{current=c.id;renderMenu(filter);renderPanel();}; m.appendChild(b);
  });
}
function filterList(){renderMenu(document.getElementById('search').value)}
function renderPanel(){
  const c=CALCS.find(x=>x.id===current); const p=document.getElementById('panel');
  p.innerHTML=`<h1>${c.name}</h1><div class="desc">${c.desc}</div>${c.fields}<div id="res"></div>
   <div class="disclaimer">⚠️ Ferramenta de apoio. Confira os valores e use o julgamento clínico — a responsabilidade pela decisão é do profissional.</div>`;
  run();
}
function run(){
  const c=CALCS.find(x=>x.id===current); const r=c.calc();
  const res=document.getElementById('res'); if(!res) return;
  if(!r){res.innerHTML='<div class="result"><div class="val">—</div><div class="note">Preencha os campos acima.</div></div>';return;}
  res.innerHTML=`<div class="result"><div class="val">${r.val} <span class="unit">${r.unit}</span></div>${r.badge?`<div><span class="badge ${r.badge}">${r.interp}</span></div>`:`<div class="interp">${r.interp}</div>`}</div>`;
}
renderMenu(); renderPanel();
</script>
</body>
</html>
