<style>

  --c1: #3fb59a; --c2: #7fa7e6; --c3: #e2a33a; --c4: #b693e6; --c5: #9aa7a3; --c6: #f07067; color-scheme: dark; } }

  --bg: #0f1519; --panel: #172026; --ink: #e8ecea; --muted: #9aa7a3; --line: #2a363d; --soft: #1d282e; --grid: #243038;

.lock { background: var(--info-soft); color: var(--info); border-radius: 12px; padding: 10px 14px; font-weight: 600; margin-bottom: 14px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }

.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

.inst { display: flex; align-items: center; gap: 12px; background: var(--brand-soft); color: var(--brand); border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; font-weight: 600; flex-wrap: wrap; }

@media (max-width: 1100px) { .k5 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; } nav.side { display: none; }
  .k5, .k4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .k3, .k2 { grid-template-columns: 1fr; } .span2 { grid-column: auto; }
  main { padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); overflow-x: auto; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); gap: 4px; z-index: 10; }
  .tabbar button { flex: none; border: 0; background: none; padding: 8px 12px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; }
  .tabbar button[aria-current="page"] { background: var(--brand-soft); color: var(--brand); }
  .leito { grid-template-columns: 1fr; } .kpi .val { font-size: 26px; }
}
@media (prefers-reduced-motion: no-preference) { .view { animation: in .2s ease-out; } @keyframes in { from { opacity: .6; transform: translateY(4px); } to { opacity: 1; transform: none; } } }

<script>
(function () {
  /* ================= dados fictícios (determinísticos) ================= */
  var seed = 7731;
  function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  function rint(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }
  function pick(a) { return a[Math.floor(rnd() * a.length)]; }
  function walk(n, base, amp, drift, lo, hi) { var o = [], v = base; for (var i = 0; i < n; i++) { v += (rnd() - .5) * amp + (drift || 0); if (lo != null) v = Math.max(lo, v); if (hi != null) v = Math.min(hi, v); o.push(+v.toFixed(2)); } return o; }
  function movel(arr, w) { return arr.map(function (_, i) { var s = arr.slice(Math.max(0, i - w + 1), i + 1); return +(s.reduce(function (a, b) { return a + b; }, 0) / s.length).toFixed(2); }); }
  var N = 90;   // dias de histórico
  var hojeD = new Date(2026, 9, 16);
  function diaRot(i) { var d = new Date(hojeD); d.setDate(d.getDate() - (N - i)); return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2); }
  var SET = [
    { k: 'CM', nome: 'Clínica Médica', cap: 30, meta: 10, base: 10.6, drift: -.012, mort: 4.8, metaMort: 2.5, livres: 0, fila: 6 },
    { k: 'CIR', nome: 'Cirúrgica', cap: 40, meta: 5, base: 3.5, drift: -.003, mort: 0.4, metaMort: 1, livres: 2, fila: 9 },
    { k: 'ORT', nome: 'Ortopedia', cap: 28, meta: 5.5, base: 5.6, drift: -.006, mort: 0, metaMort: 1, livres: 1, fila: 3 },
    { k: 'UCE', nome: 'Cuidados especiais', cap: 14, meta: 20, base: 18, drift: .01, mort: 42, metaMort: 35, livres: 0, fila: 4 },
    { k: 'UTI', nome: 'UTI adulto', cap: 30, meta: 10, base: 10.4, drift: .006, mort: 29, metaMort: 30, livres: 0, fila: 5 },
    { k: 'AVC', nome: 'Unidade AVC', cap: 20, meta: 9, base: 6.4, drift: -.004, mort: 1.2, metaMort: 5, livres: 3, fila: 0 },
    { k: 'OBS', nome: 'Obstetrícia', cap: 30, meta: 5, base: 3.8, drift: -.001, mort: 0, metaMort: 1, livres: 6, fila: 0 },
    { k: 'NEO', nome: 'Neonatologia', cap: 28, meta: 10, base: 7.6, drift: -.008, mort: 1.5, metaMort: 3, livres: 12, fila: 0 }
  ];
  var CAUSAS = ['Exame ou laudo', 'Vaga externa / regulação', 'Antibiótico', 'Cirurgia', 'Social / família'];
  SET.forEach(function (s, idx) {
    s.permD = walk(N, s.base, s.base * .5, s.drift * s.base, s.base * .55, s.base * 1.6);
    s.perm7 = movel(s.permD, 7); s.perm30 = movel(s.permD, 30);
    s.ocupD = walk(N, (s.cap - s.livres) / s.cap * 100 - 1, 4, 0, 55, 108);
    s.saidasD = s.permD.map(function () { return Math.max(0, Math.round(s.cap / s.base + (rnd() - .5) * 3)); });
    var tot = rint(8, 18); s.causas = CAUSAS.map(function (c, i) { return Math.max(0, Math.round(tot * [0.36, 0.2, 0.22, 0.14, 0.08][i] * (0.6 + rnd() * .8))); });
    s.longa = Math.round((s.cap - s.livres) * (s.perm30[N - 1] > s.meta ? .3 : .12));
  });
  function last(a) { return a[a.length - 1]; }
  function media(a) { return a.reduce(function (x, y) { return x + y; }, 0) / a.length; }
  var CAP = SET.reduce(function (a, s) { return a + s.cap; }, 0);
  var H = {};
  H.pd = []; H.sd = []; H.ocup = []; H.int = []; for (var i = 0; i < N; i++) { var pd = 0, sd = 0; SET.forEach(function (s) { pd += s.ocupD[i] / 100 * s.cap; sd += s.saidasD[i]; }); H.pd.push(pd); H.sd.push(sd); H.ocup.push(+(pd / CAP * 100).toFixed(1)); H.int.push(Math.max(10, Math.round(sd + (rnd() - .5) * 8))); }
  (function () { var k = H.pd.reduce(function (a, b) { return a + b; }, 0) / (6.45 * H.sd.reduce(function (a, b) { return a + b; }, 0)); H.sd = H.sd.map(function (v, i) { return v * k * (1 + (i - N) * 0.0012); }); })();   // calibra o hospital em ~6,4 dias, com leve queda ao longo do tempo
  function permJan(w, i) { var a = 0, b = 0; for (var j = Math.max(0, i - w + 1); j <= i; j++) { a += H.pd[j]; b += H.sd[j]; } return +(a / b).toFixed(2); }
  H.p7 = H.pd.map(function (_, i) { return permJan(7, i); }); H.p30 = H.pd.map(function (_, i) { return permJan(30, i); });
  var BASE_ANTES = 7.0;   // média do ano anterior (antes da implantação)
  H.ldLib = []; var acum = 0; for (i = 0; i < N; i++) { acum += Math.max(-2, (BASE_ANTES - H.p7[i]) * H.sd[i]); H.ldLib.push(+acum.toFixed(0)); }
  var MESES = ['nov', 'dez', 'jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out'];
  var PERM_MES = [7.4, 7.1, 7.5, 7.4, 7.6, 7.2, 6.9, 7.2, 7.0, 6.6, 6.3, 6.4];
  var EMG = { ocup: walk(N, 82, 7, 0, 60, 112), espera: walk(N, 26, 10, -.05, 5, 60), m24: walk(N, 70, 6, .05, 55, 90), fila: walk(N, 24, 6, 0, 8, 40) };
  var CIRG = { dia: walk(N, 28, 9, 0, 12, 42).map(Math.round), sala: walk(N, 86, 8, 0, 60, 105), susp: walk(N, 1.6, 1.4, 0, 0, 6) };
  var PAINEL = { acerto: walk(N, 52, 10, .12, 25, 80), escape: walk(N, 34, 10, -.1, 10, 60), andaram: walk(N, 62, 8, .05, 40, 85) };

  /* leitos (apoio operacional) */
  var SEL = { 'ALTA HOJE': 'l-ok', 'ALTA SE': 'l-br', 'PIORA CLÍNICA': 'l-crit', 'EM EXAME': 'l-info', 'REGULAÇÃO': 'l-warn', 'CIRURGIA': 'l-info', 'ATB': '', 'VIGILÂNCIA': '' };
  var SELP = { 'ALTA HOJE': 'p-ok', 'ALTA SE': 'p-ok', 'PIORA CLÍNICA': 'p-crit', 'EM EXAME': 'p-info', 'REGULAÇÃO': 'p-warn', 'CIRURGIA': 'p-info', 'ATB': 'p-n', 'VIGILÂNCIA': 'p-n' };
  var TXT = { 'ALTA HOJE': ['Alta decidida na evolução de hoje.', 'Dar a alta até 11h.'], 'ALTA SE': ['Alta se o laudo da TC de controle vier normal.', 'Checar o laudo às 10h.'], 'PIORA CLÍNICA': ['Febre e queda de saturação na madrugada.', 'Reavaliar pela manhã.'], 'EM EXAME': ['Ecocardiograma pedido há 3 dias, sem data.', 'NAC: marcar o exame.'], 'REGULAÇÃO': ['Aguarda vaga de transferência há 4 dias.', 'NAC: manter o pedido ativo.'], 'CIRURGIA': ['Aguarda cirurgia sem data no mapa.', 'Centro cirúrgico: definir a data.'], 'ATB': ['Antibiótico endovenoso até o D10 (hoje D6).', 'Programar a alta para o D11.'], 'VIGILÂNCIA': ['Ajuste de insulina em curso.', 'Seguir o plano.'] };
  var LEITOS = [];
  SET.forEach(function (s) { for (var j = 1; j <= s.cap - s.livres; j++) { var sl = pick(['ALTA SE', 'ALTA SE', 'EM EXAME', 'EM EXAME', 'REGULAÇÃO', 'ATB', 'VIGILÂNCIA', 'VIGILÂNCIA', 'CIRURGIA', 'ALTA HOJE', 'PIORA CLÍNICA']); LEITOS.push({ set: s.k, leito: s.k + ' ' + (100 + j), pront: String(rint(410000, 489999)), selo: sl, dias: rint(1, 25) }); } });

  /* ================= perfis ================= */
  var PERFIS = {
    direcao: { nome: 'Direção', setores: null, telas: ['eficiencia', 'setor', 'emergencia', 'cirurgia', 'desempenho', 'leitos', 'acessos'] },
    coord: { nome: 'Coordenação · Clínica Médica', setores: ['CM'], telas: ['eficiencia', 'setor', 'leitos'] },
    nac: { nome: 'NAC', setores: null, telas: ['emergencia', 'leitos'] },
    medico: { nome: 'Médico de referência', setores: null, telas: ['eficiencia', 'setor', 'emergencia', 'cirurgia', 'desempenho', 'leitos'] },
    ti: { nome: 'TI do hospital', setores: null, telas: ['acessos'] }
  };
  var TELAS = { eficiencia: 'Eficiência', setor: 'Setores', emergencia: 'Emergência', cirurgia: 'Centro cirúrgico', desempenho: 'Desempenho do painel', leitos: 'Leito a leito', acessos: 'Acessos' };

  /* ================= PWA: instalar na tela de início ================= */
  var promptInst = null, fechouInst = false;

      '<div class="ctl"><label for="perfil">Ver como</label><select id="perfil">' + opts + '</select></div></div>' +
      '<div class="view">' + V[st.tela]() + '</div>';

  }

    var t = e.target.closest('[data-tela]'); if (t) { st.tela = t.getAttribute('data-tela'); reg('abriu ' + TELAS[st.tela]); desenhar(); window.scrollTo(0, 0); return; }
