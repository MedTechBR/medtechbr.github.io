<style>
/* Celeris — app de eficiência hospitalar. Barra superior fixa (setor, período, perfil) + navegação lateral; no celular, abas embaixo.
   Verde-hospital como marca, neutros levemente esverdeados, cores de estado separadas da marca. Dados 100% fictícios. */
:root {
  --bg: #f2f4f1; --panel: #ffffff; --panel2: #f6f8f5; --ink: #142028; --muted: #5b6772; --line: #dde2dc; --grid: #e9ece7;
  --brand: #0f6b5a; --brand2: #13896f; --brand-ink: #ffffff; --brand-soft: #d9efe8;
  --ok: #2f8a4f; --ok-soft: #e0f2e6; --warn: #b07100; --warn-soft: #fcefd3; --crit: #c0352b; --crit-soft: #fbe2df; --info: #2459a8; --info-soft: #e1eaf7; --violet: #6e47b5; --violet-soft: #ece5f7; --cyan: #0e7490; --cyan-soft: #d6f0f7;
  --shadow: 0 1px 2px rgba(20,32,40,.06), 0 6px 20px rgba(20,32,40,.06);
  --f-display: 'Archivo', 'Segoe UI', Arial, sans-serif; --f-body: 'Source Sans 3', 'Segoe UI', Arial, sans-serif; --f-data: 'JetBrains Mono', Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1418; --panel: #151f25; --panel2: #1a262d; --ink: #e6ebe9; --muted: #98a6a2; --line: #26333a; --grid: #223038;
  --brand: #38b496; --brand2: #4fd0ae; --brand-ink: #04211a; --brand-soft: #173a32;
  --ok: #5cc581; --ok-soft: #163426; --warn: #e6a73e; --warn-soft: #3a2b10; --crit: #f0766b; --crit-soft: #3e1c1a; --info: #82a9e8; --info-soft: #1a2a40; --violet: #b398ea; --violet-soft: #2a2140; --cyan: #5cc8e0; --cyan-soft: #10313a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1418; --panel: #151f25; --panel2: #1a262d; --ink: #e6ebe9; --muted: #98a6a2; --line: #26333a; --grid: #223038;
  --brand: #38b496; --brand2: #4fd0ae; --brand-ink: #04211a; --brand-soft: #173a32;
  --ok: #5cc581; --ok-soft: #163426; --warn: #e6a73e; --warn-soft: #3a2b10; --crit: #f0766b; --crit-soft: #3e1c1a; --info: #82a9e8; --info-soft: #1a2a40; --violet: #b398ea; --violet-soft: #2a2140; --cyan: #5cc8e0; --cyan-soft: #10313a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--f-body); -webkit-tap-highlight-color: transparent; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- estrutura ---------- */
.app { display: grid; grid-template-columns: 262px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 12px calc(16px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 11px; padding: 2px 10px 18px; }
.brand img { width: 38px; height: 38px; border-radius: 12px; box-shadow: 0 4px 12px -3px #0f6b5a; }
.brand b { font: 800 22px/1 var(--f-display); letter-spacing: -.02em; display: block; }
.brand small { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.navlab { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 14px 12px 6px; }
.navbtn { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; padding: 7px 10px; border-radius: 14px; font-weight: 600; color: var(--muted); text-align: left; white-space: nowrap; }
.navbtn:hover { background: var(--panel2); color: var(--ink); }
.navbtn[aria-current="page"] { background: var(--brand-soft); color: var(--ink); }
.ico { --c1: #13896f; --c2: #2fc79a; width: 34px; height: 34px; flex: none; border-radius: 11px; display: grid; place-items: center; color: #fff; background: linear-gradient(140deg, var(--c1), var(--c2)); box-shadow: 0 3px 10px -2px var(--c1), inset 0 1px 0 rgba(255,255,255,.28); transition: transform .15s; }
.ico svg.i { width: 19px; height: 19px; stroke-width: 2.3; }
.navbtn:hover .ico { transform: scale(1.06); }
.navbtn[aria-current="page"] .ico { transform: scale(1.08); box-shadow: 0 4px 14px -2px var(--c1), inset 0 1px 0 rgba(255,255,255,.3); }
.navbtn .semd { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; }
.cob { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 12px; background: var(--soft, rgba(127,127,127,.08)); border: 1px solid var(--line); font-size: 13.5px; margin: 0 0 14px; }
.cob b { display: block; margin-bottom: 2px; }
.navbtn .badge { margin-left: auto; font-size: 12px; font-weight: 700; background: var(--crit); color: #fff; border-radius: 999px; padding: 1px 7px; }
.navbtn .soon { margin-left: auto; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--violet); background: var(--violet-soft); border-radius: 6px; padding: 2px 6px; }
.sidefoot { margin-top: auto; padding: 12px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); }
.main { min-width: 0; }

/* barra superior fixa com os seletores */
.topbar { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: calc(10px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) 8px max(24px, env(safe-area-inset-left, 0px)); }
.row1 { display: flex; align-items: center; gap: 10px; }
.row1 h1 { font: 700 22px/1.1 var(--f-display); margin: 0; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row1 .upd { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mlogo { display: none; width: 34px; height: 34px; border-radius: 11px; flex: none; }
.dotlive { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); flex: none; }
.grow { flex: 1; min-width: 0; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 3px; flex: none; }
.seg button { border: 0; background: none; padding: 6px 11px; border-radius: 8px; font-weight: 600; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.mper { display: none; }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); border-radius: 11px; padding: 7px 10px; font-weight: 600; font-size: 14px; flex: none; }
.iconbtn:hover { border-color: var(--brand); }
.profile { position: relative; flex: none; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; width: 270px; max-width: calc(100vw - 32px); z-index: 40; }
.menu button { display: flex; width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 9px; font-weight: 600; gap: 10px; align-items: center; }
.menu button:hover { background: var(--panel2); }
.menu button[aria-checked="true"] { color: var(--brand); background: var(--brand-soft); }
.menu small { display: block; color: var(--muted); font-weight: 500; font-size: 12.5px; }

/* seletor de setor: cartões roláveis com status */
.sectors { display: flex; gap: 8px; overflow-x: auto; padding: 10px 2px 4px; scroll-snap-type: x proximity; scrollbar-width: thin; }
.sec { flex: none; scroll-snap-align: start; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: center; min-width: 152px; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 13px; padding: 8px 12px; transition: border-color .15s, box-shadow .15s, transform .15s; }
.sec:hover { border-color: var(--brand); transform: translateY(-1px); }
.sec[aria-pressed="true"] { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand) inset; background: var(--brand-soft); }
.sec .st { width: 10px; height: 10px; border-radius: 50%; grid-row: span 2; }
.sec b { font-size: 14px; font-weight: 700; white-space: nowrap; }
.sec span.m { font-size: 12.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.sec .mb { grid-column: 1 / -1; height: 4px; border-radius: 4px; background: var(--grid); overflow: hidden; margin-top: 4px; }
.sec .mb i { display: block; height: 100%; }

.content { padding: 18px max(24px, env(safe-area-inset-right, 0px)) 48px max(24px, env(safe-area-inset-left, 0px)); }
.demo { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 7px 12px; margin-bottom: 16px; font-weight: 600; }
.inst { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--brand-soft); color: var(--brand); border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; font-weight: 600; }
.inst button { border: 0; background: var(--brand); color: var(--brand-ink); border-radius: 9px; padding: 7px 14px; font-weight: 700; }
.inst .link { background: none; color: var(--brand); padding: 7px 6px; }

/* ---------- componentes ---------- */
.g { display: grid; gap: 16px; }
.c12 { grid-template-columns: repeat(12, minmax(0, 1fr)); }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
.mt { margin-top: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; min-width: 0; box-shadow: var(--shadow); }
.card h2 { font: 700 16px/1.25 var(--f-display); margin: 0; display: flex; align-items: center; gap: 8px; }
.card .hd { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.card .hd p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.chart { width: 100%; height: 290px; }
.chart.sm { height: 210px; } .chart.lg { height: 340px; } .chart.xl { height: 380px; }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.kpi { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 4px; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.kpi[data-ir]:hover { border-color: var(--brand); }
.kpi.hasring { padding-right: 88px; }
.kpi .l { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kpi .v { font: 700 30px/1.05 var(--f-display); font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.kpi .v small { font: 700 13px var(--f-body); padding: 2px 7px; border-radius: 999px; }
.kpi .s { font-size: 13px; color: var(--muted); }
.kpi .spark { height: 38px; margin-top: auto; padding-top: 4px; }
.ring { --p: 50; --c: var(--brand); width: 64px; height: 64px; border-radius: 50%; background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--grid) 0); display: grid; place-items: center; position: absolute; right: 14px; top: 14px; }
.ring::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: var(--panel); }
.ring span { position: relative; z-index: 1; font: 700 13px var(--f-display); }
.up { background: var(--crit-soft); color: var(--crit); } .down { background: var(--ok-soft); color: var(--ok); } .flat { background: var(--panel2); color: var(--muted); }
.good { color: var(--ok); } .bad { color: var(--crit); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.p-ok { background: var(--ok-soft); color: var(--ok); } .p-br { background: var(--brand-soft); color: var(--brand); } .p-crit { background: var(--crit-soft); color: var(--crit); } .p-warn { background: var(--warn-soft); color: var(--warn); } .p-info { background: var(--info-soft); color: var(--info); } .p-vio { background: var(--violet-soft); color: var(--violet); } .p-n { background: var(--panel2); color: var(--muted); } .p-cy { background: var(--cyan-soft); color: var(--cyan); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.tab[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); }
.note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
th { text-align: left; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
tr.clk { cursor: pointer; } tr.clk:hover td { background: var(--panel2); }
.num { text-align: right; }
.scroll { overflow-x: auto; }
.mono { font-family: var(--f-data); font-weight: 700; }
.bar { height: 8px; border-radius: 8px; background: var(--grid); overflow: hidden; min-width: 60px; }
.bar i { display: block; height: 100%; border-radius: 8px; }
.empty { padding: 24px; text-align: center; color: var(--muted); margin: 0; }

/* quadro do dia (colunas por situação) */
.board { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--panel2); border: 1px solid var(--line); border-radius: 16px; padding: 10px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.col h3 { display: flex; align-items: center; gap: 8px; font: 700 14px var(--f-display); margin: 4px 4px 2px; }
.col h3 .dot { width: 10px; height: 10px; border-radius: 50%; }
.col h3 .ct { margin-left: auto; font: 700 13px var(--f-body); color: var(--muted); }
.tk { text-align: left; border: 1px solid var(--line); border-left: 4px solid var(--line); background: var(--panel); border-radius: 12px; padding: 10px 11px; display: flex; flex-direction: column; gap: 4px; }
.tk:hover { border-color: var(--brand); }
.tk .t1 { display: flex; align-items: center; gap: 8px; }
.tk p { margin: 0; font-size: 13.5px; color: var(--muted); }
.tk .sm { font-size: 12px; color: var(--muted); }

/* mapa de leitos */
.wards { display: grid; gap: 14px; }
.ward { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); }
.ward .wh { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; margin-bottom: 10px; }
.ward .wh b { font: 700 16px var(--f-display); }
.ward .wh .dot { width: 12px; height: 12px; border-radius: 50%; }
.beds { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
.bed { position: relative; border: 1px solid transparent; border-radius: 12px; padding: 8px 8px 7px; text-align: left; min-height: 62px; display: flex; flex-direction: column; justify-content: space-between; transition: transform .12s, opacity .15s; }
.bed:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.bed .n { font: 700 13px var(--f-data); }
.bed .d { font-size: 11.5px; font-weight: 600; opacity: .85; }
.bed .pc { position: absolute; right: 5px; bottom: 5px; font: 700 10px/1 var(--f-data); color: #fff; border-radius: 5px; padding: 3px 4px; }
.pc-l { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; color: #fff; font: 700 11px/1 var(--f-data); vertical-align: -3px; }
.prevg { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 8px; }
.prevg > div { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.prevg span { font-size: 11.5px; font-weight: 700; color: var(--muted); line-height: 1.2; }
.prevg b { font: 700 20px var(--f-display); font-variant-numeric: tabular-nums; }
.prevg small { font-size: 12px; color: var(--muted); }
.rbar { display: block; height: 6px; border-radius: 6px; background: var(--grid); overflow: hidden; } .rbar i { display: block; height: 100%; }
.bed.emg { border-left: 4px solid var(--rc); }
.risco { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--panel2); }
.risco i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.bed .al { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--crit); box-shadow: 0 0 0 2px var(--panel); }
.bed.free { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.b-ok { background: var(--ok-soft); color: var(--ok); } .b-br { background: var(--brand-soft); color: var(--brand); } .b-crit { background: var(--crit-soft); color: var(--crit); }
.b-info { background: var(--info-soft); color: var(--info); } .b-cy { background: var(--cyan-soft); color: var(--cyan); } .b-warn { background: var(--warn-soft); color: var(--warn); } .b-n { background: var(--panel2); color: var(--muted); border-color: var(--line); } .b-vio { background: var(--violet-soft); color: var(--violet); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); border-radius: 11px; padding: 7px 10px; flex: 0 1 260px; min-width: 0; }
.search input { border: 0; outline: 0; background: none; width: 100%; min-width: 0; }

/* gaveta de detalhe */
.veil { position: fixed; inset: 0; background: rgba(8,15,19,.38); z-index: 60; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--panel); z-index: 61; box-shadow: -12px 0 40px rgba(0,0,0,.18); display: flex; flex-direction: column; }
.drawer .dh { padding: calc(18px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) 14px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
.drawer .dh h3 { font: 700 22px var(--f-display); margin: 0; }
.drawer .db { padding: 16px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.kv { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px 12px; font-size: 14.5px; margin: 0; }
.kv dt { color: var(--muted); font-weight: 600; } .kv dd { margin: 0; }
.tl { display: flex; flex-direction: column; border-left: 2px solid var(--line); margin-left: 6px; }
.tl div { position: relative; padding: 0 0 12px 16px; font-size: 14px; }
.tl div::before { content: ""; position: absolute; left: -7px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--panel); border: 2px solid var(--brand); }
.tl small { color: var(--muted); display: block; }
.alertbox { border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.close { margin-left: auto; border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 7px 9px; display: inline-flex; }
.fix { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; }

      '<div class="dh" style="border-top:5px solid ' + SELOS[l.selo].cor + '"><div><h3>' + l.leito + '</h3><div class="note" style="margin:2px 0 0">' + (l.area ? 'Emergência · ' + AR(l.area).nome : s.nome) + ' · prontuário <span class="mono">' + l.pront + '</span></div></div><button class="close" data-fechar="1" aria-label="Fechar">' + ic('x') + '</button></div>' +
      '<div class="db"><div style="display:flex;gap:8px;flex-wrap:wrap">' + selPill(l.selo) + (l.set === 'EMG' ? riscoPill(l) + '<span class="pill p-n">' + l.h + ' h na emergência</span>' + (l.h > 24 ? '<span class="pill p-crit">mais de 24 h</span>' : '<span class="pill p-ok">menos de 24 h</span>') : '<span class="pill p-n">' + l.dias + ' dias no setor</span>' + (l.dias > s.meta ? '<span class="pill p-crit">acima da meta de ' + br(s.meta, 1) + ' d</span>' : '<span class="pill p-ok">dentro da meta</span>')) + '</div>' +
      (l.prec ? '<div class="alertbox" style="background:' + PREC[l.prec.tipo][2] + '1f;color:var(--ink);border-left:4px solid ' + PREC[l.prec.tipo][2] + '"><b>Precaução de ' + PREC[l.prec.tipo][0].toLowerCase() + ':</b> ' + esc(l.prec.motivo) + '</div>' : '') +
      (l.alerta ? '<div class="alertbox" style="background:var(--violet-soft);color:var(--violet)"><b>Alerta clínico:</b> ' + esc(l.alerta[0]) + '</div>' : '') +
      (l.fat ? '<div class="alertbox" style="background:var(--brand-soft);color:var(--ink);border-left:4px solid var(--brand)"><b style="color:var(--brand)">Faturamento hospitalar · ' + esc(l.fat[0]) + ':</b> ' + esc(l.fat[1]) + '</div>' : '') +
      '<dl class="kv"><dt>Hipótese</dt><dd>' + esc(l.dx) + '</dd>' + (l.set === 'EMG' ? '<dt>Risco</dt><dd>' + RISCO[l.risco][0] + ' (Manchester)</dd>' + (l.destino ? '<dt>Destino</dt><dd>' + S(l.destino).nome + ' · aguarda há ' + l.esp + ' h</dd>' : '') : '<dt>Enfermagem</dt><dd>' + CAT[l.cat].nome + ' · ' + (l.nas != null ? 'NAS ' + l.nas : l.dini ? 'escala de Dini' : 'Fugulin ' + l.fug) + ' · ' + br(l.hEnf, l.hEnf % 1 ? 1 : 0) + ' h nas 24 h</dd>') + '<dt>O que segura</dt><dd>' + esc(l.pend) + '</dd><dt>Ação</dt><dd><b>' + esc(l.acao) + '</b></dd><dt>Quem age</dt><dd>' + esc(l.quem) + '</dd>' + (l.atb ? '<dt>Antimicrobiano</dt><dd>' + l.atb.nomes.join(' + ') + ' · D' + l.atb.dia + (l.atb.prof ? ' · profilaxia' : '') + '</dd>' : '') + (l.cult ? '<dt>Cultura</dt><dd><i>' + l.cult.mo + '</i> ' + l.cult.perfil + ' · ' + l.cult.material.toLowerCase() + ' · há ' + l.cult.h + ' h' + (l.cult.cobre ? '' : ' · <b class="bad">o esquema atual não cobre</b>') + '</dd>' : '') + '</dl>' +
      (function () { if (!l.prev) return ''; var p = l.prev, hd = HIST_DX[l.dx], rc = p.risco >= 50 ? 'crit' : p.risco >= 25 ? 'warn' : 'ok';
        return '<div><div class="note" style="margin:0 0 8px;font-weight:700">Permanência prevista</div><div class="prevg">' +
          '<div><span>Até agora</span><b>' + l.dias + ' d</b></div>' +
          '<div><span>Prevista</span><b>' + br(p.d, 1) + ' d</b><small>' + br(p.lo, 1) + ' a ' + br(p.hi, 1) + ' d</small></div>' +
          '<div><span>Risco de permanência prolongada</span><b class="' + (rc === 'ok' ? 'good' : 'bad') + '">' + p.risco + '%</b><i class="rbar"><i style="width:' + p.risco + '%;background:var(--' + rc + ')"></i></i></div></div>' +
          '<p class="note" style="margin:6px 0 0">' + esc(l.dx) + ' neste hospital: mediana ' + hd.med + ' d, 90% saem até ' + hd.p90 + ' d (' + hd.n + ' internações). Estimativa de apoio, recalculada todo dia.</p></div>'; })() +
      (l.tl ? '<div><div class="note" style="margin:0 0 8px;font-weight:700">Linha do tempo</div><div class="tl">' + l.tl.map(function (x) { return '<div><b>' + esc(x[0]) + '</b><small>há ' + x[1] + ' h</small></div>'; }).join('') + '</div></div>' : '<div><div class="note" style="margin:0 0 8px;font-weight:700">Últimos 3 dias</div><div class="tl">' + l.hist.map(function (x, i) { return '<div><b>' + x + '</b><small>' + ['anteontem', 'ontem', 'hoje'][i] + '</small></div>'; }).join('') + '</div></div>') +
      (st.perfil === 'medico' ? '<label class="fix">Corrigir o selo<select data-corrige="' + l.leito + '">' + Object.keys(SELOS).map(function (k) { return '<option' + (k === l.selo ? ' selected' : '') + '>' + k + '</option>'; }).join('') + '</select><span class="note" style="margin:0;font-weight:500">A correção vale na próxima rodada e vira aprendizado.</span></label>'
        : '<p class="note" style="margin:0">Só o médico de referência corrige o selo. Troque o perfil em "Ver como" para testar.</p>') + '</div></aside>';
    var b = over.querySelector('.close'); if (b) b.focus();
  }

  /* ===================== MONTAGEM ===================== */
  var promptInst = null, fechouInst = false;
  try { fechouInst = localStorage.getItem('celeris-inst-fechado') === '1'; } catch (e) {}
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); promptInst = e; desenhar(); });
  function instalarHTML() {
    if (standalone || fechouInst) return '';
    if (promptInst) return '<div class="inst">Instale o Celeris para abrir como aplicativo.<button id="b-inst">Instalar</button><button class="link" id="b-inst-x">Agora não</button></div>';
    if (ios) return '<div class="inst">No iPhone: toque em Compartilhar e em "Adicionar à Tela de Início".<button class="link" id="b-inst-x">Entendi</button></div>';
    return '';
  }
  function ir(t) { if (!telasPerfil().some(function (x) { return x.id === t; })) return; st.tela = t; reg('abriu ' + T(t).nome); desenhar(); window.scrollTo(0, 0); }
  function irSetor(k) { st.setor = k; reg('filtrou ' + S(k).nome); desenhar(); }
  function escuro() { var t = document.documentElement.getAttribute('data-theme'); return t ? t === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); }
  function perHTML(cls) { return '<div class="seg ' + cls + '" role="group" aria-label="Período">' + [30, 60, 90, 120].map(function (p) { return '<button data-per="' + p + '" aria-pressed="' + (st.per === p) + '">' + p + ' dias</button>'; }).join('') + '</div>'; }
  // Mapa de cobertura (só no servidor do hospital): o que este hospital entrega ao Celeris
  var COB = REAL && REAL.cobertura || null;
  var TELA_MOD = { emg: 'emergencia', cir: 'cirurgias', atm: 'antimicrobianos', alertas: 'alertas', equipe: 'enfermagem' };
  function cobTela(id) { return COB && TELA_MOD[id] && COB[TELA_MOD[id]] || null; }
  function cobAviso(t, m) {
    return '<div class="g c12">' + card(null, t.nome + ': sem dados deste hospital', esc(m.detalhe),
      '<p class="note" style="font-size:14px">' + esc(m.pedir) + ' Assim que o dado começar a chegar, esta tela se preenche sozinha.</p>', 's12') + '</div>';
  }
  function cobNota(m) { return '<div class="cob"><div><b>Dado parcial neste hospital</b>' + esc(m.detalhe) + '. ' + esc(m.pedir) + '</div></div>'; }
  function desenhar() {
    if (REAL) { document.querySelector('.upd span:last-child').textContent = REAL.atualizado; document.querySelector('.sidefoot').innerHTML = esc(REAL.hospital) + '<br>' + esc(REAL.usuario.nome); }
    var tp = telasPerfil(); if (!tp.some(function (t) { return t.id === st.tela; })) st.tela = tp[0].id;
    var pS = setoresPerfil(); if (st.setor !== 'ALL' && !pS.some(function (s) { return s.k === st.setor; })) st.setor = 'ALL';
    if (PERFIS[st.perfil].setores && pS.length === 1) st.setor = pS[0].k;
    var tela = T(st.tela);
    var g = '', nav = '';
    tp.forEach(function (t) { if (t.grupo !== g) { g = t.grupo; nav += '<div class="navlab">' + g + '</div>'; } var badge = t.id === 'hoje' ? LEITOS.filter(function (l) { return !l.livre && l.set !== 'EMG' && l.selo === 'PIORA CLÍNICA' && noFiltro(l); }).length : 0;
      var cm = cobTela(t.id);
      nav += '<button class="navbtn" data-ir="' + t.id + '"' + (t.id === st.tela ? ' aria-current="page"' : '') + '>' + tile(t) + t.nome + (badge ? '<span class="badge" title="pacientes com piora clínica">' + badge + '</span>' : cm && cm.situacao === 'ausente' ? '<span class="semd" title="' + esc(cm.detalhe) + '">sem dados</span>' : '') + '</button>'; });
    document.getElementById('nav').innerHTML = nav;
    var bt = BOTTOM.filter(function (id) { return tp.some(function (t) { return t.id === id; }); });
    var mais = tp.length > bt.length; if (mais) bt = bt.slice(0, 4);
    document.getElementById('bnav').style.gridTemplateColumns = 'repeat(' + (bt.length + (mais ? 1 : 0)) + ', minmax(0, 1fr))';
    document.getElementById('bnav').innerHTML = bt.map(function (id) { var t = T(id); return '<button data-ir="' + id + '"' + (id === st.tela ? ' aria-current="page"' : '') + '>' + tile(t) + t.nome.split(' ')[0] + '</button>'; }).join('') + (mais ? '<button data-mais="1"' + (bt.indexOf(st.tela) < 0 ? ' aria-current="page"' : '') + '>' + tile({ ic: 'mais', cor: ['#334155', '#7c8ca3'] }) + 'Mais</button>' : '');
    if (st.area !== 'ALL' && !AR(st.area)) st.area = 'ALL';
    document.getElementById('titulo').textContent = tela.nome + (tela.areas ? (st.area !== 'ALL' ? ' · ' + AR(st.area).nome : '') : st.setor !== 'ALL' && !tela.semSetor ? ' · ' + atual().curto : '');
    var per = document.getElementById('periodo'); per.hidden = !tela.per;
    per.innerHTML = [30, 60, 90, 120].map(function (p) { return '<button data-per="' + p + '" aria-pressed="' + (st.per === p) + '">' + p + ' d</button>'; }).join('');
    document.getElementById('b-tema').innerHTML = ic(escuro() ? 'sol' : 'lua');
    document.getElementById('b-perfil').innerHTML = ic('user') + '<span class="hide-m">' + PERFIS[st.perfil].nome + '</span>';
    var secEl = document.getElementById('setores'); secEl.hidden = !!tela.semSetor;
    var cards = (pS.length > 1 ? [HOSP] : []).concat(pS);
    secEl.innerHTML = cards.map(function (s) {
      var oc = s === EMGS ? last(EMG.ocupD) : last(s.ocupD), stt = s === HOSP ? (last(HOSP.p30) <= HOSP.meta ? 'ok' : 'crit') : s === EMGS ? (oc >= 100 ? 'crit' : oc >= 85 ? 'warn' : 'ok') : statusSetor(s);
      return '<button class="sec" data-setor="' + s.k + '" aria-pressed="' + (st.setor === s.k) + '" title="' + (s === HOSP ? 'Hospital todo' : s.nome) + '"><span class="st" style="background:var(--' + stt + ')"></span><b>' + (s === HOSP ? 'Hospital todo' : s.curto) + '</b><span class="m">' + (s === EMGS ? 'espera ' + br(last(EMG.esperaD)) + ' h' : br(last(s.p30), 1) + ' d') + ' · ' + br(oc) + '%</span><span class="mb"><i style="width:' + Math.min(100, oc) + '%;background:' + (oc >= 98 ? 'var(--crit)' : oc >= 90 ? 'var(--warn)' : 'var(--brand)') + '"></i></span></button>'; }).join('');

    if (tela.areas) { var EL = LEITOS.filter(function (l) { return l.set === 'EMG' && !l.livre; });
      secEl.innerHTML = [{ k: 'ALL', nome: 'Emergência toda', cap: EMGS.cap }].concat(AREAS).map(function (a) {
        var L = EL.filter(function (l) { return a.k === 'ALL' || l.area === a.k; }), pc = L.length / a.cap * 100, ag = L.filter(function (l) { return l.selo === 'AGUARDA LEITO'; }).length, c = pc >= 100 ? 'crit' : pc >= 85 ? 'warn' : 'ok';
        return '<button class="sec" data-area="' + a.k + '" aria-pressed="' + (st.area === a.k) + '" title="' + a.nome + '"><span class="st" style="background:var(--' + c + ')"></span><b>' + a.nome + '</b><span class="m">' + L.length + '/' + a.cap + ' · ' + ag + ' aguardam leito</span><span class="mb"><i style="width:' + Math.min(100, pc) + '%;background:var(--' + (c === 'ok' ? 'brand' : c) + ')"></i></span></button>'; }).join(''); }
    limpar(); POS = [];
    var cm = cobTela(st.tela);
    var html = cm && cm.situacao === 'ausente' ? cobAviso(tela, cm) : (cm && cm.situacao === 'parcial' ? cobNota(cm) : '') + V[st.tela]();
    document.getElementById('conteudo').innerHTML = instalarHTML() + (standalone || REAL ? '' : '<div class="demo">Protótipo · Hospital Modelo, pacientes e números fictícios</div>') + (tela.per ? perHTML('mper') : '') + '<div class="view">' + html + '</div>';
    POS.forEach(function (f) { try { f(); } catch (e) { if (window.console) console.error(e); } });
    var on = secEl.querySelector('[aria-pressed="true"]'); if (on && on.scrollIntoView && secEl.scrollWidth > secEl.clientWidth) { var r = on.getBoundingClientRect(), R = secEl.getBoundingClientRect(); if (r.left < R.left || r.right > R.right) secEl.scrollLeft += r.left - R.left - 16; }
    salvar();
  }
  function fecharMenus() { document.getElementById('menu').hidden = true; document.getElementById('b-perfil').setAttribute('aria-expanded', 'false'); }
  document.addEventListener('click', function (e) {
    var t;
    if (e.target.closest('#b-inst') && promptInst) { promptInst.prompt(); promptInst.userChoice.then(function () { promptInst = null; desenhar(); }); return; }
    if (e.target.closest('#b-inst-x')) { fechouInst = true; try { localStorage.setItem('celeris-inst-fechado', '1'); } catch (er) {} desenhar(); return; }
    if (e.target.closest('#b-perfil')) { var m = document.getElementById('menu'); m.hidden = !m.hidden; e.target.closest('#b-perfil').setAttribute('aria-expanded', String(!m.hidden));
      if (REAL) { m.innerHTML = '<div class="note" style="margin:4px 10px 6px;font-weight:700">' + esc(REAL.usuario.nome) + '</div>' + (REAL.usuario.perfil === 'ti' ? '<a href="/configurar" style="display:flex;padding:9px 10px;border-radius:9px;font-weight:600;color:inherit;text-decoration:none">' + ic('lock') + '&nbsp; Configurar</a>' : '') + '<a href="/sair" style="display:flex;padding:9px 10px;border-radius:9px;font-weight:600;color:inherit;text-decoration:none">' + ic('x') + '&nbsp; Sair</a>'; return; }
      m.innerHTML = '<div class="note" style="margin:4px 10px 6px;font-weight:700">Ver como</div>' + Object.keys(PERFIS).map(function (k) { return '<button role="menuitemradio" aria-checked="' + (st.perfil === k) + '" data-perfil="' + k + '">' + ic('user') + '<span>' + PERFIS[k].nome + '<small>' + PERFIS[k].desc + '</small></span></button>'; }).join(''); return; }
    if ((t = e.target.closest('[data-perfil]'))) { st.perfil = t.getAttribute('data-perfil'); st.setor = 'ALL'; st.selo = ''; st.quem = ''; reg('entrou no sistema'); fecharMenus(); desenhar(); window.scrollTo(0, 0); return; }
    if (!e.target.closest('.profile')) fecharMenus();
    if (e.target.closest('#b-tema')) { st.tema = escuro() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', st.tema); desenhar(); return; }
    if (e.target.closest('[data-mais]')) { var tp = telasPerfil().filter(function (x) { return BOTTOM.slice(0, 4).indexOf(x.id) < 0; }); over.innerHTML = '<div class="veil" data-fechar="1"></div><div class="morepanel">' + tp.map(function (x) { return '<button data-ir="' + x.id + '">' + tile(x) + x.nome + '</button>'; }).join('') + '</div>'; return; }
    if ((t = e.target.closest('[data-ir]'))) { over.innerHTML = ''; var sel = t.getAttribute('data-selo'), ds = t.getAttribute('data-set'); if (sel != null) st.selo = sel; if (ds) st.setor = ds; ir(t.getAttribute('data-ir')); return; }
    if ((t = e.target.closest('[data-area]'))) { st.area = t.getAttribute('data-area'); reg('filtrou a emergência: ' + (st.area === 'ALL' ? 'toda' : AR(st.area).nome)); desenhar(); return; }
    if ((t = e.target.closest('[data-esel]'))) { st.esel = t.getAttribute('data-esel'); desenhar(); return; }
    if ((t = e.target.closest('[data-setor]'))) { var k = t.getAttribute('data-setor'); st.setor = k; reg('filtrou ' + (k === 'ALL' ? 'o hospital todo' : S(k).nome)); desenhar(); return; }
    if ((t = e.target.closest('[data-agr]'))) { st.agr = t.getAttribute('data-agr'); desenhar(); return; }
    if ((t = e.target.closest('[data-per]'))) { st.per = +t.getAttribute('data-per'); desenhar(); return; }
    if ((t = e.target.closest('[data-selo]'))) { st.selo = t.getAttribute('data-selo'); desenhar(); return; }
    if ((t = e.target.closest('[data-quem]'))) { st.quem = t.getAttribute('data-quem'); desenhar(); return; }
    if ((t = e.target.closest('[data-leito]'))) { abrirLeito(t.getAttribute('data-leito')); return; }
    if (e.target.closest('[data-fechar]')) over.innerHTML = '';
  });
  document.addEventListener('change', function (e) {
    if (e.target.getAttribute && e.target.getAttribute('data-jornada')) { st.jornada = +e.target.value; reg('mudou a jornada para ' + st.jornada + ' h'); desenhar(); return; }
    var id = e.target.getAttribute && e.target.getAttribute('data-corrige'); if (!id) return;
    var l = LEITOS.filter(function (x) { return x.leito === id; })[0]; if (!l) return;
    l.selo = e.target.value; l.hist[2] = l.selo; if (REAL) { fetch('/api/correcao', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ leito: id, pront: l.pront, selo: l.selo }) }); LOG.unshift({ h: '', p: PERFIS[st.perfil].nome, a: 'corrigiu o selo de ' + id + ' para ' + l.selo }); } else reg('corrigiu o selo de ' + id + ' para ' + l.selo); desenhar(); abrirLeito(id);
  });
  document.addEventListener('input', function (e) {
    if (e.target.id !== 'busca') return;
    st.busca = e.target.value; var p = e.target.selectionStart;
    document.querySelector('.view').innerHTML = V.leitos();
    var i = document.getElementById('busca'); if (i) { i.focus(); try { i.setSelectionRange(p, p); } catch (er) {} }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { over.innerHTML = ''; fecharMenus(); } });
  if (window.matchMedia) { var mq = matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', function () { if (!st.tema) desenhar(); }); }
  if (REAL && 'serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
  else if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  desenhar();
})();
