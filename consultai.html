<style>
:root{--petrol:#2B5CE6;--petrol-dark:#2249B8;--ink:#23272E;--mint:#2B5CE6;--mint-dark:#2249B8;--bg:#FAFAF8;--soft:rgba(43,92,230,.12);--line:#E8E8E2;--muted:#5E646B;--green:#1D7A46;--green-bg:rgba(29,122,70,.12);--amber:#A3730A;--amber-bg:rgba(163,115,10,.12);--red:#C6453D;--red-bg:rgba(198,69,61,.12);--blue:#2B5CE6;--blue-bg:rgba(43,92,230,.12);--violet:#a78bfa;--violet-bg:rgba(167,139,250,.14);--wa:#25D366;--surface:#FFFFFF;--card:#FFFFFF;--panel2:#F1F1EC;--line-strong:#DDDDD5;--dim:#767C84;--teal:#0E8A63;--glow:rgba(43,92,230,.42);--disp:'Figtree',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
/* ===== Início (dashboard) ===== */
.ini{display:grid;gap:14px}
.ini-hero{background:linear-gradient(135deg,var(--petrol),var(--petrol-dark));color:#fff;border-radius:16px;padding:20px 22px;box-shadow:0 8px 24px rgba(37,99,235,.20)}
.ini-greet{font-size:22px;font-weight:700;letter-spacing:-.2px}
.ini-greet b{font-weight:800}
.ini-sub{opacity:.92;margin-top:4px;font-size:13.5px}
.ini-cfg-hint{background:var(--amber-bg);color:var(--amber);border:1px solid rgba(163,115,10,.28);border-radius:12px;padding:12px 14px;font-size:13.5px;display:flex;align-items:center;gap:10px;cursor:pointer}
.ini-cfg-hint i{font-size:18px;flex:none}
.ini-next{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;align-items:center;gap:16px;box-shadow:0 2px 10px rgba(15,23,42,.04)}
.ini-time{font-size:28px;font-weight:800;color:var(--petrol);line-height:1;min-width:70px;text-align:center}
.ini-time small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-top:5px}
.ini-time.late{color:var(--red)}
.ini-nx-info{flex:1;min-width:0}
.ini-nx-info .h{font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.ini-nx-nome{font-weight:700;font-size:16px;color:var(--ink);margin-top:2px}
.ini-nx-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center}
.ini-nx-obs{color:var(--muted);font-size:13px;margin-top:7px}
.ini-nx-act{display:flex;flex-direction:column;gap:8px;flex:none}
.ini-empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--muted)}
.ini-empty i{font-size:30px;color:var(--petrol);opacity:.55}
.ini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ini-stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 10px;text-align:center}
.ini-stat b{display:block;font-size:24px;font-weight:800;color:var(--ink);line-height:1}
.ini-stat span{display:block;font-size:11.5px;color:var(--muted);margin-top:5px}
.ini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ini-sc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink);transition:.15s;text-align:center}
.ini-sc:hover{border-color:var(--petrol);box-shadow:0 4px 14px rgba(37,99,235,.14);transform:translateY(-1px)}
.ini-sc i{font-size:22px;color:var(--petrol)}
.ini-today{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ini-today h3{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin:0;padding:13px 16px 9px}
.ini-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer}
.ini-row:hover{background:var(--soft)}
.ini-row .rt{font-weight:700;color:var(--petrol);min-width:44px;font-size:14px}
.ini-row.done .rt{color:var(--muted)}
.ini-row .rn{flex:1;min-width:0;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ini-block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 2px 10px rgba(15,23,42,.04)}
.ini-block-row{display:flex;align-items:center;justify-content:space-between}
.ini-h{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin:0 0 10px}
.ini-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(66px,1fr))}
.ini-sum-cell{text-align:center;padding:4px 6px;border-right:1px solid var(--line)}
.ini-sum-cell:last-child{border-right:none}
.ini-sum-cell b{display:block;font-size:26px;font-weight:800;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.ini-sum-cell span{display:block;font-size:11px;color:var(--muted);margin-top:6px;font-weight:600}
.ini-sum-foot{display:flex;gap:18px;flex-wrap:wrap;margin-top:13px;padding-top:11px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);font-weight:600}
.ini-sum-foot i{color:var(--green);margin-right:4px;vertical-align:-1px}
.ini-secure{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:12px;font-weight:600;padding:2px 10px}
.ini-secure i{color:var(--green);font-size:15px}
@media(max-width:640px){.ini-stats{grid-template-columns:repeat(2,1fr)}.ini-grid{grid-template-columns:repeat(2,1fr)}.ini-next{flex-wrap:wrap}.ini-nx-act{flex-direction:row;width:100%}.ini-nx-act .btn{flex:1;justify-content:center}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:-.011em;color:var(--ink);background-color:#FAFAF8;-webkit-tap-highlight-color:transparent}
input,select,textarea{background:var(--panel2);color:var(--ink)}
input:-webkit-autofill,input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 100px #FFFFFF inset;-webkit-text-fill-color:#23272E;caret-color:#23272E;transition:background-color 99999s}
header{background:rgba(255,255,255,.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--ink);border-bottom:1px solid var(--line);padding:14px 0;padding-top:calc(14px + env(safe-area-inset-top))}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.5px;font-family:var(--disp)}
.logo .mark{width:34px;height:34px;border-radius:10px;background:var(--petrol);display:grid;place-items:center;flex:0 0 auto;box-shadow:0 0 0 1px rgba(43,92,230,.4),0 2px 8px rgba(43,92,230,.28)}
.logo .mark svg{width:22px;height:22px}
.logo b{color:var(--petrol)}
.subtitle{color:var(--muted);font-size:12.5px;margin-top:3px}
.usr{display:flex;align-items:center;gap:10px}
.usr .who{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.3;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usr a,.usr button{color:var(--ink);text-decoration:none;font-size:13px;font-weight:600;background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;font-family:inherit}
.usr a:hover,.usr button:hover{background:var(--soft);border-color:var(--petrol);color:var(--petrol)}
main{max-width:1040px;margin:0 auto;padding:18px 18px 60px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:16px;width:fit-content;max-width:100%;overflow:auto}
.tabs button{border:none;background:none;padding:9px 18px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted);font-family:inherit;white-space:nowrap}
.tabs button.on{background:var(--petrol);color:#fff}
.subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted);font-family:inherit}
.subtabs button.on{background:var(--soft);color:var(--petrol);border-color:var(--mint)}
.lab-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.lab-add input{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;font-family:inherit;background:var(--panel2)}
.lab-add #lab_nome{flex:1;min-width:150px}.lab-add #lab_val,.lab-add #lab_un{width:84px}
.lab-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.lab-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.lab-h b{font-size:15px;color:var(--petrol)}
.lab-last{font-size:14px;font-weight:800;color:var(--ink)}
.lab-rows{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lab-pill{font-size:12px;background:var(--soft);border-radius:999px;padding:3px 9px;color:var(--ink)}
.lab-pill a{color:var(--red);cursor:pointer;font-weight:800;margin-left:3px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.bar .nav{display:flex;align-items:center;gap:9px}
.bar h2{font-size:17px;text-transform:capitalize;font-family:var(--disp)}
.bar .arr{background:var(--card);border:1px solid var(--line);border-radius:9px;width:38px;height:38px;font-size:18px;cursor:pointer;color:var(--petrol)}
.bar .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.todaybtn{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 13px;font-weight:700;font-size:13px;cursor:pointer;color:var(--petrol);font-family:inherit}
input.search,input.datep{padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:var(--panel2)}
.btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:10px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;text-decoration:none}
.btn-p{background:var(--petrol);color:#fff}.btn-p:hover{background:var(--petrol-dark)}
.btn-g{background:var(--card);color:var(--petrol);border:1px solid var(--line)}
.btn-wa{background:var(--wa);color:#fff}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:9px}
.btn-dn{background:var(--red-bg);color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.kpi .v{font-size:23px;font-weight:800;color:var(--petrol);margin-top:4px}
.kpi.green .v{color:var(--green)}.kpi.blue .v{color:var(--blue)}.kpi.amber .v{color:var(--amber)}
.daygrp{margin-bottom:8px}
.daygrp .dh{font-size:13px;font-weight:800;color:var(--petrol-dark);text-transform:capitalize;margin:14px 2px 8px}
.dh{font-size:13px;font-weight:800;color:var(--petrol-dark)}
.appt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 15px;margin-bottom:9px;display:flex;align-items:flex-start;gap:13px}
.appt .time{text-align:center;min-width:54px;padding-top:2px}
.appt .time .t{font-size:17px;font-weight:800;line-height:1;color:var(--petrol)}
.appt .time .dur{font-size:11px;color:var(--muted);margin-top:3px}
.appt .mid{flex:1;min-width:0}
.appt .mid .pac{font-weight:700;font-size:15px}
.appt .mid .pac a{color:var(--petrol);text-decoration:none;border-bottom:1px dashed var(--line)}
.appt .mid .det{color:var(--muted);font-size:13px;margin-top:3px}
.appt .mid .obs{font-size:12.5px;color:var(--ink);margin-top:4px;background:var(--soft);padding:4px 9px;border-radius:7px;display:inline-block}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;margin-right:6px;vertical-align:middle}
.t-con{background:var(--blue-bg);color:var(--blue)}.t-ret{background:var(--soft);color:var(--petrol)}.t-tel{background:var(--violet-bg);color:var(--violet)}.t-pro{background:var(--amber-bg);color:var(--amber)}.t-exa{background:var(--green-bg);color:var(--green)}
.stat{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;cursor:pointer;border:none;font-family:inherit}
.s-ag{background:var(--amber-bg);color:var(--amber)}.s-cf{background:var(--blue-bg);color:var(--blue)}.s-at{background:var(--green-bg);color:var(--green)}.s-fa{background:var(--red-bg);color:var(--red)}.s-ca{background:#E1E1DA;color:var(--muted);text-decoration:line-through}
.appt .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.appt .acts .ic{display:flex;gap:6px}
.appt .acts .ic button{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:40px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
.plist{display:flex;flex-direction:column;gap:9px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;display:flex;align-items:center;gap:13px;cursor:pointer}
.pcard:hover{border-color:var(--mint)}
.pcard .av{width:42px;height:42px;border-radius:50%;background:var(--soft);color:var(--petrol);display:grid;place-items:center;font-weight:800;font-size:16px;flex:0 0 auto}
.pcard .pmid{flex:1;min-width:0}
.pcard .pname{font-weight:700;font-size:15px}
.pcard .pmeta{color:var(--muted);font-size:12.5px;margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--petrol)}
.chip.warn{background:var(--red-bg);color:var(--red)}
.pcard .pgo{color:var(--muted);font-size:20px}
.phead{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.phead .ptop{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.phead .av{width:52px;height:52px;border-radius:50%;background:var(--petrol);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:0 0 auto}
.phead .pn{flex:1;min-width:0}
.phead .pn h2{font-size:20px;font-family:var(--disp)}
.phead .pn .sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.phead .pacts{display:flex;gap:8px;flex-wrap:wrap}
.pinfo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pinfo .ib{background:var(--soft);border-radius:11px;padding:10px 13px;font-size:13.5px}
.pinfo .ib .il{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);letter-spacing:.03em;margin-bottom:3px}
.pinfo .ib.alerta{background:var(--red-bg);color:var(--red)}
.pinfo .ib.alerta .il{color:var(--red)}
.rec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:9px}
.rec .rh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rec .rh .rt{font-weight:700;font-size:14.5px}
.rec .rh .rd{color:var(--muted);font-size:12.5px}
.rec .rbody{white-space:pre-wrap;font-size:14px;line-height:1.55;margin-top:8px;color:var(--ink)}
.rec .racts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.rec .racts button{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--petrol);font-family:inherit}
.note{background:var(--soft);border-radius:12px;padding:13px 16px;font-size:13px;color:var(--ink);margin-top:16px;line-height:1.6}
.note b{color:var(--petrol)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:18px;z-index:60}
.modal .box{background:var(--card);border-radius:16px;padding:24px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
.modal .box.wide{max-width:760px}
.modal h3{margin-bottom:16px}
.field{margin-bottom:13px}.field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:var(--panel2);color:var(--ink)}
.field textarea{resize:vertical;min-height:54px}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--mint)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.row{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.aiout{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:13px;font-size:14px;line-height:1.6;white-space:pre-wrap;min-height:90px;margin-top:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 8px}
.btn-mic{background:var(--card);color:var(--petrol);border:1px solid var(--line)}
.btn-mic.on{background:var(--red-bg);color:var(--red);border-color:rgba(198,69,61,.35)}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--red);font-size:12.5px;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--petrol-dark);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.wa-tpls{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 10px}
.wa-tpls button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--petrol)}
.wa-tpls button.on{background:var(--wa);color:#fff;border-color:var(--wa)}
.wa-preview{background:rgba(37,211,102,.10);border:1px solid rgba(37,211,102,.28);border-radius:12px;padding:13px 15px;font-size:13.5px;color:var(--ink);white-space:pre-wrap;line-height:1.5;margin:6px 0 14px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--petrol);font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;margin-bottom:10px;padding:4px 0}
footer{text-align:center;color:var(--muted);font-size:13px;padding:24px}
footer a{color:var(--petrol);font-weight:600;text-decoration:none}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function minutesOf(t){const[h,m]=(t||'0:0').split(':').map(Number);return h*60+m;}
function fmtEnd(t,dur){const tot=minutesOf(t)+Number(dur||0);const h=Math.floor(tot/60)%24,m=tot%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');}
function nowISO(){return new Date().toISOString();}
function fmtDate(iso){const d=new Date(iso);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
function fmtDT(iso){const d=new Date(iso);return fmtDate(iso)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function age(nasc){if(!nasc)return '';const b=new Date(nasc+'T00:00:00');if(isNaN(b))return '';const n=new Date();let a=n.getFullYear()-b.getFullYear();const m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))a--;return a;}
function initials(nm){return (nm||'?').trim().split(/\s+/).slice(0,2).map(s=>s[0]||'').join('').toUpperCase()||'?';}
function patientById(id){return state.patients.find(p=>p.id===id)||null;}
function pacNome(a){if(a.pacId){const p=patientById(a.pacId);if(p)return p.nome;}return a.pac||'Paciente';}
function pacFone(a){if(a.pacId){const p=patientById(a.pacId);if(p&&p.fone)return p.fone;}return a.fone||'';}

// Antes era fire-and-forget: a UI dizia "salvo" mesmo quando a nuvem falhava

function persist(){
  return Promise.resolve(MT.save(state)).catch(e=>{
    mtToast('Falha ao salvar na nuvem. Os dados estão salvos neste aparelho, mas ainda não subiram — verifique a conexão.');

}

/* migra histórico do EvoluAI (app aposentado) uma única vez */
async function migrateEvoluai(){
  if(state.migratedEvoluai)return;
  try{
    let docs=null;
    if(MT.mode==='demo'){try{docs=(JSON.parse(localStorage.getItem('mt_evoluai'))||{}).docs;}catch(e){}}
    else if(MT._fb&&MT._fb.F&&MT.user){const {db,F}=MT._fb;const snap=await F.getDoc(F.doc(db,'users',MT.user.uid,'apps','evoluai'));
      if(snap.exists()){const raw=snap.data();const dd=raw&&raw.json?JSON.parse(raw.json):null;docs=dd&&dd.docs;}}
    if(docs&&docs.length){state.docs=(state.docs||[]).concat(docs);}
    state.migratedEvoluai=true;persist();render();
  }catch(e){state.migratedEvoluai=true;}
}

function renderMonth(){

  const first=new Date(y,m,1);const startDow=first.getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const weeks=Math.ceil((startDow+daysInMonth)/7);
  const gridStart=new Date(y,m,1-startDow);
  const today=new Date();today.setHours(0,0,0,0);
  const total=state.appts.filter(a=>{const d=new Date(a.date+'T00:00:00');return d.getFullYear()===y&&d.getMonth()===m&&a.status!=='cancelado';}).length;
  let html=`<div class="bar">
    <div class="nav"><button class="arr" onclick="moveMonth(-1)">‹</button><h2>${MES[m]} de ${y}</h2><button class="arr" onclick="moveMonth(1)">›</button><button class="todaybtn" onclick="goToday()">Este mês</button></div>

  for(let i=0;i<weeks*7;i++){const d=new Date(gridStart);d.setDate(gridStart.getDate()+i);
    const inM=d.getMonth()===m;const ds=ymd(d);
    const n=state.appts.filter(a=>a.date===ds&&a.status!=='cancelado').length;
    const isToday=d.getTime()===today.getTime();
    html+=`<div class="mcell${inM?'':' off'}${isToday?' today':''}" onclick="goDay('${ds}')"><div class="mnum">${d.getDate()}</div>${n?`<div class="mcount">${n}</div>`:''}</div>`;
  }
  html+='</div></div><div class="hint" style="margin-top:8px">Toque em um dia para abrir a agenda daquele dia.</div>';
  document.getElementById('aview').innerHTML=html;
}

  const start=new Date(cur);start.setDate(start.getDate()-start.getDay());
  const end=new Date(start);end.setDate(end.getDate()+6);
  const days7=[];for(let i=0;i<7;i++){const d=new Date(start);d.setDate(d.getDate()+i);days7.push(d);}
  const weekAppts=state.appts.filter(a=>a.date>=ymd(start)&&a.date<=ymd(end));
  const total=weekAppts.filter(a=>a.status!=='cancelado').length;
  const showDays=days7.filter(d=>(ag.dias||[]).includes(d.getDay())||weekAppts.some(a=>a.date===ymd(d)));
  const daysToShow=showDays.length?showDays:days7;
  let rStart=minutesOf(ag.ini||'07:00'),rEnd=minutesOf(ag.fim||'19:00');
  weekAppts.forEach(a=>{const s=minutesOf(a.time),e=s+(+a.dur||slot);if(s<rStart)rStart=s;if(e>rEnd)rEnd=e;});
  rStart=Math.floor(rStart/slot)*slot;rEnd=Math.ceil(rEnd/slot)*slot;if(rEnd<=rStart)rEnd=rStart+slot;
  const nSlots=Math.round((rEnd-rStart)/slot),SP=28,colH=nSlots*SP;
  const fmtMin=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  const todayYmd=ymd(new Date());
  let html=`<div class="bar">
    <div class="nav"><button class="arr" onclick="moveWeek(-1)">‹</button><h2>${start.getDate()}/${start.getMonth()+1} – ${end.getDate()}/${end.getMonth()+1}</h2><button class="arr" onclick="moveWeek(1)">›</button><button class="todaybtn" onclick="goToday()">Esta semana</button></div>
    <div class="right"><span style="color:var(--muted);font-size:13px;font-weight:600">${total} consulta(s)</span><button class="btn btn-p btn-sm" onclick="openForm()">+ Consulta</button></div>
  </div>`;
  let timeLabels='';for(let i=0;i<=nSlots;i++)timeLabels+=`<div class="wkg-tl" style="top:${i*SP}px">${fmtMin(rStart+i*slot)}</div>`;
  let cols='';
  daysToShow.forEach(d=>{const dy=ymd(d),isToday=dy===todayYmd;
    let slots='';for(let i=0;i<nSlots;i++){const t=fmtMin(rStart+i*slot);slots+=`<div class="wkg-slot${i%2?' alt':''}" style="height:${SP}px" onclick="openSlot('${dy}','${t}')"></div>`;}
    let blocks='';apptsSorted(state.appts.filter(a=>a.date===dy)).forEach(a=>{
      const s=minutesOf(a.time),top=((s-rStart)/slot)*SP,h=Math.max(((+a.dur||slot)/slot)*SP-2,16);
      const c=WKC[a.type]||WKC.con,nm=(pacNome(a)||'').split(' ').slice(0,2).join(' ');
      blocks+=`<div class="wkg-appt${a.status==='cancelado'?' cae':''}" style="top:${top}px;height:${h}px;background:${c[0]};color:${c[1]}" onclick="openForm('${a.id}')" title="${esc(a.time+' · '+pacNome(a))}"><span class="wt">${a.time}</span><b>${esc(nm)}</b></div>`;});
    cols+=`<div class="wkg-day"><div class="wkg-head${isToday?' today':''}">${WDS[d.getDay()]}<small>${d.getDate()}/${d.getMonth()+1}</small></div><div class="wkg-col" style="height:${colH}px">${slots}${blocks}</div></div>`;});
  html+=`<div class="wkg-wrap"><div class="wkg"><div class="wkg-time"><div class="wkg-corner"></div><div class="wkg-time-body" style="height:${colH}px">${timeLabels}</div></div>${cols}</div></div>
   <div class="hint" style="margin-top:8px">Toque num horário livre para agendar, ou numa consulta para abrir. Defina seus horários em ⚙️ Configurações.</div>`;
  document.getElementById('aview').innerHTML=html;
}

function dm(s){const d=new Date((s&&String(s).length<=10?s+'T00:00:00':s));if(isNaN(d))return esc(String(s||''));return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');}
function fmtNum(n){return (Math.round(Number(n)*100)/100).toString().replace('.',',');}
function labChartSVG(series){
  const W=600,H=170,padL=8,padR=8,padT=20,padB=26,n=series.length;
  const ys=series.map(s=>s.valor);let lo=Math.min(...ys),hi=Math.max(...ys);
  if(lo===hi){lo=lo-1;hi=hi+1;}const p=(hi-lo)*0.18;lo-=p;hi+=p;const span=(hi-lo)||1;
  const plotW=W-padL-padR,plotH=H-padT-padB;
  const X=i=>padL+(n<=1?plotW/2:(i/(n-1))*plotW);
  const Y=v=>padT+(1-(v-lo)/span)*plotH;
  const line=series.map((s,i)=>X(i).toFixed(1)+','+Y(s.valor).toFixed(1)).join(' ');
  const step=Math.max(1,Math.ceil(n/6));let marks='';
  series.forEach((s,i)=>{const x=X(i).toFixed(1),y=Y(s.valor);
    marks+='<circle cx="'+x+'" cy="'+y.toFixed(1)+'" r="3.5" fill="#2B5CE6"/>';
    marks+='<text x="'+x+'" y="'+(y-7).toFixed(1)+'" font-size="10" text-anchor="middle" fill="#23272E">'+esc(fmtNum(s.valor))+'</text>';
    if(i%step===0||i===n-1)marks+='<text x="'+x+'" y="'+(H-8)+'" font-size="9" text-anchor="middle" fill="#767C84">'+esc(dm(s.date))+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:100%;height:auto;display:block" preserveAspectRatio="xMidYMid meet"><polyline points="'+line+'" fill="none" stroke="#2B5CE6" stroke-width="2"/>'+marks+'</svg>';
}

function encounterCtx(tipo){
  const p=patientById(curPac)||{};
  if(tipo==='retorno'){
    const prev=state.records.filter(r=>r.pacId===curPac).sort((a,b)=>b.date.localeCompare(a.date))[0];
    let c='CONTEXTO: esta é uma consulta de RETORNO. Resuma brevemente o caso já conhecido, FOQUE na evolução do intervalo (queixas novas, resposta ao tratamento, exames trazidos) e no DIRECIONAMENTO/ajuste de conduta — não repita a anamnese completa.';
    if(prev&&prev.texto)c+='\n\nEVOLUÇÃO ANTERIOR ('+fmtDate(prev.date)+'):\n'+prev.texto;
    return c+'\n\n';
  }
  if(tipo==='nova'){
    let c='CONTEXTO: esta é uma NOVA consulta de um paciente JÁ CONHECIDO. Faça a anamnese do problema atual de forma completa, mas APROVEITE os dados já conhecidos abaixo (não re-pergunte o que já está registrado; atualize apenas se houver mudança).';
    const base=[p.problemas?('Problemas/comorbidades: '+p.problemas):'',p.meds?('Medicações em uso: '+p.meds):'',p.alergias?('Alergias: '+p.alergias):''].filter(Boolean).join('\n');
    if(base)c+='\n\nDADOS JÁ CONHECIDOS:\n'+base;
    return c+'\n\n';
  }
  return 'CONTEXTO: esta é a PRIMEIRA consulta deste paciente. Faça uma ANAMNESE COMPLETA: identificação, queixa principal, história da doença atual, antecedentes pessoais e familiares, hábitos de vida, medicações em uso, alergias, exame físico, hipóteses diagnósticas e conduta.\n\n';

function rxSug(q){
  const box=document.getElementById('r_sug');if(!box)return;
  const nq=norm(q).trim();
  if(nq.length<2){box.style.display='none';box.innerHTML='';return;}
  const terms=nq.split(/\s+/);
  const res=MED_DB.map((m,idx)=>({m,idx,k:norm(m.n)})).filter(o=>terms.every(t=>o.k.includes(t))).slice(0,12);
  if(!res.length){box.innerHTML='<div class="rx-sug-empty">Nenhum medicamento. Use “adicionar manualmente”.</div>';box.style.display='block';return;}
  box.innerHTML=res.map(o=>`<div class="rx-sug-item" onmousedown="rxPick(${o.idx})"><b>${esc(o.m.n)}${o.m.c?' <span class="rx-tag">controlado</span>':''}</b><span>${esc(o.m.p)}</span></div>`).join('');
  box.style.display='block';
}
function rxPick(idx){const m=MED_DB[idx];if(!m)return;rxItens.push({nome:m.n,pos:m.p});
  const b=document.getElementById('r_busca');if(b)b.value='';
  const s=document.getElementById('r_sug');if(s){s.style.display='none';s.innerHTML='';}
  if(m.c){const sel=document.getElementById('r_tipo');if(sel&&sel.value==='simples')sel.value='especial';}
  renderRxItens();if(b)b.focus();
}

/* ===== voz: ditado curto e GRAVAÇÃO DA CONSULTA (áudios longos) ===== */
let rec=null,listening=false,micTarget=null,recMode=null,recSecs=0,recTimer=null,mediaRec=null,mediaChunks=[],mediaStream=null,consultaAbort=false;
function startRec(targetId,mode){
  micTarget=targetId;recMode=mode;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Seu navegador não suporta gravação/ditado por voz. Use o Google Chrome (no computador ou no celular).');return false;}
  rec=new SR();rec.lang='pt-BR';rec.continuous=true;rec.interimResults=true;
  rec.onresult=e=>{let fin='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)fin+=e.results[i][0].transcript;}
    if(fin){const ta=document.getElementById(micTarget);if(ta){ta.value=(ta.value?ta.value.replace(/\s*$/,'')+' ':'')+fin.trim();ta.scrollTop=ta.scrollHeight;}}};
  rec.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed')alert('Permita o acesso ao microfone.');};
  rec.onend=()=>{if(listening){try{rec.start();}catch(e){}}};  /* reinicia sozinho: sustenta gravações longas e pausas */
  try{rec.start();listening=true;}catch(e){alert('Não foi possível iniciar o microfone.');return false;}
  if(mode==='consulta'){recSecs=0;if(recTimer)clearInterval(recTimer);recTimer=setInterval(()=>{recSecs++;updateRecUI();},1000);}
  updateRecUI();return true;
}
function stopRec(){listening=false;if(rec){try{rec.stop();}catch(e){}}if(recTimer){clearInterval(recTimer);recTimer=null;}updateRecUI();}
function stopMic(){stopRec();}
function fmtSecs(s){const m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function updateRecUI(){
  const mic=document.getElementById('micBtn'),recb=document.getElementById('recBtn'),t=document.getElementById('liveTag');
  if(mic){const on=listening&&recMode==='dictate';mic.classList.toggle('on',on);mic.textContent=on?'⏹️ Parar ditado':'🎤 Ditar';}
  if(recb){const on=listening&&recMode==='consulta';recb.classList.toggle('on',on);recb.textContent=on?'⏹️ Parar e gerar evolução':'🔴 Gravar consulta';}
  if(t){if(listening&&recMode==='consulta')t.innerHTML='<span class="live"><span class="dot"></span>gravando '+fmtSecs(recSecs)+'</span>';else if(listening)t.innerHTML='<span class="live"><span class="dot"></span>ouvindo…</span>';else t.innerHTML='';}
}
function toggleMic(targetId){if(mediaRec&&mediaRec.state==='recording'){alert('Pare a gravação da consulta antes de ditar.');return;}if(listening&&recMode==='dictate'){stopRec();return;}if(listening)stopRec();startRec(targetId,'dictate');}
/* Gravar consulta = ÁUDIO REAL (MediaRecorder) → MT.aiAudio (servidor) → evolução */
function pickAudioMime(){const c=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus','audio/ogg'];for(const t of c){if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))return t;}return '';}
function stopStream(){if(mediaStream){mediaStream.getTracks().forEach(t=>{try{t.stop();}catch(e){}});mediaStream=null;}}
function blobToB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onloadend=()=>{const s=String(r.result||'');const i=s.indexOf(',');res(i>=0?s.slice(i+1):s);};r.onerror=rej;r.readAsDataURL(blob);});}
async function toggleConsulta(){
  if(mediaRec&&mediaRec.state==='recording'){if(recTimer){clearInterval(recTimer);recTimer=null;}listening=false;updateRecUI();try{mediaRec.stop();}catch(e){}return;}
  if(listening)stopRec();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){alert('Seu navegador não permite gravar áudio. Use o Google Chrome.');return;}
  if(MT.mode!=='cloud'||!MT.aiAudio){alert('Para gravar a consulta em áudio e gerar a evolução, entre na sua conta MedTech.');return;}
  try{mediaStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});}
  catch(e){alert('Permita o acesso ao microfone.');return;}
  const mime=pickAudioMime();mediaChunks=[];consultaAbort=false;
  try{mediaRec=new MediaRecorder(mediaStream, mime?{mimeType:mime,audioBitsPerSecond:24000}:{audioBitsPerSecond:24000});}
  catch(e){try{mediaRec=new MediaRecorder(mediaStream);}catch(e2){alert('Não foi possível iniciar a gravação.');stopStream();return;}}
  mediaRec.ondataavailable=e=>{if(e.data&&e.data.size)mediaChunks.push(e.data);};
  mediaRec.onstop=()=>{stopStream();processConsultaAudio();};
  mediaRec.start(1000);
  recMode='consulta';listening=true;recSecs=0;if(recTimer)clearInterval(recTimer);recTimer=setInterval(()=>{recSecs++;updateRecUI();},1000);
  updateRecUI();
}
async function processConsultaAudio(){
  if(consultaAbort){consultaAbort=false;return;}
  const blob=new Blob(mediaChunks,{type:(mediaChunks[0]&&mediaChunks[0].type)||'audio/webm'});
  const recb=document.getElementById('recBtn'),out=document.getElementById('e_out');
  if(!blob.size){updateRecUI();return;}
  if(recb){recb.disabled=true;recb.innerHTML='<span class="spin"></span> Transcrevendo e gerando…';}
  try{
    const b64=await blobToB64(blob);
    if(b64.length>9400000){alert('A gravação ficou muito longa para enviar de uma vez (~30–40 min é o limite por bloco). Grave em partes menores ou use 🎤 Ditar.');return;}
    const fmt=(document.getElementById('e_fmt')||{}).value||'soap';
    const atend=(document.getElementById('e_atend')||{}).value||'primeira';
    const prompt='Você recebeu o ÁUDIO de uma consulta médica (fala do médico e do paciente). Transcreva internamente e produza um documento clínico em português do Brasil, completo, organizado e objetivo, extraindo só o que é clinicamente relevante. REGRAS: não invente dados, exames, doses ou condutas que não foram ditos; padronize termos médicos; se algo essencial faltar, escreva "[não informado]". FORMATAÇÃO: escreva em texto limpo e profissional, SEM markdown — não use #, nem asteriscos (* ou **), nem negrito; escreva o nome de cada seção seguido de dois-pontos e, quando precisar listar, use um único hífen no início da linha.'+encounterCtx(atend)+(REC_FMT[fmt]||REC_FMT.evolucao).ai;
    const mt=(blob.type||'audio/webm').split(';')[0];
    const text=await MT.aiAudio(b64,mt,prompt);
    if(out)out.value=(text||'').trim();
  }catch(e){alert('⚠️ '+(e.message||'Falha ao processar o áudio.'));}
  finally{const rb=document.getElementById('recBtn');if(rb)rb.disabled=false;updateRecUI();}
}

function loadLogo(input){
  const f=input.files&&input.files[0];if(!f)return;
  if(f.size>5000000){alert('Arquivo muito grande. Escolha uma imagem menor.');input.value='';return;}
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      // Reduz o logo para caber com folga no doc de 1 MiB do Firestore.
      // Antes, um logo de ~800 KB virava ~1,07 MB em base64 e travava TODA a
      // sincronizacao (pacientes/evolucoes paravam de subir, sem erro visivel).
      const MAXW=240,MAXH=90;let w=img.width,h=img.height;
      const sc=Math.min(1,MAXW/w,MAXH/h);w=Math.round(w*sc)||1;h=Math.round(h*sc)||1;
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      let out;try{out=cv.toDataURL('image/png');if(out.length>90000)out=cv.toDataURL('image/jpeg',0.85);}catch(e){out=r.result;}
      const h2=document.getElementById('c_logo');if(h2)h2.value=out;
      const p=document.getElementById('logoPrev');if(p)p.innerHTML='<img src="'+out+'" style="max-height:56px;max-width:170px;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff"> <button class="btn btn-g btn-sm" onclick="clearLogo()">Remover</button>';
    };
    img.onerror=()=>{alert('Não consegui ler essa imagem. Tente PNG ou JPG.');input.value='';};
    img.src=r.result;
  };
  r.readAsDataURL(f);
}
function clearLogo(){const h=document.getElementById('c_logo');if(h)h.value='';const p=document.getElementById('logoPrev');if(p)p.innerHTML='';const f=document.getElementById('c_logofile');if(f)f.value='';}

function onlyDigits(s){return String(s||'').replace(/\D/g,'');}
function waNumber(fone){let d=onlyDigits(fone);if(!d)return '';if(d.length<=11&&!d.startsWith('55'))d='55'+d;return d;}

/* ===== Teleconsulta — sala de vídeo do médico (WebRTC P2P via _mttele.js) ===== */
let teleCall=null;
function teleLink(a){
  if(!a.teleRoom){const r=new Uint8Array(24);crypto.getRandomValues(r);a.teleRoom='t'+Array.from(r,x=>(x%36).toString(36)).join('');a.updatedAt=Date.now();persist();}
  return new URL('tele.html?r='+a.teleRoom,location.href).href;
}
function teleCopy(link,btn){
  const done=()=>{const o=btn.innerHTML;btn.innerHTML='<i class="ti ti-check"></i> Copiado';setTimeout(()=>btn.innerHTML=o,1600);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(link).then(done).catch(()=>{teleCopyFallback(link);done();});}
  else{teleCopyFallback(link);done();}
}
function teleCopyFallback(t){const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();}

    document.head.appendChild(st);
  }
  const w=document.createElement('div');w.id='teleWrap';
  w.innerHTML='<div class="tstage"><video class="trv" id="teleRv" autoplay playsinline></video><video class="tlv" id="teleLv" autoplay playsinline muted></video><div class="tst" id="teleSt"><span class="tdot"></span><span id="teleStTxt">Abrindo a sala…</span></div></div><div class="tbar"><button class="tlink" id="teleCopyBtn" title="Copiar o link do paciente"><i class="ti ti-link"></i> Copiar link do paciente</button><button class="trb" id="teleMic" title="Silenciar / ativar microfone"><i class="ti ti-microphone"></i></button><button class="trb" id="teleCam" title="Ligar / desligar câmera"><i class="ti ti-video"></i></button><button class="trb end" id="teleEnd" title="Encerrar a teleconsulta"><i class="ti ti-phone-off"></i></button></div>';
  document.body.appendChild(w);

  let pacNomeTele='';
  const setSt=k=>{stTxt.textContent=(k==='connected'&&pacNomeTele)?('Conectado — '+pacNomeTele):(MSG[k]||k);stBox.classList.toggle('ok',k==='connected');if(k==='ended')closeTele();};
  document.getElementById('teleCopyBtn').onclick=e=>teleCopy(link,e.currentTarget);
  document.getElementById('teleMic').onclick=e=>{if(!teleCall)return;const on=teleCall.toggleMic();e.currentTarget.classList.toggle('off',!on);e.currentTarget.innerHTML=on?'<i class="ti ti-microphone"></i>':'<i class="ti ti-microphone-off"></i>';};

function closeTele(){

  if(kind==='confirm')return `Olá, ${nome}! 👋\n\nConfirmando ${quem?('seu atendimento com '+quem):'sua consulta'}${onde}:\n\n📅 ${dia}\n🕒 ${a.time}h\n\nPodemos confirmar sua presença? Responda SIM para confirmar ou avise se precisar remarcar. 🙂${ass}`;
  if(kind==='lembrete')return `Olá, ${nome}! 😊\n\nLembrete da sua ${a.type==='tel'?'teleconsulta':'consulta'}${onde}:\n\n📅 ${dia}\n🕒 ${a.time}h\n\n${a.type==='tel'?('Acesse no horário pelo link:\n'+teleLink(a)+'\n\n'):'Chegue com alguns minutos de antecedência. '}Até lá! 👋${ass}`;
  if(kind==='remarcar')return `Olá, ${nome}!\n\nPreciso remarcar sua consulta que estava prevista para ${dia} às ${a.time}h. Quais dias e horários ficam melhores para você nesta semana?\n\nDesde já, obrigado pela compreensão. 🙏${ass}`;

/* ===== Atender (gravar consulta → IA), resumo IA e WhatsApp do prontuário ===== */
function atender(id){
  const a=state.appts.find(x=>x.id===id);if(!a)return;
  let pid=a.pacId;
  if(!pid){const nome=(a.pac||'').trim();
    if(!nome){alert('Esta consulta não tem paciente vinculado. Toque em ✏️ para vincular ou cadastrar o paciente.');return;}
    if(!confirm('Criar a ficha de "'+nome+'" para registrar a evolução desta consulta?'))return;
    const np={id:uid(),criadoEm:nowISO(),nome,nasc:'',sexo:'',cpf:'',fone:a.fone||'',email:'',convenio:'',endereco:'',alergias:'',problemas:'',meds:'',obs:''};
    state.patients.push(np);a.pacId=np.id;a.pac='';pid=np.id;persist();
  }
  attendApptId=id;openPac(pid);openEvol();
}
async function resumoPac(pid){
  const p=patientById(pid);if(!p)return;
  const recs=state.records.filter(r=>r.pacId===pid).sort((a,b)=>a.date.localeCompare(b.date));
  if(!recs.length){alert('Este paciente ainda não tem evoluções para resumir.');return;}
  if(MT.mode!=='cloud'||!MT.ai){alert('Entre na sua conta MedTech para usar a IA.');return;}
  modal(`<h3><i class="ti ti-sparkles"></i> Resumo do paciente — ${esc(p.nome)}</h3><div class="hint" style="margin-bottom:8px">Síntese das ${recs.length} evolução(ões) para leitura rápida antes da consulta. Revise — a IA não substitui o prontuário.</div><div id="rp_out" class="rbody" style="white-space:pre-wrap;min-height:130px;background:var(--soft);border-radius:10px;padding:12px"><span class="spin"></span> Gerando resumo…</div><div class="row"><button class="btn btn-p" id="rp_copy" style="display:none" onclick="navigator.clipboard&&navigator.clipboard.writeText(window.__rpTxt||'')"><i class="ti ti-copy"></i> Copiar</button><button class="btn btn-g" onclick="closeModal()">Fechar</button></div>`);
  const hist=recs.map(r=>fmtDate(r.date)+' ['+((REC_FMT[r.tipo]||REC_FMT.evolucao).l)+']: '+r.texto).join('\n\n');
  const ctx='Paciente: '+p.nome+(age(p.nasc)!==''?(', '+age(p.nasc)+' anos'):'')+'. '+(p.problemas?('Problemas: '+p.problemas+'. '):'')+(p.alergias?('Alergias: '+p.alergias+'. '):'')+(p.meds?('Medicações em uso: '+p.meds+'.'):'');
  const prompt='Você é um médico assistente. Com base no histórico de evoluções abaixo, escreva um RESUMO CLÍNICO do paciente para leitura rápida antes da consulta, em português do Brasil. Estruture em: Problemas ativos; Evolução recente; Medicações; Pendências/seguimento. Use bullets curtos e objetivos; NÃO invente dados que não estejam no histórico.\n\n'+ctx+'\n\nEvoluções (mais antigas → mais recentes):\n'+hist;
  try{const t=await MT.ai(prompt,'gemini-2.5-pro');window.__rpTxt=(t||'').trim();const o=document.getElementById('rp_out');if(o)o.textContent=window.__rpTxt||'Sem resposta.';const c=document.getElementById('rp_copy');if(c&&window.__rpTxt)c.style.display='';}
  catch(e){const o=document.getElementById('rp_out');if(o)o.textContent='⚠️ '+(e.message||'Falha na IA.');}
}
function waSign(){return state.cfg.medico?('\n\n— '+(state.cfg.clinica?state.cfg.clinica+' · ':'')+'Dr(a). '+state.cfg.medico):'';}
function waToPatient(pid,text){const p=patientById(pid);const num=waNumber(p&&p.fone);if(!p||!num){alert('Cadastre o telefone (WhatsApp) do paciente na ficha para enviar.');return;}window.open('https://wa.me/'+num+'?text='+encodeURIComponent(text),'_blank');}
function waPac(pid){const p=patientById(pid);if(!p)return;const nome=(p.nome||'').split(' ')[0];waToPatient(pid,'Olá, '+nome+'! 😊'+waSign());}
function waRx(id){const r=state.prescriptions.find(x=>x.id===id);if(!r)return;const p=patientById(r.pacId);const nome=(p&&p.nome||'').split(' ')[0];
  const txt='Olá, '+nome+'! 😊 Segue seu receituário:\n\n'+r.texto+(r.obs?('\n\nOrientações: '+r.obs):'')+waSign()+'\n\n(A via assinada impressa fica disponível no consultório quando necessária.)';
  waToPatient(r.pacId,txt);}
function waDocu(id){const d=state.documentos.find(x=>x.id===id);if(!d)return;const p=patientById(d.pacId);const nome=(p&&p.nome||'').split(' ')[0];
  const lbl=d.tipo==='atestado'?'seu atestado':'sua solicitação de exames';
  const txt='Olá, '+nome+'! 😊 Segue '+lbl+':\n\n'+d.texto+(d.obs?('\n\n'+d.obs):'')+waSign();
  waToPatient(d.pacId,txt);}

/* ===== modal ===== */
function modal(html){document.querySelectorAll('.modal').forEach(m=>m.remove());const d=document.createElement('div');d.className='modal';d.id='modal';d.innerHTML='<div class="box">'+html+'</div>';
  if(/<div class="box wide"/.test(html)){d.innerHTML=html;}
  d.onclick=e=>{if(e.target===d)closeModalMic();};document.body.appendChild(d);}
function closeModal(){const m=document.getElementById('modal');if(m)m.remove();}
function closeModalMic(){attendApptId=null;stopRec();if(mediaRec&&mediaRec.state==='recording'){consultaAbort=true;try{mediaRec.stop();}catch(e){}}stopStream();if(recTimer){clearInterval(recTimer);recTimer=null;}closeModal();}
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
