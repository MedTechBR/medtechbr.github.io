<!doctype html>
<html lang="pt-BR">
<head>

<style>
/* Layout: barra lateral de navegação + área de trabalho; no celular, abas embaixo. Dados 100% fictícios. */
:root {
  --bg: #f3f4f1; --panel: #ffffff; --ink: #17212b; --muted: #5d6874; --line: #dfe3de; --soft: #eef1ec;
  --brand: #0f6b5a; --brand-ink: #ffffff; --brand-soft: #dcefe9;
  --ok: #2e7d4a; --ok-soft: #e1f1e6; --warn: #a96a08; --warn-soft: #fbefd6; --crit: #b3261e; --crit-soft: #fbe3e0; --info: #1f4e8c; --info-soft: #e2eaf6;
  --f-display: 'Archivo', 'Segoe UI', Arial, sans-serif; --f-body: 'Source Sans 3', 'Segoe UI', Arial, sans-serif; --f-data: 'JetBrains Mono', Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1519; --panel: #172026; --ink: #e8ecea; --muted: #9aa7a3; --line: #2a363d; --soft: #1d282e;
  --brand: #3fb59a; --brand-ink: #06231c; --brand-soft: #173a33;
  --ok: #5cc27e; --ok-soft: #173426; --warn: #e2a33a; --warn-soft: #3a2c12; --crit: #f07067; --crit-soft: #3d1d1b; --info: #7fa7e6; --info-soft: #1b2a40; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1519; --panel: #172026; --ink: #e8ecea; --muted: #9aa7a3; --line: #2a363d; --soft: #1d282e;
  --brand: #3fb59a; --brand-ink: #06231c; --brand-soft: #173a33;
  --ok: #5cc27e; --ok-soft: #173426; --warn: #e2a33a; --warn-soft: #3a2c12; --crit: #f07067; --crit-soft: #3d1d1b; --info: #7fa7e6; --info-soft: #1b2a40; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--f-body); }
button, select, input { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 236px 1fr; min-height: 100%; }
nav.side { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 14px calc(20px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
.logo { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.logo svg { flex: none; }
.logo b { font: 800 22px var(--f-display); letter-spacing: -.02em; }
.logo small { display: block; font: 600 11px var(--f-body); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
nav.side button { display: flex; align-items: center; gap: 10px; text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: 10px; cursor: pointer; font-weight: 600; color: var(--muted); }
nav.side button:hover { background: var(--soft); color: var(--ink); }
nav.side button[aria-current="page"] { background: var(--brand-soft); color: var(--brand); }
nav.side button[hidden] { display: none; }
nav.side .sep { height: 1px; background: var(--line); margin: 10px 6px; }
nav.side .foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 8px; }
main { min-width: 0; padding-block: 18px 40px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin-bottom: 18px; }
.top h1 { font: 700 26px/1.15 var(--f-display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.top .meta { color: var(--muted); font-size: 14px; }
.top .grow { flex: 1; min-width: 0; }
.role { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 12px; }
.role label { font-size: 13px; color: var(--muted); font-weight: 600; }
.role select { border: 1px solid var(--line); background: var(--soft); border-radius: 8px; padding: 6px 8px; font-weight: 600; }
.demo { display: flex; gap: 10px; align-items: center; background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 14px; font-size: 14px; font-weight: 600; margin-bottom: 18px; }
.grid { display: grid; gap: 16px; }
.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.k3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.k2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; min-width: 0; }
.card h2 { font: 700 17px var(--f-display); margin: 0 0 12px; }
.card h2 small { font: 500 13px var(--f-body); color: var(--muted); margin-left: 6px; }
.kpi .lab { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.kpi .val { font: 700 38px/1.1 var(--f-display); margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 14px; color: var(--muted); }
.kpi.ok .val { color: var(--ok); } .kpi.crit .val { color: var(--crit); } .kpi.warn .val { color: var(--warn); } .kpi.info .val { color: var(--info); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.p-alta { background: var(--ok-soft); color: var(--ok); } .p-altase { background: var(--brand-soft); color: var(--brand); }
.p-piora { background: var(--crit-soft); color: var(--crit); } .p-exame { background: var(--info-soft); color: var(--info); }
.p-reg { background: var(--warn-soft); color: var(--warn); } .p-neutro { background: var(--soft); color: var(--muted); }
.setores { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.setor { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--panel); cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 8px; }
.setor:hover { border-color: var(--brand); }
.setor .nm { font: 700 16px var(--f-display); display: flex; justify-content: space-between; gap: 8px; }
.bar { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--brand); }
.bar.cheio i { background: var(--crit); } .bar.alto i { background: var(--warn); }
.mini { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mini b { color: var(--ink); }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
.scroll { overflow-x: auto; }
.tend-up { color: var(--crit); font-weight: 700; } .tend-down { color: var(--ok); font-weight: 700; } .tend-eq { color: var(--muted); font-weight: 700; }
.v-ok { color: var(--ok); font-weight: 700; } .v-bad { color: var(--crit); font-weight: 700; }
.filtros { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
.filtros select, .filtros input { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.leitos { display: grid; gap: 10px; }
.leito { display: grid; grid-template-columns: 112px 1fr auto; gap: 14px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; text-align: left; width: 100%; }
.leito:hover { border-color: var(--brand); }
.leito.s-piora { border-left-color: var(--crit); } .leito.s-alta { border-left-color: var(--ok); } .leito.s-altase { border-left-color: var(--brand); }
.leito.s-exame { border-left-color: var(--info); } .leito.s-reg { border-left-color: var(--warn); }
.leito .id { font: 700 15px var(--f-data); }
.leito .id small { display: block; font: 500 12.5px var(--f-body); color: var(--muted); }
.leito .tx { min-width: 0; }
.leito .tx p { margin: 2px 0; }
.leito .tx .ac { color: var(--muted); font-size: 14.5px; }
.leito .who { font-size: 12.5px; color: var(--muted); text-align: right; white-space: nowrap; }
.drawer { position: fixed; inset: 0 0 0 auto; width: min(460px, 100%); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -10px 0 40px rgba(0,0,0,.14); padding: calc(22px + env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) 22px 22px; overflow-y: auto; z-index: 20; }
.drawer h3 { font: 700 22px var(--f-display); margin: 0 0 4px; }
.drawer dl { display: grid; grid-template-columns: 120px 1fr; gap: 8px 12px; font-size: 15px; }
.drawer dt { color: var(--muted); font-weight: 600; }
.drawer dd { margin: 0; }
.x { float: right; border: 1px solid var(--line); background: var(--soft); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.veil { position: fixed; inset: 0; background: rgba(10,18,22,.35); z-index: 19; }
.hist { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.note { font-size: 13.5px; color: var(--muted); }
.lista li { margin: 6px 0; }
.lock { display: flex; gap: 12px; align-items: center; background: var(--info-soft); color: var(--info); border-radius: 12px; padding: 12px 16px; font-weight: 600; margin-bottom: 16px; }
.svgchart text { fill: var(--muted); font: 12px var(--f-body); }
.diagram { width: 100%; height: auto; }
.diagram text { fill: var(--ink); font: 600 13px var(--f-body); }
.diagram .t-muted { fill: var(--muted); font-weight: 500; font-size: 12px; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.tabbar { display: none; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  nav.side { display: none; }
  .k4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .k3, .k2 { grid-template-columns: 1fr; }
  main { padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); overflow-x: auto; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); gap: 4px; z-index: 10; }
  .tabbar button { flex: none; border: 0; background: none; padding: 8px 12px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; }
  .tabbar button[aria-current="page"] { background: var(--brand-soft); color: var(--brand); }
  .leito { grid-template-columns: 1fr; }
  .leito .who { text-align: left; }
  .kpi .val { font-size: 30px; }
}
@media (prefers-reduced-motion: no-preference) { .view { animation: in .2s ease-out; } @keyframes in { from { opacity: .6; transform: translateY(4px); } to { opacity: 1; transform: none; } } }
</style>
</head>

<div class="app">
  <nav class="side" aria-label="Seções">
    <div class="logo">

      <div><b>Destrava</b><small>Gestão de leitos</small></div>

<script>
(function () {
  /* ---------------- dados fictícios, gerados de forma determinística ---------------- */
  var seed = 20261016;
  function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  function pick(a) { return a[Math.floor(rnd() * a.length)]; }
  function rint(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }
  var SET = [
    { k: 'CM', nome: 'Clínica Médica', cap: 30, meta: 10, perm7: 11.8, perm30: 10.2, permMes: 10.6, mort: 0.048, giro: 2.9, livres: 0, fila: 6 },
    { k: 'CIR', nome: 'Cirúrgica', cap: 40, meta: 5, perm7: 3.4, perm30: 3.2, permMes: 3.3, mort: 0.004, giro: 10.1, livres: 2, fila: 9 },
    { k: 'ORT', nome: 'Ortopedia', cap: 28, meta: 5.5, perm7: 4.6, perm30: 5.2, permMes: 4.8, mort: 0, giro: 6.0, livres: 1, fila: 3 },
    { k: 'UCE', nome: 'Cuidados especiais', cap: 14, meta: 20, perm7: 22.5, perm30: 16.4, permMes: 17.9, mort: 0.42, giro: 1.8, livres: 0, fila: 4 },
    { k: 'UTI', nome: 'UTI adulto', cap: 30, meta: 10, perm7: 13.9, perm30: 10.6, permMes: 11.8, mort: 0.29, giro: 2.8, livres: 0, fila: 5 },
    { k: 'AVC', nome: 'Unidade AVC', cap: 20, meta: 9, perm7: 6.3, perm30: 5.9, permMes: 6.1, mort: 0, giro: 4.4, livres: 3, fila: 0 },
    { k: 'OBS', nome: 'Obstetrícia', cap: 30, meta: 5, perm7: 3.7, perm30: 3.6, permMes: 3.5, mort: 0, giro: 6.4, livres: 6, fila: 0 },
    { k: 'NEO', nome: 'Neonatologia', cap: 28, meta: 10, perm7: 6.1, perm30: 7.4, permMes: 7.2, mort: 0, giro: 2.5, livres: 12, fila: 0 }
  ];
  var SELOS = {
    'ALTA HOJE': { c: 'p-alta', s: 's-alta', ex: ['Alta decidida na evolução de hoje; receita e orientações prontas.', 'Alta após curativo de hoje; retorno ambulatorial em 7 dias.'] },
    'ALTA SE': { c: 'p-altase', s: 's-altase', ex: ['Alta se o laudo da TC de controle vier sem alteração (realizada ontem).', 'Alta se a última dose de antibiótico for hoje e seguir afebril.', 'Alta se o potássio de hoje estiver normal.', 'Alta se tolerar dieta oral até a tarde.'] },
    'PIORA CLÍNICA': { c: 'p-piora', s: 's-piora', ex: ['Febre nova e queda de saturação na noite; antibiótico ampliado.', 'Rebaixamento do nível de consciência desde a madrugada.', 'Hipotensão com início de noradrenalina.'] },
    'EM EXAME': { c: 'p-exame', s: 's-exame', ex: ['Ecocardiograma pedido há 3 dias, sem data marcada.', 'Ressonância de crânio realizada, aguarda laudo.', 'Endoscopia pedida, aguarda vaga.'] },
    'REGULAÇÃO': { c: 'p-reg', s: 's-reg', ex: ['Aguarda vaga de hemodiálise ambulatorial.', 'Transferência para hospital de origem pedida há 4 dias.', 'Aguarda leito de retaguarda na regulação estadual.'] },
    'CIRURGIA': { c: 'p-exame', s: 's-exame', ex: ['Aguarda cirurgia sem data no mapa cirúrgico.', 'Cirurgia marcada para amanhã; jejum a partir das 22h.'] },
    'VIGILÂNCIA': { c: 'p-neutro', s: '', ex: ['Ajuste de insulina em curso; glicemias ainda altas.', 'Controle de dor ainda com opioide endovenoso.'] },
    'ATB': { c: 'p-neutro', s: '', ex: ['Antibiótico endovenoso até o 10º dia (hoje D6).', 'Antibiótico com término a definir pela infectologia.'] }
  };
  var DEP = { 'ALTA HOJE': 'Equipe do setor', 'ALTA SE': 'Equipe do setor', 'PIORA CLÍNICA': 'Equipe do setor', 'EM EXAME': 'NAC / Imagem', 'REGULAÇÃO': 'NAC (terceiros)', 'CIRURGIA': 'Centro cirúrgico', 'VIGILÂNCIA': 'Equipe do setor', 'ATB': 'Equipe do setor' };
  var ACAO = { 'ALTA HOJE': 'Dar a alta pela manhã e liberar o leito até 11h.', 'ALTA SE': 'Checar a condição até 10h e dar a alta se cumprida.', 'PIORA CLÍNICA': 'Reavaliar hoje; considerar UTI se não responder.', 'EM EXAME': 'Cobrar a marcação ou o laudo; a alta depende disso.', 'REGULAÇÃO': 'Manter o pedido ativo e registrar a resposta.', 'CIRURGIA': 'Confirmar data no mapa e os exames pré-operatórios.', 'VIGILÂNCIA': 'Seguir o plano; sem pendência que segure o leito.', 'ATB': 'Programar a alta para o dia seguinte ao fim do antibiótico.' };
  var DX = ['Pneumonia comunitária', 'Pé diabético infectado', 'ICC descompensada', 'Fratura de fêmur', 'Colecistite aguda', 'AVC isquêmico', 'DPOC exacerbada', 'Pielonefrite', 'Pós-operatório de hernioplastia', 'Celulite de membro inferior', 'Cetoacidose diabética', 'Pancreatite aguda', 'Fratura de tíbia', 'Sepse de foco urinário', 'Insuficiência renal aguda', 'Gestação de 39 semanas', 'Recém-nascido com icterícia'];
  var PESOS = { CM: ['ALTA SE', 'ALTA SE', 'EM EXAME', 'EM EXAME', 'REGULAÇÃO', 'PIORA CLÍNICA', 'VIGILÂNCIA', 'ATB', 'ATB', 'ALTA HOJE'],
    CIR: ['ALTA SE', 'ALTA SE', 'ALTA HOJE', 'CIRURGIA', 'CIRURGIA', 'EM EXAME', 'VIGILÂNCIA', 'ATB'],
    ORT: ['CIRURGIA', 'CIRURGIA', 'ALTA SE', 'ALTA HOJE', 'EM EXAME', 'VIGILÂNCIA'],
    UCE: ['VIGILÂNCIA', 'REGULAÇÃO', 'ATB', 'PIORA CLÍNICA', 'ALTA SE'],
    UTI: ['VIGILÂNCIA', 'VIGILÂNCIA', 'PIORA CLÍNICA', 'ALTA SE', 'ATB', 'EM EXAME'],
    AVC: ['EM EXAME', 'ALTA SE', 'ALTA SE', 'VIGILÂNCIA', 'ALTA HOJE'],
    OBS: ['ALTA SE', 'ALTA HOJE', 'ALTA HOJE', 'VIGILÂNCIA'],
    NEO: ['VIGILÂNCIA', 'ALTA SE', 'ALTA SE', 'ATB'] };
  var LEITOS = [];
  SET.forEach(function (s) {
    var ocup = s.cap - s.livres;
    for (var i = 1; i <= ocup; i++) {
      var selo = pick(PESOS[s.k]);
      LEITOS.push({ set: s.k, leito: s.k + ' ' + String(100 + i), pront: String(rint(410000, 489999)), selo: selo, dx: pick(DX), pend: pick(SELOS[selo].ex), acao: ACAO[selo], dep: DEP[selo], dias: rint(1, s.k === 'UCE' ? 40 : s.k === 'UTI' ? 18 : 12), hist: [pick(PESOS[s.k]), pick(PESOS[s.k]), selo] });
    }
  });
  function conta(f) { return LEITOS.filter(f).length; }
  var DIAS = []; for (var d = 59; d >= 0; d--) DIAS.push(d);
  function serie(base, amp, n) { var out = [], v = base; for (var i = 0; i < n; i++) { v += (rnd() - .5) * amp; v = Math.max(base * .7, Math.min(base * 1.3, v)); out.push(+v.toFixed(2)); } return out; }

  /* ---------------- perfis e acesso ---------------- */
  var PERFIS = {
    direcao: { nome: 'Direção', telas: ['hoje', 'leitos', 'eficiencia', 'emergencia', 'cirurgia', 'desempenho', 'acessos'], setores: null },
    coord: { nome: 'Coordenação · Clínica Médica', telas: ['hoje', 'leitos', 'eficiencia'], setores: ['CM'] },
    nac: { nome: 'NAC (regulação e exames)', telas: ['leitos', 'emergencia'], setores: null, selos: ['EM EXAME', 'REGULAÇÃO', 'CIRURGIA'] },
    medico: { nome: 'Médico de referência', telas: ['hoje', 'leitos', 'eficiencia', 'emergencia', 'cirurgia', 'desempenho'], setores: null },
    ti: { nome: 'TI do hospital', telas: ['acessos'], setores: null }
  };
  var TELAS = { hoje: 'Hoje', leitos: 'Leito a leito', eficiencia: 'Eficiência', emergencia: 'Emergência', cirurgia: 'Centro cirúrgico', desempenho: 'Desempenho', acessos: 'Acessos' };
  var st = { perfil: 'direcao', tela: 'hoje', fSet: '', fSelo: '', fDep: '', busca: '' };
  try { var mem = JSON.parse(localStorage.getItem('destrava-demo') || '{}'); if (mem.perfil && PERFIS[mem.perfil]) st.perfil = mem.perfil; if (mem.tela) st.tela = mem.tela; } catch (e) {}
  function salvar() { try { localStorage.setItem('destrava-demo', JSON.stringify({ perfil: st.perfil, tela: st.tela })); } catch (e) {} }

      '<line x1="290" y1="106" x2="110" y2="150" stroke="var(--line)" stroke-width="2"/><line x1="310" y1="106" x2="310" y2="150" stroke="var(--line)" stroke-width="2"/>' +
      '<rect x="24" y="250" width="366" height="52" rx="10" fill="var(--panel)" stroke="var(--line)"/><text x="38" y="272">VPN do hospital</text><text x="38" y="290" class="t-muted">celular, plantão de casa, suporte (registrado)</text>' +
      '<rect x="424" y="48" width="90" height="58" rx="10" fill="var(--info-soft)" stroke="var(--info)"/><text x="436" y="72">IA</text><text x="436" y="92" class="t-muted">sem nomes</text>' +
      '<line x1="390" y1="77" x2="424" y2="77" stroke="var(--info)" stroke-width="2" stroke-dasharray="5 4"/>' +
      '<rect x="424" y="250" width="90" height="52" rx="10" fill="var(--panel)" stroke="var(--line)"/><text x="436" y="272">Fora</text><text x="436" y="290" class="t-muted">celular</text>' +
      '<line x1="424" y1="276" x2="390" y2="276" stroke="var(--line)" stroke-width="2"/></svg>';
  }

  /* ---------------- montagem ---------------- */
  var main = document.getElementById('main'), over = document.getElementById('over');
  function desenhar() {
    var p = PERFIS[st.perfil];
    if (p.telas.indexOf(st.tela) < 0) st.tela = p.telas[0];
    var navH = p.telas.map(function (t) { return '<button data-tela="' + t + '"' + (st.tela === t ? ' aria-current="page"' : '') + '>' + TELAS[t] + '</button>'; }).join('');
    document.getElementById('nav').innerHTML = navH;
    document.getElementById('tabbar').innerHTML = navH;
    var opts = Object.keys(PERFIS).map(function (k) { return '<option value="' + k + '"' + (st.perfil === k ? ' selected' : '') + '>' + PERFIS[k].nome + '</option>'; }).join('');
    main.innerHTML = '<div class="demo">Protótipo de demonstração · hospital, pacientes e números fictícios</div>' +
      '<div class="top"><div class="grow"><h1>' + TELAS[st.tela] + '</h1><div class="meta">Hospital Modelo · atualizado às 06:42 pela rodada da madrugada</div></div>' +
      '<div class="role"><label for="perfil">Ver como</label><select id="perfil">' + opts + '</select></div></div>' +
      '<div class="view">' + V[st.tela]() + '</div>';
    salvar();
  }
  function abrir(pront) {
    var l = LEITOS.filter(function (x) { return x.pront === pront; })[0]; if (!l) return;
    registrar('abriu o leito ' + l.leito);
    over.innerHTML = '<div class="veil" data-fechar="1"></div><aside class="drawer" role="dialog" aria-label="Leito ' + l.leito + '"><button class="x" data-fechar="1">Fechar</button><h3>' + l.leito + '</h3><p class="note">' + setNome(l.set) + ' · prontuário ' + l.pront + ' · ' + l.dias + ' dias no setor</p>' +
      '<p>' + pill(l.selo) + '</p><dl><dt>Diagnóstico</dt><dd>' + esc(l.dx) + '</dd><dt>O que segura</dt><dd>' + esc(l.pend) + '</dd><dt>Ação</dt><dd>' + esc(l.acao) + '</dd><dt>Quem age</dt><dd>' + esc(l.dep) + '</dd></dl>' +
      '<p class="note" style="margin-top:18px">Últimos 3 dias</p><div class="hist">' + l.hist.map(pill).join('<span class="note">→</span>') + '</div>' +
      (st.perfil === 'medico' ? '<p class="note" style="margin-top:18px">Como médico de referência você pode corrigir o selo; a correção vale para a próxima rodada e vira aprendizado.</p>' : '') + '</aside>';
    var x = over.querySelector('.x'); if (x) x.focus();
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tela]'); if (t) { st.tela = t.getAttribute('data-tela'); registrar('abriu ' + TELAS[st.tela]); desenhar(); window.scrollTo(0, 0); return; }
    var s = e.target.closest('[data-set]'); if (s) { if (PERFIS[st.perfil].telas.indexOf('leitos') >= 0) { st.fSet = s.getAttribute('data-set'); st.fSelo = ''; st.tela = 'leitos'; registrar('abriu Leito a leito (' + setNome(st.fSet) + ')'); desenhar(); } return; }
    var c = e.target.closest('[data-selo]'); if (c) { st.fSelo = c.getAttribute('data-selo'); desenhar(); return; }
    var p = e.target.closest('[data-p]'); if (p) { abrir(p.getAttribute('data-p')); return; }
    if (e.target.closest('[data-fechar]')) { over.innerHTML = ''; }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'perfil') { st.perfil = e.target.value; st.fSet = ''; st.fSelo = ''; st.fDep = ''; registrar('entrou no sistema'); desenhar(); }
    if (e.target.id === 'f-set') { st.fSet = e.target.value; desenhar(); }
    if (e.target.id === 'f-dep') { st.fDep = e.target.value; desenhar(); }
  });
  document.addEventListener('input', function (e) { if (e.target.id === 'f-busca') { st.busca = e.target.value; var pos = e.target.selectionStart; desenhar(); var i = document.getElementById('f-busca'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (er) {} } } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') over.innerHTML = ''; });
  desenhar();
})();
</script>
</body>
</html>
