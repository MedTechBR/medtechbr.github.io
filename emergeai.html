/* ====== ECG (desenho original em SVG) ====== */
function ecgPath(type){
  const W=600,mid=58;let d='M0 '+mid;
  if(type==='fv'){let s=42;const r=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};for(let x=0;x<=W;x+=6){const y=mid+(r()-0.5)*64*(0.55+0.45*Math.sin(x/28));d+=' L'+x+' '+y.toFixed(0);}}
  else if(type==='vt'){for(let x=0;x<=W;x+=2){const y=mid-34*Math.sin(x/20);d+=' L'+x+' '+y.toFixed(0);}}
  else if(type==='asystole'){for(let x=0;x<=W;x+=24){const y=mid+Math.sin(x/45)*2;d+=' L'+x+' '+y.toFixed(0);}}
  else if(type==='organized'){let x=0;const beat=118;while(x<W){d+=' L'+(x+18)+' '+mid;d+=' Q'+(x+28)+' '+(mid-9)+' '+(x+38)+' '+mid;d+=' L'+(x+48)+' '+mid;d+=' L'+(x+52)+' '+(mid+7)+' L'+(x+58)+' '+(mid-42)+' L'+(x+64)+' '+(mid+13)+' L'+(x+70)+' '+mid;d+=' L'+(x+86)+' '+mid+' Q'+(x+98)+' '+(mid-15)+' '+(x+110)+' '+mid;x+=beat;}}
  return d;
}
function ecgSVG(type){let g='';for(let x=0;x<=600;x+=25)g+=`<line x1="${x}" y1="0" x2="${x}" y2="116" stroke="#0e3a45"/>`;for(let y=0;y<=116;y+=19)g+=`<line x1="0" y1="${y}" x2="600" y2="${y}" stroke="#0e3a45"/>`;return `<svg viewBox="0 0 600 116" preserveAspectRatio="none"><rect width="600" height="116" fill="#08222b"/>${g}<path d="${ecgPath(type)}" fill="none" stroke="#2DD4A8" stroke-width="2"/></svg>`;}

/* ====== Render ====== */
let current=P[0].id, cycleCount=0;
document.getElementById('count').textContent='· '+P.length+' protocolos';
function renderMenu(filter=''){
  const m=document.getElementById('menu');m.innerHTML='';let lastCat='';
  P.filter(p=>(p.name+p.desc+p.cat).toLowerCase().includes(filter.toLowerCase())).forEach(p=>{
    if(p.cat!==lastCat){const d=document.createElement('div');d.className='cat';d.textContent=p.cat;m.appendChild(d);lastCat=p.cat;}
    const b=document.createElement('button');b.textContent=p.name;b.className=(p.id===current?'active':'');b.onclick=()=>{current=p.id;renderMenu(filter);renderPanel();window.scrollTo({top:0,behavior:'smooth'});};m.appendChild(b);
  });
}
function filterList(){renderMenu(document.getElementById('search').value)}
function renderPanel(){
  stopTimer();cycleCount=0;
  const p=P.find(x=>x.id===current);const el=document.getElementById('panel');
  let h=`<h1>${p.name}</h1><div class="desc">${p.desc}</div>`;
  if(p.ecg){h+=`<div class="ecgwrap">${p.ecg.map(e=>`<div class="ecg">${ecgSVG(e.type)}<div class="cap">${e.cap}</div></div>`).join('')}</div>`;}
  if(p.timer)h+=timerHTML();
  if(p.cycleChecks)h+=`<div class="sec"><h3><span class="n">✓</span> Checklist por ciclo</h3><div class="cycles" id="cycles"></div><button class="addcyc" id="addCyc">+ Adicionar ciclo</button></div>`;
  if(p.warn)h+=`<div class="warn">⚠️ ${p.warn}</div>`;
  p.sections.forEach((s,i)=>{h+=`<div class="sec"><h3><span class="n">${i+1}</span> ${s.t}</h3><ul>${s.items.map(it=>`<li><span>${it}</span></li>`).join('')}</ul></div>`;});
  if(p.drugs&&p.drugs.length){h+=`<div class="drugs"><h3>💊 Doses de referência</h3>${p.drugs.map(d=>`<div class="drug"><span>${d[0]}</span><span class="d">${d[1]}</span></div>`).join('')}</div>`;}
  h+=`<div class="disclaimer">⚠️ Consulta rápida — não substitui as diretrizes vigentes nem o protocolo da sua instituição. <b>Confirme todas as doses</b> antes de administrar. A responsabilidade pela conduta é do profissional.</div>`;
  el.innerHTML=h;
  if(p.timer)bindTimer();
  if(p.cycleChecks){document.getElementById('addCyc').onclick=()=>addCycle(cycleCount+1);addCycle(1);}
}
function addCycle(n){const c=document.getElementById('cycles');if(!c)return;const p=P.find(x=>x.id===current);if(!p.cycleChecks||n<=cycleCount)return;cycleCount=n;
  Array.from(c.children).forEach(ch=>ch.classList.remove('cur'));
  const div=document.createElement('div');div.className='cycrow cur';
  div.innerHTML='<div class="h">Ciclo '+n+'</div>'+p.cycleChecks.map(l=>`<label class="ck"><input type="checkbox"> ${l}</label>`).join('');
  c.appendChild(div);}
/* ====== Cronômetro de RCP ====== */
let tInt=null,tSec=0,tRun=false;
function timerHTML(){return `<div class="timer"><div class="clock" id="clk">00:00</div><div class="cyc" id="cyc">Ciclo 1 · reavalie em 2:00</div><div><button class="b1" id="tStart">Iniciar</button><button class="b2" id="tReset">Zerar</button></div><div class="hint">A cada ciclo de 2 min: reavalie o ritmo, troque quem comprime e considere adrenalina. Um novo ciclo é marcado automaticamente no checklist.</div></div>`}
function fmtT(s){const m=Math.floor(s/60),x=s%60;return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
function tick(){tSec++;const clk=document.getElementById('clk');if(!clk){stopTimer();return;}clk.textContent=fmtT(tSec);const cyc=Math.floor(tSec/120)+1;const rem=120-(tSec%120);const c=document.getElementById('cyc');if(c)c.textContent='Ciclo '+cyc+' · reavalie em '+fmtT(rem);if(cyc>cycleCount){addCycle(cyc);}if(tSec%120===0){try{beep();}catch(e){}if(c)c.textContent='⏱️ 2 min! Reavalie o ritmo · troque o compressor · adrenalina?';}}
function bindTimer(){const s=document.getElementById('tStart');const r=document.getElementById('tReset');if(s)s.onclick=()=>{if(tRun){clearInterval(tInt);tRun=false;s.textContent='Continuar';}else{tInt=setInterval(tick,1000);tRun=true;s.textContent='Pausar';}};if(r)r.onclick=()=>{tSec=0;const clk=document.getElementById('clk');if(clk)clk.textContent='00:00';const c=document.getElementById('cyc');if(c)c.textContent='Ciclo 1 · reavalie em 2:00';};}
function stopTimer(){if(tInt)clearInterval(tInt);tInt=null;tSec=0;tRun=false;}
function beep(){const ctx=new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;o.start();g.gain.setValueAtTime(0.2,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.6);o.stop(ctx.currentTime+0.6);}
renderMenu();renderPanel();
</script>
