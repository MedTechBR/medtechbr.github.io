<style>
:root{--petrol:#0E5A6D;--petrol-dark:#083845;--ink:#0E2A31;--mint:#2DD4A8;--mint-dark:#14b894;--red:#c0392b;--red-bg:#fde8e8;--amber:#c97a17;--amber-bg:#fdf0e0;--bg:#F6FAFB;--soft:#EAF3F4;--line:#dbe8ea;--muted:#5B7882}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{background:linear-gradient(135deg,var(--petrol),var(--petrol-dark));color:#fff;padding:16px 0;position:sticky;top:0;z-index:20}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.5px}
.logo .mark{width:34px;height:34px;border-radius:10px;background:#2DD4A8;display:grid;place-items:center;flex:0 0 auto}
.logo .mark svg{width:22px;height:22px}
.logo b{color:var(--mint)}
.top a{color:#cfe3e6;text-decoration:none;font-size:14px;font-weight:600}
.subtitle{color:#bcd6db;font-size:12.5px;margin-top:3px}
.layout{display:grid;grid-template-columns:280px 1fr;gap:22px;padding:22px 0;align-items:start}
.list{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;position:sticky;top:84px;max-height:calc(100vh - 104px);overflow:auto}
.list .search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:14px}
.list button{display:block;width:100%;text-align:left;background:none;border:none;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14.5px;color:var(--ink);font-weight:600;line-height:1.3}
.list button:hover{background:var(--soft)}
.list button.active{background:var(--petrol);color:#fff}
.list .cat{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 12px 4px;font-weight:800}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;min-height:420px}
.panel h1{font-size:24px;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.tagp{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.tp-red{background:var(--red-bg);color:var(--red)}.tp-amber{background:var(--amber-bg);color:var(--amber)}.tp-blue{background:#e6f0f3;color:var(--petrol)}
.panel .desc{color:var(--muted);font-size:14px;margin:6px 0 18px}
.sec{border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin-bottom:14px}
.sec h3{font-size:15px;margin-bottom:10px;color:var(--petrol-dark);display:flex;align-items:center;gap:8px}
.sec h3 .n{width:24px;height:24px;border-radius:7px;background:var(--petrol);color:#fff;display:grid;place-items:center;font-size:13px;flex:0 0 auto}
.sec ul{list-style:none;display:grid;gap:8px}
.sec li{display:flex;gap:10px;font-size:14.5px;line-height:1.45}
.sec li::before{content:"›";color:var(--mint-dark);font-weight:800;flex:0 0 auto}
.sec li b{color:var(--ink)}
.drugs{background:var(--soft);border-radius:13px;padding:14px 18px;margin-bottom:14px}
.drugs h3{font-size:14px;margin-bottom:10px;color:var(--petrol-dark)}
.drug{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.drug:last-child{border-bottom:none}
.drug .d{font-weight:700;color:var(--petrol);text-align:right}
.warn{background:var(--red-bg);border:1px solid #f3c2c2;color:#8a2020;border-radius:12px;padding:12px 16px;font-size:13.5px;margin-bottom:14px}
.timer{background:var(--petrol-dark);color:#fff;border-radius:14px;padding:18px;margin-bottom:16px;text-align:center}
.timer .clock{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px}
.timer .cyc{color:var(--mint);font-weight:700;margin:2px 0 12px}
.timer button{border:none;border-radius:9px;padding:9px 18px;font-weight:700;font-size:14px;cursor:pointer;margin:0 4px}
.timer .b1{background:var(--mint);color:var(--petrol-dark)}.timer .b2{background:rgba(255,255,255,.15);color:#fff}
.timer .hint{color:#bcd6db;font-size:12.5px;margin-top:10px}
.disclaimer{background:#fff8ed;border:1px solid #f4d9a8;color:#8a5a16;border-radius:12px;padding:13px 16px;font-size:13px;margin-top:16px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:24px}
footer a{color:var(--petrol);font-weight:600;text-decoration:none}
@media(max-width:860px){.layout{grid-template-columns:1fr}.list{position:static;max-height:none}}

let current=P[0].id;
function renderMenu(filter=''){
  const m=document.getElementById('menu');m.innerHTML='';let lastCat='';
  P.filter(p=>(p.name+p.desc+p.cat).toLowerCase().includes(filter.toLowerCase())).forEach(p=>{
    if(p.cat!==lastCat){const d=document.createElement('div');d.className='cat';d.textContent=p.cat;m.appendChild(d);lastCat=p.cat;}
    const b=document.createElement('button');b.textContent=p.name;b.className=(p.id===current?'active':'');b.onclick=()=>{current=p.id;renderMenu(filter);renderPanel();window.scrollTo({top:0,behavior:'smooth'});};m.appendChild(b);
  });
}
function filterList(){renderMenu(document.getElementById('search').value)}
function renderPanel(){
  stopTimer();
  const p=P.find(x=>x.id===current);const el=document.getElementById('panel');
  let h=`<h1>${p.name}</h1><div class="desc">${p.desc}</div>`;
  if(p.timer)h+=timerHTML();
  if(p.warn)h+=`<div class="warn">⚠️ ${p.warn}</div>`;
  p.sections.forEach((s,i)=>{
    h+=`<div class="sec"><h3><span class="n">${i+1}</span> ${s.t}</h3><ul>${s.items.map(it=>`<li><span>${it}</span></li>`).join('')}</ul></div>`;
  });
  if(p.drugs&&p.drugs.length){h+=`<div class="drugs"><h3>💊 Doses de referência</h3>${p.drugs.map(d=>`<div class="drug"><span>${d[0]}</span><span class="d">${d[1]}</span></div>`).join('')}</div>`;}
  h+=`<div class="disclaimer">⚠️ Consulta rápida — não substitui as diretrizes vigentes nem o protocolo da sua instituição. <b>Confirme todas as doses</b> antes de administrar. A responsabilidade pela conduta é do profissional.</div>`;
  el.innerHTML=h;
  if(p.timer)bindTimer();
}
/* ---- Cronômetro de RCP ---- */
let tInt=null,tSec=0,tRun=false;
function timerHTML(){return `<div class="timer"><div class="clock" id="clk">00:00</div><div class="cyc" id="cyc">Ciclo 1 · reavalie em 2:00</div><div><button class="b1" id="tStart">Iniciar</button><button class="b2" id="tReset">Zerar</button></div><div class="hint">A cada ciclo de 2 min: reavalie o ritmo, troque quem comprime e considere adrenalina.</div></div>`}
function fmtT(s){const m=Math.floor(s/60),x=s%60;return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
function tick(){tSec++;const clk=document.getElementById('clk');if(!clk){stopTimer();return;}clk.textContent=fmtT(tSec);const cyc=Math.floor(tSec/120)+1;const rem=120-(tSec%120);document.getElementById('cyc').textContent='Ciclo '+cyc+' · reavalie em '+fmtT(rem);if(tSec%120===0){try{beep();}catch(e){}document.getElementById('cyc').textContent='⏱️ 2 min! Reavalie o ritmo · troque o compressor · adrenalina?';}}
function bindTimer(){const s=document.getElementById('tStart');const r=document.getElementById('tReset');if(s)s.onclick=()=>{if(tRun){clearInterval(tInt);tRun=false;s.textContent='Continuar';}else{tInt=setInterval(tick,1000);tRun=true;s.textContent='Pausar';}};if(r)r.onclick=()=>{tSec=0;const clk=document.getElementById('clk');if(clk)clk.textContent='00:00';const c=document.getElementById('cyc');if(c)c.textContent='Ciclo 1 · reavalie em 2:00';};}
function stopTimer(){if(tInt)clearInterval(tInt);tInt=null;tSec=0;tRun=false;}
function beep(){const ctx=new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;o.start();g.gain.setValueAtTime(0.2,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.6);o.stop(ctx.currentTime+0.6);}
renderMenu();renderPanel();
</script>
