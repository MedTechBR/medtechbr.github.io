<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>EnfermarIA — Gestão de pacientes internados | MedTech</title>
<meta name="description" content="EnfermarIA: gestão de pacientes internados e visita beira-leito — evolução do dia, exame físico, transcrição de parâmetros por foto e evolução pronta para colar no sistema do hospital.">
<meta name="theme-color" content="#0E5A6D">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="enfermaria.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EnfermarIA">
<script src="_mtfb.js?v=1"></script>
<script>window.MT_APP={id:"enfermaria",name:"EnfermarIA"};</script>
<script type="module" src="_mtauth.js?v=7"></script>
<style>
:root{--petrol:#0E5A6D;--petrol-dark:#083845;--ink:#0E2A31;--mint:#2DD4A8;--mint-dark:#14b894;--bg:#F6FAFB;--soft:#EAF3F4;--line:#dbe8ea;--muted:#5B7882;--green:#14794f;--green-bg:#e7f7f1;--amber:#c97a17;--amber-bg:#fdf0e0;--red:#c0392b;--red-bg:#fdecea;--blue:#2563a8;--blue-bg:#e8f1fb;--violet:#6b46c1;--violet-bg:#efe9fb}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent}
header{background:linear-gradient(135deg,var(--petrol),var(--petrol-dark));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 0 14px;position:sticky;top:0;z-index:40}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.4px}
.logo .mark{width:34px;height:34px;border-radius:10px;background:#2DD4A8;display:grid;place-items:center;flex:0 0 auto;font-size:18px}
.logo b{color:var(--mint)}
.subtitle{color:#bcd6db;font-size:12.5px;margin-top:3px}
.usr{display:flex;align-items:center;gap:10px}
.usr .who{font-size:12.5px;color:#cfe3e6;text-align:right;line-height:1.3;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usr a,.usr button{color:#cfe3e6;text-decoration:none;font-size:13px;font-weight:600;background:rgba(255,255,255,.12);border:none;border-radius:8px;padding:8px 11px;cursor:pointer;font-family:inherit}
.usr button:hover{background:rgba(255,255,255,.22)}
main{max-width:980px;margin:0 auto;padding:16px 18px calc(60px + env(safe-area-inset-bottom))}
.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:16px;width:fit-content;max-width:100%}
.tabs button{border:none;background:none;padding:10px 18px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted);font-family:inherit;white-space:nowrap}
.tabs button.on{background:var(--petrol);color:#fff}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.bar .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.search{padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:16px;font-family:inherit;background:#fff;min-width:230px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:10px;padding:12px 16px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;text-decoration:none;min-height:44px}
.btn-p{background:var(--mint);color:var(--petrol-dark)}.btn-p:hover{background:var(--mint-dark)}
.btn-g{background:#fff;color:var(--petrol);border:1px solid var(--line)}
.btn-v{background:var(--violet);color:#fff}
.btn-sm{padding:9px 12px;font-size:13px;border-radius:9px;min-height:40px}
.btn-dn{background:var(--red-bg);color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.kpi .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.kpi .v{font-size:22px;font-weight:800;color:var(--petrol);margin-top:3px}
.kpi.green .v{color:var(--green)}.kpi.red .v{color:var(--red)}.kpi.blue .v{color:var(--blue)}
.pt-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;gap:13px;align-items:flex-start}
.pt-card.sa{opacity:.96}
.leito{flex:0 0 auto;min-width:58px;text-align:center;background:var(--petrol);color:#fff;border-radius:11px;padding:8px 6px}
.leito .ln{font-size:18px;font-weight:800;line-height:1}
.leito .ls{font-size:9.5px;opacity:.85;margin-top:3px;text-transform:uppercase;letter-spacing:.03em}
.pt-main{flex:1;min-width:0}
.pt-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pt-top .nome{font-weight:800;font-size:16px}
.pt-top .meta{color:var(--muted);font-size:13px}
.pt-field{font-size:13.5px;margin-top:5px;line-height:1.5;color:#243b41;white-space:pre-wrap}
.pt-field b{color:var(--petrol-dark);font-weight:700}
.pt-field.pend{background:var(--amber-bg);border-radius:8px;padding:5px 9px;color:#6b4413}
.pt-field.pend b{color:var(--amber)}
.pt-obs{font-size:12.5px;color:var(--muted);margin-top:5px;white-space:pre-wrap}
.pt-acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.pt-acts button{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;font-size:13px;font-family:inherit;white-space:nowrap;min-height:38px}
.pt-acts .visita{color:#fff;background:var(--violet);border-color:var(--violet);font-weight:700}
.pt-acts .saida{color:var(--amber);font-weight:700}
.badge{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:999px;vertical-align:middle}
.b-alta{background:var(--green-bg);color:var(--green)}.b-obito{background:#eee;color:#555}.b-transf{background:var(--blue-bg);color:var(--blue)}
.chip-hoje{display:inline-block;font-size:10px;font-weight:800;background:var(--violet-bg);color:var(--violet);border-radius:999px;padding:2px 8px;margin-left:4px}
.empty{text-align:center;color:var(--muted);padding:42px 18px;background:#fff;border:1px dashed var(--line);border-radius:14px}
.modal{position:fixed;inset:0;background:rgba(8,56,69,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:60}
.modal .box{background:#fff;border-radius:16px;padding:22px;max-width:600px;width:100%;max-height:93vh;overflow:auto;-webkit-overflow-scrolling:touch}
.modal h3{margin-bottom:6px;font-size:18px;position:sticky;top:0;background:#fff;z-index:3;padding-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chip{background:var(--soft);color:var(--petrol-dark);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.chip:active{background:var(--mint);border-color:var(--mint);transform:scale(.96)}
.ef-grid{display:flex;flex-direction:column;gap:7px;margin-bottom:7px}
.ef-row{display:flex;align-items:center;gap:9px}
.ef-lbl{flex:0 0 58px;font-size:12px;font-weight:800;color:var(--petrol-dark);letter-spacing:.02em}
.ef-row input{flex:1;min-width:0;padding:9px 11px}
.ef-outros{min-height:40px}
.field{margin-bottom:12px}.field label{display:block;font-weight:600;font-size:13.5px;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit;background:#fff}
.field textarea{resize:vertical;min-height:52px;line-height:1.5}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--mint)}
.pt-main,.leito,.field input,.field select,.field textarea{text-transform:uppercase}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:90px 1fr 90px;gap:10px}
.row{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.row.actions{position:sticky;bottom:calc(-1 * env(safe-area-inset-bottom));background:#fff;padding:10px 0 calc(2px + env(safe-area-inset-bottom));margin-top:8px;z-index:2}
.row.actions .btn{flex:1}
.hint{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.sec-h{font-weight:800;color:var(--petrol);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 9px;border-top:1px solid var(--line);padding-top:13px}
.ai-box{background:#eef7f4;border:1px solid #bfe6db;border-radius:12px;padding:13px;margin-bottom:14px}
.ai-box .ai-h{font-weight:800;color:var(--petrol-dark);font-size:14px;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.ai-box textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit;resize:vertical;background:#fff;line-height:1.5}
.ai-box textarea:focus{outline:none;border-color:var(--mint)}
.file-in{display:block;width:100%;font-size:13px;font-family:inherit;margin:6px 0;padding:10px;border:1px dashed #bfe6db;border-radius:10px;background:#fff}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.thumb{position:relative;width:76px;height:76px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:#f0f0f0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:12px;line-height:1;padding:0;min-height:0;z-index:2}
.thumb-ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:22px;color:var(--petrol);background:#e8f1f2}
.thumb-ph span{font-size:9px;font-weight:800;letter-spacing:.04em}
.thumbs-n{flex:1 0 100%;font-size:12px;font-weight:800;color:var(--green)}
.thumbs-err{flex:1 0 100%;font-size:12px;font-weight:600;color:var(--red);background:var(--red-bg);border-radius:8px;padding:7px 9px;line-height:1.45}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--petrol-dark);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.note{background:var(--soft);border-radius:12px;padding:12px 15px;font-size:13px;color:#28424a;margin-top:16px;line-height:1.6}
.note b{color:var(--petrol)}
footer{text-align:center;color:var(--muted);font-size:13px;padding:24px}
footer a{color:var(--petrol);font-weight:600;text-decoration:none}
.setor-h{font-size:12px;font-weight:800;color:var(--petrol-dark);text-transform:uppercase;letter-spacing:.04em;margin:16px 2px 8px;display:flex;align-items:center;gap:8px}
.setor-h span{background:var(--soft);color:var(--petrol);border-radius:999px;padding:1px 9px;font-size:11px}
.pt-pend{margin-top:6px;background:var(--amber-bg);border-radius:9px;padding:7px 10px}
.pend-item{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;color:#6b4413;padding:3px 0;cursor:pointer}
.pend-item input{margin-top:2px;flex:0 0 auto;width:18px;height:18px;accent-color:var(--mint-dark);cursor:pointer}
.pend-item.done span{text-decoration:line-through;color:#9aa8a0}
.mini-ed{background:none;border:none;cursor:pointer;font-size:12px;opacity:.55;padding:0 4px;vertical-align:middle;font-family:inherit}
.mini-ed:hover{opacity:1}
.pt-pend-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pt-pend-h b{color:var(--amber);font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.pend-empty{font-size:13px;color:var(--muted);padding:2px 0}
.pt-muted{color:#9aa8a0}
.evo-out{min-height:60vh;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.55;text-transform:none!important}
@media(max-width:680px){
  .cards{grid-template-columns:1fr 1fr}
  .two,.three{grid-template-columns:1fr}
  .chip{padding:9px 13px;font-size:13px}
  .ai-box{padding:11px}
  .ef-lbl{flex-basis:54px}
  .modal{padding:0;align-items:flex-end}
  .modal .box{max-width:100%;max-height:96vh;border-radius:18px 18px 0 0;padding:18px 16px 14px}
  .pt-card{gap:10px;flex-wrap:wrap}
  .pt-acts{flex-direction:row;flex-wrap:wrap;align-items:stretch;width:100%}
  .pt-acts button{flex:1 1 44%}
  .bar{gap:8px}
  input.search{min-width:0;width:100%;flex:1 1 100%}
  .bar .right{width:100%}
  .bar .right .btn{flex:1}
}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div>
      <div class="logo"><span class="mark">🛏️</span> Enfermar<b>IA</b></div>
      <div class="subtitle">Visita beira-leito · evolução por IA · por MedTech</div>
    </div>
    <div class="usr" id="usr"></div>
  </div>
</header>

<main>
  <div class="tabs">
    <button id="tab-ativos" class="on" onclick="setTab('ativos')">🛏️ Internados</button>
    <button id="tab-saidas" onclick="setTab('saidas')">🚪 Saídas</button>
  </div>
  <div id="view"></div>
  <div class="note" id="storenote">Carregando…</div>
</main>

<footer>© 2026 <a href="index.html">MedTech</a> · <a href="privacidade.html">Privacidade</a></footer>

<script>
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const SAIDA={alta:{l:'Alta',c:'b-alta'},obito:{l:'Óbito',c:'b-obito'},transferencia:{l:'Transferência',c:'b-transf'}};
const EF_TEMPLATE='- NEURO: \n- AC: \n- AP: \n- ABDOME: \n- EXT: \n- PELE: ';
let state={pacientes:[]};
let tab='ativos', busca='', visitaImgs=[], visitaImgErrs=[];

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function nowISO(){return new Date().toISOString();}
function ymd(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtData(s){if(!s)return '';const d=new Date((s.length<=10?s+'T00:00:00':s));if(isNaN(d))return esc(s);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
function setVal(id,v){const e=document.getElementById(id);if(e!=null&&v!=null)e.value=v;}
function getVal(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function up(s){return String(s==null?'':s).toUpperCase();}

/* ===== boot ===== */
function sampleSeed(){return {pacientes:[
  {id:uid(),leito:'12A',setor:'Enfermaria',nome:'Maria Souza',idade:'74 anos',sexo:'F',clinica:'Clínica Médica',diagnosticos:'Pneumonia adquirida na comunidade',comorbidades:'HAS, DM2',alergias:'',muc:'Losartana 50 mg/dia',hda:'Quadro de tosse produtiva e febre há 4 dias, com piora da dispneia, admitida em 18/06.',laboratorio:'PCR 180 · leucograma 15.000 com desvio',culturas:'Hemocultura (18/06): em andamento',imagem:'RX tórax: consolidação em base direita',exameFisico:EF_TEMPLATE,evolucao:'',parametros:'',conduta:'Ceftriaxona + azitromicina (D2)',pendencias:[{id:uid(),t:'Colher hemocultura',done:false},{id:uid(),t:'Controle de PCR em 48h',done:false}],obs:'',status:'ativo',criadoEm:nowISO()},
  {id:uid(),leito:'UTI 3',setor:'UTI',nome:'João Lima',idade:'61 anos',sexo:'M',clinica:'Clínica Médica',diagnosticos:'IAM sem supra (NSTEMI)\nIC descompensada',comorbidades:'HAS, tabagismo',alergias:'',muc:'AAS, sinvastatina',hda:'Dor torácica em aperto iniciada há 1 dia, com dispneia progressiva.',laboratorio:'Troponina em curva ascendente',culturas:'',imagem:'ECG: infra de ST em V4-V6 · Eco: FE 35%',exameFisico:EF_TEMPLATE,evolucao:'',parametros:'',conduta:'AAS + clopidogrel + enoxaparina',pendencias:[{id:uid(),t:'CAT amanhã',done:false},{id:uid(),t:'Ajustar diurético',done:false}],obs:'Aguardando vaga em hemodinâmica.',status:'ativo',criadoEm:nowISO()}
]};}
function normalize(d){d=d&&typeof d==='object'?d:{};return {pacientes:Array.isArray(d.pacientes)?d.pacientes:[]};}

function whenMT(cb){if(window.MT){cb();}else{setTimeout(()=>whenMT(cb),30);}}
whenMT(()=>{MT.onData(d=>{
  if(d&&typeof d==='object'&&d.pacientes){state=normalize(d);}
  else{state=(MT.mode==='demo')?sampleSeed():normalize(null);if(MT.mode==='demo')MT.save(state);}
  renderUser();render();
});renderUser();});
function persist(){MT.save(state);}
function renderUser(){const el=document.getElementById('usr');if(!el)return;
  const sn=document.getElementById('storenote');
  if(sn)sn.innerHTML=(MT.mode==='demo')?'🔧 <b>Modo demonstração</b> — dados salvos só neste navegador. Entre na conta MedTech para sincronizar e usar a IA.':'☁️ Conectado — sua lista de internados sincroniza na nuvem MedTech.';
  if(MT.mode==='demo'){el.innerHTML='<span class="who">Modo demo</span><a href="index.html">← MedTech</a>';return;}
  const u=MT.user;const nm=u?(u.displayName||u.email||'Conta'):'';
  el.innerHTML=`<span class="who">${esc(nm)}</span><button onclick="MT.signOut()">Sair</button>`;}

/* ===== navegação ===== */
function setTab(t){tab=t;busca='';['ativos','saidas'].forEach(x=>{const b=document.getElementById('tab-'+x);if(b)b.className=(x===t?'on':'');});render();}
function ativos(){return state.pacientes.filter(p=>p.status!=='saida');}
function saidos(){return state.pacientes.filter(p=>p.status==='saida');}
function leitoSort(a,b){return String(a.setor||'').localeCompare(String(b.setor||''))||String(a.leito||'').localeCompare(String(b.leito||''),'pt',{numeric:true});}
function render(){tab==='ativos'?renderAtivos():renderSaidas();}
function examesFmt(p){return [p.laboratorio,p.culturas,p.imagem].filter(Boolean).join('\n')||p.exames||'';}

function matchBusca(p){const q=busca.trim().toLowerCase();if(!q)return true;return [p.leito,p.nome,p.diagnosticos,p.setor].some(x=>(x||'').toLowerCase().includes(q));}

function ptCard(p){
  const meta=[p.idade||'',p.sexo||'',p.setor||''].filter(Boolean).join(' · ');
  const pend=(p.pendencias||[]);
  const exFmt=examesFmt(p);
  const visitHoje=p.visitaEm===ymd();
  const pendHtml=`<div class="pt-pend"><div class="pt-pend-h"><b>Pendências</b><button class="mini-ed" onclick="editCampo('${p.id}','pendencias')">✏️</button></div>${pend.length?pend.map(it=>`<label class="pend-item${it.done?' done':''}"><input type="checkbox" ${it.done?'checked':''} onclick="togglePend('${p.id}','${it.id}')"><span>${esc(it.t)}</span></label>`).join(''):'<div class="pend-empty">Nenhuma pendência.</div>'}</div>`;
  return `<div class="pt-card">
    <div class="leito"><div class="ln">${esc(p.leito||'—')}</div>${p.setor?`<div class="ls">${esc(p.setor)}</div>`:''}</div>
    <div class="pt-main">
      <div class="pt-top"><span class="nome">${esc(p.nome||'Paciente')}</span>${meta?`<span class="meta">${esc(meta)}</span>`:''}${visitHoje?'<span class="chip-hoje">✓ visto hoje</span>':''}</div>
      <div class="pt-field"><b>Dx:</b> <button class="mini-ed" onclick="editCampo('${p.id}','dx')">✏️</button>${p.diagnosticos?('\n'+esc(bullets(p.diagnosticos))):' <span class="pt-muted">—</span>'}</div>
      <div class="pt-field"><b>Exames:</b> <button class="mini-ed" onclick="openForm('${p.id}')">✏️</button>${exFmt?('\n'+esc(bullets(exFmt))):' <span class="pt-muted">—</span>'}</div>
      ${pendHtml}
      ${p.obs?`<div class="pt-obs">📝 ${esc(p.obs)}</div>`:''}
    </div>
    <div class="pt-acts">
      <button class="visita" onclick="openVisita('${p.id}')">👨‍⚕️ Visita</button>
      <button onclick="openForm('${p.id}')">📋 Ficha</button>
      <button class="saida" onclick="openSaida('${p.id}')">🚪 Saída</button>
      <button onclick="delPac('${p.id}')">🗑️</button>
    </div>
  </div>`;
}
function editCampo(pid,campo){
  const p=state.pacientes.find(x=>x.id===pid);if(!p)return;
  const M={dx:{l:'Diagnósticos / hipóteses',v:bullets(p.diagnosticos)},pendencias:{l:'Pendências',v:(p.pendencias||[]).map(x=>'- '+x.t).join('\n')}}[campo];

  modal(`<h3>Editar ${M.l}</h3><div class="hint" style="margin-bottom:8px">${esc(p.nome||'Paciente')} · leito ${esc(p.leito||'—')} — um item por linha</div>

function saveCampo(pid,campo){
  const p=state.pacientes.find(x=>x.id===pid);if(!p)return;
  const v=getVal('ec_txt');
  if(campo==='dx')p.diagnosticos=bullets(v);
  else if(campo==='pendencias'){const oldP=p.pendencias||[];p.pendencias=v.split('\n').map(s=>s.trim().replace(/^[-•*]\s*/,'')).filter(Boolean).map(t=>{const ex=oldP.find(o=>o.t===t);return {id:ex?ex.id:uid(),t,done:ex?ex.done:false};});}
  persist();closeModal();render();
}

const SISTEMAS=['NEURO','AC','AP','ABDOME','EXT','PELE'];
function parseEF(ef){const map={};SISTEMAS.forEach(s=>map[s]='');const outros=[];String(ef||'').split('\n').forEach(line=>{const m=line.match(/^\s*-?\s*(NEURO|AC|AP|ABDOME|EXT|PELE)\s*:\s*(.*)$/i);if(m){map[m[1].toUpperCase()]=(m[2]||'').trim();}else{const t=line.replace(/^\s*-\s*/,'').trim();if(t)outros.push(t);}});return {map,outros:outros.join('\n')};}
function buildEF(){const lines=SISTEMAS.map(s=>'- '+s+': '+getVal('ef_'+s).trim());getVal('ef_outros').split('\n').map(x=>x.trim().replace(/^-\s*/,'')).filter(Boolean).forEach(x=>lines.push('- '+x));return lines.join('\n');}

/* fotos dos parâmetros */
function guessMime(name){const n=(name||'').toLowerCase();if(/\.png$/.test(n))return 'image/png';if(/\.webp$/.test(n))return 'image/webp';if(/\.(heic|heif)$/.test(n))return 'image/heic';return 'image/jpeg';}
function readFileRetry(f,tries,onok,onfail){
  const go=n=>{
    const r=new FileReader();
    r.onload=()=>onok(String(r.result||''));
    r.onerror=()=>{if(n<tries)setTimeout(()=>go(n+1),900);else onfail();}; // retry: acessar de novo pode forçar o download do iCloud
    try{r.readAsDataURL(f);}catch(e){if(n<tries)setTimeout(()=>go(n+1),900);else onfail();}
  };
  go(0);
}
function addParamImgs(input){
  const files=[...(input.files||[])];
  if(!files.length)return;
  visitaImgErrs=[];
  let pending=files.length;
  const doneOne=()=>{if(--pending<=0){try{input.value='';}catch(e){}}};
  files.forEach(f=>{
    const origMime=f.type||guessMime(f.name);
    readFileRetry(f,2,dataUrl=>{
      if(!dataUrl){visitaImgErrs.push(f.name||'imagem');renderThumbs();doneOne();return;}
      downscale(dataUrl,1600,.82,(outUrl,outMime)=>{
        const url=outUrl||dataUrl, mime=outMime||origMime||'image/jpeg', b64=(url.split(',')[1]||'');
        if(b64)visitaImgs.push({data:b64,mimeType:mime,thumb:url,heic:/heic|heif/i.test(mime)});
        else visitaImgErrs.push(f.name||'imagem');
        renderThumbs();doneOne();
      });
    },()=>{visitaImgErrs.push(f.name||'imagem');renderThumbs();doneOne();});
  });
  renderThumbs();
}
function renderThumbs(){const box=document.getElementById('v_thumbs');if(!box)return;
  let h=(visitaImgs.length?`<div class="thumbs-n">✓ ${visitaImgs.length} foto(s) anexada(s)</div>`:'');
  h+=visitaImgs.map((im,i)=>`<div class="thumb">${im.heic?'<div class="thumb-ph">📄<span>FOTO</span></div>':`<img src="${im.thumb}" onerror="this.style.opacity=0">`}<button onclick="rmThumb(${i})">✕</button></div>`).join('');
  if(visitaImgErrs.length)h+=`<div class="thumbs-err">⚠️ Não consegui ler: ${esc(visitaImgErrs.join(', '))}. No Mac, fotos do iPhone podem estar no iCloud sem download — abra a foto no app Fotos (ou arraste pra Mesa) e tente de novo. No celular, tire a foto na hora.</div>`;
  box.innerHTML=h;}
function rmThumb(i){visitaImgs.splice(i,1);renderThumbs();}
function downscale(dataUrl,maxDim,q,cb){
  const img=new Image();let done=false;const finish=(u,m)=>{if(done)return;done=true;cb(u,m);};
  img.onload=()=>{try{const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;if(!w||!h)return finish(null,null);const sc=Math.min(1,maxDim/Math.max(w,h));const cw=Math.max(1,Math.round(w*sc)),ch=Math.max(1,Math.round(h*sc));const c=document.createElement('canvas');c.width=cw;c.height=ch;c.getContext('2d').drawImage(img,0,0,cw,ch);finish(c.toDataURL('image/jpeg',q),'image/jpeg');}catch(e){finish(null,null);}};
  img.onerror=()=>finish(null,null);
  setTimeout(()=>finish(null,null),6000);
  img.src=dataUrl;
}
const PARAM_PROMPT='Você recebe FOTO(S) manuscritas: uma folha de CONTROLE HEMODINÂMICO (sinais vitais) e, possivelmente, uma folha SEPARADA de CONTROLE HÍDRICO (diurese/balanço hídrico) das últimas 24h de um paciente internado. Transcreva os sinais vitais e calcule as faixas mínimo–máximo do dia. Responda APENAS UMA LINHA, em MAIÚSCULAS, exatamente neste formato, sem o rótulo "PARÂMETROS:" e sem nenhum texto extra:\n'
 +'PA [sis_min-sis_max] X [dia_min-dia_max] MMHG // FC [min-max] BPM // FR [min-max] IRPM // T [min-max] ºC // SPO2 [min-max]% // DX [valores em ordem de horário separados por hífen, sem espaços] MG/DL // DIURESE [valor] ML // BH [valor com sinal] ML\n'
 +'REGRAS: (0) A folha hemodinâmica costuma ter, ABAIXO dos valores, uma GRADE DE ESCORE (MEWS/alerta precoce) com números 0, 1, 2 e 3 nas células — IGNORE completamente esses escores; use SEMPRE os valores REAIS medidos. '
 +'(1) PA = curva sistólica × diastólica (ex.: PA 100-136 X 60-80). A pressão aparece como pares na linha "PRESSÃO ARTERIAL" do topo (ex.: 136/75, 130X80, 100X60); use a MENOR e a MAIOR sistólica e a MENOR e a MAIOR diastólica do dia. NUNCA inclua PAM. '
 +'(2) DX = glicemia/HGT: valores em ordem de horário separados por "-" sem espaços (ex.: DX 135-192-84-104 MG/DL) — o hífen é separador de horário, NÃO faixa; pule horários sem medida; se uma só medida, registre só ela; se não houver nenhuma, escreva DX NÃO AFERIDA (sem unidade). '
 +'(3) DIURESE e BH vêm da folha de controle hídrico: use os TOTAIS DO DIA (24h) — DIURESE = total de diurese do dia; BH = TOTAL BALANÇO do dia (com sinal + ou −). IGNORE os subtotais parciais (linhas "TP"/total parcial) de cada período. Se a folha não vier ou não houver registro, escreva DIURESE NÃO AFERIDA e/ou BH NÃO AFERIDO. '
 +'(4) DÉBITO DE DRENO: só se houver coluna de dreno preenchida na folha de balanço, acrescente "// DEBITO DE DRENO [valor] ML"; se não houver, omita. '
 +'(5) Se algum sinal não estiver nas fotos, omita esse campo (não invente). Responda só a linha.';
async function transcreverParams(){
  if(!visitaImgs.length){alert('Anexe ao menos uma foto dos parâmetros.');return;}
  const b=document.getElementById('transBtn');b.innerHTML='<span class="spin"></span> Transcrevendo...';b.disabled=true;
  try{
    const out=await MT.aiImage(visitaImgs.map(im=>({data:im.data,mimeType:im.mimeType})),PARAM_PROMPT);
    const clean=String(out||'').replace(/^```[a-z]*\s*/i,'').replace(/```\s*$/,'').replace(/^\s*PARÂMETROS:\s*/i,'').trim();
    if(clean)setVal('v_param',up(clean));
    b.innerHTML='✓ Transcrito';setTimeout(()=>{b.innerHTML='✨ Transcrever parâmetros';b.disabled=false;},1600);
    return;
  }catch(e){alert('⚠️ '+(e.message||'Falha na IA.'));}
  b.innerHTML='✨ Transcrever parâmetros';b.disabled=false;
}

/* evolução pronta para colar */
function condutaComExplico(s){
  const lines=String(s||'').split('\n').map(x=>x.trim().replace(/^[-•*]\s*/,'')).filter(Boolean).filter(x=>!/EXPLICO[\s\S]*PLANO\s+TERAP/i.test(x));
  lines.push('EXPLICO PLANO TERAPEUTICO');
  return lines.map(x=>'- '+x).join('\n');
}
function gerarEvolucao(p){
  const L=[];
  L.push('# EVOLUÇÃO MÉDICA - '+(p.setor||p.clinica||'Clínica Médica'));
  L.push('# ID: '+(p.nome||'')+(p.idade?(', '+p.idade):'')+', IH POR:');
  if(p.diagnosticos)L.push(bullets(p.diagnosticos));
  if(p.comorbidades)L.push('# COMORBIDADES: '+oneLine(p.comorbidades));
  if(p.alergias)L.push('> ALERGIAS: '+oneLine(p.alergias));
  if(p.muc)L.push('> MUC: '+oneLine(p.muc));
  if(p.hda)L.push('# HDA: '+oneLine(p.hda));
  if(p.evolucao)L.push('# EVOLUÇÃO: '+oneLine(p.evolucao));
  if(p.parametros)L.push('# PARÂMETROS: '+oneLine(p.parametros).replace(/^\s*PARÂMETROS:\s*/i,''));
  if(p.exameFisico&&p.exameFisico.trim()){L.push('# EXAME FÍSICO:');L.push(bullets(p.exameFisico));}
  const lab=p.laboratorio||p.exames||'';
  if(lab){L.push('# LABORATÓRIO:');L.push(bullets(lab));}
  if(p.culturas){L.push('# CULTURAS:');L.push(gtbul(p.culturas));}
  if(p.imagem){L.push('# EXAMES DE IMAGEM');L.push(gtbul(p.imagem));}
  L.push('# CONDUTA:');L.push(condutaComExplico(p.conduta));
  return up(L.join('\n'));
}
function lineToHtml(line){
  if(line==='')return '';
  if(/^# EVOLUÇÃO MÉDICA/.test(line)||/^# EXAME FÍSICO:/.test(line)||/^# LABORATÓRIO:/.test(line)||/^# CULTURAS:/.test(line)||/^# EXAMES DE IMAGEM/.test(line)||/^# CONDUTA:/.test(line))
    return '<b>'+esc(line)+'</b>';
  const m=line.match(/^((?:#|>) (?:ID|COMORBIDADES|ALERGIAS|MUC|HDA|EVOLUÇÃO|PARÂMETROS):)([\s\S]*)$/);
  if(m)return '<b>'+esc(m[1])+'</b>'+esc(m[2]);
  if(/^- /.test(line)||/^> /.test(line))return '<b>'+esc(line)+'</b>'; // tópicos (itens) em negrito
  return esc(line);
}
function gerarEvolucaoHtml(p){return gerarEvolucao(p).split('\n').map(l=>'<div>'+(lineToHtml(l)||'<br>')+'</div>').join('');}
function copyEvoFmt(id,btnId){
  const p=state.pacientes.find(x=>x.id===id);if(!p)return;
  // O editor do ISGH (ars vitae) DESCARTA HTML na colagem e só quebra linha quando há LINHA EM BRANCO.
  // Solução testada no editor real: separar cada linha por \n\n (vira 1 parágrafo por linha, margem 0 = sem espaço extra).
  const plain=gerarEvolucao(p).split('\n').join('\n\n');
  let ok=false;
  try{
    const ta=document.createElement('textarea');
    ta.value=plain;ta.setAttribute('style','position:fixed;left:-9999px;top:0;opacity:0');
    document.body.appendChild(ta);ta.focus();ta.select();
    ok=document.execCommand('copy');
    document.body.removeChild(ta);
  }catch(e){ok=false;}
  if(!ok&&navigator.clipboard){try{navigator.clipboard.writeText(plain);ok=true;}catch(e){}}
  const b=document.getElementById(btnId);if(b){b.textContent=ok?'✓ Copiado p/ o sistema':'Selecione e copie manualmente';setTimeout(()=>b.textContent='📋 Copiar p/ o sistema',2000);}
}
function verEvolucao(id){
  const p=state.pacientes.find(x=>x.id===id);if(!p)return;
  const txt=gerarEvolucao(p);
  modal(`<h3>📄 Evolução — pronta para colar</h3>
   <div class="hint" style="margin-bottom:8px">${esc(p.nome||'Paciente')} · leito ${esc(p.leito||'—')}. Revise antes de colar no sistema do hospital.</div>
   <div class="hint" style="margin:-2px 0 8px">Use o botão <b>Copiar p/ o sistema</b> e cole no ISGH — as quebras de linha são preservadas. (O editor do ISGH não aceita negrito na colagem.)</div>
   <div class="field"><textarea id="evoTa" class="evo-out">${esc(txt)}</textarea></div>
   <div class="row actions"><button class="btn btn-p" id="copyEvoBtn" onclick="copyEvoFmt('${id}','copyEvoBtn')">📋 Copiar p/ o sistema</button><button class="btn btn-g" onclick="openVisita('${id}')">← Voltar</button><button class="btn btn-g" onclick="closeModal()">Fechar</button></div>`);
}
function copyTa(taId,btnId,label){const t=document.getElementById(taId);if(!t)return;t.focus();t.select();try{document.execCommand('copy');}catch(e){}if(navigator.clipboard){try{navigator.clipboard.writeText(t.value);}catch(e){}}const b=document.getElementById(btnId);if(b){b.textContent='✓ Copiado';setTimeout(()=>b.textContent=label,1600);}}

function resumoPlantao(){
  const list=ativos();
  if(!list.length){alert('Não há pacientes internados para resumir.');return;}
  const g=agrupaPorSetor(list);
  let txt='PASSAGEM DE PLANTÃO — '+fmtData(ymd())+' ('+list.length+' internado(s))\n';
  grupoKeys(g).forEach(k=>{txt+='\n== '+k+' ('+g[k].length+') ==\n';
    g[k].forEach(p=>{txt+='\n['+(p.leito||'—')+'] '+(p.nome||'Paciente')+(p.idade?(', '+p.idade):'')+'\n';
      if(p.diagnosticos)txt+='Dx:\n'+bullets(p.diagnosticos)+'\n';
      const ex=examesFmt(p);if(ex)txt+='Exames:\n'+bullets(ex)+'\n';
      const pend=(p.pendencias||[]).filter(x=>!x.done);
      if(pend.length)txt+='Pendências:\n'+pend.map(x=>'- '+x.t).join('\n')+'\n';
      if(p.obs)txt+='Obs: '+oneLine(p.obs)+'\n';});});
  modal(`<h3>📋 Passar plantão</h3><div class="hint" style="margin-bottom:8px">Resumo dos ${list.length} internado(s), agrupado por setor (só pendências em aberto). Revise e copie.</div><div class="field"><textarea id="resumoTa" class="evo-out" style="min-height:50vh">${esc(txt.toUpperCase())}</textarea></div><div class="row actions"><button class="btn btn-p" id="copyResBtn" onclick="copyTa('resumoTa','copyResBtn','📋 Copiar tudo')">📋 Copiar tudo</button><button class="btn btn-g" onclick="closeModal()">Fechar</button></div>`);
}

/* ===== saída (alta / óbito / transferência) ===== */
function openSaida(id){
  const p=state.pacientes.find(x=>x.id===id);if(!p)return;
  modal(`<h3>Registrar saída · ${esc(p.nome||'Paciente')} (leito ${esc(p.leito||'—')})</h3>
   <div class="field"><label>Tipo de saída</label><select id="s_tipo" onchange="saidaToggle()">
     <option value="alta">Alta</option><option value="obito">Óbito</option><option value="transferencia">Transferência</option></select></div>
   <div class="two"><div class="field"><label>Data</label><input id="s_data" type="date" value="${ymd()}"></div>
     <div class="field" id="s_destWrap" style="display:none"><label>Destino</label><input id="s_dest" placeholder="Hospital / setor de destino"></div></div>
   <div class="field"><label>Observações da saída (opcional)</label><textarea id="s_obs" placeholder="Resumo, orientações, motivo..."></textarea></div>
   <div class="row actions"><button class="btn btn-p" onclick="saveSaida('${id}')">Confirmar saída</button><button class="btn btn-g" onclick="closeModal()">Cancelar</button></div>`);
}
function saidaToggle(){const t=document.getElementById('s_tipo').value;const w=document.getElementById('s_destWrap');if(w)w.style.display=(t==='transferencia')?'':'none';}
function saveSaida(id){
  const p=state.pacientes.find(x=>x.id===id);if(!p)return;
  p.status='saida';
  p.saida={tipo:document.getElementById('s_tipo').value,data:document.getElementById('s_data').value||ymd(),destino:getVal('s_dest'),obs:getVal('s_obs'),em:nowISO()};
  persist();closeModal();render();
}

/* ===== IA: extrair dados da evolução ===== */
function parseJsonLoose(t){if(!t)return null;t=String(t).trim().replace(/^```[a-z]*\s*/i,'').replace(/```\s*$/,'').trim();const i=t.indexOf('{'),j=t.lastIndexOf('}');if(i>=0&&j>i){try{return JSON.parse(t.slice(i,j+1));}catch(e){}}try{return JSON.parse(t);}catch(e){return null;}}
async function extrairEvol(){
  const raw=getVal('f_evol');
  if(!raw){alert('Cole a evolução do paciente antes de extrair.');return;}
  const b=document.getElementById('extrairBtn');b.innerHTML='<span class="spin"></span> Extraindo...';b.disabled=true;
  const prompt='Você é um assistente clínico extraindo dados de uma evolução/prontuário de paciente INTERNADO para um sistema de enfermaria. Responda APENAS um objeto JSON válido (sem markdown, sem comentários) com EXATAMENTE estas chaves:\n'
   +'- "nome" (string)\n'
   +'- "idade" (string, ex.: "78 anos")\n'
   +'- "diagnosticos" (ARRAY de strings): SOMENTE o MOTIVO DA INTERNAÇÃO / hipóteses que justificaram a internação (o "IH POR"). CADA hipótese em um ITEM SEPARADO. NUNCA junte duas no mesmo item.\n'
   +'- "comorbidades" (string): comorbidades/doenças prévias separadas por vírgula. "" se não houver.\n'
   +'- "alergias" (string): alergias relatadas. "" se não houver.\n'
   +'- "muc" (string): medicações de USO CONTÍNUO/domiciliar (o "USO DE"), separadas por vírgula. "" se não houver.\n'
   +'- "hda" (string): a História da Doença Atual em um parágrafo. "" se não houver.\n'
   +'- "laboratorio" (ARRAY de strings): exames LABORATORIAIS relevantes (um por item, com data e resultado). NÃO inclua rotina pura (hemograma/função renal/eletrólitos) salvo se alterada e relevante. Resultados de CULTURAS/SOROLOGIAS vão em "culturas".\n'
   +'- "culturas" (ARRAY de strings): hemoculturas, uroculturas, culturas, sorologias e painéis virais (um por item, com data e resultado). [] se não houver.\n'
   +'- "imagem" (ARRAY de strings): exames de IMAGEM (RX, USG, TC, RM, ECO) — um por item, com o achado resumido. [] se não houver.\n'
   +'- "exameFisico" (string): o EXAME FÍSICO em linhas começando por "- ", uma por aparelho, nesta ordem quando houver: "- NEURO:", "- AC:", "- AP:", "- ABDOME:", "- EXT:", "- PELE:" (mapeie SCR→AC, SR→AP, TGI→ABDOME). "" se não houver.\n'
   +'- "conduta" (ARRAY de strings): cada item da CONDUTA/PLANO atual (um por item). NÃO inclua nenhuma linha de "explico plano terapêutico" (ela é adicionada automaticamente).\n'
   +'- "pendencias" (ARRAY de strings curtas): o que IMPEDE A ALTA agora (sobretudo após "CONDUTA"/"PLANO"). Para CADA antibiótico em uso com dia de início (DI/D1/"iniciado em"), crie uma pendência "<ATB> DI <DD/MM> - programado até <DD/MM>" (ou "[definir]" se não houver término).\n'
   +'Não invente nada; use "" ou [] quando não houver. Português do Brasil.\n\nEvolução:\n'+raw;
  try{
    const txt=await MT.ai(prompt);
    const data=parseJsonLoose(txt);
    if(!data){alert('Não consegui estruturar automaticamente. Tente colar novamente ou preencha manualmente.');}
    else{
      const toLines=v=>Array.isArray(v)?v.filter(Boolean).join('\n'):(v||'');
      setVal('f_nome',data.nome||'');
      setVal('f_idade',data.idade||'');
      setVal('f_comorb',data.comorbidades||'');
      setVal('f_alergias',data.alergias||'');
      setVal('f_muc',data.muc||'');
      setVal('f_hda',data.hda||'');
      setVal('f_dx',bullets(toLines(data.diagnosticos)));
      setVal('f_lab',bullets(toLines(data.laboratorio)));
      setVal('f_culturas',bullets(toLines(data.culturas)));
      setVal('f_imagem',bullets(toLines(data.imagem)));
      setVal('f_pend',bullets(toLines(data.pendencias)));
      setVal('f_ef',data.exameFisico||'');
      setVal('f_conduta',bullets(toLines(data.conduta)));
      const okN=(data.nome||'')?'':' (nome não encontrado)';
      const bb=document.getElementById('extrairBtn');if(bb){bb.innerHTML='✓ Ficha preenchida'+okN;setTimeout(()=>{bb.innerHTML='✨ Extrair dados';bb.disabled=false;},1800);}
      return;
    }
  }catch(e){alert('⚠️ '+(e.message||'Falha na IA.'));}
  b.innerHTML='✨ Extrair dados';b.disabled=false;
}

/* ===== modal ===== */
function modal(html){document.querySelectorAll('.modal').forEach(m=>m.remove());const d=document.createElement('div');d.className='modal';d.id='modal';d.innerHTML='<div class="box">'+html+'</div>';d.onclick=e=>{if(e.target===d)closeModal();};document.body.appendChild(d);}
function closeModal(){const m=document.getElementById('modal');if(m)m.remove();}

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
