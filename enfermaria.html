<style>
:root{--petrol:#3B7BE0;--petrol-btn:#3169CC;--petrol-dark:#2F62B3;--ink:#23272E;--mint:#3B7BE0;--mint-dark:#2F62B3;--bg:#FAFAF8;--soft:rgba(59,123,224,.12);--line:#E8E8E2;--muted:#5E646B;--green:#186139;--green-bg:rgba(29,122,70,.12);--amber:#8A6009;--amber-bg:rgba(163,115,10,.12);--red:#C6453D;--red-bg:rgba(198,69,61,.12);--blue:#3B7BE0;--blue-bg:rgba(59,123,224,.12);--violet:#5B3BC4;--violet-bg:rgba(167,139,250,.14);--violet-btn:#6d4bd8;--surface:#FFFFFF;--card:#FFFFFF;--panel2:#F1F1EC;--line-strong:#DDDDD5;--dim:#767C84;--teal:#0E8A63;--glow:rgba(59,123,224,.42);--disp:'Figtree',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:-.011em;color:var(--ink);background-color:#FAFAF8;-webkit-tap-highlight-color:transparent}
input,select,textarea{background:var(--panel2);color:var(--ink)}
input:-webkit-autofill,input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 100px #FFFFFF inset;-webkit-text-fill-color:#23272E;caret-color:#23272E;transition:background-color 99999s}
header{background:rgba(255,255,255,.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--ink);border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top)) 0 14px;position:sticky;top:0;z-index:40}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.5px;font-family:var(--disp)}
.logo .mark{width:34px;height:34px;border-radius:10px;background:var(--petrol-btn);color:#fff;display:grid;place-items:center;flex:0 0 auto;font-size:18px;box-shadow:0 0 0 1px rgba(59,123,224,.4),0 2px 8px rgba(59,123,224,.28)}
.logo b{color:var(--petrol-dark)}
.subtitle{color:var(--muted);font-size:12.5px;margin-top:3px}
.usr{display:flex;align-items:center;gap:10px}
.usr .who{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.3;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usr a,.usr button{color:var(--ink);text-decoration:none;font-size:13px;font-weight:600;background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 11px;cursor:pointer;font-family:inherit}
.usr a:hover,.usr button:hover{background:var(--soft);border-color:var(--petrol);color:var(--petrol-dark)}
main{max-width:980px;margin:0 auto;padding:16px 18px calc(60px + env(safe-area-inset-bottom))}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:16px;width:fit-content;max-width:100%}
.tabs button{border:none;background:none;padding:10px 18px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted);font-family:inherit;white-space:nowrap}
.tabs button.on{background:var(--petrol-btn);color:#fff}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.bar .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.search{padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:16px;font-family:inherit;background:var(--panel2);min-width:230px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:10px;padding:12px 16px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;text-decoration:none;min-height:44px}
.btn-p{background:var(--petrol-btn);color:#fff}
.btn-p:hover{background:var(--petrol-dark)}
.btn-p .spin{border-color:#fff;border-top-color:transparent}.btn-p:hover{background:var(--mint-dark)}
.btn-g{background:var(--card);color:var(--petrol-dark);border:1px solid var(--line)}
.btn-v{background:var(--violet-btn);color:#fff}
.btn-sm{padding:9px 12px;font-size:13px;border-radius:9px;min-height:40px}
.btn-dn{background:var(--red-bg);color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.kpi .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.kpi .v{font-size:22px;font-weight:800;color:var(--petrol-dark);margin-top:3px;font-family:var(--mono)}
.kpi.green .v{color:var(--green)}.kpi.red .v{color:var(--red)}.kpi.blue .v{color:var(--blue)}
.pt-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;gap:13px;align-items:flex-start}
.pt-card.sa{opacity:.96}
.leito{flex:0 0 auto;min-width:58px;text-align:center;background:var(--petrol-btn);color:#fff;border-radius:11px;padding:8px 6px}
.leito .ln{font-size:18px;font-weight:800;line-height:1;font-family:var(--mono)}
.leito .ls{font-size:9.5px;opacity:.85;margin-top:3px;text-transform:uppercase;letter-spacing:.03em}
.pt-main{flex:1;min-width:0}
.pt-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pt-top .nome{font-weight:800;font-size:16px}
.pt-top .meta{color:var(--muted);font-size:13px}
.pt-field{font-size:13.5px;margin-top:5px;line-height:1.5;color:var(--ink);white-space:pre-wrap}
.pt-field b{color:var(--petrol-dark);font-weight:700}
.pt-field.pend{background:var(--amber-bg);border-radius:8px;padding:5px 9px;color:var(--amber)}
.pt-field.pend b{color:var(--amber)}
.pt-obs{font-size:12.5px;color:var(--muted);margin-top:5px;white-space:pre-wrap}
.pt-acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.pt-acts button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;font-size:13px;font-family:inherit;white-space:nowrap;min-height:38px}
.pt-acts .visita{color:#fff;background:var(--violet-btn);border-color:var(--violet-btn);font-weight:700}
.pt-acts .saida{color:var(--amber);font-weight:700}
.badge{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:999px;vertical-align:middle;font-family:var(--mono)}
.b-alta{background:var(--green-bg);color:var(--green)}.b-obito{background:#E1E1DA;color:var(--muted)}.b-transf{background:var(--blue-bg);color:var(--blue)}
.chip-hoje{display:inline-block;font-size:10px;font-weight:800;background:var(--violet-bg);color:var(--violet);border-radius:999px;padding:2px 8px;margin-left:4px}
.empty{text-align:center;color:var(--muted);padding:42px 18px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:18px;z-index:9600}
.modal .box{background:var(--card);border-radius:16px;padding:22px;max-width:600px;width:100%;max-height:93vh;overflow:auto;-webkit-overflow-scrolling:touch}
.modal h3{margin-bottom:6px;font-size:16px;position:sticky;top:0;background:var(--card);z-index:3;padding-bottom:6px;font-family:var(--disp)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chip{background:var(--soft);color:var(--petrol-dark);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.chip:active{background:var(--petrol-btn);border-color:var(--petrol-btn);color:#fff;transform:scale(.96)}
.ef-grid{display:flex;flex-direction:column;gap:4px;margin-bottom:5px}
.ef-row{display:flex;align-items:center;gap:7px}
.ef-lbl{flex:0 0 86px;font-size:10.5px;font-weight:800;color:var(--petrol-dark);letter-spacing:.02em;white-space:nowrap}
.ef-grid .ef-row input{flex:1;min-width:0;padding:5px 9px;font-size:13.5px}
.ef-outros{min-height:34px}
.sug-out{background:var(--green-bg);border:1px solid rgba(29,122,70,.28);border-radius:11px;padding:11px 13px;font-size:13px;line-height:1.5;color:var(--ink);margin-top:8px}
.sug-out b{color:var(--petrol-dark)}
.sug-h{font-weight:800;color:var(--petrol-dark);margin:8px 0 3px}
.sug-li{margin:4px 0;padding-left:2px}
.sug-p{margin:5px 0}
.sug-item{display:flex;align-items:flex-start;gap:8px;margin:6px 0;padding-bottom:7px;border-bottom:1px dashed var(--line)}
.sug-item:last-child{border-bottom:none;padding-bottom:0}
.sug-tx{flex:1;min-width:0;font-size:13px;line-height:1.45}
.sug-ok{flex:0 0 auto;background:var(--card);border:1px solid var(--mint-dark);color:var(--green);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
.sug-ok:active{background:var(--mint-dark);color:#fff}
.sug-clear{margin-top:8px;text-align:right}
.sug-clear button{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;text-decoration:underline}
.field{margin-bottom:9px}.field label{display:block;font-weight:600;font-size:12px;margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:var(--panel2);color:var(--ink)}
.field textarea{resize:vertical;min-height:48px;line-height:1.38}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--mint)}
.pt-main,.leito,.field input,.field select,.field textarea{text-transform:uppercase}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:90px 1fr 90px;gap:10px}
.row{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.row.actions{position:sticky;bottom:calc(-1 * env(safe-area-inset-bottom));background:var(--card);padding:10px 0 calc(2px + env(safe-area-inset-bottom));margin-top:8px;z-index:2}
.row.actions .btn{flex:1}
.hint{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.sec-h{font-weight:800;color:var(--petrol-dark);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 9px;border-top:1px solid var(--line);padding-top:13px}
.ai-box{background:var(--soft);border:1px solid rgba(59,123,224,.28);border-radius:12px;padding:13px;margin-bottom:14px}
.ai-box .ai-h{font-weight:800;color:var(--petrol-dark);font-size:14px;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.ai-box textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit;resize:vertical;background:var(--panel2);color:var(--ink);line-height:1.5}
.ai-box textarea:focus{outline:none;border-color:var(--mint)}
.file-in{display:block;width:100%;font-size:13px;font-family:inherit;margin:6px 0;padding:10px;border:1px dashed rgba(88,166,255,.28);border-radius:10px;background:var(--panel2)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.thumb{position:relative;width:76px;height:76px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--panel2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:12px;line-height:1;padding:0;min-height:0;z-index:2}
.thumb-ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:22px;color:var(--petrol-dark);background:var(--panel2)}
.thumb-ph span{font-size:9px;font-weight:800;letter-spacing:.04em}
.thumbs-n{flex:1 0 100%;font-size:12px;font-weight:800;color:var(--green)}
.thumbs-err{flex:1 0 100%;font-size:12px;font-weight:600;color:var(--red);background:var(--red-bg);border-radius:8px;padding:7px 9px;line-height:1.45}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--petrol-dark);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.note{background:var(--soft);border-radius:12px;padding:12px 15px;font-size:13px;color:var(--ink);margin-top:16px;line-height:1.6}
.note b{color:var(--petrol-dark)}
footer{text-align:center;color:var(--muted);font-size:13px;padding:24px}
footer a{color:var(--petrol-dark);font-weight:600;text-decoration:none}
.setor-h{font-size:12px;font-weight:800;color:var(--petrol-dark);text-transform:uppercase;letter-spacing:.04em;margin:16px 2px 8px;display:flex;align-items:center;gap:8px}
.setor-h span{background:var(--soft);color:var(--petrol-dark);border-radius:999px;padding:1px 9px;font-size:11px}
.pt-pend{margin-top:6px;background:var(--amber-bg);border-radius:9px;padding:7px 10px}
.pend-item{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;color:var(--amber);padding:3px 0;cursor:pointer}
.pend-item input{margin-top:2px;flex:0 0 auto;width:18px;height:18px;accent-color:var(--mint-dark);cursor:pointer}
.pend-item.done span{text-decoration:line-through;color:var(--muted)}
.mini-ed{background:none;border:none;cursor:pointer;font-size:12px;opacity:.55;padding:0 4px;vertical-align:middle;font-family:inherit}
.mini-ed:hover{opacity:1}
.pt-pend-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pt-pend-h b{color:var(--amber);font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.pend-empty{font-size:13px;color:var(--muted);padding:2px 0}
.pt-pend-l{display:inline-flex;align-items:center;gap:1px}
.pt-prev{font-size:10.5px;font-weight:800;color:var(--green);background:var(--green-bg);border-radius:999px;padding:2px 9px;cursor:pointer;white-space:nowrap;letter-spacing:.01em}
.pt-prev.empty{color:var(--muted);background:transparent;font-weight:600;opacity:.65;border:1px dashed var(--line)}
.pt-prev:hover{filter:brightness(.96);opacity:1}
.pt-muted{color:var(--muted)}
.evo-out{min-height:60vh;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.55;text-transform:none!important}
@media(max-width:680px){
  .cards{grid-template-columns:1fr 1fr}
  .two,.three{grid-template-columns:1fr}
  .chip{padding:9px 13px;font-size:13px}
  .ai-box{padding:11px}
  .ef-lbl{flex-basis:84px}
  .modal{padding:0;align-items:flex-end}
  .modal .box{max-width:100%;max-height:calc(100dvh - env(safe-area-inset-top) - 8px);border-radius:18px 18px 0 0;padding:18px 16px 14px}
  .pt-card{gap:10px;flex-wrap:wrap}
  .pt-acts{flex-direction:row;flex-wrap:wrap;align-items:stretch;width:100%}
  .pt-acts button{flex:1 1 44%}
  .bar{gap:8px}
  input.search{min-width:0;width:100%;flex:1 1 100%}
  .bar .right{width:100%}
  .bar .right .btn{flex:1}
}
/* ===== modo app (PWA mobile): bottom nav ===== */
@media(max-width:640px){
  .subtitle{display:none}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:55;width:auto;max-width:none;margin:0;border-radius:0;border:none;border-top:1px solid var(--line);padding:6px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,1fr);gap:4px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 -4px 18px rgba(20,24,30,.08)}

  footer{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
  .field input,.field select,.field textarea,input.search{font-size:16px}
}

.modal .box{position:relative}
.modal .box>h3{padding-right:46px}

.ef-row textarea{flex:1;min-width:0;padding:8px 10px;font-size:15px;min-height:38px;resize:none;overflow:hidden;line-height:1.4;border:1px solid var(--line);border-radius:8px;font-family:inherit;background:var(--panel2);color:var(--ink)}
.ef-row textarea:focus{outline:none;border-color:var(--mint)}
@media(max-width:680px){.ef-row textarea{font-size:16px}}
/* ✕ fixo no topo do sheet + selo de rascunho + hierarquia dos botões + chip aguarda visita */
.modal-xwrap{position:sticky;top:8px;height:0;display:flex;justify-content:flex-end;align-items:flex-start;gap:8px;z-index:6}
.modal-x{position:static;box-shadow:0 2px 10px rgba(15,23,42,.14)}

.modal h3{box-shadow:0 -30px 0 0 var(--card)}
/* ===== desktop: modal mais largo + campos de digitação maiores ===== */
#f_hda{min-height:80px}
#ec_txt{min-height:170px}
@media(min-width:860px){
  .modal .box{max-width:820px;padding:26px 30px}

  #f_hda,#f_conduta{min-height:140px}
  #f_lab,#f_culturas,#f_imagem{min-height:100px}
  #f_pend{min-height:110px}
  #ec_txt{min-height:220px}
  .ai-box textarea{min-height:130px}
}

<header>
  <div class="wrap top">

<script>
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const SAIDA={alta:{l:'Alta',c:'b-alta'},obito:{l:'Óbito',c:'b-obito'},transferencia:{l:'Transferência',c:'b-transf'}};
const EF_TEMPLATE='- ESTADO GERAL: \n- NEURO: \n- AC: \n- AP: \n- ABDOME: \n- EXT: \n- PELE: ';
let state={pacientes:[]};
let tab='ativos', busca='', visitaImgs=[], visitaImgErrs=[];

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function nowISO(){return new Date().toISOString();}
function ymd(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtData(s){if(!s)return '';const d=new Date((s.length<=10?s+'T00:00:00':s));if(isNaN(d))return esc(s);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
function setVal(id,v){const e=document.getElementById(id);if(e!=null&&v!=null){e.value=v;if(e.tagName==='TEXTAREA')autoGrow(e,true);const bx=document.querySelector('#modal .box');if(bx&&bx.contains(e))saveDraft();}}
function getVal(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function up(s){return String(s==null?'':s).toUpperCase();}

/* ===== boot ===== */
function sampleSeed(){return {pacientes:[
  {id:uid(),leito:'12A',setor:'Enfermaria',nome:'Maria Souza',idade:'74 anos',sexo:'F',clinica:'Clínica Médica',diagnosticos:'Pneumonia adquirida na comunidade',comorbidades:'HAS, DM2',alergias:'',muc:'Losartana 50 mg/dia',hda:'Quadro de tosse produtiva e febre há 4 dias, com piora da dispneia, admitida em 18/06.',laboratorio:'PCR 180 · leucograma 15.000 com desvio',culturas:'Hemocultura (18/06): em andamento',imagem:'RX tórax: consolidação em base direita',exameFisico:EF_TEMPLATE,evolucao:'',parametros:'',conduta:'Ceftriaxona + azitromicina (D2)',pendencias:[{id:uid(),t:'Colher hemocultura',done:false},{id:uid(),t:'Controle de PCR em 48h',done:false}],obs:'',status:'ativo',criadoEm:nowISO()},
  {id:uid(),leito:'UTI 3',setor:'UTI',nome:'João Lima',idade:'61 anos',sexo:'M',clinica:'Clínica Médica',diagnosticos:'IAM sem supra (NSTEMI)\nIC descompensada',comorbidades:'HAS, tabagismo',alergias:'',muc:'AAS, sinvastatina',hda:'Dor torácica em aperto iniciada há 1 dia, com dispneia progressiva.',laboratorio:'Troponina em curva ascendente',culturas:'',imagem:'ECG: infra de ST em V4-V6 · Eco: FE 35%',exameFisico:EF_TEMPLATE,evolucao:'',parametros:'',conduta:'AAS + clopidogrel + enoxaparina',pendencias:[{id:uid(),t:'CAT amanhã',done:false},{id:uid(),t:'Ajustar diurético',done:false}],obs:'Aguardando vaga em hemodinâmica.',status:'ativo',criadoEm:nowISO()}
]};}
function normalize(d){d=d&&typeof d==='object'?d:{};return {pacientes:Array.isArray(d.pacientes)?d.pacientes:[],_tomb:(d._tomb&&typeof d._tomb==='object')?d._tomb:{}};}

function whenMT(cb){if(window.MT){cb();}else{setTimeout(()=>whenMT(cb),30);}}
whenMT(()=>{MT.mergeFn=(r,l)=>MT.mergeState(r,l,['pacientes']);MT.onData(d=>{
  if(d&&typeof d==='object'&&d.pacientes){state=normalize(d);}
  else{state=(MT.mode==='demo')?sampleSeed():normalize(null);if(MT.mode==='demo')MT.save(state);}
  renderUser();render();
});renderUser();});
function persist(){MT.save(state);}
function renderUser(){const el=document.getElementById('usr');if(!el)return;
  const sn=document.getElementById('storenote');
  if(sn)sn.innerHTML=(MT.mode==='demo')?'<i class="ti ti-tool"></i> <b>Modo demonstração</b> — dados salvos só neste navegador. Entre na conta MedTech para sincronizar e usar a IA.':'<i class="ti ti-cloud-check"></i> Conectado — sua lista de internados sincroniza na nuvem MedTech.';
  if(MT.mode==='demo'){el.innerHTML='<span class="who">Modo demo</span><a href="index.html">← MedTech</a>';return;}
  const u=MT.user;const nm=u?(u.displayName||u.email||'Conta'):'';
  el.innerHTML=`<span class="who">${esc(nm)}</span><button onclick="MT.signOut()">Sair</button>`;}

/* ===== navegação ===== */
function setTab(t){tab=t;busca='';['ativos','saidas'].forEach(x=>{const b=document.getElementById('tab-'+x);if(b)b.className=(x===t?'on':'');});render();}
function ativos(){return state.pacientes.filter(p=>p.status!=='saida');}
function saidos(){return state.pacientes.filter(p=>p.status==='saida');}
function leitoSort(a,b){return String(a.setor||'').localeCompare(String(b.setor||''))||String(a.leito||'').localeCompare(String(b.leito||''),'pt',{numeric:true});}
function render(){tab==='ativos'?renderAtivos():renderSaidas();}
function examesFmt(p){return [p.laboratorio,p.culturas,p.imagem].filter(Boolean).join('\n')||p.exames||'';}
let examOpen=new Set(); let examAllOpen=false;
function toggleExames(id){const o=examOpen.has(id);o?examOpen.delete(id):examOpen.add(id);const b=document.getElementById('exb-'+id),c=document.getElementById('exc-'+id);if(b)b.style.display=o?'none':'';if(c)c.textContent=o?'▸':'▾';}
function toggleAllExames(){examAllOpen=!examAllOpen;examOpen.clear();if(examAllOpen)ativos().forEach(p=>{if(examesFmt(p))examOpen.add(p.id);});render();}

/* O Chrome trata qualquer campo de texto solto como login e injeta o e-mail da conta
   aqui — a lista de pacientes ficava vazia "sozinha". Valor com "@" nunca é busca. */
function buscaSuja(q){return q.indexOf('@')>=0;}
function matchBusca(p){const q=busca.trim().toLowerCase();if(!q||buscaSuja(q))return true;return [p.leito,p.nome,p.diagnosticos,p.setor].some(x=>(x||'').toLowerCase().includes(q));}
function onBusca(el){if(buscaSuja(el.value)){el.value='';busca='';}else busca=el.value;renderListOnly();}

function ptCard(p){
  const meta=[p.idade||'',p.sexo||'',p.setor||''].filter(Boolean).join(' · ');
  const pend=(p.pendencias||[]);
  const exFmt=examesFmt(p);
  const visitHoje=p.visitaEm===ymd();
  const pendHtml=`<div class="pt-pend"><div class="pt-pend-h"><span class="pt-pend-l"><b>Pendências</b><button class="mini-ed" onclick="editCampo('${p.id}','pendencias')"><i class="ti ti-pencil"></i></button></span><span class="pt-prev${p.previsaoAlta?'':' empty'}" onclick="editPrevAlta('${p.id}')" title="Previsão de alta — clique para editar"><i class="ti ti-calendar"></i> ${p.previsaoAlta?('Alta: '+esc(fmtData(p.previsaoAlta))):'+ previsão de alta'}</span></div>${pend.length?pend.map(it=>`<label class="pend-item${it.done?' done':''}"><input type="checkbox" ${it.done?'checked':''} onclick="togglePend('${p.id}','${it.id}')"><span>${esc(it.t)}</span></label>`).join(''):'<div class="pend-empty">Nenhuma pendência.</div>'}</div>`;
  return `<div class="pt-card">
    <div class="leito"><div class="ln">${esc(p.leito||'—')}</div>${p.setor?`<div class="ls">${esc(p.setor)}</div>`:''}</div>
    <div class="pt-main">
      <div class="pt-top"><span class="nome">${esc(p.nome||'Paciente')}</span>${meta?`<span class="meta">${esc(meta)}</span>`:''}${visitHoje?'<span class="chip-hoje"><i class="ti ti-check"></i> visto hoje</span>':'<span class="chip-wait"><i class="ti ti-clock"></i> aguarda visita</span>'}</div>
      <div class="pt-field"><b>Dx:</b> <button class="mini-ed" onclick="editCampo('${p.id}','dx')"><i class="ti ti-pencil"></i></button>${p.diagnosticos?('\n'+esc(bullets(p.diagnosticos))):' <span class="pt-muted">—</span>'}</div>
      <div class="pt-field pt-exwrap">${exFmt?`<div class="pt-exh" onclick="toggleExames('${p.id}')" style="cursor:pointer;display:flex;align-items:center;gap:6px"><b>Exames</b><span class="pt-muted" style="font-weight:400">(${exFmt.split('\n').filter(Boolean).length})</span><button class="mini-ed" onclick="event.stopPropagation();openForm('${p.id}')"><i class="ti ti-pencil"></i></button><span id="exc-${p.id}" style="margin-left:auto;color:var(--muted)">${examOpen.has(p.id)?'▾':'▸'}</span></div><div id="exb-${p.id}" style="${examOpen.has(p.id)?'':'display:none;'}white-space:pre-wrap;margin-top:2px">${esc(bullets(exFmt))}</div>`:`<b>Exames:</b> <button class="mini-ed" onclick="openForm('${p.id}')"><i class="ti ti-pencil"></i></button> <span class="pt-muted">—</span>`}</div>
      ${pendHtml}
      ${p.obs?`<div class="pt-obs"><i class="ti ti-note"></i> ${esc(p.obs)}</div>`:''}
    </div>
    <div class="pt-acts">
      <button class="visita" onclick="openVisita('${p.id}')"><i class="ti ti-stethoscope"></i> Visita</button>
      <button onclick="openForm('${p.id}')"><i class="ti ti-clipboard-text"></i> Ficha</button>
      <button class="saida" onclick="openSaida('${p.id}')"><i class="ti ti-door-exit"></i> Saída</button>
      <button onclick="delPac('${p.id}')"><i class="ti ti-trash"></i></button>
    </div>
  </div>`;
}
function editCampo(pid,campo){
  const p=state.pacientes.find(x=>x.id===pid);if(!p)return;
  const M={dx:{l:'Diagnósticos / hipóteses',v:bullets(p.diagnosticos)},pendencias:{l:'Pendências',v:(p.pendencias||[]).map(x=>'- '+x.t).join('\n')}}[campo];
  if(!M)return;
  modal(`<h3>Editar ${M.l}</h3><div class="hint" style="margin-bottom:8px">${esc(p.nome||'Paciente')} · leito ${esc(p.leito||'—')} — um item por linha</div>
   <div class="field"><textarea id="ec_txt" placeholder="- um por linha">${esc(M.v)}</textarea></div>
   <div class="row actions"><button class="btn btn-p" onclick="saveCampo('${pid}','${campo}')">Salvar</button><button class="btn btn-g" onclick="closeModal()">Cancelar</button></div>`);
  const t=document.getElementById('ec_txt');if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length);}
}
function saveCampo(pid,campo){
  const p=state.pacientes.find(x=>x.id===pid);if(!p)return;p.updatedAt=Date.now();
  const v=getVal('ec_txt');
  if(campo==='dx')p.diagnosticos=bullets(v);
  else if(campo==='pendencias'){const oldP=p.pendencias||[];p.pendencias=v.split('\n').map(s=>s.trim().replace(/^[-•*]\s*/,'')).filter(Boolean).map(t=>{const ex=oldP.find(o=>up(o.t)===up(t));return {id:ex?ex.id:uid(),t,done:ex?ex.done:false};});}
  persist();closeModal();render();
}
function editPrevAlta(pid){
  const p=state.pacientes.find(x=>x.id===pid);if(!p)return;
  modal(`<h3><i class="ti ti-calendar"></i> Previsão de alta</h3>
   <div class="hint" style="margin-bottom:8px">${esc(p.nome||'Paciente')} · leito ${esc(p.leito||'—')} — opcional, preenchimento manual.</div>
   <div class="field"><label>Data prevista para a alta</label><input type="date" id="pa_date" value="${esc(p.previsaoAlta||'')}"></div>
   <div class="row actions"><button class="btn btn-p" onclick="savePrevAlta('${pid}')">Salvar</button>${p.previsaoAlta?`<button class="btn btn-g" onclick="savePrevAlta('${pid}',true)">Remover</button>`:''}<button class="btn btn-g" onclick="closeModal()">Cancelar</button></div>`);
}
function savePrevAlta(pid,clear){
  const p=state.pacientes.find(x=>x.id===pid);if(!p)return;p.updatedAt=Date.now();
  p.previsaoAlta=clear?'':getVal('pa_date');persist();closeModal();render();
}

function renderAtivos(){
  const list=ativos().slice().sort(leitoSort).filter(matchBusca);
  const tot=ativos().length;
  const uti=ativos().filter(p=>/\buti\b/i.test(p.setor||'')||/\buti\b/i.test(p.leito||'')).length;
  const comPend=ativos().filter(p=>(p.pendencias||[]).some(x=>!x.done)).length;
  let html=`<div class="cards">
    <div class="kpi"><div class="l">Internados</div><div class="v">${tot}</div></div>
    <div class="kpi blue"><div class="l">Em UTI</div><div class="v">${uti}</div></div>
    <div class="kpi"><div class="l">Com pendências</div><div class="v">${comPend}</div></div>
    <div class="kpi green"><div class="l">Saídas registradas</div><div class="v">${saidos().length}</div></div>
  </div>
  <div class="bar">
    <input class="search" id="sin" type="text" name="filtro-leito" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" data-1p-ignore data-lpignore="true" placeholder="Buscar leito, nome ou diagnóstico..." value="${esc(busca)}" oninput="onBusca(this)" onfocus="if(buscaSuja(this.value)){this.value='';busca='';renderListOnly();}">
    <div class="right"><button class="btn btn-g btn-sm" onclick="toggleAllExames()" title="Recolher/expandir os exames de todos">${examAllOpen?'<i class="ti ti-chevrons-up"></i> Recolher exames':'<i class="ti ti-chevrons-down"></i> Expandir exames'}</button><button class="btn btn-g btn-sm" onclick="resumoPlantao()"><i class="ti ti-clipboard-list"></i> Passar plantão</button><button class="btn btn-p btn-sm" onclick="openForm()">+ Novo paciente</button></div>
  </div><div id="ptlist"></div>`;
  document.getElementById('view').innerHTML=html;
  const inp=document.getElementById('sin');if(inp&&busca){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}
  renderListOnly();
}
function grupoKeys(groups){return Object.keys(groups).sort((a,b)=>a==='Sem setor'?1:b==='Sem setor'?-1:a.localeCompare(b,'pt'));}
function agrupaPorSetor(list){const g={};list.forEach(p=>{const k=(p.setor||'').replace(/\s+/g,' ').trim().toUpperCase()||'Sem setor';(g[k]=g[k]||[]).push(p);});Object.keys(g).forEach(k=>g[k].sort((a,b)=>String(a.leito||'').localeCompare(String(b.leito||''),'pt',{numeric:true})));return g;}
function renderListOnly(){
  const box=document.getElementById('ptlist');if(!box)return;
  const list=ativos().filter(matchBusca);
  if(!list.length){box.innerHTML=ativos().length?'<div class="empty">Nenhum paciente encontrado para a busca.</div>':'<div class="empty">Nenhum paciente internado.<br>Toque em <b>+ Novo paciente</b> — você pode colar a evolução e a IA preenche os campos.</div>';return;}
  const g=agrupaPorSetor(list);
  box.innerHTML=grupoKeys(g).map(k=>`<div class="setor-h"><i class="ti ti-building-hospital"></i> ${esc(k)} <span>${g[k].length}</span></div>`+g[k].map(ptCard).join('')).join('');
}

function renderSaidas(){
  const list=saidos().slice().sort((a,b)=>String((b.saida&&b.saida.data)||'').localeCompare(String((a.saida&&a.saida.data)||'')));
  let html=`<div class="bar"><div style="color:var(--muted);font-size:13px;font-weight:600">${list.length} saída(s) registrada(s)</div></div>`;
  if(!list.length){html+='<div class="empty">Nenhuma saída registrada ainda.<br>Em um paciente internado, toque em <b>Saída</b> para registrar alta, óbito ou transferência.</div>';}
  else html+=list.map(p=>{const s=p.saida||{};const sd=SAIDA[s.tipo]||{l:s.tipo||'Saída',c:'b-obito'};
    return `<div class="pt-card sa">
      <div class="leito" style="background:var(--muted)"><div class="ln">${esc(p.leito||'—')}</div></div>
      <div class="pt-main">
        <div class="pt-top"><span class="nome">${esc(p.nome||'Paciente')}</span><span class="badge ${sd.c}">${sd.l}</span><span class="meta">${fmtData(s.data)}${s.destino?(' · '+esc(s.destino)):''}</span></div>
        ${p.diagnosticos?`<div class="pt-field"><b>Dx:</b> ${esc(p.diagnosticos)}</div>`:''}
        ${s.obs?`<div class="pt-obs"><i class="ti ti-note"></i> ${esc(s.obs)}</div>`:''}
      </div>
      <div class="pt-acts">
        <button onclick="reabrir('${p.id}')">↩️ Reinternar</button>
        <button onclick="delPac('${p.id}')"><i class="ti ti-trash"></i></button>
      </div>
    </div>`;}).join('');
  document.getElementById('view').innerHTML=html;
}

/* ===== ficha do paciente (dados de base + extração por IA) ===== */
/* ===== admissão por áudio: grava → transcreve no modelo de anamnese → reusa extrairEvol p/ preencher a ficha ===== */
let admStream=null,admRec=null,admChunks=[],admListening=false;
function pickAudioMime(){const c=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'];for(const m of c){if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))return m;}return '';}
function blobToB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result||'').split(',')[1]||'');r.onerror=rej;r.readAsDataURL(blob);});}
function admStop(){admListening=false;if(admStream){admStream.getTracks().forEach(t=>t.stop());admStream=null;}}
async function gravarAdmissao(id){
  const btn=document.getElementById('admRecBtn');
  if(admListening){if(admRec&&admRec.state!=='inactive')admRec.stop();return;}
  if(MT.mode!=='cloud'||!MT.aiAudio){alert('Para gravar a admissão em áudio, entre na sua conta MedTech.');return;}
  try{admStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});}
  catch(e){alert('Permita o acesso ao microfone.');return;}
  const mime=pickAudioMime();admChunks=[];
  try{admRec=new MediaRecorder(admStream,mime?{mimeType:mime,audioBitsPerSecond:24000}:{audioBitsPerSecond:24000});}
  catch(e){try{admRec=new MediaRecorder(admStream);}catch(e2){alert('Não foi possível iniciar a gravação.');admStop();return;}}
  admRec.ondataavailable=e=>{if(e.data&&e.data.size)admChunks.push(e.data);};
  admRec.onstop=()=>{admStop();processAdmissaoAudio(id);};
  admRec.start(1000);admListening=true;
  if(btn){btn.innerHTML='⏹️ Parar e transcrever';btn.style.background='#dc2626';btn.style.color='#fff';}
}
async function processAdmissaoAudio(id){
  const blob=new Blob(admChunks,{type:(admChunks[0]&&admChunks[0].type)||'audio/webm'});
  const btn=document.getElementById('admRecBtn');
  const reset=()=>{if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-microphone"></i> '+(id?'Gravar evolução':'Gravar admissão');btn.style.background='';btn.style.color='';}};
  if(!blob.size){reset();return;}
  if(btn){btn.disabled=true;btn.style.background='';btn.style.color='';btn.innerHTML='<span class="spin"></span> Transcrevendo…';}
  try{
    const b64=await blobToB64(blob);
    if(b64.length>9400000){alert('Gravação muito longa (~30–40 min máx por bloco). Grave em partes menores.');reset();return;}
    const mt=(blob.type||'audio/webm').split(';')[0];
    const prompt='Você recebeu o ÁUDIO da ADMISSÃO de um paciente sendo INTERNADO (anamnese de admissão — fala do médico e do paciente). Transcreva internamente e organize uma ANAMNESE DE ADMISSÃO clara em português do Brasil, com as seções: Identificação, Queixa principal, História da doença atual, Antecedentes pessoais, Medicações em uso, Alergias, Exame físico e Hipóteses/Conduta inicial. REGRAS: a HDA deve ser TEXTO CORRIDO e CRONOLÓGICO, conectando os sintomas; em Antecedentes use os DIAGNÓSTICOS padronizados (ex.: "pressão alta"→HAS, "colesterol alto"→dislipidemia/DLP, "diabetes"→DM2), não a fala literal; em Medicações em uso liste APENAS os nomes; não invente — escreva "[não informado]" se faltar; texto limpo, SEM markdown (sem # nem *).';
    const text=await MT.aiAudio(b64,mt,prompt);
    const ev=document.getElementById('f_evol');if(ev)ev.value=(text||'').trim();
    if(btn)btn.innerHTML='<span class="spin"></span> Preenchendo a ficha…';
    await extrairEvol(id||'');
  }catch(e){alert('⚠️ '+(e.message||'Falha ao processar o áudio.'));}
  finally{reset();}
}
function openForm(id){
  const p=id?state.pacientes.find(x=>x.id===id):{leito:'',setor:'',nome:'',idade:'',sexo:'',clinica:'Clínica Médica',diagnosticos:'',comorbidades:'',alergias:'',muc:'',hda:'',laboratorio:'',culturas:'',imagem:'',exameFisico:'',conduta:'',obs:''};
  const sx=['','M','F'].map(k=>`<option value="${k}" ${p.sexo===k?'selected':''}>${k||'—'}</option>`).join('');
  modal(`<h3>${id?'Editar':'Novo'} paciente</h3>
   <div class="ai-box">
     <div class="ai-h"><i class="ti ti-sparkles"></i> ${id?'Atualizar pela nova evolução':'Colar evolução ou gravar a admissão — a IA preenche a ficha'}</div>
     <textarea id="f_evol" placeholder="${id?'Cole a NOVA evolução de hoje — a IA ATUALIZA exames, exame físico, conduta e pendências, mantendo os dados de base.':'Cole aqui a evolução / prontuário do paciente. A IA extrai identificação, comorbidades, HDA, exames, exame físico, conduta e pendências.'}"></textarea>

function saveForm(id){

  const o={leito:getVal('f_leito'),setor:getVal('f_setor'),nome:getVal('f_nome'),idade:getVal('f_idade'),sexo:getVal('f_sexo'),diagnosticos:bullets(getVal('f_dx')),comorbidades:getVal('f_comorb'),alergias:getVal('f_alergias'),muc:getVal('f_muc'),hda:getVal('f_hda'),laboratorio:bullets(getVal('f_lab')),culturas:bullets(getVal('f_culturas')),imagem:bullets(getVal('f_imagem')),exameFisico:getVal('f_ef'),conduta:bullets(getVal('f_conduta')),pendencias:pend,previsaoAlta:getVal('f_prevAlta'),obs:getVal('f_obs')};
  if(!o.leito&&!o.nome){alert('Informe ao menos o leito ou o nome do paciente.');return;}

}

function bullets(s){return String(s||'').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>/^[-•*>]/.test(x)?('- '+x.replace(/^[-•*>]\s*/,'')):('- '+x)).join('\n');}

const SISTEMAS=[{k:'EG',l:'ESTADO GERAL'},{k:'NEURO',l:'NEURO'},{k:'AC',l:'AC'},{k:'AP',l:'AP'},{k:'ABDOME',l:'ABDOME'},{k:'EXT',l:'EXT'},{k:'PELE',l:'PELE'}];
function efRegex(){return new RegExp('^\\s*-?\\s*('+SISTEMAS.map(s=>s.l).join('|')+')\\s*:\\s*(.*)$','i');}
function parseEF(ef){const map={};SISTEMAS.forEach(s=>map[s.k]='');const outros=[];const rx=efRegex();String(ef||'').split('\n').forEach(line=>{const m=line.match(rx);if(m){const sys=SISTEMAS.find(s=>s.l===m[1].toUpperCase());if(sys)map[sys.k]=(m[2]||'').trim();}else{const t=line.replace(/^\s*-\s*/,'').trim();if(t)outros.push(t);}});return {map,outros:outros.join('\n')};}
function buildEF(){const lines=SISTEMAS.map(s=>{const v=getVal('ef_'+s.k).trim();return v?('- '+s.l+': '+v):null;}).filter(Boolean);getVal('ef_outros').split('\n').map(x=>x.trim().replace(/^-\s*/,'')).filter(Boolean).forEach(x=>lines.push('- '+x));return lines.join('\n');}

function addCondutaChip(t){const e=document.getElementById('v_conduta');if(!e)return;const c=e.value.replace(/\s+$/,'');e.value=(c?c+'\n':'')+'- '+t;e.focus();}
/* ===== análise da evolução por IA (sugere oportunidades, NÃO edita) ===== */
const PROMPT_ANALISE='Você é um médico hospitalista sênior revisando o caso de um paciente INTERNADO para apoiar o colega de plantão. Aponte OPORTUNIDADES DE MELHORIA na condução — somente SUGESTÕES; NÃO reescreva a evolução. Verifique especificamente:\n'
 +'1) AJUSTE GLICÊMICO: glicemia/DX alterada (hiper/hipo) sem tratamento/ajuste na conduta.\n'
 +'2) AJUSTE PRESSÓRICO: PA fora de meta (hiper/hipotensão) sem ajuste de anti-hipertensivo/vasoativo.\n'
 +'3) INVESTIGAÇÃO DE FEBRE: febre/temperatura elevada sem investigação de foco (culturas/exames/imagem) ou sem ATB quando indicado.\n'
 +'4) ATB x FUNÇÃO RENAL: se há antibiótico em uso E função renal alterada (creatinina/ureia/TFG) E a evolução NÃO sinaliza que a dose já está ajustada → sugerir checar/ajustar a dose. Se já está sinalizado como ajustado, NÃO sugira.\n'
 +'5) EXAMES FALTANTES: exames específicos importantes para o quadro ainda não solicitados.\n'
 +'6) PROFILAXIA/SEGURANÇA: profilaxia de TEV, protetor gástrico, interações/dose máxima — quando claramente indicado e ausente.\n'
 +'7) PENDÊNCIAS não endereçadas ou condutas incompletas.\n'
 +'IMPORTANTE: os itens 1, 2 e 3 (glicêmico, pressórico, febre) são DINÂMICOS — sinalize-os SEMPRE que o PARÂMETRO DO DIA estiver alterado/descompensado, MESMO que constem em "PONTOS JÁ AVALIADOS" (são reavaliados a cada dia). Os itens 4 a 7, se já avaliados, NÃO repita.\n'
 +'REGRAS: seja OBJETIVO e PRÁTICO. Bullets curtos começando por "- ", citando o DADO que motivou (ex.: "DX 256 MG/DL", "CR 2,1", "T 38,5°C"). Só sugira o que tiver respaldo nos dados; se uma categoria está adequada, NÃO cite. Se NÃO houver oportunidade relevante, responda APENAS: "✅ Sem oportunidades críticas de ajuste no momento." NUNCA invente dados ausentes. Português do Brasil, no máximo ~8 bullets. Se vier uma seção "PONTOS JÁ AVALIADOS", NÃO repita nenhum daqueles itens (exceto se o dado ATUAL mostrar piora/mudança relevante). Termine com a linha: "<i class="ti ti-alert-triangle"></i> Sugestões de apoio — a decisão é do médico."';
function dadosParaAnalise(p){
  const aberto=!!document.getElementById('v_evol');
  const ev=aberto?getVal('v_evol'):(p.evolucao||'');
  const pr=aberto?getVal('v_param'):(p.parametros||'');
  const ef=aberto?buildEF():(p.exameFisico||'');
  const cd=aberto?getVal('v_conduta'):(p.conduta||'');
  const pd=aberto?getVal('v_pend'):((p.pendencias||[]).map(x=>'- '+x.t).join('\n'));
  const L=[];
  L.push('PACIENTE: '+(p.nome||'—')+(p.idade?(', '+p.idade):'')+(p.sexo?(' · '+p.sexo):''));
  if(p.diagnosticos)L.push('MOTIVO DA INTERNAÇÃO:\n'+p.diagnosticos);
  if(p.comorbidades)L.push('COMORBIDADES: '+p.comorbidades);
  if(p.muc)L.push('MEDICAÇÕES DE USO CONTÍNUO: '+p.muc);
  if(p.hda)L.push('HDA: '+p.hda);
  if(ev)L.push('EVOLUÇÃO DE HOJE: '+ev);
  if(pr)L.push('PARÂMETROS (24H): '+pr);
  if(ef&&ef.trim())L.push('EXAME FÍSICO:\n'+ef);
  if(p.laboratorio)L.push('LABORATÓRIO:\n'+p.laboratorio);
  if(p.culturas)L.push('CULTURAS:\n'+p.culturas);
  if(p.imagem)L.push('EXAMES DE IMAGEM:\n'+p.imagem);
  if(cd)L.push('CONDUTA ATUAL:\n'+cd);
  if(pd)L.push('PENDÊNCIAS:\n'+pd);
  return L.join('\n\n');
}
function mdInline(s){return esc(String(s||'')).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
function normSug(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim().slice(0,70);}
function isDinamica(t){t=String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');return /pressoric|hipertens|hipotens|\bpa\b|pressao/.test(t)||/glic|hipergli|hipogli|\bdx\b|insulin|\bhgt\b/.test(t)||/febre|febril|temperatura|hipertermia/.test(t);}
let _sugAtual=[], _sugCtx=null;
function renderSugestoes(id,txt,alvo){
  const p=state.pacientes.find(x=>x.id===id);if(!p||!alvo)return;
  _sugCtx={id,txt,alvo};
  const ack=p.sugAck||[];
  const ackDia=(p.sugAckDia&&p.sugAckDia.data===ymd())?(p.sugAckDia.items||[]):[];
  _sugAtual=[];let html='',nItens=0;
  String(txt||'').split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
    if(/^[-•*]\s/.test(l)){
      const item=l.replace(/^[-•*]\s*/,'');
      if((isDinamica(item)?ackDia:ack).some(a=>normSug(a)===normSug(item)))return; // estáticos: silenciados de vez; dinâmicos (PA/glicemia/febre): só no dia de hoje
      const i=_sugAtual.length;_sugAtual.push(item);nItens++;
      html+=`<div class="sug-item"><div class="sug-tx">${mdInline(item)}</div><button class="sug-ok" onclick="ackSug('${id}',${i},this)" title="Marcar como resolvido — não sugerir de novo"><i class="ti ti-check"></i> OK</button></div>`;
    } else if(/^#{1,4}\s/.test(l)){
      html+=`<div class="sug-h">${esc(l.replace(/^#{1,4}\s*/,''))}</div>`;
    } else { html+=`<div class="sug-p">${mdInline(l)}</div>`; }
  });
  if(!nItens && !/✅|sem oportunidade/i.test(txt)) html+='<div class="sug-p">✅ Sem novas oportunidades (os pontos marcados como OK foram ocultados).</div>';
  const nAck=ack.length+ackDia.length;
  if(nAck) html+=`<div class="sug-clear"><button onclick="limparAck('${id}')">↺ Limpar ${nAck} marcação(ões) "OK"</button></div>`;
  alvo.innerHTML='<div class="sug-out">'+html+'</div>';
}
function ackSug(id,i,btn){
  const p=state.pacientes.find(x=>x.id===id);if(!p)return;p.updatedAt=Date.now();
  const item=_sugAtual[i];if(!item)return;
  if(isDinamica(item)){ // PA/glicemia/febre: OK vale só para HOJE — reaparece amanhã se o parâmetro do dia ainda estiver alterado
    const hoje=ymd();
    if(!p.sugAckDia||p.sugAckDia.data!==hoje)p.sugAckDia={data:hoje,items:[]};
    if(!p.sugAckDia.items.some(a=>normSug(a)===normSug(item)))p.sugAckDia.items.push(item);
  } else { // pontuais (exame, ATB/função renal, profilaxia...): silenciado de vez
    p.sugAck=p.sugAck||[];if(!p.sugAck.some(a=>normSug(a)===normSug(item)))p.sugAck.push(item);
  }
  persist();
  const row=btn&&btn.closest('.sug-item');if(row)row.remove();
}
function limparAck(id){
  const p=state.pacientes.find(x=>x.id===id);if(!p)return;p.updatedAt=Date.now();
  p.sugAck=[];p.sugAckDia=null;persist();
  if(_sugCtx&&_sugCtx.id===id)renderSugestoes(id,_sugCtx.txt,_sugCtx.alvo);
}
async function rodarAnalise(id,alvo,btn){
  const p=state.pacientes.find(x=>x.id===id);if(!p||!alvo)return;
  alvo.innerHTML='<div class="sug-out"><span class="spin"></span> Analisando o caso e buscando oportunidades de melhoria…</div>';
  if(btn)btn.disabled=true;
  try{
    const ack=(p.sugAck||[]);
    const ackBlock=ack.length?('\n\n=== PONTOS JÁ AVALIADOS/DECIDIDOS PELO MÉDICO (NÃO sugerir de novo, salvo piora relevante) ===\n'+ack.map(a=>'- '+a).join('\n')):'';
    const txt=await MT.ai(PROMPT_ANALISE+'\n\n=== CASO ===\n'+dadosParaAnalise(p)+ackBlock, 'gemini-2.5-pro');
    renderSugestoes(id,txt,alvo);
  }catch(e){
    alvo.innerHTML='<div class="sug-out" style="color:var(--red)">⚠️ '+esc(e.message||'Falha na IA.')+(MT.mode==='demo'?' (Entre na conta MedTech para usar a IA.)':'')+'</div>';
  }
  if(btn)btn.disabled=false;
}

function guessMime(name){const n=(name||'').toLowerCase();if(/\.png$/.test(n))return 'image/png';if(/\.webp$/.test(n))return 'image/webp';if(/\.(heic|heif)$/.test(n))return 'image/heic';return 'image/jpeg';}
function readFileRetry(f,tries,onok,onfail){
  const go=n=>{
    const r=new FileReader();
    r.onload=()=>onok(String(r.result||''));
    r.onerror=()=>{if(n<tries)setTimeout(()=>go(n+1),900);else onfail();}; // retry: acessar de novo pode forçar o download do iCloud
    try{r.readAsDataURL(f);}catch(e){if(n<tries)setTimeout(()=>go(n+1),900);else onfail();}
  };
  go(0);
}
function addParamImgs(input){
  const files=[...(input.files||[])];
  if(!files.length)return;
  visitaImgErrs=[];
  let pending=files.length;
  const doneOne=()=>{if(--pending<=0){try{input.value='';}catch(e){}}};
  files.forEach(f=>{
    const origMime=f.type||guessMime(f.name);
    readFileRetry(f,2,dataUrl=>{
      if(!dataUrl){visitaImgErrs.push(f.name||'imagem');renderThumbs();doneOne();return;}
      downscale(dataUrl,3200,.92,(outUrl,outMime)=>{
        const url=outUrl||dataUrl, mime=outMime||origMime||'image/jpeg', b64=(url.split(',')[1]||'');
        if(b64)visitaImgs.push({data:b64,mimeType:mime,thumb:url,heic:/heic|heif/i.test(mime)});
        else visitaImgErrs.push(f.name||'imagem');
        renderThumbs();doneOne();
      });
    },()=>{visitaImgErrs.push(f.name||'imagem');renderThumbs();doneOne();});
  });
  renderThumbs();
}
function renderThumbs(){const box=document.getElementById('v_thumbs');if(!box)return;
  let h=(visitaImgs.length?`<div class="thumbs-n"><i class="ti ti-check"></i> ${visitaImgs.length} foto(s) anexada(s)</div>`:'');
  h+=visitaImgs.map((im,i)=>`<div class="thumb">${im.heic?'<div class="thumb-ph"><i class="ti ti-photo"></i><span>FOTO</span></div>':`<img src="${im.thumb}" onerror="this.style.opacity=0">`}<button onclick="rmThumb(${i})">✕</button></div>`).join('');
  if(visitaImgErrs.length)h+=`<div class="thumbs-err"><i class="ti ti-alert-triangle"></i> Não consegui ler: ${esc(visitaImgErrs.join(', '))}. No Mac, fotos do iPhone podem estar no iCloud sem download — abra a foto no app Fotos (ou arraste pra Mesa) e tente de novo. No celular, tire a foto na hora.</div>`;
  box.innerHTML=h;}
function rmThumb(i){visitaImgs.splice(i,1);renderThumbs();}
function downscale(dataUrl,maxDim,q,cb){
  const img=new Image();let done=false;const finish=(u,m)=>{if(done)return;done=true;cb(u,m);};
  img.onload=()=>{try{const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;if(!w||!h)return finish(null,null);const sc=Math.min(1,maxDim/Math.max(w,h));const cw=Math.max(1,Math.round(w*sc)),ch=Math.max(1,Math.round(h*sc));const c=document.createElement('canvas');c.width=cw;c.height=ch;c.getContext('2d').drawImage(img,0,0,cw,ch);finish(c.toDataURL('image/jpeg',q),'image/jpeg');}catch(e){finish(null,null);}};
  img.onerror=()=>finish(null,null);
  setTimeout(()=>finish(null,null),6000);
  img.src=dataUrl;
}
const PARAM_PROMPT='Você é um escriba clínico. Recebe a FOTO manuscrita de UMA folha das últimas 24h de um paciente internado: ou uma folha de CONTROLE HEMODINÂMICO (sinais vitais por horário), ou uma folha de CONTROLE HÍDRICO (ganhos/perdas, diurese, balanço). Identifique qual é, transcreva os DÍGITOS com precisão e termine com UMA linha padronizada. Campos que não existem nesta folha: simplesmente omita.\n'
 +'COMO PENSAR (faça isto internamente, em silêncio, e NÃO escreva na resposta): as fotos podem estar GIRADAS (deitadas) e ter FAIXAS DE SOMBRA — gire mentalmente e leia a folha INTEIRA, da primeira à ÚLTIMA coluna da direita. As ÚLTIMAS colunas são as medidas mais recentes e as mais importantes clinicamente (é onde aparecem hipotensão, febre, queda de saturação); sombra sobre a coluna NÃO significa coluna vazia — esforce-se para lê-la. Leia COLUNA POR COLUNA (cada coluna = um horário), dígito por dígito, sem trocar valores entre linhas nem entre colunas; pule células vazias. Depois faça uma SEGUNDA PASSADA apenas conferindo os EXTREMOS de cada linha (menor e maior do dia) — confirme que a MENOR PA da sua resposta é um par que está realmente ESCRITO na folha (ex.: se a folha tem 75X45, o mínimo é 75X45, nunca um valor maior). Então calcule as faixas mínimo–máximo, a lista cronológica COMPLETA das glicemias (até a última coluna), a diurese e o balanço.\n'
 +'PROIBIDO INVENTAR: todo número da resposta precisa estar ESCRITO em alguma célula da foto. Se um dígito ficou ilegível, OMITA esse valor e use os demais — nunca chute, nunca "arredonde", nunca complete. Antes de responder, confira os DOIS ÚLTIMOS dígitos dos números grandes (ex.: +1.695 é +1695, não +1659).\n'
 +'FORMATO DA RESPOSTA — duas partes, nesta ordem:\n'
 +'1) TRANSCRIÇÃO COLUNA A COLUNA (esta parte é rascunho de conferência; folha hemodinâmica: uma linha por horário, ex. "08:00 → PA 142X73; FC 90; FR 18; T 35,5; SAT 96; DX 139"; folha hídrica: uma linha por turno, ex. "TURNO 1 → DIURESE 300; HD 800; BH -800". Transcreva TODAS as colunas, inclusive as últimas; célula ilegível = escreva "?").\n'
 +'2) A LINHA FINAL, começando EXATAMENTE com "FINAL: ", em MAIÚSCULAS, única, derivada SOMENTE da transcrição acima (se um valor não está no rascunho, não pode estar na linha final). Omita campos sem dado:\n'
 +'FINAL: PA [sist_min-sist_max] X [diast_min-diast_max] MMHG // FC [min-max] BPM // FR [min-max] IRPM // T [min-max] ºC // SPO2 [min-max]% // DX [glicemias em ordem de horário separadas por hífen] MG/DL // DIURESE [total em ML — ou "PRESENTE, NÃO QUANTIFICADA"] // HEMODIÁLISE [valor] ML (só se houver) // DRENO [total] ML (só se houver) // BH [valor com sinal] ML\n'
 +'REGRAS: '
 +'(A) A folha hemodinâmica costuma ter, ABAIXO dos valores, uma GRADE DE ESCORE (MEWS/alerta precoce) com números 0, 1, 2 e 3 nas células — IGNORE esses escores; use SEMPRE o valor REAL medido, nunca o escore. '
 +'(B) PA = sistólica × diastólica (linha "PRESSÃO ARTERIAL", pares tipo 136/75, 130X80): use a MENOR e a MAIOR sistólica e a MENOR e a MAIOR diastólica do dia (ex.: PA 100-136 X 60-80). Valores HIPOTENSOS (sistólica < 90, ex.: 75X45, 85X49) são os MAIS importantes da folha — jamais podem faltar na faixa. Ao lado do par pode haver a PAM entre parênteses (ex.: 75X45 (55)) — NUNCA use a PAM nem o escore, só o par. '
 +'(C) DX (glicemia/HGT): em ordem CRONOLÓGICA separadas por "-" (ex.: DX 229-165-148-110) — o hífen separa horários, NÃO é faixa; pule horários sem medida; se houver só uma, registre só ela; se nenhuma, escreva "DX NÃO AFERIDA". '
 +'(D) FOLHA HÍDRICA: tem CABEÇALHOS escritos em cima de cada coluna. GANHOS/ENTRADAS = soro/SF, hidratação, dieta, água, medicações diluídas. PERDAS/SAÍDAS = DIURESE, DIÁLISE/ultrafiltração (UF), DRENOS, vômitos. Leia os cabeçalhos e classifique cada coluna por eles; DIURESE é SOMENTE a coluna rotulada como diurese (não confunda com ganhos). '
 +'(E) DIURESE: muitas folhas marcam diurese/evacuação só com LETRAS — P (presente) ou A (ausente) — sem volume. LETRA NÃO É VOLUME: nunca converta P/A em ml nem some letra como número. Três casos: (1) coluna SÓ com P/A (NENHUM dígito em NENHUMA célula da coluna) → "DIURESE PRESENTE, NÃO QUANTIFICADA"; (2) coluna SÓ com números → "DIURESE [soma] ML"; (3) coluna MISTA (números em uns turnos e P em outros — MUITO COMUM) → "DIURESE [soma dos números] ML + TURNOS COM DIURESE PRESENTE NÃO QUANTIFICADA" (a soma é PARCIAL: os turnos com P não entram em ml, mas NÃO podem sumir da resposta). Coluna vazia → "DIURESE NÃO AFERIDA". ERRO GRAVE A EVITAR: se você enxergar QUALQUER dígito numérico em QUALQUER célula da coluna diurese (mesmo que a folha pareça confusa, com números empilhados/duplicados nas linhas de fechamento sombreadas — ver regra E2), o caso NUNCA é "PRESENTE, NÃO QUANTIFICADA" pura; é o caso (2) ou (3). Não use "NÃO QUANTIFICADA" como saída padrão por insegurança — releia a coluna inteira antes de decidir. '
 +'(E2) LINHAS DE FECHAMENTO PARCIAL (subtotal de 6h) — ERRO GRAVE A EVITAR: muitas folhas hídricas FECHAM o balanço a cada ~6h numa LINHA SOMBREADA / mais escura, que em geral é a ÚNICA com a coluna "TOTAL DE PERDAS" e/ou "TOTAL BALANÇO" preenchida. Nessa linha, o número da coluna DIURESE é o SUBTOTAL das 6h — NÃO é um horário isolado. É PROIBIDO somar as células individuais de diurese JUNTO com essas linhas de fechamento: isso conta em DOBRO e superestima gravemente a diurese (perigoso). REGRA: se existirem linhas de fechamento (com TOTAL DE PERDAS/BALANÇO preenchido), a DIURESE das 24h = SOMA APENAS dos valores da coluna DIURESE dessas linhas de fechamento (tipicamente 4 blocos de 6h = 24h; ex.: subtotais 300+600+700+500 = 2100 ML, NUNCA a soma de tudo = 4600). Só quando NÃO houver nenhuma linha de fechamento é que você soma os horários individuais. A MESMA lógica vale para o BH (use o TOTAL BALANÇO fechado, não a soma de tudo). '
 +'(F) HEMODIÁLISE/UF e DRENOS: se a coluna de hemodiálise (ou ultrafiltração) tiver volume, é PERDA importante — acrescente "// HEMODIÁLISE [valor] ML". DRENOS: qualquer coluna de dreno preenchida conta como perda, INDEPENDENTE do tipo/modalidade (torácico D/E, abdominal, ventricular, JP, renal/CVVH, "outros drenos" etc.) — inclusive quando o cabeçalho impresso da coluna foi substituído/anotado à mão por outro nome (ex.: alguém escreveu "RENAL" por cima de "DRENO TÓRAX D/E": ainda assim é um dreno, não ignore). Se houver MAIS DE UMA coluna de dreno preenchida, SOME o débito de todas num ÚNICO total — não crie um campo por tipo nem descreva a modalidade, é só o débito total de dreno — e acrescente "// DRENO [total] ML". '
 +'(F2) CHECKLIST OBRIGATÓRIO DE DRENO — ERRO GRAVE E FREQUENTE A EVITAR: as colunas "DRENO TÓRAX DIREITO" e "DRENO TÓRAX ESQUERDO" ficam entre as PRIMEIRAS colunas da folha hídrica (logo depois de RESÍDUO GÁSTRICO/VÔMITOS, bem ANTES de DIURESE) e são fáceis de pular na leitura por estarem longe do "TOTAL DE PERDAS" à direita. Antes de escrever a linha FINAL, releia especificamente essas colunas de dreno da esquerda pra direita e confira célula por célula se há número — não confie só na memória da primeira passada. Se qualquer coluna de dreno tiver número em qualquer linha, a linha final OBRIGATORIAMENTE precisa ter "// DRENO [total] ML" (regra F); esquecer o dreno é um erro tão grave quanto errar a PA. '
 +'(G) BALANÇO HÍDRICO (BH): se a folha tiver o TOTAL DE BALANÇO das 24h escrito (linha/coluna "TOTAL BALANÇO", geralmente o último valor embaixo), USE esse valor com o sinal — confira somando os balanços parciais dos turnos, que devem bater com ele. Atenção ao ponto de milhar (ex.: +1.120 = +1120 ml). Só se NÃO houver total escrito, calcule: soma dos ganhos − (diurese em ml + hemodiálise/UF + drenos + vômitos). Se a diurese não foi quantificada E não houver total escrito, escreva "BH NÃO AFERIDO" — nunca estime. '
 +'(H) Sem folha hídrica: escreva "DIURESE NÃO AFERIDA" e "BH NÃO AFERIDO". '
 +'(I) Se um sinal não aparece nas fotos, omita o campo inteiro. Repito: a resposta é SÓ a linha de parâmetros, nada mais.';
async function transcreverParams(){
  if(!visitaImgs.length){alert('Anexe ao menos uma foto dos parâmetros.');return;}
  const b=document.getElementById('transBtn');b.innerHTML='<span class="spin"></span> Transcrevendo...';b.disabled=true;
  // 1 chamada de IA POR FOTO (campo visual menor lê o manuscrito muito melhor que fotos juntas)
  const extrairFinal=out=>{
    const ls=String(out||'').replace(/```/g,'').replace(/\*\*/g,'').split('\n').map(s=>s.trim()).filter(Boolean);
    let l=[...ls].reverse().find(x=>/^FINAL\s*:/i.test(x))          // âncora nova
         ||[...ls].reverse().find(x=>/\/\//.test(x)&&/\b(PA|FC|MMHG|DIURESE|BH)\b/i.test(x)) // fallback formato antigo
         ||'';
    return l.replace(/^\s*FINAL\s*:\s*/i,'').replace(/^\s*(PAR[ÂA]METROS|RESULTADO)\s*:\s*/i,'').trim();
  };
  const mesclarLinhas=linhas=>{ // junta campos das fotos: valor real ganha de "NÃO AFERID*"; primeiro a chegar fica
    const ORDEM=['PA','FC','FR','T','SPO2','DX','DIURESE','HEMODIÁLISE','HEMODIALISE','DRENO','BH'];
    const chave=seg=>{const m=seg.toUpperCase().match(/^(HEMODIÁLISE|HEMODIALISE|DIURESE|DRENO|SPO2|PA|FC|FR|DX|BH|T)\b/);return m?(m[1]==='HEMODIALISE'?'HEMODIÁLISE':m[1]):null;};
    const campos={};
    linhas.forEach(l=>l.split('//').map(s=>s.trim()).filter(Boolean).forEach(seg=>{
      const k=chave(seg); if(!k)return;
      const na=/N[ÃA]O AFERID/i.test(seg);
      if(!campos[k]||(/N[ÃA]O AFERID/i.test(campos[k])&&!na)) campos[k]=seg;
    }));
    return ORDEM.filter(k=>k!=='HEMODIALISE'&&campos[k]).map(k=>campos[k]).join(' // ');
  };
  try{
    const outs=await Promise.all(visitaImgs.map(async im=>{
      const um=[{data:im.data,mimeType:im.mimeType}];
      try{ return await MT.aiImage(um,PARAM_PROMPT,'gemini-2.5-pro'); }  // pro = melhor OCR de manuscrito
      catch(e1){ return await MT.aiImage(um,PARAM_PROMPT); }             // fallback flash
    }));
    const finais=outs.map(extrairFinal).filter(Boolean);
    const clean=finais.length>1?mesclarLinhas(finais):(finais[0]||'');
    if(clean)setVal('v_param',up(clean));
    b.innerHTML='<i class="ti ti-check"></i> Transcrito';setTimeout(()=>{b.innerHTML='<i class="ti ti-sparkles"></i> Transcrever com IA';b.disabled=false;},1600);
    return;
  }catch(e){alert('⚠️ '+(e.message||'Falha na IA.'));}
  b.innerHTML='<i class="ti ti-sparkles"></i> Transcrever com IA';b.disabled=false;
}

/* evolução pronta para colar */
function condutaComExplico(s){
  const lines=String(s||'').split('\n').map(x=>x.trim().replace(/^[-•*]\s*/,'')).filter(Boolean).filter(x=>!/EXPLICO[\s\S]*PLANO\s+TERAP/i.test(x));
  lines.push('EXPLICO PLANO TERAPEUTICO');
  return lines.map(x=>'- '+x).join('\n');
}
function gerarEvolucao(p){
  const L=[];
  L.push('# EVOLUÇÃO MÉDICA - '+(p.setor||p.clinica||'Clínica Médica'));
  L.push('# ID: '+(p.nome||'')+(p.idade?(', '+p.idade):'')+', IH POR:');
  if(p.diagnosticos)L.push(bullets(p.diagnosticos));
  if(p.comorbidades)L.push('# COMORBIDADES: '+oneLine(p.comorbidades));
  if(p.alergias)L.push('> ALERGIAS: '+oneLine(p.alergias));
  if(p.muc)L.push('> MUC: '+oneLine(p.muc));
  if(p.hda)L.push('# HDA: '+oneLine(p.hda));
  if(p.evolucao)L.push('# EVOLUÇÃO: '+oneLine(p.evolucao));
  if(p.parametros)L.push('# PARÂMETROS: '+oneLine(p.parametros).replace(/^\s*PARÂMETROS:\s*/i,''));
  if(p.exameFisico&&p.exameFisico.trim()){
    const efRx=efRegex();const efLines=p.exameFisico.split('\n').filter(l=>{const m=l.match(efRx);return m?((m[2]||'').trim().length>0):(l.trim().length>0);});
    if(efLines.length){L.push('# EXAME FÍSICO:');L.push(bullets(efLines.join('\n')));}
  }
  const lab=p.laboratorio||p.exames||'';
  if(lab){L.push('# LABORATÓRIO:');L.push(bullets(lab));}
  if(p.culturas){L.push('# CULTURAS:');L.push(bullets(p.culturas));}
  if(p.imagem){L.push('# EXAMES DE IMAGEM');L.push(bullets(p.imagem));}
  L.push('# CONDUTA:');L.push(condutaComExplico(p.conduta));
  return up(L.join('\n'));
}
function lineToHtml(line){
  if(line==='')return '';
  if(/^# EVOLUÇÃO MÉDICA/.test(line)||/^# EXAME FÍSICO:/.test(line)||/^# LABORATÓRIO:/.test(line)||/^# CULTURAS:/.test(line)||/^# EXAMES DE IMAGEM/.test(line)||/^# CONDUTA:/.test(line))
    return '<b>'+esc(line.replace(/^#\s+/,''))+'</b>';
  const m=line.match(/^((?:#|>) (?:ID|COMORBIDADES|ALERGIAS|MUC|HDA|EVOLUÇÃO|PARÂMETROS):)([\s\S]*)$/);
  if(m)return '<b>'+esc(m[1].replace(/^[#>]\s+/,''))+'</b>'+esc(m[2]);
  if(/^> /.test(line))return esc(line.replace(/^>\s+/,'')); // linha ">" remanescente: sem marcador, peso normal
  return esc(line); // bullets/itens em peso normal (só cabeçalhos ficam em negrito)
}
function gerarEvolucaoHtml(p){return gerarEvolucao(p).split('\n').map(l=>lineToHtml(l)).join('<br>');}
function copyEvoFmt(id,btnId){
  const p=state.pacientes.find(x=>x.id===id);if(!p)return;
  // O editor do ISGH (ars vitae) DESCARTA HTML na colagem e só quebra linha quando há LINHA EM BRANCO.
  // Solução testada no editor real: separar cada linha por \n\n (vira 1 parágrafo por linha, margem 0 = sem espaço extra).
  // Modelo "#": TEXTO PURO — cabeçalhos com "#", itens com "-". Cada linha vira parágrafo (\n\n) para o ISGH preservar as quebras.
  const plain=gerarEvolucao(p).split('\n').join('\n\n');
  let ok=false;
  try{const ta=document.createElement('textarea');ta.value=plain;ta.setAttribute('style','position:fixed;left:-9999px;top:0;opacity:0');document.body.appendChild(ta);ta.focus();ta.select();ok=document.execCommand('copy');document.body.removeChild(ta);}catch(e){ok=false;}
  if(!ok&&navigator.clipboard){try{navigator.clipboard.writeText(plain);ok=true;}catch(e){}}
  const b=document.getElementById(btnId);if(b){b.textContent=ok?'✓ Copiado p/ o sistema':'Selecione e copie manualmente';setTimeout(()=>b.textContent='Copiar p/ o sistema',2000);}
}

}

function openSaida(id){

  modal(`<h3>Registrar saída · ${esc(p.nome||'Paciente')} (leito ${esc(p.leito||'—')})</h3>
   <div class="field"><label>Tipo de saída</label><select id="s_tipo" onchange="saidaToggle()">
     <option value="alta">Alta</option><option value="obito">Óbito</option><option value="transferencia">Transferência</option></select></div>
   <div class="two"><div class="field"><label>Data</label><input id="s_data" type="date" value="${ymd()}"></div>
     <div class="field" id="s_destWrap" style="display:none"><label>Destino</label><input id="s_dest" placeholder="Hospital / setor de destino"></div></div>
   <div class="field"><label>Observações da saída (opcional)</label><textarea id="s_obs" placeholder="Resumo, orientações, motivo..."></textarea></div>
   <div class="row actions"><button class="btn btn-p" onclick="saveSaida('${id}')">Confirmar saída</button><button class="btn btn-g" onclick="closeModal()">Cancelar</button></div>`);
}
function saidaToggle(){const t=document.getElementById('s_tipo').value;const w=document.getElementById('s_destWrap');if(w)w.style.display=(t==='transferencia')?'':'none';}
function saveSaida(id){
  const p=state.pacientes.find(x=>x.id===id);if(!p)return;p.updatedAt=Date.now();
  p.status='saida';
  p.saida={tipo:document.getElementById('s_tipo').value,data:document.getElementById('s_data').value||ymd(),destino:getVal('s_dest'),obs:getVal('s_obs'),em:nowISO()};
  persist();closeModal();render();
}

/* ===== IA: extrair dados da evolução ===== */
function parseJsonLoose(t){if(!t)return null;t=String(t).trim().replace(/^```[a-z]*\s*/i,'').replace(/```\s*$/,'').trim();const i=t.indexOf('{'),j=t.lastIndexOf('}');if(i>=0&&j>i){try{return JSON.parse(t.slice(i,j+1));}catch(e){}}try{return JSON.parse(t);}catch(e){return null;}}
async function extrairEvol(id){
  const raw=getVal('f_evol');
  const editar=!!id;
  if(!raw){alert('Cole a evolução do paciente antes de '+(editar?'atualizar.':'extrair.'));return;}
  const b=document.getElementById('extrairBtn');b.innerHTML='<span class="spin"></span> '+(editar?'Atualizando…':'Extraindo…');b.disabled=true;
  const KEYS=''
   +'- "nome" (string)\n'
   +'- "idade" (string, ex.: "78 anos")\n'
   +'- "diagnosticos" (ARRAY de strings): SOMENTE o MOTIVO DA INTERNAÇÃO / hipóteses que justificaram a internação (o "IH POR"). CADA hipótese em um ITEM SEPARADO. NUNCA junte duas no mesmo item.\n'
   +'- "comorbidades" (string): comorbidades/doenças prévias separadas por vírgula. "" se não houver.\n'
   +'- "alergias" (string): alergias relatadas. "" se não houver.\n'
   +'- "muc" (string): medicações de USO CONTÍNUO/domiciliar (o "USO DE"), separadas por vírgula. "" se não houver.\n'
   +'- "hda" (string): a História da Doença Atual em um parágrafo. "" se não houver.\n'
   +'- "laboratorio" (ARRAY de strings): exames laboratoriais de INVESTIGAÇÃO relevantes para ESTE paciente — use JULGAMENTO CLÍNICO e o CONTEXTO (motivo da internação, diagnósticos, comorbidades). NÃO inclua MONITORIZAÇÃO DE ROTINA (hemograma, função renal, eletrólitos isolados, coagulograma, gasometria). **NÃO invente um rótulo de "investigação" para um valor ISOLADO.** Uma linha de investigação é um CONJUNTO de exames direcionados a um problema (ex.: anemia = ferro/ferritina/IST/transferrina/B12/folato/reticulócitos/LDH/haptoglobina) OU um exame específico claramente ligado ao motivo da internação/problema ativo. Um marcador SOLTO (uma PCR isolada, um cálcio, um reticulócito sem o resto do perfil) é rotina/monitorização → NÃO inclua. EXEMPLO: NÃO existe "investigação de cálcio" — só inclua cálcio/fósforo se houver contexto de DISTÚRBIO MINERAL-ÓSSEO/DRC (perfil DMO-DRC) OU se o paciente estiver internado POR distúrbio do cálcio. Na dúvida, OMITA. Quando houver investigação REAL, AGRUPE os exames dela em UM ÚNICO item: "NOME DA INVESTIGAÇÃO: exame: valor, exame: valor" (ex.: "INVESTIGAÇÃO DE ANEMIA: FERRITINA: 1090, B12: 300, RETICULÓCITOS: 79110"; "PERFIL DMO-DRC: VIT D: 24.3, FÓSFORO: 6.2, PTH: 120"). CULTURAS/SOROLOGIAS vão em "culturas". [] se não houver investigação relevante.\n'
   +'- "culturas" (ARRAY de strings): hemoculturas, uroculturas, culturas, sorologias e painéis virais (um por item, com data e resultado). [] se não houver.\n'
   +'- "imagem" (ARRAY de strings): exames de IMAGEM (RX, USG, TC, RM, ECO) — um por item, com o achado resumido. [] se não houver.\n'
   +'- "exameFisico" (string): o EXAME FÍSICO em linhas começando por "- ", uma por aparelho, nesta ordem quando houver: "- ESTADO GERAL:" (impressão geral — ex.: BEG/REG/MEG, hidratação, mucosas, febril/afebril, nível de consciência), "- NEURO:", "- AC:", "- AP:", "- ABDOME:", "- EXT:", "- PELE:" (mapeie SCR→AC, SR→AP, TGI→ABDOME). "" se não houver.\n'
   +'- "conduta" (ARRAY de strings): cada item da CONDUTA/PLANO atual (um por item). NÃO inclua nenhuma linha de "explico plano terapêutico" (ela é adicionada automaticamente).\n'
   +'- "pendencias" (ARRAY de strings curtas): o que IMPEDE A ALTA agora (sobretudo após "CONDUTA"/"PLANO"). Para CADA antibiótico em uso com dia de início (DI/D1/"iniciado em"), crie uma pendência "<ATB> DI <DD/MM> - programado até <DD/MM>" (ou "[definir]" se não houver término).\n'
   ;
  let prompt;
  if(editar){
    const A=[]; const g=(lbl,v)=>{v=(v||'').trim();if(v)A.push(lbl+': '+v);};
    g('nome',getVal('f_nome'));g('idade',getVal('f_idade'));g('diagnosticos',getVal('f_dx'));g('comorbidades',getVal('f_comorb'));g('alergias',getVal('f_alergias'));g('muc',getVal('f_muc'));g('hda',getVal('f_hda'));g('laboratorio',getVal('f_lab'));g('culturas',getVal('f_culturas'));g('imagem',getVal('f_imagem'));g('exameFisico',getVal('f_ef'));g('conduta',getVal('f_conduta'));g('pendencias',getVal('f_pend'));
    prompt='Você é um assistente clínico ATUALIZANDO a ficha de um paciente INTERNADO. Recebe os DADOS ATUAIS (já no sistema) e uma NOVA EVOLUÇÃO; responda APENAS um objeto JSON válido (sem markdown) com EXATAMENTE as chaves abaixo, já com os dados ATUALIZADOS após esta evolução. REGRAS DE ATUALIZAÇÃO:\n'
     +'- MANTENHA os dados de base (nome, idade, comorbidades, alergias, muc, hda) — só altere se a evolução claramente corrigir/acrescentar.\n'
     +'- "diagnosticos": mantenha os atuais e ACRESCENTE novas hipóteses que a evolução trouxer (sem duplicar).\n'
     +'- "laboratorio": mantenha as investigações já listadas e ACRESCENTE novos exames investigativos da evolução (mesmas regras; sem duplicar o mesmo exame).\n'
     +'- "culturas" e "imagem": ACRESCENTE os novos resultados aos já existentes (sem duplicar).\n'
     +'- "exameFisico": SUBSTITUA pelo exame físico MAIS RECENTE desta evolução, se houver; senão mantenha o atual.\n'
     +'- "conduta": SUBSTITUA pela conduta/plano ATUAL desta evolução, se houver plano novo; senão mantenha.\n'
     +'- "pendencias": ATUALIZE — REMOVA as que a evolução indica resolvidas, MANTENHA as ainda pendentes e ACRESCENTE as novas.\n\n'
     +'CHAVES (siga as regras de conteúdo de cada uma):\n'+KEYS
     +'\nNão invente nada; use "" ou [] quando não houver. Português do Brasil.\n\n=== DADOS ATUAIS ===\n'+A.join('\n')+'\n\n=== NOVA EVOLUÇÃO ===\n'+raw;
  } else {
    prompt='Você é um assistente clínico extraindo dados de uma evolução/prontuário de paciente INTERNADO para um sistema de enfermaria. Responda APENAS um objeto JSON válido (sem markdown, sem comentários) com EXATAMENTE estas chaves:\n'+KEYS
     +'Não invente nada; use "" ou [] quando não houver. Português do Brasil.\n\nEvolução:\n'+raw;
  }
  try{
    const txt=await MT.ai(prompt);
    const data=parseJsonLoose(txt);
    if(!data){alert('Não consegui estruturar automaticamente. Tente colar novamente ou preencha manualmente.');}
    else{
      const toLines=v=>Array.isArray(v)?v.filter(Boolean).join('\n'):(v||'');
      setVal('f_nome',data.nome||'');
      setVal('f_idade',data.idade||'');
      setVal('f_comorb',data.comorbidades||'');
      setVal('f_alergias',data.alergias||'');
      setVal('f_muc',data.muc||'');
      setVal('f_hda',data.hda||'');
      setVal('f_dx',bullets(toLines(data.diagnosticos)));
      setVal('f_lab',bullets(toLines(data.laboratorio)));
      setVal('f_culturas',bullets(toLines(data.culturas)));
      setVal('f_imagem',bullets(toLines(data.imagem)));
      setVal('f_pend',bullets(toLines(data.pendencias)));
      setVal('f_ef',data.exameFisico||'');
      setVal('f_conduta',bullets(toLines(data.conduta)));
      const okN=(data.nome||'')?'':' (nome não encontrado)';
      const bb=document.getElementById('extrairBtn');if(bb){bb.innerHTML=(editar?'✓ Ficha atualizada':'✓ Ficha preenchida')+okN;setTimeout(()=>{bb.innerHTML=editar?'<i class="ti ti-sparkles"></i> Atualizar dados':'<i class="ti ti-sparkles"></i> Extrair dados';bb.disabled=false;},1800);}
      return;
    }
  }catch(e){alert('⚠️ Não consegui '+(editar?'atualizar':'extrair')+' agora: '+(e.message||'falha na IA')+'. Tente novamente — a evolução continua no campo.');}
  b.innerHTML=editar?'<i class="ti ti-sparkles"></i> Atualizar dados':'<i class="ti ti-sparkles"></i> Extrair dados';b.disabled=false;
}

/* ===== modal ===== */
function modal(html){document.querySelectorAll('.modal').forEach(m=>m.remove());
  draftKey=null;draftReopen=null;draftPristine={}; // cada tela decide se liga o rascunho (openVisita/openForm ligam depois)
  const d=document.createElement('div');d.className='modal';d.id='modal';d.innerHTML='<div class="box">'+html+'</div>';
  const box=d.querySelector('.box');
  const xw=document.createElement('div');xw.className='modal-xwrap';
  const ok=document.createElement('span');ok.className='draft-ok';ok.innerHTML='<i class="ti ti-check"></i> rascunho salvo';
  const x=document.createElement('button');x.className='modal-x';x.setAttribute('aria-label','Fechar');x.innerHTML='<i class="ti ti-x"></i>';x.onclick=closeModal;
  xw.appendChild(ok);xw.appendChild(x);box.prepend(xw);
  // tocar FORA só fecha modais sem edição — com campos, toque acidental não fecha nem perde nada
  d.onclick=e=>{if(e.target!==d)return;const editing=box.querySelector('textarea,select,input:not([type=hidden]):not([type=file])');if(!editing)closeModal();};
  box.addEventListener('input',e=>{if(e.target.tagName==='TEXTAREA')autoGrow(e.target);saveDraft();});
  document.body.appendChild(d);
  requestAnimationFrame(()=>box.querySelectorAll('textarea').forEach(t=>autoGrow(t,true)));
}
function closeModal(){const m=document.getElementById('modal');if(m)m.remove();}
/* textareas crescem conforme o texto (campo maior sem scroll interno).
   Ao DIGITAR só cresce (nunca colapsa p/ remedir — evita o scroll "sambar");
   full=true (abrir modal / setVal / restaurar rascunho) remede do zero. */
function autoGrow(t,full){if(!t||t.tagName!=='TEXTAREA'||t.style.display==='none')return;
  const box=t.closest('.box');const st=box?box.scrollTop:0;
  if(full)t.style.height='auto';
  const sh=t.scrollHeight+2;const alvo=Math.min(sh,560);
  if(full||alvo>t.clientHeight+2)t.style.height=alvo+'px';
  t.style.overflowY=sh>560?'auto':'hidden';
  if(box&&box.scrollTop!==st)box.scrollTop=st;}
/* (sem reposicionar o modal pelo visualViewport — causava saltos no iOS;
   deixamos o Safari revelar o campo focado nativamente) */
/* ===== rascunho automático: nada digitado se perde, mesmo fechando o modal ===== */
let draftKey=null,draftReopen=null,draftPristine={};
/* Cada campo do rascunho guarda DOIS valores: `v` (o que está na tela) e `p` (o valor
   com que o campo foi renderizado quando o modal abriu). Na hora de restaurar:
   - v===p  → o usuário não mexeu neste campo: nunca restaura (senão congela o campo);
   - render atual !== p → o registro mudou por OUTRA tela depois do rascunho: o registro
     vence (senão o rascunho velho reaparece e, ao salvar, apaga a alteração nova).
   Sem isso, editar a conduta na ficha e abrir a evolução trazia a conduta antiga — e
   salvar a evolução regravava a versão velha por cima. */
function fieldsOf(box){return [...box.querySelectorAll('input[id],textarea[id],select[id]')].filter(el=>el.type!=='file'&&el.type!=='hidden');}
function valOf(el){return (el.type==='checkbox')?(el.checked?'1':''):el.value;}
function saveDraft(){if(!draftKey)return;const box=document.querySelector('#modal .box');if(!box)return;const o={};
  fieldsOf(box).forEach(el=>{const v=valOf(el);const p=(draftPristine[el.id]!==undefined)?draftPristine[el.id]:v;o[el.id]={v,p};});
  try{localStorage.setItem('enfdraft:'+draftKey,JSON.stringify(o));}catch(e){}
  const b=document.querySelector('#modal .draft-ok');if(b){b.classList.add('on');clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('on'),1100);}}
function restoreDraft(){if(!draftKey)return;
  const box=document.querySelector('#modal .box');if(!box)return;
  draftPristine={};fieldsOf(box).forEach(el=>{draftPristine[el.id]=valOf(el);});   // verdade atual do registro
  let o=null;try{o=JSON.parse(localStorage.getItem('enfdraft:'+draftKey)||'null');}catch(e){}if(!o)return;
  let restaurados=0,descartados=0;
  Object.keys(o).forEach(id=>{const el=document.getElementById(id);if(!el)return;
    const d=o[id];
    if(!d||typeof d!=='object'){descartados++;return;}                 // rascunho do formato antigo: descarta
    if(d.v===d.p)return;                                               // campo intocado pelo usuário
    if((draftPristine[id]!==undefined?draftPristine[id]:'')!==d.p){descartados++;return;} // dado mais novo veio de outra tela
    if(el.type==='checkbox')el.checked=(d.v==='1');else el.value=d.v;
    restaurados++;});
  box.querySelectorAll('textarea').forEach(t=>autoGrow(t,true));
  if(restaurados||descartados){const h=document.createElement('div');h.className='draft-hint';
    h.innerHTML=restaurados
      ? '<i class="ti ti-history"></i> Recuperei o que você digitou e não salvou'+(descartados?' (o resto foi atualizado em outra tela)':'')+' <button type="button" onclick="descartarDraft()">descartar</button>'
      : '<i class="ti ti-refresh"></i> Estes dados foram atualizados em outra tela — mostrando a versão mais recente.';
    const t=box.querySelector('h3');if(t)t.after(h);else box.prepend(h);}}
function clearDraft(){if(!draftKey)return;try{localStorage.removeItem('enfdraft:'+draftKey);}catch(e){}}
function descartarDraft(){clearDraft();const r=draftReopen;if(r)r();else closeModal();}
/* rascunhos valem só pro dia — limpa os antigos ao abrir o app */
try{const hoje=':'+ymd();Object.keys(localStorage).filter(k=>k.indexOf('enfdraft:')===0&&k.slice(-hoje.length)!==hoje).forEach(k=>localStorage.removeItem(k));}catch(e){}

/* ===== PWA ===== */
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
