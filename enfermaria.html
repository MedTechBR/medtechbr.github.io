<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnfermarIA — Gestão de pacientes internados | MedTech</title>
<meta name="description" content="EnfermarIA: gestão de pacientes internados — leito, diagnósticos, exames e pendências, com extração automática da evolução por IA e registro de alta, óbito ou transferência.">
<meta name="theme-color" content="#0E5A6D">
<link rel="icon" type="image/png" href="favicon.png">
<script src="_mtfb.js?v=1"></script>
<script>window.MT_APP={id:"enfermaria",name:"EnfermarIA"};</script>
<script type="module" src="_mtauth.js?v=6"></script>
<style>
:root{--petrol:#0E5A6D;--petrol-dark:#083845;--ink:#0E2A31;--mint:#2DD4A8;--mint-dark:#14b894;--bg:#F6FAFB;--soft:#EAF3F4;--line:#dbe8ea;--muted:#5B7882;--green:#14794f;--green-bg:#e7f7f1;--amber:#c97a17;--amber-bg:#fdf0e0;--red:#c0392b;--red-bg:#fdecea;--blue:#2563a8;--blue-bg:#e8f1fb;--violet:#6b46c1;--violet-bg:#efe9fb}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{background:linear-gradient(135deg,var(--petrol),var(--petrol-dark));color:#fff;padding:14px 0}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.4px}
.logo .mark{width:34px;height:34px;border-radius:10px;background:#2DD4A8;display:grid;place-items:center;flex:0 0 auto;font-size:18px}
.logo b{color:var(--mint)}
.subtitle{color:#bcd6db;font-size:12.5px;margin-top:3px}
.usr{display:flex;align-items:center;gap:10px}
.usr .who{font-size:12.5px;color:#cfe3e6;text-align:right;line-height:1.3;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usr a,.usr button{color:#cfe3e6;text-decoration:none;font-size:13px;font-weight:600;background:rgba(255,255,255,.12);border:none;border-radius:8px;padding:7px 11px;cursor:pointer;font-family:inherit}
.usr button:hover{background:rgba(255,255,255,.22)}
main{max-width:980px;margin:0 auto;padding:18px 18px 60px}
.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:16px;width:fit-content;max-width:100%}
.tabs button{border:none;background:none;padding:9px 18px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted);font-family:inherit;white-space:nowrap}
.tabs button.on{background:var(--petrol);color:#fff}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.bar .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.search{padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff;min-width:230px}
.btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:10px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;text-decoration:none}
.btn-p{background:var(--mint);color:var(--petrol-dark)}.btn-p:hover{background:var(--mint-dark)}
.btn-g{background:#fff;color:var(--petrol);border:1px solid var(--line)}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:9px}
.btn-dn{background:var(--red-bg);color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.kpi .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.kpi .v{font-size:22px;font-weight:800;color:var(--petrol);margin-top:3px}
.kpi.green .v{color:var(--green)}.kpi.red .v{color:var(--red)}.kpi.blue .v{color:var(--blue)}
.pt-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;gap:13px;align-items:flex-start}
.pt-card.sa{opacity:.96}
.leito{flex:0 0 auto;min-width:58px;text-align:center;background:var(--petrol);color:#fff;border-radius:11px;padding:8px 6px}
.leito .ln{font-size:18px;font-weight:800;line-height:1}
.leito .ls{font-size:9.5px;opacity:.85;margin-top:3px;text-transform:uppercase;letter-spacing:.03em}
.pt-main{flex:1;min-width:0}
.pt-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pt-top .nome{font-weight:800;font-size:16px}
.pt-top .meta{color:var(--muted);font-size:13px}
.pt-field{font-size:13.5px;margin-top:5px;line-height:1.5;color:#243b41;white-space:pre-wrap}
.pt-field b{color:var(--petrol-dark);font-weight:700}
.pt-field.pend{background:var(--amber-bg);border-radius:8px;padding:5px 9px;color:#6b4413}
.pt-field.pend b{color:var(--amber)}
.pt-obs{font-size:12.5px;color:var(--muted);margin-top:5px;white-space:pre-wrap}
.pt-acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pt-acts button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer;font-size:13px;font-family:inherit;white-space:nowrap}
.pt-acts .saida{color:var(--amber);font-weight:700}
.badge{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:999px;vertical-align:middle}
.b-alta{background:var(--green-bg);color:var(--green)}.b-obito{background:#eee;color:#555}.b-transf{background:var(--blue-bg);color:var(--blue)}
.empty{text-align:center;color:var(--muted);padding:42px 18px;background:#fff;border:1px dashed var(--line);border-radius:14px}
.modal{position:fixed;inset:0;background:rgba(8,56,69,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:60}
.modal .box{background:#fff;border-radius:16px;padding:22px;max-width:600px;width:100%;max-height:93vh;overflow:auto}
.modal h3{margin-bottom:14px}
.field{margin-bottom:12px}.field label{display:block;font-weight:600;font-size:13.5px;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff}
.field textarea{resize:vertical;min-height:52px;line-height:1.5}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--mint)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:90px 1fr 90px;gap:10px}
.row{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.ai-box{background:#eef7f4;border:1px solid #bfe6db;border-radius:12px;padding:13px;margin-bottom:14px}
.ai-box .ai-h{font-weight:800;color:var(--petrol-dark);font-size:14px;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.ai-box textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;resize:vertical;background:#fff;line-height:1.5}
.ai-box textarea:focus{outline:none;border-color:var(--mint)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--petrol-dark);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.note{background:var(--soft);border-radius:12px;padding:12px 15px;font-size:13px;color:#28424a;margin-top:16px;line-height:1.6}
.note b{color:var(--petrol)}
footer{text-align:center;color:var(--muted);font-size:13px;padding:24px}
footer a{color:var(--petrol);font-weight:600;text-decoration:none}
.setor-h{font-size:12px;font-weight:800;color:var(--petrol-dark);text-transform:uppercase;letter-spacing:.04em;margin:16px 2px 8px;display:flex;align-items:center;gap:8px}
.setor-h span{background:var(--soft);color:var(--petrol);border-radius:999px;padding:1px 9px;font-size:11px}
.pt-pend{margin-top:6px;background:var(--amber-bg);border-radius:9px;padding:7px 10px}
.pt-pend>b{color:var(--amber);font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:3px}
.pend-item{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;color:#6b4413;padding:2px 0;cursor:pointer}
.pend-item input{margin-top:2px;flex:0 0 auto;width:16px;height:16px;accent-color:var(--mint-dark);cursor:pointer}
.pend-item.done span{text-decoration:line-through;color:#9aa8a0}
@media(max-width:680px){.cards{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.pt-acts{flex-direction:row}}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div>
      <div class="logo"><span class="mark">🛏️</span> Enfermar<b>IA</b></div>
      <div class="subtitle">Gestão de pacientes internados · com extração por IA · por MedTech</div>
    </div>
    <div class="usr" id="usr"></div>
  </div>
</header>

<main>
  <div class="tabs">
    <button id="tab-ativos" class="on" onclick="setTab('ativos')">🛏️ Internados</button>
    <button id="tab-saidas" onclick="setTab('saidas')">🚪 Saídas</button>
  </div>
  <div id="view"></div>
  <div class="note" id="storenote">Carregando…</div>
</main>

<footer>© 2026 <a href="index.html">MedTech</a> · <a href="privacidade.html">Privacidade</a></footer>

<script>
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const SAIDA={alta:{l:'Alta',c:'b-alta'},obito:{l:'Óbito',c:'b-obito'},transferencia:{l:'Transferência',c:'b-transf'}};
let state={pacientes:[]};
let tab='ativos', busca='';

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function nowISO(){return new Date().toISOString();}
function ymd(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtData(s){if(!s)return '';const d=new Date((s.length<=10?s+'T00:00:00':s));if(isNaN(d))return esc(s);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
function setVal(id,v){const e=document.getElementById(id);if(e!=null&&v!=null)e.value=v;}
function getVal(id){const e=document.getElementById(id);return e?e.value.trim():'';}

/* ===== boot ===== */
function sampleSeed(){return {pacientes:[
  {id:uid(),leito:'12A',setor:'Enfermaria',nome:'Maria Souza',idade:'74 anos',sexo:'F',diagnosticos:'Pneumonia adquirida na comunidade\nHAS, DM2',exames:'RX tórax: consolidação em base direita\nLeucograma 15.000 com desvio · PCR 180 · Creatinina 1,3',condutas:'Ceftriaxona + azitromicina (D2)',pendencias:[{id:uid(),t:'Colher hemocultura',done:false},{id:uid(),t:'Controle de PCR em 48h',done:false}],obs:'',status:'ativo',criadoEm:nowISO()},
  {id:uid(),leito:'UTI 3',setor:'UTI',nome:'João Lima',idade:'61 anos',sexo:'M',diagnosticos:'IAM sem supra (NSTEMI)\nIC descompensada',exames:'Troponina em curva ascendente\nECG: infra de ST em V4-V6 · Eco: FE 35%',condutas:'AAS + clopidogrel + enoxaparina',pendencias:[{id:uid(),t:'CAT amanhã',done:false},{id:uid(),t:'Ajustar diurético',done:false}],obs:'Aguardando vaga em hemodinâmica.',status:'ativo',criadoEm:nowISO()}
]};}
function normalize(d){d=d&&typeof d==='object'?d:{};return {pacientes:Array.isArray(d.pacientes)?d.pacientes:[]};}

function whenMT(cb){if(window.MT){cb();}else{setTimeout(()=>whenMT(cb),30);}}
whenMT(()=>{MT.onData(d=>{
  if(d&&typeof d==='object'&&d.pacientes){state=normalize(d);}
  else{state=(MT.mode==='demo')?sampleSeed():normalize(null);if(MT.mode==='demo')MT.save(state);}
  renderUser();render();
});renderUser();});
function persist(){MT.save(state);}
function renderUser(){const el=document.getElementById('usr');if(!el)return;
  const sn=document.getElementById('storenote');
  if(sn)sn.innerHTML=(MT.mode==='demo')?'🔧 <b>Modo demonstração</b> — dados salvos só neste navegador. Entre na conta MedTech para sincronizar e usar a IA.':'☁️ Conectado — sua lista de internados sincroniza na nuvem MedTech.';
  if(MT.mode==='demo'){el.innerHTML='<span class="who">Modo demo</span><a href="index.html">← MedTech</a>';return;}
  const u=MT.user;const nm=u?(u.displayName||u.email||'Conta'):'';
  el.innerHTML=`<span class="who">${esc(nm)}</span><button onclick="MT.signOut()">Sair</button>`;}

/* ===== navegação ===== */
function setTab(t){tab=t;busca='';['ativos','saidas'].forEach(x=>{const b=document.getElementById('tab-'+x);if(b)b.className=(x===t?'on':'');});render();}
function ativos(){return state.pacientes.filter(p=>p.status!=='saida');}
function saidos(){return state.pacientes.filter(p=>p.status==='saida');}
function leitoSort(a,b){return String(a.setor||'').localeCompare(String(b.setor||''))||String(a.leito||'').localeCompare(String(b.leito||''),'pt',{numeric:true});}
function render(){tab==='ativos'?renderAtivos():renderSaidas();}

function matchBusca(p){const q=busca.trim().toLowerCase();if(!q)return true;return [p.leito,p.nome,p.diagnosticos,p.setor].some(x=>(x||'').toLowerCase().includes(q));}

function ptCard(p){
  const meta=[p.idade||'',p.sexo||'',p.setor||''].filter(Boolean).join(' · ');
  const pend=(p.pendencias||[]);
  const pendHtml=pend.length?`<div class="pt-pend"><b>Pendências</b>${pend.map(it=>`<label class="pend-item${it.done?' done':''}"><input type="checkbox" ${it.done?'checked':''} onclick="togglePend('${p.id}','${it.id}')"><span>${esc(it.t)}</span></label>`).join('')}</div>`:'';
  return `<div class="pt-card">
    <div class="leito"><div class="ln">${esc(p.leito||'—')}</div>${p.setor?`<div class="ls">${esc(p.setor)}</div>`:''}</div>
    <div class="pt-main">
      <div class="pt-top"><span class="nome">${esc(p.nome||'Paciente')}</span>${meta?`<span class="meta">${esc(meta)}</span>`:''}</div>
      ${p.diagnosticos?`<div class="pt-field"><b>Dx:</b>\n${esc(bullets(p.diagnosticos))}</div>`:''}
      ${p.exames?`<div class="pt-field"><b>Exames:</b>\n${esc(bullets(p.exames))}</div>`:''}
      ${p.condutas?`<div class="pt-field"><b>Condutas:</b>\n${esc(bullets(p.condutas))}</div>`:''}
      ${pendHtml}
      ${p.obs?`<div class="pt-obs">📝 ${esc(p.obs)}</div>`:''}
    </div>
    <div class="pt-acts">
      <button onclick="openForm('${p.id}')">✏️ Editar</button>
      <button class="saida" onclick="openSaida('${p.id}')">🚪 Saída</button>
      <button onclick="delPac('${p.id}')">🗑️</button>
    </div>
  </div>`;
}

function renderAtivos(){
  const list=ativos().slice().sort(leitoSort).filter(matchBusca);
  const tot=ativos().length;
  const uti=ativos().filter(p=>/uti/i.test(p.setor||'')||/uti/i.test(p.leito||'')).length;
  const comPend=ativos().filter(p=>(p.pendencias||[]).some(x=>!x.done)).length;
  let html=`<div class="cards">
    <div class="kpi"><div class="l">Internados</div><div class="v">${tot}</div></div>
    <div class="kpi blue"><div class="l">Em UTI</div><div class="v">${uti}</div></div>
    <div class="kpi"><div class="l">Com pendências</div><div class="v">${comPend}</div></div>
    <div class="kpi green"><div class="l">Saídas registradas</div><div class="v">${saidos().length}</div></div>
  </div>
  <div class="bar">
    <input class="search" id="sin" placeholder="Buscar leito, nome ou diagnóstico..." value="${esc(busca)}" oninput="busca=this.value;renderListOnly()">
    <div class="right"><button class="btn btn-g btn-sm" onclick="resumoPlantao()">📋 Passar plantão</button><button class="btn btn-p btn-sm" onclick="openForm()">+ Novo paciente</button></div>
  </div><div id="ptlist"></div>`;
  document.getElementById('view').innerHTML=html;
  const inp=document.getElementById('sin');if(inp&&busca){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}
  renderListOnly();
}
function grupoKeys(groups){return Object.keys(groups).sort((a,b)=>a==='Sem setor'?1:b==='Sem setor'?-1:a.localeCompare(b,'pt'));}
function agrupaPorSetor(list){const g={};list.forEach(p=>{const k=(p.setor||'').trim()||'Sem setor';(g[k]=g[k]||[]).push(p);});Object.keys(g).forEach(k=>g[k].sort((a,b)=>String(a.leito||'').localeCompare(String(b.leito||''),'pt',{numeric:true})));return g;}
function renderListOnly(){
  const box=document.getElementById('ptlist');if(!box)return;
  const list=ativos().filter(matchBusca);
  if(!list.length){box.innerHTML=ativos().length?'<div class="empty">Nenhum paciente encontrado para a busca.</div>':'<div class="empty">Nenhum paciente internado.<br>Toque em <b>+ Novo paciente</b> — você pode colar a evolução e a IA preenche os campos.</div>';return;}
  const g=agrupaPorSetor(list);
  box.innerHTML=grupoKeys(g).map(k=>`<div class="setor-h">🏥 ${esc(k)} <span>${g[k].length}</span></div>`+g[k].map(ptCard).join('')).join('');
}

function renderSaidas(){
  const list=saidos().slice().sort((a,b)=>String((b.saida&&b.saida.data)||'').localeCompare(String((a.saida&&a.saida.data)||'')));
  let html=`<div class="bar"><div style="color:var(--muted);font-size:13px;font-weight:600">${list.length} saída(s) registrada(s)</div></div>`;
  if(!list.length){html+='<div class="empty">Nenhuma saída registrada ainda.<br>Em um paciente internado, toque em <b>🚪 Saída</b> para registrar alta, óbito ou transferência.</div>';}
  else html+=list.map(p=>{const s=p.saida||{};const sd=SAIDA[s.tipo]||{l:s.tipo||'Saída',c:'b-obito'};
    return `<div class="pt-card sa">
      <div class="leito" style="background:var(--muted)"><div class="ln">${esc(p.leito||'—')}</div></div>
      <div class="pt-main">
        <div class="pt-top"><span class="nome">${esc(p.nome||'Paciente')}</span><span class="badge ${sd.c}">${sd.l}</span><span class="meta">${fmtData(s.data)}${s.destino?(' · '+esc(s.destino)):''}</span></div>
        ${p.diagnosticos?`<div class="pt-field"><b>Dx:</b> ${esc(p.diagnosticos)}</div>`:''}
        ${s.obs?`<div class="pt-obs">📝 ${esc(s.obs)}</div>`:''}
      </div>
      <div class="pt-acts">
        <button onclick="reabrir('${p.id}')">↩️ Reinternar</button>
        <button onclick="delPac('${p.id}')">🗑️</button>
      </div>
    </div>`;}).join('');
  document.getElementById('view').innerHTML=html;
}

/* ===== form do paciente (com extração por IA) ===== */
function openForm(id){
  const p=id?state.pacientes.find(x=>x.id===id):{leito:'',setor:'',nome:'',idade:'',sexo:'',diagnosticos:'',exames:'',condutas:'',obs:''};
  const sx=['','M','F'].map(k=>`<option value="${k}" ${p.sexo===k?'selected':''}>${k||'—'}</option>`).join('');
  modal(`<h3>${id?'Editar':'Novo'} paciente</h3>
   ${id?'':`<div class="ai-box">
     <div class="ai-h">✨ Colar evolução — a IA preenche os campos</div>
     <textarea id="f_evol" placeholder="Cole aqui a evolução / prontuário do paciente. A IA extrai nome, idade, hipóteses diagnósticas, principais exames de imagem e laboratoriais e condutas."></textarea>
     <div class="row"><button class="btn btn-p btn-sm" id="extrairBtn" onclick="extrairEvol()">✨ Extrair dados da evolução</button></div>
     <div class="hint">Revise sempre o que a IA preencher. O <b>leito</b> você informa manualmente.${MT.mode==='demo'?' <b>Entre na conta MedTech para usar a IA.</b>':''}</div>
   </div>`}
   <div class="three"><div class="field"><label>Leito *</label><input id="f_leito" value="${esc(p.leito)}" placeholder="12A"></div>
     <div class="field"><label>Nome</label><input id="f_nome" value="${esc(p.nome)}" placeholder="Nome do paciente"></div>
     <div class="field"><label>Idade</label><input id="f_idade" value="${esc(p.idade)}" placeholder="74 anos"></div></div>
   <div class="two"><div class="field"><label>Setor / unidade</label><input id="f_setor" value="${esc(p.setor)}" placeholder="Enfermaria, UTI, etc."></div>
     <div class="field"><label>Sexo</label><select id="f_sexo">${sx}</select></div></div>
   <div class="field"><label>Diagnósticos / hipóteses <span style="color:var(--muted);font-weight:400">(um por linha)</span></label><textarea id="f_dx" placeholder="- um por linha">${esc(bullets(p.diagnosticos))}</textarea></div>
   <div class="field"><label>Principais exames <span style="color:var(--muted);font-weight:400">(um por linha)</span></label><textarea id="f_exames" placeholder="- imagem e laboratório investigativos (um por linha)">${esc(bullets(p.exames))}</textarea></div>
   <div class="field"><label>Condutas atuais <span style="color:var(--muted);font-weight:400">(uma por linha)</span></label><textarea id="f_condutas" placeholder="- tratamento em curso / plano">${esc(bullets(p.condutas))}</textarea></div>
   <div class="field"><label>Pendências <span style="color:var(--muted);font-weight:400">(uma por linha — você marca como feitas na lista)</span></label><textarea id="f_pend" placeholder="- colher hemocultura&#10;- controle de PCR em 48h&#10;- avaliar com a cirurgia">${esc((p.pendencias||[]).map(x=>'- '+x.t).join('\n'))}</textarea></div>
   <div class="field"><label>Observações</label><textarea id="f_obs" placeholder="Anotações livres">${esc(p.obs)}</textarea></div>
   <div class="row"><button class="btn btn-p" onclick="saveForm('${id||''}')">Salvar</button><button class="btn btn-g" onclick="closeModal()">Cancelar</button></div>`);
}
function saveForm(id){
  const oldP=id?((state.pacientes.find(x=>x.id===id)||{}).pendencias||[]):[];
  const pend=getVal('f_pend').split('\n').map(s=>s.trim().replace(/^[-•*]\s*/,'')).filter(Boolean).map(t=>{const ex=oldP.find(o=>o.t===t);return {id:ex?ex.id:uid(),t,done:ex?ex.done:false};});
  const o={leito:getVal('f_leito'),setor:getVal('f_setor'),nome:getVal('f_nome'),idade:getVal('f_idade'),sexo:getVal('f_sexo'),diagnosticos:bullets(getVal('f_dx')),exames:bullets(getVal('f_exames')),condutas:bullets(getVal('f_condutas')),pendencias:pend,obs:getVal('f_obs')};
  if(!o.leito&&!o.nome){alert('Informe ao menos o leito ou o nome do paciente.');return;}
  if(id){Object.assign(state.pacientes.find(x=>x.id===id),o);}
  else{state.pacientes.push({id:uid(),status:'ativo',criadoEm:nowISO(),...o});}
  persist();closeModal();render();
}
function delPac(id){const p=state.pacientes.find(x=>x.id===id);if(!p)return;
  if(confirm(`Excluir definitivamente ${p.nome||'este paciente'} (leito ${p.leito||'—'})?`)){state.pacientes=state.pacientes.filter(x=>x.id!==id);persist();render();}}
function reabrir(id){const p=state.pacientes.find(x=>x.id===id);if(!p)return;p.status='ativo';delete p.saida;persist();render();}
function togglePend(pid,itemId){const p=state.pacientes.find(x=>x.id===pid);if(!p)return;const it=(p.pendencias||[]).find(x=>x.id===itemId);if(!it)return;it.done=!it.done;persist();renderAtivos();}
function oneLine(s){return String(s||'').replace(/\s*\n\s*/g,'; ').trim();}
function bullets(s){return String(s||'').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>/^[-•*]/.test(x)?('- '+x.replace(/^[-•*]\s*/,'')):('- '+x)).join('\n');}
function resumoPlantao(){
  const list=ativos();
  if(!list.length){alert('Não há pacientes internados para resumir.');return;}
  const g=agrupaPorSetor(list);
  let txt='PASSAGEM DE PLANTÃO — '+fmtData(ymd())+' ('+list.length+' internado(s))\n';
  grupoKeys(g).forEach(k=>{txt+='\n== '+k+' ('+g[k].length+') ==\n';
    g[k].forEach(p=>{txt+='\n['+(p.leito||'—')+'] '+(p.nome||'Paciente')+(p.idade?(', '+p.idade):'')+'\n';
      if(p.diagnosticos)txt+='Dx:\n'+bullets(p.diagnosticos)+'\n';
      if(p.exames)txt+='Exames:\n'+bullets(p.exames)+'\n';
      if(p.condutas)txt+='Condutas:\n'+bullets(p.condutas)+'\n';
      const pend=(p.pendencias||[]).filter(x=>!x.done);
      if(pend.length)txt+='Pendências:\n'+pend.map(x=>'- '+x.t).join('\n')+'\n';
      if(p.obs)txt+='Obs: '+oneLine(p.obs)+'\n';});});
  modal(`<h3>📋 Passar plantão</h3><div class="hint" style="margin-bottom:8px">Resumo dos ${list.length} internado(s), agrupado por setor (só pendências em aberto). Revise e copie.</div><div class="field"><textarea id="resumoTa" style="min-height:320px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.55">${esc(txt)}</textarea></div><div class="row"><button class="btn btn-p" id="copyResBtn" onclick="copyResumo()">📋 Copiar tudo</button><button class="btn btn-g" onclick="closeModal()">Fechar</button></div>`);
}
function copyResumo(){const t=document.getElementById('resumoTa');if(!t)return;t.focus();t.select();try{document.execCommand('copy');}catch(e){}if(navigator.clipboard){try{navigator.clipboard.writeText(t.value);}catch(e){}}const b=document.getElementById('copyResBtn');if(b){const o=b.textContent;b.textContent='✓ Copiado';setTimeout(()=>b.textContent=o,1500);}}

/* ===== saída (alta / óbito / transferência) ===== */
function openSaida(id){
  const p=state.pacientes.find(x=>x.id===id);if(!p)return;
  modal(`<h3>Registrar saída · ${esc(p.nome||'Paciente')} (leito ${esc(p.leito||'—')})</h3>
   <div class="field"><label>Tipo de saída</label><select id="s_tipo" onchange="saidaToggle()">
     <option value="alta">Alta</option><option value="obito">Óbito</option><option value="transferencia">Transferência</option></select></div>
   <div class="two"><div class="field"><label>Data</label><input id="s_data" type="date" value="${ymd()}"></div>
     <div class="field" id="s_destWrap" style="display:none"><label>Destino</label><input id="s_dest" placeholder="Hospital / setor de destino"></div></div>
   <div class="field"><label>Observações da saída (opcional)</label><textarea id="s_obs" placeholder="Resumo, orientações, motivo..."></textarea></div>
   <div class="row"><button class="btn btn-p" onclick="saveSaida('${id}')">Confirmar saída</button><button class="btn btn-g" onclick="closeModal()">Cancelar</button></div>`);
}
function saidaToggle(){const t=document.getElementById('s_tipo').value;const w=document.getElementById('s_destWrap');if(w)w.style.display=(t==='transferencia')?'':'none';}
function saveSaida(id){
  const p=state.pacientes.find(x=>x.id===id);if(!p)return;
  p.status='saida';
  p.saida={tipo:document.getElementById('s_tipo').value,data:document.getElementById('s_data').value||ymd(),destino:getVal('s_dest'),obs:getVal('s_obs'),em:nowISO()};
  persist();closeModal();render();
}

/* ===== IA: extrair dados da evolução ===== */
function parseJsonLoose(t){if(!t)return null;t=String(t).trim().replace(/^```[a-z]*\s*/i,'').replace(/```\s*$/,'').trim();const i=t.indexOf('{'),j=t.lastIndexOf('}');if(i>=0&&j>i){try{return JSON.parse(t.slice(i,j+1));}catch(e){}}try{return JSON.parse(t);}catch(e){return null;}}
async function extrairEvol(){
  const raw=getVal('f_evol');
  if(!raw){alert('Cole a evolução do paciente antes de extrair.');return;}
  const b=document.getElementById('extrairBtn');b.innerHTML='<span class="spin"></span> Extraindo...';b.disabled=true;
  const prompt='Você é um assistente clínico extraindo dados de uma evolução de paciente INTERNADO para um painel de enfermaria. Responda APENAS um objeto JSON válido (sem markdown, sem comentários) com EXATAMENTE estas chaves:\n'
   +'- "nome" (string)\n'
   +'- "idade" (string, ex.: "47 anos")\n'
   +'- "diagnosticos" (ARRAY de strings): SOMENTE o MOTIVO DA INTERNAÇÃO / as hipóteses que justificaram a internação (costuma vir logo após a identificação). CADA hipótese/diagnóstico em um ITEM SEPARADO do array. NUNCA junte duas hipóteses no mesmo item (não use "e" nem vírgula para unir hipóteses distintas — separe em itens). NÃO liste comorbidades/diagnósticos prévios de rotina (HAS, DM2, etc.), a não ser que sejam o motivo da internação.\n'
   +'- "exames" (ARRAY de strings): SOMENTE os exames INVESTIGATIVOS do quadro atual, UM exame por item, com o resultado relevante. NÃO inclua exames de rotina/controle de praxe.\n'
   +'- "condutas" (ARRAY de strings): SOMENTE o que aparece APÓS a linha/título "CONDUTA" (ou "CONDUTAS"/"PLANO") e que mantém o paciente internado / impede a alta no momento. UMA conduta por item. Ignore condutas já resolvidas e o que não impede a alta.\n'
   +'- "pendencias" (ARRAY de strings curtas): o que IMPEDE A ALTA neste momento, UMA por item (ex.: aguardar resultado de exame, avaliação de especialidade, melhora clínica, vaga, ajuste de medicação).\n'
   +'Cada array deve ter um item por elemento (a interface mostra um por linha). Não invente nada; se algo não estiver no texto, use array vazio. Use português do Brasil.\n\nEvolução:\n'+raw;
  try{
    const txt=await MT.ai(prompt);
    const data=parseJsonLoose(txt);
    if(!data){alert('Não consegui estruturar automaticamente. Tente colar novamente ou preencha manualmente.');}
    else{
      const toLines=v=>Array.isArray(v)?v.filter(Boolean).join('\n'):(v||'');
      setVal('f_nome',data.nome||'');
      setVal('f_idade',data.idade||'');
      setVal('f_dx',bullets(toLines(data.diagnosticos)));
      setVal('f_exames',bullets(toLines(data.exames)));
      setVal('f_condutas',bullets(toLines(data.condutas)));
      setVal('f_pend',bullets(toLines(data.pendencias)));
      const okN=(data.nome||'')?'':' (nome não encontrado)';
      const bb=document.getElementById('extrairBtn');if(bb){bb.innerHTML='✓ Campos preenchidos'+okN;setTimeout(()=>{bb.innerHTML='✨ Extrair dados da evolução';bb.disabled=false;},1800);}
      return;
    }
  }catch(e){alert('⚠️ '+(e.message||'Falha na IA.'));}
  b.innerHTML='✨ Extrair dados da evolução';b.disabled=false;
}

/* ===== modal ===== */
function modal(html){document.querySelectorAll('.modal').forEach(m=>m.remove());const d=document.createElement('div');d.className='modal';d.id='modal';d.innerHTML='<div class="box">'+html+'</div>';d.onclick=e=>{if(e.target===d)closeModal();};document.body.appendChild(d);}
function closeModal(){const m=document.getElementById('modal');if(m)m.remove();}
</script>
</body>
