<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EvoluAI — Voz para evolução clínica (SOAP) | MedTech</title>
<meta name="description" content="EvoluAI: dite e a IA organiza em evolução médica estruturada (SOAP), anamnese, alta, receituário ou encaminhamento. Com histórico salvo na nuvem.">
<meta name="theme-color" content="#0E5A6D">
<link rel="icon" type="image/png" href="favicon.png">
<script src="_mtfb.js?v=1"></script>
<script>window.MT_APP={id:"evoluai",name:"EvoluAI"};</script>
<script type="module" src="_mtauth.js?v=3"></script>
<style>
:root{--petrol:#0E5A6D;--petrol-dark:#083845;--ink:#0E2A31;--mint:#2DD4A8;--mint-dark:#14b894;--bg:#F6FAFB;--soft:#EAF3F4;--line:#dbe8ea;--muted:#5B7882;--red:#c0392b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{background:linear-gradient(135deg,var(--petrol),var(--petrol-dark));color:#fff;padding:14px 0}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.5px}
.logo .mark{width:34px;height:34px;border-radius:10px;background:#2DD4A8;display:grid;place-items:center;flex:0 0 auto}
.logo .mark svg{width:22px;height:22px}
.logo b{color:var(--mint)}
.subtitle{color:#bcd6db;font-size:12.5px;margin-top:3px}
.usr{display:flex;align-items:center;gap:10px}
.usr .who{font-size:12.5px;color:#cfe3e6;text-align:right;line-height:1.3;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usr a,.usr button{color:#cfe3e6;text-decoration:none;font-size:13px;font-weight:600;background:rgba(255,255,255,.12);border:none;border-radius:8px;padding:7px 11px;cursor:pointer;font-family:inherit}
.usr button:hover{background:rgba(255,255,255,.22)}
main{max-width:1080px;margin:0 auto;padding:18px 18px 50px}
.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:16px;width:fit-content}
.tabs button{border:none;background:none;padding:9px 18px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted);font-family:inherit}
.tabs button.on{background:var(--petrol);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:10px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.btn-p{background:var(--mint);color:var(--petrol-dark)}.btn-p:hover{background:var(--mint-dark)}
.btn-g{background:#fff;color:var(--petrol);border:1px solid var(--line)}.btn-g:hover{background:var(--soft)}
.btn-mic{background:#fff;color:var(--petrol);border:1px solid var(--line)}
.btn-mic.on{background:#fde8e8;color:var(--red);border-color:#f3c2c2}
.btn-sm{padding:7px 12px;font-size:13px}
select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 10px 30px -24px rgba(8,56,69,.3)}
.card h3{font-size:15px;margin-bottom:10px;color:var(--petrol-dark);display:flex;align-items:center;justify-content:space-between;gap:8px}
textarea{width:100%;min-height:300px;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:14.5px;font-family:inherit;line-height:1.55;resize:vertical;background:#fff}
textarea:focus{outline:none;border-color:var(--mint)}
#out{min-height:300px;white-space:pre-wrap;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14.5px;line-height:1.6}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--red);font-size:12.5px;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.note{background:#fff8ed;border:1px solid #f4d9a8;color:#8a5a16;border-radius:12px;padding:12px 15px;font-size:13px;margin-top:14px}
.muted{color:var(--muted);font-size:13px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--petrol-dark);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.hist{display:flex;flex-direction:column;gap:9px}
.hitem{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 15px;display:flex;align-items:center;gap:12px}
.hitem .hmid{flex:1;min-width:0}
.hitem .htitle{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hitem .hmeta{color:var(--muted);font-size:12.5px;margin-top:3px}
.hbadge{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--petrol)}
.hitem .hacts{display:flex;gap:6px}
.hitem .hacts button{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px;font-weight:700;color:var(--petrol);font-family:inherit}
.empty{text-align:center;color:var(--muted);padding:40px;background:#fff;border:1px dashed var(--line);border-radius:14px}
.modal{position:fixed;inset:0;background:rgba(8,56,69,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:60}
.modal .box{background:#fff;border-radius:16px;padding:24px;max-width:480px;width:100%}
.field{margin-bottom:14px}.field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
footer{text-align:center;color:var(--muted);font-size:13px;padding:24px}
footer a{color:var(--petrol);font-weight:600;text-decoration:none}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div>
      <div class="logo"><span class="mark"><svg viewBox="0 0 96 96"><path d="M18 50 h13 l7 -20 9 38 8 -26 5 8 h13" fill="none" stroke="#062a33" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></span> Evolu<b>AI</b></div>
      <div class="subtitle">Voz → evolução clínica estruturada · por MedTech</div>
    </div>
    <div class="usr" id="usr"></div>
  </div>
</header>

<main>
  <div class="tabs">
    <button id="tab-editor" class="on" onclick="setTab('editor')">Editor</button>
    <button id="tab-hist" onclick="setTab('hist')">Histórico</button>
  </div>
  <div id="view"></div>
  <div class="note" id="storenote">⚠️ Ferramenta de apoio. A IA <b>não inventa dados</b> — mas <b>revise sempre</b> antes de assinar. Evite inserir dados que identifiquem o paciente; o conteúdo é processado pela API do Google Gemini. <a href="privacidade.html" style="color:#8a5a16;text-decoration:underline">Política de privacidade</a>.</div>
</main>

<footer>© 2026 <a href="index.html">MedTech</a> · <a href="privacidade.html">Privacidade</a></footer>

<script>
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const FMTLABEL={soap:'SOAP',anamnese:'Anamnese',alta:'Alta',evolucao:'Evolução',receita:'Receituário',encaminhamento:'Encaminhamento'};
const FORMATS={
 soap:'Organize em evolução médica no formato SOAP — S (Subjetivo), O (Objetivo: exame físico, sinais vitais, exames), A (Avaliação / impressão diagnóstica), P (Plano / conduta).',
 anamnese:'Organize em anamnese estruturada: Identificação, Queixa principal, História da doença atual, Antecedentes pessoais e familiares, Hábitos, Medicações em uso, Exame físico, Hipóteses diagnósticas e Conduta.',
 alta:'Organize em resumo de alta hospitalar: Diagnósticos, Resumo da internação, Procedimentos realizados, Medicações de alta, Orientações e Seguimento.',
 evolucao:'Organize o texto em uma evolução médica clara, concisa e profissional, mantendo apenas as informações fornecidas.',
 receita:'Organize as medicações citadas em um receituário claro, uma medicação por linha no formato "Medicamento concentração — posologia (via, frequência, duração)". Liste apenas o que foi mencionado; não acrescente fármacos.',
 encaminhamento:'Organize em uma carta de encaminhamento/parecer: especialidade de destino, resumo do caso, hipótese diagnóstica, exames relevantes e motivo do encaminhamento.'
};
let state={docs:[]};
let tab='editor';
let draft={raw:'',out:'',fmt:'soap'};

const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

/* boot */
function whenMT(cb){if(window.MT){cb();}else{setTimeout(()=>whenMT(cb),30);}}
whenMT(()=>{MT.onData(d=>{
  if(d&&typeof d==='object'&&d.docs){state={docs:d.docs||[]};}
  else{state={docs:[]};if(MT.mode==='demo')MT.save(state);}
  renderUser();render();
});renderUser();});
function persist(){MT.save(state);}
function renderUser(){const el=document.getElementById('usr');if(!el)return;
  if(MT.mode==='demo'){el.innerHTML='<span class="who">Modo demo</span><a href="index.html">← MedTech</a>';return;}
  const u=MT.user;const nm=u?(u.displayName||u.email||'Conta'):'';
  el.innerHTML=`<span class="who">${esc(nm)}</span><button onclick="MT.signOut()">Sair</button>`;}

function setTab(t){tab=t;document.getElementById('tab-editor').className=t==='editor'?'on':'';document.getElementById('tab-hist').className=t==='hist'?'on':'';
  document.getElementById('tab-hist').textContent='Histórico'+(state.docs.length?(' ('+state.docs.length+')'):'');render();}
function render(){tab==='editor'?renderEditor():renderHist();}

/* ---------- EDITOR ---------- */
function renderEditor(){
  const opt=Object.keys(FORMATS).map(k=>`<option value="${k}" ${draft.fmt===k?'selected':''}>${({soap:'Evolução SOAP',anamnese:'Anamnese estruturada',alta:'Resumo de alta',evolucao:'Evolução livre (organizada)',receita:'Receituário organizado',encaminhamento:'Encaminhamento / parecer'})[k]}</option>`).join('');
  document.getElementById('view').innerHTML=`
  <div class="row">
    <label class="muted" style="font-weight:700">Formato:</label>
    <select id="fmt" onchange="draft.fmt=this.value">${opt}</select>
  </div>
  <div class="grid">
    <div class="card">
      <h3>1. Rascunho / ditado <span id="liveTag"></span></h3>
      <div class="toolbar">
        <button class="btn btn-mic" id="micBtn" onclick="toggleMic()">🎤 Ditar</button>
        <button class="btn btn-g btn-sm" onclick="clearRaw()">Limpar</button>
        <button class="btn btn-g btn-sm" onclick="loadExample()">Exemplo</button>
      </div>
      <textarea id="raw" placeholder="Dite ou digite o caso aqui... Ex.: 'Paciente masculino 62 anos, hipertenso, refere dor torácica há 2 horas...'" oninput="draft.raw=this.value">${esc(draft.raw)}</textarea>
    </div>
    <div class="card">
      <h3>2. Documento gerado <span><button class="btn btn-g btn-sm" onclick="editOut()">✏️ Editar</button> <button class="btn btn-g btn-sm" onclick="copyOut(event)">📋 Copiar</button></span></h3>
      <div class="toolbar">
        <button class="btn btn-p" id="genBtn" onclick="generate()">✨ Gerar com IA</button>
        <button class="btn btn-g" id="saveBtn" onclick="saveDoc()">💾 Salvar no histórico</button>
      </div>
      <div id="out" contenteditable="false">${draft.out?esc(draft.out):'O documento estruturado aparecerá aqui.'}</div>
    </div>
  </div>`;
  if(listening)updateMic();
}
function clearRaw(){draft.raw='';$('#raw').value='';}
function loadExample(){draft.raw='Paciente masculino 62 anos, hipertenso e diabético, chega ao pronto-socorro com dor torácica opressiva há cerca de duas horas irradiando para o braço esquerdo associada a sudorese. Refere uso irregular das medicações. Ao exame está consciente orientado, pressão 160 por 95, frequência cardíaca 98, saturação 96 por cento, ausculta cardíaca sem sopros, pulmões limpos. Eletrocardiograma mostra supra de ST em parede inferior. Penso em infarto agudo com supra de ST de parede inferior, vou dar AAS 300 mg, acionar a hemodinâmica para angioplastia primária e iniciar anticoagulação.';if($('#raw'))$('#raw').value=draft.raw;}
function copyOut(ev){const t=$('#out').innerText;if(!t||t.startsWith('O documento'))return;navigator.clipboard&&navigator.clipboard.writeText(t);const b=ev.target;const old=b.textContent;b.textContent='✓ Copiado';setTimeout(()=>b.textContent=old,1500);}
function editOut(){const o=$('#out');const on=o.getAttribute('contenteditable')==='true';o.setAttribute('contenteditable',on?'false':'true');if(!on)o.focus();else draft.out=o.innerText;event.target.textContent=on?'✏️ Editar':'✓ Concluir';}

/* voz */
let rec=null,listening=false;
function toggleMic(){ if(listening){stopMic();return;} const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Seu navegador não suporta ditado por voz. Use o Google Chrome (no computador ou celular) ou digite o texto.');return;}
  rec=new SR();rec.lang='pt-BR';rec.continuous=true;rec.interimResults=true;
  rec.onresult=e=>{let fin='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)fin+=e.results[i][0].transcript;}if(fin){const ta=$('#raw');ta.value=(ta.value?ta.value.replace(/\s*$/,'')+' ':'')+fin.trim();draft.raw=ta.value;}};
  rec.onerror=ev=>{if(ev.error==='not-allowed')alert('Permita o acesso ao microfone para ditar.');};
  rec.onend=()=>{if(listening){try{rec.start();}catch(e){}}};
  try{rec.start();listening=true;updateMic();}catch(e){alert('Não foi possível iniciar o microfone.');}
}
function stopMic(){listening=false;if(rec){try{rec.stop();}catch(e){}}updateMic();}
function updateMic(){const b=$('#micBtn');const t=$('#liveTag');if(!b)return;if(listening){b.classList.add('on');b.textContent='⏹️ Parar';if(t)t.innerHTML='<span class="live"><span class="dot"></span>ouvindo…</span>';}else{b.classList.remove('on');b.textContent='🎤 Ditar';if(t)t.innerHTML='';}}

/* IA */
async function localGemini(prompt,model){
  const key=localStorage.getItem('evoluai_key');
  if(!key)throw new Error('IA MedTech indisponível no momento. Tente novamente em instantes (ou, se preferir, configure uma chave própria em ⚙️).');
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
  if(!r.ok){const e=await r.text();throw new Error('HTTP '+r.status+' — '+e.slice(0,140));}
  const data=await r.json();
  const text=(data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts[0].text)||'';
  if(!text)throw new Error('A IA não retornou texto. Tente novamente.');
  return text;
}
async function generate(){
  const raw=$('#raw').value.trim();draft.raw=raw;
  if(!raw){alert('Dite ou digite o caso antes de gerar.');return;}
  const fmt=$('#fmt').value;const model=localStorage.getItem('evoluai_model')||'gemini-2.5-flash';
  const g=$('#genBtn');g.innerHTML='<span class="spin"></span> Gerando...';g.disabled=true;
  const prompt='Você é um escriba clínico experiente. A partir do rascunho/ditado abaixo, produza o documento solicitado em português do Brasil, de forma concisa e profissional. REGRAS: não invente dados, exames, doses ou condutas que não foram mencionados; se algo essencial estiver faltando, escreva "[não informado]". '+FORMATS[fmt]+'\n\nRascunho:\n'+raw;
  try{
    let text;
    if(window.MT&&MT.ai){try{text=await MT.ai(prompt,model);}catch(e){text=await localGemini(prompt,model);}}
    else{text=await localGemini(prompt,model);}
    draft.out=text.trim();$('#out').textContent=draft.out;
  }catch(err){$('#out').textContent='⚠️ '+err.message;}
  g.innerHTML='✨ Gerar com IA';g.disabled=false;
}

/* salvar no histórico */
function saveDoc(){
  const out=$('#out')?$('#out').innerText.trim():draft.out;
  if(!out||out.startsWith('O documento')){alert('Gere ou escreva um documento antes de salvar.');return;}
  draft.out=out;draft.raw=$('#raw')?$('#raw').value:draft.raw;draft.fmt=$('#fmt')?$('#fmt').value:draft.fmt;
  const first=out.split('\n').map(s=>s.trim()).find(s=>s)||'Documento';
  const title=first.replace(/^[#*•\-\s]+/,'').slice(0,70);
  state.docs.unshift({id:uid(),date:new Date().toISOString(),title,fmt:draft.fmt,raw:draft.raw,out});
  persist();
  const b=$('#saveBtn');if(b){const o=b.textContent;b.textContent='✓ Salvo no histórico';setTimeout(()=>b.textContent=o,1600);}
  document.getElementById('tab-hist').textContent='Histórico ('+state.docs.length+')';
}

/* ---------- HISTÓRICO ---------- */
function renderHist(){
  if(!state.docs.length){document.getElementById('view').innerHTML='<div class="empty">Nenhum documento salvo ainda.<br>No <b>Editor</b>, gere um documento e toque em <b>💾 Salvar no histórico</b>.</div>';return;}
  const html='<div class="hist">'+state.docs.map(d=>{const dt=new Date(d.date);const ds=String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0')+'/'+dt.getFullYear()+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');
    return `<div class="hitem"><div class="hmid"><div class="htitle">${esc(d.title)}</div><div class="hmeta"><span class="hbadge">${FMTLABEL[d.fmt]||d.fmt}</span> &nbsp;${ds}</div></div><div class="hacts"><button onclick="openDoc('${d.id}')">Abrir</button><button onclick="delDoc('${d.id}')">🗑️</button></div></div>`;}).join('')+'</div>';
  document.getElementById('view').innerHTML=html;
}
function openDoc(id){const d=state.docs.find(x=>x.id===id);if(!d)return;draft={raw:d.raw||'',out:d.out||'',fmt:d.fmt||'soap'};setTab('editor');}
function delDoc(id){if(confirm('Excluir este documento do histórico?')){state.docs=state.docs.filter(x=>x.id!==id);persist();document.getElementById('tab-hist').textContent='Histórico'+(state.docs.length?(' ('+state.docs.length+')'):'');render();}}

/* chave (fica só no navegador, nunca na nuvem) */
function openKey(){const cur=localStorage.getItem('evoluai_key')||'';
  modal(`<h3>⚙️ Chave do Google Gemini</h3>
   <div class="field"><label>API Key (fica salva só neste navegador, nunca na nuvem)</label><input id="mkey" type="password" placeholder="AIza..." value="${esc(cur)}"></div>
   <div class="field"><label>Modelo</label><input id="mmodel" value="${esc(localStorage.getItem('evoluai_model')||'gemini-2.5-flash')}"></div>
   <p class="muted">Crie uma chave gratuita em aistudio.google.com/app/apikey.</p>
   <div class="row" style="margin-top:14px"><button class="btn btn-p" onclick="saveKey()">Salvar</button><button class="btn btn-g" onclick="closeModal()">Fechar</button></div>`);}
function saveKey(){localStorage.setItem('evoluai_key',$('#mkey').value.trim());localStorage.setItem('evoluai_model',$('#mmodel').value.trim()||'gemini-2.5-flash');closeModal();}
function modal(html){const d=document.createElement('div');d.className='modal';d.id='modal';d.innerHTML='<div class="box">'+html+'</div>';d.onclick=e=>{if(e.target===d)closeModal();};document.body.appendChild(d);}
function closeModal(){const m=document.getElementById('modal');if(m)m.remove();}
</script>
</body>
</html>
