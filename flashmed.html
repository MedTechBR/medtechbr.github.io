<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlashMed</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="/flashmed/">
<!-- 07/10/2026: o FlashMed virou o preparatório ENARE/ENAMED em /flashmed/ (repo MedTechBR/flashmed).
     Esta página só redireciona. ?tema=<termo> (link "Treinar no FlashMed" do CondutAI) vira ?busca=<termo>.
     O progresso do app antigo é trazido para o novo na primeira entrada da conta (nuvem.js, legado). -->
<script>
(function(){
  var p=new URLSearchParams(location.search), t=p.get("tema"), q=new URLSearchParams();
  if(t)q.set("busca",t);
  if(p.get("ir"))q.set("ir",p.get("ir"));
  var s=q.toString();
  location.replace("/flashmed/"+(s?"?"+s:""));
})();
</script>
<meta http-equiv="refresh" content="0; url=/flashmed/">
<body style="font:16px -apple-system,system-ui,sans-serif;background:#F7F5F0;color:#1B1915;display:grid;place-items:center;min-height:100vh;margin:0">
<p>O FlashMed mudou de endereço. <a href="/flashmed/" style="color:#C2410C">Abrir o FlashMed</a></p>
</body>
</html>
