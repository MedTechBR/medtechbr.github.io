<style>
:root{--petrol:#2563eb;--petrol-dark:#1e40af;--ink:#0f172a;--bg:#f4f7fb;--soft:#e8f0fe;--line:#e6ebf3;--muted:#64748b;--green:#16a34a;--green-bg:#e7f7ee;--red:#c0392b;--red-bg:#fdecea;--amber:#c97a17}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:-.011em;color:var(--ink);background:var(--bg)}
header{background:var(--petrol);color:#fff;padding:15px 0}
.wrap{max-width:880px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.5px}
.logo .mark{width:34px;height:34px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:0 0 auto}
.logo .mark svg{width:22px;height:22px}
.logo b{color:#bfdbfe}
.top a{color:#cfe3e6;text-decoration:none;font-size:14px;font-weight:600}
.subtitle{color:#bcd6db;font-size:12.5px;margin-top:3px}
/* tab bar */
.tabbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.tabs{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs button{flex:0 0 auto;background:none;border:none;padding:13px 14px;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;display:flex;align-items:center;gap:6px}
.tabs button.active{color:var(--petrol);border-bottom-color:var(--petrol)}
.tabs button i{font-size:16px}
main{max-width:880px;margin:0 auto;padding:20px 18px}
.btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:10px;padding:11px 18px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.btn-p{background:var(--petrol);color:#fff}.btn-p:hover{background:var(--petrol-dark)}
.btn-g{background:#fff;color:var(--petrol);border:1px solid var(--line)}.btn-g:hover{background:var(--soft)}
.btn-sm{padding:8px 12px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;align-items:center}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 10px 30px -22px rgba(8,56,69,.3)}
.muted{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;background:var(--soft);color:var(--petrol);font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px}
.pill.due{background:#fdf0e0;color:var(--amber)}
.pill.bi{background:#e7f7f1;color:var(--green)}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--petrol)}
label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
.field{margin-bottom:14px}
/* área chips / grid */
.areagrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.areagrid{grid-template-columns:1fr}}
.areacard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:.12s;border-left:5px solid var(--petrol)}
.areacard:hover{transform:translateY(-2px);box-shadow:0 10px 24px -18px rgba(8,56,69,.4)}
.areacard h3{font-size:16px}
.areacard p{color:var(--muted);font-size:12.5px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:600;font-size:13px;padding:7px 13px;border-radius:999px;cursor:pointer}
.chip.sel{background:var(--petrol);color:#fff;border-color:var(--petrol)}
/* questão */
.qwrap{max-width:720px;margin:0 auto}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.qstem{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;font-size:16px;line-height:1.6;box-shadow:0 10px 30px -24px rgba(8,56,69,.35)}
.qopts{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.qopt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;font-size:15px;line-height:1.45;cursor:pointer;font-family:inherit;color:var(--ink);transition:.1s}
.qopt:hover:not(:disabled){border-color:var(--petrol);background:var(--soft)}
.qopt .let{flex:0 0 26px;height:26px;border-radius:50%;background:var(--soft);color:var(--petrol);font-weight:800;font-size:13px;display:grid;place-items:center}
.qopt.correct{border-color:var(--green);background:var(--green-bg)}
.qopt.correct .let{background:var(--green);color:#fff}
.qopt.wrong{border-color:var(--red);background:var(--red-bg)}
.qopt.wrong .let{background:var(--red);color:#fff}
.qopt:disabled{cursor:default}
.coment{margin-top:14px;border:1px solid #cfe0f4;background:#f3f8ff;border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.6}
.coment .h{font-weight:800;color:var(--petrol);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.coment .ref{display:inline-block;margin-top:8px;color:var(--green);font-weight:700;font-size:12.5px}
.prog{height:7px;background:var(--soft);border-radius:99px;overflow:hidden;margin:0 0 14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--petrol),#60a5fa)}
/* simulado */
.simbar{position:sticky;top:47px;background:var(--bg);padding:10px 0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.timer{font-weight:800;font-variant-numeric:tabular-nums;font-size:16px;background:#fff;border:1px solid var(--line);padding:6px 12px;border-radius:10px}
.timer.warn{color:var(--red);border-color:var(--red)}
.navdots{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.navdots button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}
.navdots button.ans{background:var(--soft);color:var(--petrol);border-color:var(--petrol)}
.navdots button.cur{outline:2px solid var(--petrol)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
.stat .n{font-size:26px;font-weight:800}.stat .l{font-size:11px;color:var(--muted);margin-top:2px}
.stat.green .n{color:var(--green)}.stat.red .n{color:var(--red)}
.barrow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}
.barrow .nm{flex:0 0 130px;font-weight:600}
.barrow .bar{flex:1;height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.barrow .bar i{display:block;height:100%;background:var(--green)}
.barrow .pc{flex:0 0 46px;text-align:right;font-weight:700}
/* flashcards (mantido) */
.deck{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.deck .info h3{font-size:17px}
.deck .info p{color:var(--muted);font-size:13px;margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flash{background:#fff;border:1px solid var(--line);border-radius:18px;min-height:220px;display:flex;align-items:center;justify-content:center;padding:28px;font-size:18px;line-height:1.55;cursor:pointer;box-shadow:0 16px 40px -26px rgba(8,56,69,.4);user-select:none}
.flash .side{max-width:680px}.flash .q{font-weight:700}.flash .a{color:#28424a;text-align:left}
.flash small{display:block;color:var(--muted);font-size:13px;margin-top:16px;font-weight:600;text-align:center}
.flash .refx{display:block;color:var(--green);font-size:12px;margin-top:10px;font-weight:700;text-align:center}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.rate button{border:none;border-radius:11px;padding:13px 6px;font-weight:800;font-size:14px;cursor:pointer;color:#fff}
.r0{background:#c0392b}.r1{background:#c97a17}.r2{background:#1e40af}.r3{background:#2563eb}
.rate small{display:block;font-weight:600;font-size:11px;opacity:.85;margin-top:2px}
.carditem{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.carditem:last-child{border-bottom:none}
.carditem .x{color:var(--red);cursor:pointer;font-weight:800;background:none;border:none}
.empty{text-align:center;color:var(--muted);padding:34px}
.empty i{font-size:38px;opacity:.5;display:block;margin-bottom:8px}
.note{background:#fff8ed;border:1px solid #f4d9a8;color:#8a5a16;border-radius:12px;padding:12px 15px;font-size:13px;margin-top:8px;line-height:1.5}
footer{text-align:center;color:var(--muted);font-size:13px;padding:24px}
footer a{color:var(--petrol);font-weight:600;text-decoration:none}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:18px;z-index:60}
.modal .box{background:#fff;border-radius:16px;padding:24px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--petrol);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:560px){.rate{grid-template-columns:1fr 1fr}.stats3{grid-template-columns:repeat(3,1fr)}}
/* filtro */
.filterbar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filterbar .fg{flex:1;min-width:120px}.filterbar label{font-size:12px;margin:0 0 4px}
.filterbar select{padding:9px 11px;font-size:14px}
/* riscar alternativa */
.qopt.struck{opacity:.5;text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.qopt.struck .let{background:#e5e7eb;color:#94a3b8}
.opt-hint{font-size:12px;color:var(--muted);margin:6px 2px 2px;display:flex;align-items:center;gap:5px}
/* caneta / escrita à mão */
.ink-canvas{position:fixed;inset:0;z-index:70;touch-action:none;pointer-events:none}
.ink-canvas.active{pointer-events:auto;cursor:crosshair}
.penbar{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:71;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.pen-tools{display:flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px;box-shadow:0 12px 34px -14px rgba(8,56,69,.5)}
.pen-color{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.pen-color.sel{box-shadow:0 0 0 2px var(--petrol)}
.pen-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}
.pen-btn.sel{background:var(--petrol);color:#fff;border-color:var(--petrol)}
.pen-fab{width:52px;height:52px;border-radius:50%;border:none;background:var(--petrol);color:#fff;box-shadow:0 12px 30px -8px rgba(37,99,235,.6);cursor:pointer;display:grid;place-items:center}
.pen-fab i{font-size:24px}.pen-fab.on{background:#0f172a}
@media print{.penbar,.ink-canvas{display:none}}
</style>

<!-- Caneta / escrita à mão (Apple Pencil / dedo / mouse) -->
<canvas id="inkCanvas" class="ink-canvas" aria-hidden="true"></canvas>
<div class="penbar">
  <div class="pen-tools" id="penTools" hidden>
    <button class="pen-color sel" data-color="#0f172a" style="background:#0f172a" aria-label="Tinta"></button>

    <button class="pen-color" data-color="#16a34a" style="background:#16a34a" aria-label="Verde"></button>
    <button class="pen-btn" id="penEraser" type="button">Borracha</button>
    <button class="pen-btn" id="penClear" type="button">Limpar</button>
  </div>

<script>
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const $=s=>document.querySelector(s);
const LETRAS=['A','B','C','D','E','F'];
const AREAS=window.FM_AREAS||[];
const areaNome=a=>{const x=AREAS.find(z=>z.id===a);return x?x.nome:a;};
const areaCor=a=>{const x=AREAS.find(z=>z.id===a);return x?x.cor:'#2563eb';};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let qFilter={area:'*',esp:'*'};

/* ====== Riscar / eliminar alternativa (arraste para o lado; persiste por questão) ====== */
let strikes={}; try{ strikes=JSON.parse(localStorage.getItem('flashmed_strikes')||'{}')||{}; }catch(e){ strikes={}; }
function getStruck(qi){ return new Set(strikes[qi]||[]); }
function saveStruck(qi,set){ if(set.size)strikes[qi]=[...set]; else delete strikes[qi]; try{localStorage.setItem('flashmed_strikes',JSON.stringify(strikes));}catch(e){} }
function toggleStrike(qi,j,btn){ const s=getStruck(qi); if(s.has(j)){s.delete(j);btn.classList.remove('struck');} else {s.add(j);btn.classList.add('struck');} saveStruck(qi,s); }
function attachStrikeSwipe(btn,qi,j){
  let sx=0,sy=0,dragging=false;
  btn.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse'&&e.button!==0)return; sx=e.clientX;sy=e.clientY;dragging=true;btn._swiped=false;btn.style.transition='none'; });
  btn.addEventListener('pointermove',e=>{ if(!dragging)return; const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!btn._swiped&&Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>8){ try{btn.setPointerCapture(e.pointerId);}catch(_){} }
    if(btn.hasPointerCapture&&btn.hasPointerCapture(e.pointerId)){ btn.style.transform='translateX('+(dx*0.5)+'px)'; if(Math.abs(dx)>48)btn._swiped=true; e.preventDefault(); } });
  function up(){ if(!dragging)return; dragging=false; btn.style.transition='transform .18s ease'; btn.style.transform=''; if(btn._swiped)toggleStrike(qi,j,btn); }
  btn.addEventListener('pointerup',up); btn.addEventListener('pointercancel',up);
}

/* ====== Caneta — escrever à mão sobre o app (Apple Pencil / dedo / mouse) ====== */
(function(){
  const canvas=document.getElementById('inkCanvas'); if(!canvas)return; const ctx=canvas.getContext('2d');
  const fab=document.getElementById('penFab'), tools=document.getElementById('penTools');
  let penMode=false,drawing=false,erasing=false,color='#0f172a',activeId=null,lastPen=0,lastX=0,lastY=0,curKey=null;
  const inkStore=new Map();
  function clearPixels(){ ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height); ctx.restore(); }
  function stash(){ if(curKey==null)return; let blank=true; try{const d=ctx.getImageData(0,0,canvas.width,canvas.height).data; for(let i=3;i<d.length;i+=4){if(d[i]!==0){blank=false;break;}} }catch(_){blank=false;} if(blank)inkStore.delete(curKey); else inkStore.set(curKey,canvas.toDataURL()); }
  function sizeCanvas(){ const dpr=Math.min(window.devicePixelRatio||1,3); let prev=null; if(canvas.width){prev=document.createElement('canvas');prev.width=canvas.width;prev.height=canvas.height;prev.getContext('2d').drawImage(canvas,0,0);} const w=window.innerWidth,h=window.innerHeight; canvas.style.width=w+'px';canvas.style.height=h+'px'; canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineCap='round';ctx.lineJoin='round'; if(prev){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(prev,0,0,prev.width,prev.height,0,0,canvas.width,canvas.height);ctx.restore();} }
  sizeCanvas(); window.addEventListener('resize',sizeCanvas); window.addEventListener('orientationchange',()=>setTimeout(sizeCanvas,250));
  function setMode(on){ penMode=on; canvas.classList.toggle('active',on); tools.hidden=!on; fab.classList.toggle('on',on); fab.innerHTML=on?'<i class="ti ti-x"></i>':'<i class="ti ti-pencil"></i>'; fab.setAttribute('aria-label',on?'Sair da caneta':'Escrever à mão'); }
  fab.onclick=()=>setMode(!penMode);
  tools.querySelectorAll('.pen-color').forEach(b=>{ b.onclick=()=>{color=b.dataset.color;erasing=false;refreshSel();}; });
  document.getElementById('penEraser').onclick=()=>{erasing=!erasing;refreshSel();};
  document.getElementById('penClear').onclick=()=>{clearPixels(); if(curKey!=null)inkStore.delete(curKey);};
  window.QuizInk={ switchTo(key){ if(key===curKey)return; stash(); curKey=key; clearPixels(); const d=inkStore.get(key); if(d){const img=new Image();img.onload=()=>{if(curKey!==key)return;ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(img,0,0,canvas.width,canvas.height);ctx.restore();};img.src=d;} } };
  function refreshSel(){ tools.querySelectorAll('.pen-color').forEach(b=>b.classList.toggle('sel',!erasing&&b.dataset.color===color)); document.getElementById('penEraser').classList.toggle('sel',erasing); }
  refreshSel();
  function seg(x,y,pressure){ ctx.globalCompositeOperation=erasing?'destination-out':'source-over'; ctx.strokeStyle=color; ctx.lineWidth=erasing?26:2.4*(0.35+1.3*(pressure||0.5)); ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(x,y);ctx.stroke(); lastX=x;lastY=y; }
  canvas.addEventListener('pointerdown',e=>{ if(!penMode)return; if(e.pointerType==='touch'&&(performance.now()-lastPen)<1000){e.preventDefault();return;} if(e.pointerType==='pen')lastPen=performance.now(); drawing=true;activeId=e.pointerId; try{canvas.setPointerCapture(e.pointerId);}catch(_){} lastX=e.clientX;lastY=e.clientY; seg(e.clientX+0.01,e.clientY+0.01,e.pressure); e.preventDefault(); });
  canvas.addEventListener('pointermove',e=>{ if(!drawing||e.pointerId!==activeId)return; if(e.pointerType==='pen')lastPen=performance.now(); let evs=e.getCoalescedEvents?e.getCoalescedEvents():null; if(!evs||!evs.length)evs=[e]; for(const ev of evs)seg(ev.clientX,ev.clientY,ev.pressure); e.preventDefault(); });
  function endp(e){ if(e.pointerId===activeId){drawing=false;activeId=null;} }
  canvas.addEventListener('pointerup',endp); canvas.addEventListener('pointercancel',endp);
})();
function inkKeyAtual(){
  if(nav==='simulado'&&sim&&!sim.done){ const q=sim.pool[sim.idx]; return q?'S:'+q.id:'none'; }
  if((nav==='questoes'||nav==='revisao')&&sess&&sess.pool[sess.idx]){ return 'Q:'+sess.pool[sess.idx].id; }
  return 'none';
}

/* ====== BARALHOS PRONTOS (flashcards) — preservado ====== */
const BUILTIN = [
{ id:'b-emerg', name:'Emergência & UTI — avançado', cards:[

{ id:'b-infecto', name:'Infectologia & Antibióticos — avançado', cards:[

/* ====== Estado / persistência ====== */
let decks=[], answers={}, marked=[], generated=[], sims=[], simActive=null;
let mtReady=false;
function save(){ if(window.MT&&MT.save){ MT.save({decks,answers,marked,generated,sims,simActive}); } }
function persistSim(){ if(!sim||sim.done){simActive=null;} else { simActive={area:sim.area,areaNome:sim.areaNome,qids:sim.pool.map(q=>q.id),answers:sim.answers,idx:sim.idx,tpq:sim.tpq,left:sim.left}; } save(); }
function ensureBuiltin(){
  BUILTIN.forEach(bd=>{
    let d=decks.find(x=>x.id===bd.id);
    if(!d){ d={id:bd.id,name:bd.name,builtin:true,cards:[],checkedAt:0}; decks.unshift(d); }
    d.builtin=true; d.name=bd.name;
    bd.cards.forEach(bc=>{
      let c=d.cards.find(x=>x.id===bc.id);
      if(!c){ d.cards.push({id:bc.id,front:bc.q,back:bc.a,ref:bc.ref||'',builtin:true,ef:2.5,interval:0,reps:0,due:0}); }
      else { c.front=bc.q; c.back=bc.a; c.ref=bc.ref||''; c.builtin=true; }
    });
  });
}
const allQ=()=>(window.QBANK||[]).concat(generated);
const qById=id=>allQ().find(q=>q.id===id);

/* ====== Navegação ====== */
let nav='inicio';   // inicio | questoes | simulado | flashcards | revisao
let sess=null;      // sessão de questões (prática/revisão)
let sim=null;       // sessão de simulado
let fc={mode:'home',deck:null,queue:[],idx:0,flip:false,done:0}; // flashcards
const TABS=[['inicio','Início','ti-home-2'],['questoes','Questões','ti-list-check'],['simulado','Simulado','ti-clock-hour-4'],['flashcards','Flashcards','ti-cards'],['revisao','Revisão','ti-refresh']];
function go(n){ nav=n; if(n!=='questoes'&&n!=='revisao')sess=null; if(n!=='simulado')sim=null; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function renderTabs(){
  $('#tabs').innerHTML=TABS.map(t=>`<button class="${nav===t[0]?'active':''}" onclick="go('${t[0]}')"><i class="ti ${t[2]}"></i>${t[1]}</button>`).join('');
}
function render(){
  renderTabs();
  const a=$('#app');
  if(nav==='inicio')a.innerHTML=inicioView();
  else if(nav==='questoes')a.innerHTML= sess? sessView() : questoesHome();
  else if(nav==='simulado')a.innerHTML= sim? (sim.done?simResult():simRun()) : simConfig();
  else if(nav==='revisao')a.innerHTML= sess? sessView() : revisaoHome();
  else if(nav==='flashcards')a.innerHTML= fc.mode==='study'?studyView():(fc.mode==='manage'?manageView():flashHome());
  postRender();
}
function postRender(){
  // liga clique + arraste-para-riscar nas alternativas da questão atual
  const emQuestao = (nav==='questoes'||nav==='revisao') && sess && sess.pool[sess.idx];
  const emSim = nav==='simulado' && sim && !sim.done;
  if(emQuestao || emSim){
    const q = emSim ? sim.pool[sim.idx] : sess.pool[sess.idx];
    const revelou = emQuestao && sess.revealed;
    document.querySelectorAll('.qopt').forEach(btn=>{
      const j=+btn.dataset.j; if(isNaN(j))return;
      if(getStruck(q.id).has(j)) btn.classList.add('struck');
      if(!revelou) attachStrikeSwipe(btn,q.id,j);
      btn.onclick=()=>{ if(btn._swiped){btn._swiped=false;return;} if(emSim)simPick(j); else answerQ(j); };
    });
  }
  if(window.QuizInk) window.QuizInk.switchTo(inkKeyAtual());
}

/* ====== INÍCIO ====== */
function statsGlobais(){
  const ks=Object.keys(answers); const tot=ks.length; let ac=0; const porArea={};
  ks.forEach(id=>{const a=answers[id];if(a.correct)ac++;const ar=a.area||(qById(id)||{}).area||'?';porArea[ar]=porArea[ar]||{t:0,c:0};porArea[ar].t++;if(a.correct)porArea[ar].c++;});
  return {tot,ac,pct:tot?Math.round(ac/tot*100):0,porArea,erradas:ks.filter(id=>!answers[id].correct)};
}
function inicioView(){
  const s=statsGlobais(); const nBanco=allQ().length; const nMarc=marked.length;
  const dueFC=decks.reduce((a,d)=>a+d.cards.filter(c=>(c.due||0)<=Date.now()).length,0);
  return `<div class="stats3">
     <div class="stat"><div class="n">${nBanco}</div><div class="l">questões no banco</div></div>
     <div class="stat green"><div class="n">${s.pct}%</div><div class="l">acerto (${s.ac}/${s.tot})</div></div>
     <div class="stat"><div class="n">${dueFC}</div><div class="l">flashcards p/ revisar</div></div>
   </div>
   <div class="card">
     <h3 style="margin-bottom:4px">Estudar por questões</h3>
     <p class="muted" style="margin-bottom:12px">Escolha uma área e responda questões comentadas. A IA gera mais do tema que você quiser.</p>
     <div class="row">
       <button class="btn btn-p" onclick="go('questoes')"><i class="ti ti-list-check"></i> Ir para Questões</button>
       <button class="btn btn-g" onclick="go('simulado')"><i class="ti ti-clock-hour-4"></i> Fazer simulado</button>
       ${(s.erradas.length||nMarc)?`<button class="btn btn-g" onclick="go('revisao')"><i class="ti ti-refresh"></i> Revisar (${s.erradas.length+nMarc})</button>`:''}
     </div>
   </div>
   ${s.tot?`<div class="card"><h3 style="margin-bottom:10px">Seu desempenho por área</h3>${
     AREAS.filter(ar=>s.porArea[ar.id]).map(ar=>{const p=s.porArea[ar.id];const pc=Math.round(p.c/p.t*100);return `<div class="barrow"><span class="nm">${esc(ar.nome)}</span><span class="bar"><i style="width:${pc}%;background:${ar.cor}"></i></span><span class="pc">${pc}%</span></div>`;}).join('')
   }</div>`:''}
   <div class="note"><b>Híbrido:</b> o banco começa com questões curadas do MedTech e a <b>IA amplia</b> por tema. Os <b>Flashcards</b> (repetição espaçada) continuam disponíveis na aba própria.</div>`;
}

/* ====== QUESTÕES (home + sessão) ====== */
function espPresentes(area){ const set=new Set(); allQ().forEach(q=>{ if((area==='*'||q.area===area)&&q.esp)set.add(q.esp); }); return Array.from(set).sort(); }
function questoesHome(){
  const fa=qFilter.area, fe=qFilter.esp, espOpts=espPresentes(fa);
  const nFilt=allQ().filter(q=>(fa==='*'||q.area===fa)&&(fe==='*'||q.esp===fe)).length;
  return `<h3 style="margin-bottom:4px">Questões</h3>
   <p class="muted" style="margin-bottom:12px">Filtre por área e especialidade — ou toque direto numa área abaixo.</p>
   <div class="filterbar">
     <div class="fg"><label>Área</label>
       <select onchange="setFilterArea(this.value)"><option value="*"${fa==='*'?' selected':''}>Todas as áreas</option>${AREAS.map(a=>`<option value="${a.id}"${fa===a.id?' selected':''}>${esc(a.nome)}</option>`).join('')}</select></div>
     <div class="fg"><label>Especialidade</label>
       <select onchange="setFilterEsp(this.value)"${espOpts.length?'':' disabled'}><option value="*">Todas</option>${espOpts.map(e=>`<option value="${esc(e)}"${fe===e?' selected':''}>${esc(e)}</option>`).join('')}</select></div>
     <button class="btn btn-p" onclick="startPractice(qFilter.area,qFilter.esp)"${nFilt?'':' disabled'}>Estudar (${nFilt})</button>
   </div>
   <div class="areagrid">${AREAS.map(ar=>{
     const n=allQ().filter(q=>q.area===ar.id).length;
     return `<div class="areacard" style="border-left-color:${ar.cor}" onclick="startPractice('${ar.id}','*')">
        <h3>${esc(ar.nome)}</h3>
        <p>${n} questão(ões) · ${ar.esp.slice(0,3).join(' · ')}${ar.esp.length>3?'…':''}</p>
     </div>`;
   }).join('')}</div>`;
}
function setFilterArea(v){ qFilter.area=v; qFilter.esp='*'; render(); }
function setFilterEsp(v){ qFilter.esp=v; render(); }
function startPractice(area,esp){
  esp=esp||'*';
  let pool=allQ().filter(q=>(area==='*'||q.area===area)&&(esp==='*'||q.esp===esp));
  if(!pool.length){ area!=='*'&&genMore(area,esp==='*'?null:esp,true); return; }
  const naoVistas=shuffle(pool.filter(q=>!answers[q.id]));
  const vistas=shuffle(pool.filter(q=>answers[q.id]));
  sess={mode:'practice',area,esp,pool:naoVistas.concat(vistas),idx:0,picked:null,revealed:false,right:0,done:0};
  nav='questoes'; render(); window.scrollTo({top:0,behavior:'smooth'});
}
function sessView(){
  if(!sess.pool.length) return `<div class="card empty"><i class="ti ti-checkbox"></i><h3>Nada por aqui</h3><p class="muted">Sem questões para esta seleção.</p><div style="margin-top:14px"><button class="btn btn-p" onclick="go('${nav}')">Voltar</button></div></div>`;
  if(sess.idx>=sess.pool.length) return sessDone();
  const q=sess.pool[sess.idx];
  const pct=Math.round(sess.idx/sess.pool.length*100);
  const isMk=marked.includes(q.id);
  return `<div class="qwrap">
    <div class="prog"><i style="width:${pct}%"></i></div>
    <div class="qmeta">
      <span class="pill" style="background:${areaCor(q.area)}1a;color:${areaCor(q.area)}">${esc(areaNome(q.area))}${q.esp?' · '+esc(q.esp):''}</span>
      <span class="muted">${sess.idx+1} / ${sess.pool.length} · ${sess.right} certas</span>
    </div>
    <div class="qstem">${esc(q.q)}</div>
    ${sess.revealed?'':'<div class="opt-hint"><i class="ti ti-arrows-horizontal"></i> arraste uma alternativa para o lado para riscá-la</div>'}
    <div class="qopts">${q.ops.map((op,i)=>{
      let cls='';
      if(sess.revealed){ if(i===q.correct)cls='correct'; else if(i===sess.picked)cls='wrong'; }
      return `<button class="qopt ${cls}" ${sess.revealed?'disabled':''} data-j="${i}"><span class="let">${LETRAS[i]}</span><span>${esc(op)}</span></button>`;
    }).join('')}</div>
    ${sess.revealed?`<div class="coment"><div class="h"><i class="ti ti-bulb"></i> ${sess.picked===q.correct?'Correto':'Comentário'}</div>${esc(q.coment||'—')}${q.ref?`<span class="ref">📚 ${esc(q.ref)}</span>`:''}</div>
      <div class="row" style="margin-top:16px;justify-content:space-between">
        <button class="btn btn-g btn-sm" onclick="toggleMark('${q.id}')"><i class="ti ${isMk?'ti-bookmark-filled':'ti-bookmark'}"></i> ${isMk?'Marcada':'Marcar p/ revisão'}</button>
        <button class="btn btn-p" onclick="nextQ()">${sess.idx+1>=sess.pool.length?'Terminar':'Próxima →'}</button>
      </div>`
    :`<div class="row" style="margin-top:16px"><button class="btn btn-g btn-sm" onclick="go('${nav}')">← Sair</button></div>`}
    ${sess.revealed&&sess.mode==='practice'?`<div class="row" style="margin-top:10px"><button class="btn btn-g btn-sm" onclick="genMore('${q.area}',${q.esp?`'${esc(q.esp)}'`:'null'})"><i class="ti ti-sparkles"></i> Gerar mais deste tema (IA)</button></div>`:''}
   </div>`;
}
function answerQ(i){
  if(sess.revealed)return; const q=sess.pool[sess.idx];
  sess.picked=i; sess.revealed=true; const ok=(i===q.correct); if(ok)sess.right++;
  answers[q.id]={picked:i,correct:ok,area:q.area,at:Date.now()};
  save(); render();
}
function nextQ(){ sess.idx++; sess.picked=null; sess.revealed=false; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function sessDone(){
  const tot=sess.pool.length, pc=Math.round(sess.right/tot*100);
  return `<div class="card" style="text-align:center">
    <i class="ti ti-confetti" style="font-size:42px;color:var(--petrol)"></i>
    <h3 style="margin:8px 0 4px">Sessão concluída</h3>

function startSim(){
  const area=$('#simArea').value, n=+$('#simN').value, tpq=+$('#simT').value;
  let pool;
  if(area==='ENARE'){ // blueprint ENARE: equilibrado entre as 5 grandes áreas
    const per=Math.max(1,Math.round(n/AREAS.length)); pool=[];
    AREAS.forEach(ar=>{ pool=pool.concat(shuffle(allQ().filter(q=>q.area===ar.id)).slice(0,per)); });
    pool=shuffle(pool);
  } else { pool=shuffle(allQ().filter(q=>area==='*'||q.area===area)); }
  pool=pool.slice(0,n);
  if(!pool.length){ alert('Sem questões para esta seleção. Gere questões na aba Questões primeiro.'); return; }
  if(pool.length<n) toast('Só há '+pool.length+' questão(ões) — gere mais na aba Questões para provas maiores.');
  const areaNm = area==='ENARE'?'Estilo ENARE':(area==='*'?'Misto':areaNome(area));
  sim={area,areaNome:areaNm,pool,idx:0,answers:{},tpq,left:tpq*pool.length,done:false};
  persistSim(); nav='simulado'; render(); if(tpq){ startSimTimer(); }
  window.scrollTo({top:0,behavior:'smooth'});
}
function startSimTimer(){ clearInterval(simTimer); simTimer=setInterval(()=>{ if(!sim||sim.done){clearInterval(simTimer);return;} sim.left--; if(sim.left<=0){ sim.left=0; submitSim(); return;} const t=$('#simTimer'); if(t){ t.textContent=fmtT(sim.left); t.classList.toggle('warn',sim.left<60);} },1000); }
const fmtT=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function simRun(){
  const q=sim.pool[sim.idx]; const pk=sim.answers[sim.idx];
  return `<div class="simbar">

      <div class="navdots">${sim.pool.map((_,i)=>`<button class="${sim.answers[i]!=null?'ans':''} ${i===sim.idx?'cur':''}" onclick="simGo(${i})">${i+1}</button>`).join('')}</div>

      </div>
    </div>`;
}
function simPick(i){ sim.answers[sim.idx]=i; persistSim(); render(); }
function simGo(i){ if(i<0||i>=sim.pool.length)return; sim.idx=i; persistSim(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function resumeSim(){
  if(!simActive)return;
  const pool=(simActive.qids||[]).map(qById).filter(Boolean);
  if(!pool.length){ simActive=null; save(); render(); return; }
  sim={area:simActive.area,areaNome:simActive.areaNome,pool,idx:Math.min(simActive.idx||0,pool.length-1),answers:simActive.answers||{},tpq:simActive.tpq||0,left:simActive.left||0,done:false};

}
function descartarSim(){ if(confirm('Descartar o simulado em andamento?')){ simActive=null; save(); render(); } }
function askSubmitSim(){ const resp=Object.keys(sim.answers).length; modal(`<h3>Finalizar simulado?</h3><p class="muted">Você respondeu ${resp} de ${sim.pool.length}.</p><div class="row" style="margin-top:14px"><button class="btn btn-p" onclick="closeModal();submitSim()">Finalizar e corrigir</button><button class="btn btn-g" onclick="closeModal()">Continuar</button></div>`); }
function submitSim(){
  clearInterval(simTimer);
  let right=0; const porArea={};
  sim.pool.forEach((q,i)=>{const ok=sim.answers[i]===q.correct;if(ok)right++;porArea[q.area]=porArea[q.area]||{t:0,c:0};porArea[q.area].t++;if(ok)porArea[q.area].c++;
    // alimenta o histórico global de desempenho e revisão
    if(sim.answers[i]!=null){answers[q.id]={picked:sim.answers[i],correct:ok,area:q.area,at:Date.now()};}
  });
  sim.right=right; sim.porArea=porArea; sim.done=true;
  sims.push({at:Date.now(),n:sim.pool.length,right,pct:Math.round(right/sim.pool.length*100),area:sim.area,areaNome:sim.areaNome});

}

/* ====== IA: gerar mais questões ====== */
async function genMore(area,esp,fromEmpty){
  if(!(window.MT&&MT.ai)){ modal(`<h3>IA indisponível</h3><p class="muted">Entre na sua conta MedTech para gerar questões.</p><div class="row" style="margin-top:12px"><button class="btn btn-g" onclick="closeModal()">Fechar</button></div>`); return; }
  const alvo=esp?`${esp} (${areaNome(area)})`:areaNome(area);
  modal(`<h3><i class="ti ti-sparkles"></i> Gerar questões — ${esc(alvo)}</h3><div id="gout" class="muted"><span class="spin"></span> A IA está elaborando 5 questões inéditas nível residência…</div>`);
  const pr=`Gere 5 questões INÉDITAS de múltipla escolha, nível prova de residência médica (estilo ENARE), sobre ${alvo}. Cada questão: enunciado clínico objetivo, 5 alternativas plausíveis com apenas UMA correta, e um comentário explicativo curto citando a diretriz/fonte quando possível. Baseie-se nas diretrizes vigentes. Responda APENAS um array JSON válido, sem markdown, sem texto fora do array, no formato exato: [{"q":"enunciado","ops":["a","b","c","d","e"],"correct":0,"coment":"explicação","ref":"fonte"}] (correct = índice 0-4 da alternativa correta).`;
  try{
    const out=await MT.ai(pr,'gemini-2.5-pro');
    let txt=String(out||'').replace(/```json/gi,'').replace(/```/g,'').trim();
    const i=txt.indexOf('['), j=txt.lastIndexOf(']'); if(i>=0&&j>i)txt=txt.slice(i,j+1);
    const arr=JSON.parse(txt);
    let add=0;
    arr.forEach(o=>{ if(o&&o.q&&Array.isArray(o.ops)&&o.ops.length>=4&&typeof o.correct==='number'&&o.correct>=0&&o.correct<o.ops.length){
      generated.push({id:'g_'+uid(),area,esp:esp||'',q:String(o.q),ops:o.ops.map(String),correct:o.correct,coment:String(o.coment||''),ref:String(o.ref||''),ia:true}); add++;
    }});
    save(); closeModal();
    if(add&&(fromEmpty||!sess)){ startPractice(area); }
    else if(add&&sess){ // injeta as novas no fim da fila atual
      const novas=generated.slice(-add); sess.pool=sess.pool.slice(0,sess.idx+1).concat(novas,sess.pool.slice(sess.idx+1)); render();
      toast(add+' questões novas adicionadas à fila');
    } else if(!add){ modal(`<h3>Não deu certo</h3><p class="muted">A IA não retornou questões válidas. Tente de novo.</p><div class="row" style="margin-top:12px"><button class="btn btn-g" onclick="closeModal()">Fechar</button></div>`); }
  }catch(e){ const el=$('#gout'); if(el)el.innerHTML='⚠ '+(e.message||'Falha ao gerar. Tente novamente.'); }
}
function toast(m){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.3)';document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}

/* ============================================================
   FLASHCARDS (SM-2) — preservado do FlashMed original
   ============================================================ */
function rate(card,q){
  let ef=(card.ef||2.5)+(0.1-(5-q)*(0.08+(5-q)*0.02)); if(ef<1.3)ef=1.3; card.ef=ef;
  if(q<3){card.reps=0;card.interval=0;card.due=Date.now();}
  else{card.reps=(card.reps||0)+1;
    if(card.reps===1)card.interval=1;else if(card.reps===2)card.interval=6;else card.interval=Math.max(1,Math.round((card.interval||1)*ef));
    card.due=Date.now()+card.interval*86400000;}
}
const dueCount=d=>d.cards.filter(c=>(c.due||0)<=Date.now()).length;
const daysAgo=t=>t?Math.floor((Date.now()-t)/86400000):null;
function flashHome(){
  return `<div class="toolbar">
    <button class="btn btn-p" onclick="newDeck()">+ Meu baralho</button>
    <span class="muted">${decks.length} baralho(s) · prontos do MedTech + os seus</span>
  </div>
  ${decks.map(d=>{
    const dc=daysAgo(d.checkedAt);
    const chk=d.builtin?`<span class="pill ${dc===null||dc>30?'due':''}">${dc===null?'nunca verificado':('verificado há '+dc+'d')}</span>`:'';
    return `<div class="card deck"><div class="info">
     <h3>${esc(d.name)} ${d.builtin?'<span class="pill bi">pronto</span>':''}</h3>
     <p><span class="pill">${d.cards.length} cartões</span> ${dueCount(d)?`<span class="pill due">${dueCount(d)} para revisar</span>`:'<span class="pill">em dia</span>'} ${chk}</p>
    </div><div class="row">
     <button class="btn btn-p btn-sm" onclick="study('${d.id}')">Estudar</button>
     <button class="btn btn-g btn-sm" onclick="manage('${d.id}')">Cartões</button>
     ${d.builtin?`<button class="btn btn-g btn-sm" onclick="verifyDeck('${d.id}')"><i class="ti ti-sparkles"></i> Verificar (IA)</button>`:`<button class="btn btn-g btn-sm" onclick="delDeck('${d.id}')" title="Excluir baralho"><i class="ti ti-trash"></i></button>`}
    </div></div>`;
  }).join('')}
  <div class="note"><b>Repetição espaçada (SM-2):</b> cada cartão volta no melhor momento — quanto mais fácil, mais distante. Os baralhos "prontos" são de nível avançado e a <b>IA verifica</b> se continuam atualizados.</div>`;
}

function modal(html){closeModal();const d=document.createElement('div');d.className='modal';d.id='modal';d.innerHTML='<div class="box">'+html+'</div>';d.onclick=e=>{if(e.target===d)closeModal();};document.body.appendChild(d);}
function closeModal(){const m=document.getElementById('modal');if(m)m.remove();}

/* ====== Boot ====== */
function whenMT(cb){if(window.MT){cb();}else{setTimeout(()=>whenMT(cb),30);}}
whenMT(()=>{
  MT.onData(function(d){
    decks=(d&&Array.isArray(d.decks))?d.decks:[];
    answers=(d&&d.answers)||{}; marked=(d&&Array.isArray(d.marked))?d.marked:[];
    generated=(d&&Array.isArray(d.generated))?d.generated:[]; sims=(d&&Array.isArray(d.sims))?d.sims:[];
    simActive=(d&&d.simActive)||null;
    ensureBuiltin();
    if(!mtReady){mtReady=true;}
    render();
  });
});
render();
</script>
