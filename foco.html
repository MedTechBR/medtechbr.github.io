<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071c22">
<title>Foco — MedTech</title>
<!-- Foco unificado: o app oficial roda em foco-produtividade.web.app (login e dados próprios).
     Esta página apenas redireciona para lá. Versão antiga (login central/azul) fica no histórico do git. -->
<meta http-equiv="refresh" content="0; url=https://foco-produtividade.web.app/">
<link rel="canonical" href="https://foco-produtividade.web.app/">
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;
       font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
       background:#071c22;color:#eaf4f3;text-align:center;padding:24px}
  .sp{width:36px;height:36px;border:3px solid rgba(255,255,255,.22);border-top-color:#2DD4A8;
      border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .t{font-size:16px;font-weight:600}
  .h{font-size:13px;color:#8aa6a9}
  a{color:#5fe3c0}
</style>
</head>
<body>
  <div class="sp"></div>
  <div class="t">Abrindo o Foco…</div>
  <div class="h">Se não abrir automaticamente, <a href="https://foco-produtividade.web.app/">toque aqui</a>.</div>
  <script>location.replace('https://foco-produtividade.web.app/');</script>
</body>
</html>
