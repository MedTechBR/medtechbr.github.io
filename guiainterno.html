/* ============================================================
   Guia do Interno, camada viva (23/09/2026). Modelo: ClínicaMed cm-v97.
   Fica DEPOIS do _mtviva.css: é a camada do próprio app (vence pela ordem).
   Duas seções: Capítulos (buscar → ler → próximo) e Mentor (perguntar à IA).
   Âmbar com texto escuro por cima; a tinta âmbar escurece para passar AA no branco.
   ============================================================ */
html[data-viva="guiainterno"] body{--acInk:color-mix(in srgb,var(--ac) 55%,var(--tinta))}
@media (prefers-color-scheme:dark){html[data-viva="guiainterno"][data-viva-escuro] body{--acInk:color-mix(in srgb,var(--ac) 72%,#fff)}}

html{-webkit-text-size-adjust:100%;scroll-padding-top:84px}
body{font-size:15px;line-height:1.55;color:var(--tinta);min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:920px;margin:0 auto;padding:0 20px}
[hidden]{display:none!important}

/* cabeçalho de uma linha: marca, abas, portal */
header{position:sticky;top:0;z-index:30}
.top{display:flex;align-items:center;gap:14px;min-height:64px;max-width:1120px}
.logo{display:flex;align-items:center;gap:11px;font-weight:700;font-size:19px;letter-spacing:-.02em;color:var(--tinta);text-decoration:none;flex:0 0 auto}
.logo .mark{width:36px;height:36px;display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.navtabs{display:flex;gap:4px;margin-left:auto;background:var(--sup2);border-radius:999px;padding:4px}
.navtab{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 18px;border:0;border-radius:999px;background:none;
  font:inherit;font-size:14px;font-weight:600;color:var(--tinta2);cursor:pointer;text-decoration:none;transition:background-color .2s,color .2s,transform .18s var(--mola)}
.navtab:hover{color:var(--tinta);background:var(--sup)}
.navtab.on{background:var(--ac);color:var(--acTxt);box-shadow:0 6px 14px color-mix(in srgb,var(--ac) 30%,transparent)}
.navtab .ti{font-size:18px}
.sair{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 16px;border-radius:999px;background:var(--sup2);color:var(--tinta);
  font-weight:600;font-size:14px;text-decoration:none;flex:0 0 auto;transition:background-color .2s,color .2s,transform .18s var(--mola)}
.sair:hover{background:var(--acSup);color:var(--acInk)}
.sair:active{transform:scale(.96)}

main{padding:24px 0 64px;flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border:0;border-radius:999px;font:inherit;font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:none}
.btn-light{background:var(--sup);color:var(--tinta);border:1.5px solid var(--fioF)}
.btn-light:hover{background:var(--acSup);border-color:color-mix(in srgb,var(--ac) 45%,var(--fio));color:var(--acInk)}
.btn:disabled{cursor:default}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}

/* abertura dos capítulos */
.abre{position:relative;overflow:hidden;border-radius:28px;padding:26px 28px;margin-bottom:18px;background:var(--ac);color:var(--acTxt);

.abre .b2{width:110px;height:110px;right:150px;bottom:-60px;opacity:.12;animation:flutua 7s ease-in-out infinite reverse}

<script>
const SEC=[
{id:'admissao',ic:'ti-clipboard-plus',t:'Admissão do paciente',s:'Anamnese estruturada e primeira ficha',html:`
<h3>Estrutura da anamnese</h3>
<ul>
<li><b>Identificação:</b> nome, idade, sexo, procedência, profissão.</li>
<li><b>Queixa principal (QP):</b> nas palavras do paciente, com duração.</li>
<li><b>HDA:</b> conte a história em <b>texto corrido e cronológico</b> — início, fatores, evolução, sintomas associados, tratamentos e resposta. Evite só tópicos soltos.</li>
<li><b>Antecedentes pessoais:</b> registre o <b>diagnóstico real</b> (HAS, DM2, DLP…), não a fala literal. Cirurgias, internações, alergias.</li>
<li><b>Medicações em uso:</b> liste os <b>nomes</b> (dose/posologia ajudam).</li>
<li><b>Hábitos:</b> tabagismo (maços-ano), álcool, drogas, atividade.</li>
<li><b>História familiar</b> e <b>social</b> relevantes.</li>
<li><b>Exame físico:</b> sinais vitais + por sistemas (estado geral, AC, AP, abdome, neuro, extremidades, pele).</li>
<li><b>Hipóteses diagnósticas</b> e <b>conduta</b> inicial (exames, tratamento, monitorização).</li>
</ul>
<div class="tip">Dica: foque no que muda a conduta. "Negar sintomas relevantes" (pertinentes negativos) também é informação.</div>
<div class="xref"><i class="ti ti-bolt"></i> Quer agilizar? O <a href="enfermaria.html">EnfermarIA</a> faz a admissão por voz e a ficha do internado; no consultório, o <a href="/clinicar/">Clinicar</a> grava a consulta e estrutura a evolução.</div>`},

{id:'evolucao',ic:'ti-notes',t:'Evolução (SOAP)',s:'Como evoluir o paciente internado',html:`
<p>Evolua <b>por problemas</b> e seja objetivo.</p>
<h3>S — Subjetivo</h3><ul><li>Queixas e intercorrências das últimas 24h; aceitação de dieta, sono, dor, evacuação/diurese.</li></ul>
<h3>O — Objetivo</h3><ul><li>Sinais vitais (faixas das 24h), exame físico dirigido, <b>balanço hídrico/diurese</b>, drogas e doses em curso, <b>exames novos</b>.</li></ul>
<h3>A — Avaliação</h3><ul><li>Impressão <b>por problema ativo</b> (ex.: "1) Pneumonia — melhora; 2) LRA — estável; 3) Anemia — investigar").</li></ul>
<h3>P — Plano</h3><ul><li>Conduta de cada problema, ajustes, exames pedidos, <b>pendências</b> e o que falta para a alta.</li></ul>
<div class="tip">Date os antibióticos (DI/D1) e reavalie diariamente as pendências e a previsão de alta.</div>
<div class="xref"><i class="ti ti-bolt"></i> <a href="enfermaria.html">EnfermarIA</a> extrai a evolução, sugere oportunidades de melhoria e gera a passagem de plantão.</div>`},

{id:'prescricao',ic:'ti-prescription',t:'Prescrição segura',s:'Estrutura e itens que não podem faltar',html:`
<h3>Estrutura da prescrição</h3>
<ol>
<li><b>Dieta</b> (oral/enteral/zero; restrições).</li>
<li><b>Hidratação</b> (se indicada — volume e velocidade).</li>
<li><b>Medicações</b>: nome, <b>dose, via e intervalo</b> (evite abreviaturas perigosas).</li>
<li><b>Sintomáticos "se necessário" (SOS)</b>: dor, febre, náusea, insônia — com dose e intervalo mínimo.</li>
<li><b>Profilaxias</b> quando indicadas: <b>TEV</b> (avaliar risco/sangramento), protetor gástrico (só com indicação real).</li>
<li><b>Cuidados</b>: cabeceira, sinais vitais, glicemia capilar, controle de diurese, curativos.</li>
</ol>
<div class="warn">Antes de assinar: confira <b>alergias</b>, <b>interações</b>, <b>dose pela função renal</b> (use CKD-EPI 2021) e se cada item ainda é necessário (reconciliação). Não copie a prescrição do dia anterior no automático.</div>
<div class="xref"><i class="ti ti-bolt"></i> Doses/escalonamento de antibiótico → <a href="atbguia.html">ATBguia</a>. Clearance e escores → <a href="calcmed.html">CalcMed</a>. Conduta da doença → <a href="condutai.html">CondutAI</a>.</div>`},

{id:'plantao',ic:'ti-clock-hour-4',t:'Plantão e intercorrências',s:'Organizar e abordar o que mais chamam',html:`
<p>Organize a lista, <b>priorize o instável</b> (ABCDE no grave) e reavalie. Saiba <b>quando chamar o staff</b>: instabilidade, dúvida diagnóstica, ou conduta acima da sua autonomia.</p>
<h3>Abordagem inicial das chamadas comuns</h3>
<ul>
<li><b>Dor:</b> caracterizar, tratar conforme intensidade; dor torácica/abdominal nova = avaliar à beira-leito.</li>
<li><b>Febre:</b> examinar e buscar <b>foco</b>; se sinais de sepse, hemoculturas + ATB precoce (ver CondutAI), não só antitérmico.</li>
<li><b>PA alta:</b> diferenciar urgência × emergência (lesão de órgão-alvo) — ver protocolo no CondutAI.</li>
<li><b>Hipoglicemia:</b> consciente → 15 g de carboidrato VO; rebaixado/sem VO → glicose IV; reavaliar.</li>
<li><b>Hiperglicemia:</b> checar cetonas/pH se muito alta; ajustar esquema.</li>
<li><b>Dispneia:</b> O₂ se SpO₂ baixa, examinar, pensar em causa (congestão, TEP, broncoespasmo, pneumonia).</li>
<li><b>Agitação/delirium:</b> procurar causa (dor, retenção, hipóxia, infecção, drogas); medidas não-farmacológicas primeiro.</li>
<li><b>Náusea, constipação, insônia:</b> medir, tratar a causa, sintomático.</li>
</ul>
<div class="warn">Reavalie sempre após a conduta. Registre a intercorrência e o que foi feito.</div>`},

{id:'passagem',ic:'ti-arrows-exchange',t:'Passagem de plantão (SBAR)',s:'Transmitir o caso sem perder informação',html:`
<h3>Modelo SBAR</h3>
<ul>
<li><b>S — Situação:</b> quem é, leito, problema atual.</li>
<li><b>B — Background:</b> diagnóstico, comorbidades, o relevante da internação.</li>
<li><b>A — Avaliação:</b> como está agora (estável/instável), o que preocupa.</li>
<li><b>R — Recomendação:</b> o que o próximo turno precisa fazer/vigiar.</li>
</ul>
<p>Priorize os <b>instáveis</b>, as <b>pendências em aberto</b>, exames a checar e tarefas com horário.</p>
<div class="xref"><i class="ti ti-bolt"></i> <a href="enfermaria.html">EnfermarIA</a> gera o resumo de passagem de plantão agrupado por setor.</div>`},

{id:'procedimentos',ic:'ti-needle',t:'Procedimentos à beira-leito',s:'Princípios e passos gerais (com supervisão)',html:`
<div class="warn">No início, faça todo procedimento <b>com supervisão</b>. Sempre: consentimento, identificação correta, assepsia/paramentação, material conferido e "time-out".</div>
<h3>Acesso venoso periférico</h3><ul><li>Garrote, antissepsia, bisel para cima, fixar bem; descartar perfurocortante com segurança.</li></ul>
<h3>Gasometria arterial</h3><ul><li>Radial (teste de Allen), 45–90°, seringa heparinizada, comprimir 5 min após; identificar e levar em gelo se demora.</li></ul>
<h3>Sondagem vesical</h3><ul><li>Técnica estéril; insira até retorno de urina e progrida antes de insuflar o balão; fixe; sistema fechado.</li></ul>
<h3>Sonda nasogástrica/enteral</h3><ul><li>Medir comprimento, lubrificar, paciente sentado, deglutir; <b>confirmar posição</b> antes de usar (raio-X é o padrão para sonda fina/enteral).</li></ul>
<div class="tip">Conheça as contraindicações e complicações antes; na dúvida, chame quem tem experiência.</div>`},

{id:'exames',ic:'ti-microscope',t:'Interpretação rápida',s:'Gasometria, eletrólitos, hemograma, ECG',html:`
<h3>Gasometria — passo a passo</h3>
<ol>
<li><b>pH:</b> acidemia (&lt;7,35) ou alcalemia (&gt;7,45)?</li>
<li><b>Distúrbio primário:</b> olhe <b>pCO₂</b> (respiratório) e <b>HCO₃</b> (metabólico) — qual explica o pH?</li>
<li><b>Compensação:</b> adequada ou há distúrbio misto?</li>
<li><b>Ânion-gap</b> (Na − [Cl + HCO₃]) na acidose metabólica; depois o delta-delta.</li>
</ol>
<h3>Eletrólitos e função renal</h3><ul><li>Aborde Na⁺ pela <b>osmolaridade + volemia</b>; K⁺ pela gravidade + ECG. TFG pela <b>CKD-EPI 2021</b>.</li></ul>
<h3>Hemograma</h3><ul><li>Anemia (VCM → micro/normo/macro), leucocitose/leucopenia, plaquetas.</li></ul>
<h3>ECG — leitura sistemática</h3><ul><li>Ritmo → FC → eixo → P/PR/QRS/QT → ST-T (isquemia) → comparar com prévio.</li></ul>
<div class="xref"><i class="ti ti-bolt"></i> Cálculos (gaso, clearance, escores) no <a href="calcmed.html">CalcMed</a>; distúrbios eletrolíticos/ECG no <a href="condutai.html">CondutAI</a>.</div>`},

{id:'comunicacao',ic:'ti-messages',t:'Comunicação',s:'Com paciente, família e equipe',html:`
<h3>Com o paciente/família</h3><ul><li>Linguagem simples; <b>ask-tell-ask</b> (pergunte o que sabe → informe → confirme entendimento).</li></ul>
<h3>Más notícias — SPIKES</h3><ul><li>Setting (ambiente) · Perception · Invitation · Knowledge · Emotions · Strategy/Summary.</li></ul>
<h3>Emoções — NURSE</h3><ul><li>Nomear · Compreender · Respeitar · Apoiar · Explorar.</li></ul>
<h3>Com a equipe</h3><ul><li>Objetivo, sem culpabilizar; comunique <b>valores críticos</b> e dúvidas cedo; registre o combinado.</li></ul>
<div class="xref"><i class="ti ti-bolt"></i> Reunião familiar / objetivos de cuidado → <a href="paliai.html">PaliAI</a> gera um roteiro estruturado.</div>`},

{id:'seguranca',ic:'ti-shield-check',t:'Segurança do paciente',s:'Erros comuns e como evitá-los',html:`
<ul>
<li><b>Identifique</b> o paciente (2 identificadores) antes de qualquer ato.</li>
<li><b>Higiene das mãos</b> nos 5 momentos.</li>
<li>Confira <b>alergia, dose, via e função renal</b> em toda prescrição.</li>
<li><b>Reconciliação medicamentosa</b> na admissão/transferência/alta.</li>
<li>Profilaxia de <b>TEV</b> e de úlcera de estresse <b>quando indicadas</b> (não em todos).</li>
<li>Evite <b>prescrição verbal</b>; se inevitável, leia de volta (read-back).</li>
<li>Comunique <b>valores críticos</b> e documente.</li>
</ul>
<div class="tip">Na dúvida sobre dose/segurança, pare e cheque — pedir ajuda é prática segura, não fraqueza.</div>`},

{id:'organizacao',ic:'ti-checklist',t:'Organização e bem-estar',s:'Render o dia sem se perder (nem se esgotar)',html:`
<ul>
<li>Comece o dia com uma <b>lista</b> (pacientes, tarefas, exames a checar, horários).</li>
<li><b>Priorize</b> o instável e o que destrava a alta.</li>
<li>Registre <b>na hora</b> (não confie só na memória).</li>
<li>Feche pendências e atualize a equipe.</li>
<li><b>Autocuidado:</b> sono, alimentação, pausas; peça ajuda cedo; conheça seus limites e os canais de apoio.</li>
</ul>
<div class="tip">Use o <a href="foco.html" style="color:var(--primary);font-weight:600">Foco</a> para organizar tarefas/agenda do dia.</div>`},
];

/* ---------------- interface (camada viva, 23/09/2026) ---------------- */
const main=document.getElementById('main');
const CORES=['azul','verde','violeta','laranja','ciano','rosa','indigo','teal','cobalto','terracota'];
const corDe=i=>'var(--c-'+CORES[i%CORES.length]+')';
const semAc=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const _txt=new Map();
function textoDe(s){if(!_txt.has(s.id)){const d=document.createElement('div');d.innerHTML=s.html;_txt.set(s.id,d.textContent);}return _txt.get(s.id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function aviso(msg,tipo){const box=document.getElementById('avisos');box.innerHTML='';const t=document.createElement('div');t.className='toast'+(tipo==='erro'?' erro':'');
  t.innerHTML='<i class="ti '+(tipo==='erro'?'ti-alert-triangle':'ti-check')+'" aria-hidden="true"></i>'+msg;box.appendChild(t);clearTimeout(aviso._t);aviso._t=setTimeout(()=>t.remove(),2800);}
/* o que o mentor já tem (pergunta e resposta) sobrevive à troca de tela */
const mentorEstado={q:'',out:''};
let busca='';

function marcarAba(v){
  [['ntCap','capitulos'],['ntMen','mentor']].forEach(([id,nome])=>{const a=document.getElementById(id);const on=(v===nome);a.classList.toggle('on',on);
    if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
}
/* rotas pelo endereço (#cap-admissao, #mentor): o voltar do celular funciona */
function ir(v,id){
  guardarMentor();
  const h=v==='mentor'?'#mentor':(v==='cap'&&id?'#cap-'+id:'');
  if(location.hash!==h){if(h)location.hash=h;else{history.pushState(null,'',location.pathname+location.search);rota();}}
  else rota();
}
function rota(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(h==='mentor'){renderMentor();marcarAba('mentor');}
  else if(h.indexOf('cap-')===0&&SEC.some(s=>s.id===h.slice(4))){renderCap(h.slice(4));marcarAba('capitulos');}
  else{home(busca);marcarAba('capitulos');}
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{guardarMentor();rota();});
window.addEventListener('popstate',()=>{if(!location.hash)rota();});

function home(q){
  busca=q||'';const termo=semAc(busca.trim());
  const lista=termo?SEC.filter(s=>semAc(s.t+' '+s.s).includes(termo)).concat(SEC.filter(s=>!semAc(s.t+' '+s.s).includes(termo)&&semAc(textoDe(s)).includes(termo))):SEC;
  const primeira=!document.getElementById('q');
  if(primeira){
    main.innerHTML=`<section class="abre"><span class="bola b1"></span><span class="bola b2"></span>
      <small><i class="ti ti-book-2" aria-hidden="true"></i> ${SEC.length} capítulos</small>
      <h1>Seu manual de bolso do internato</h1>
      <p>Admitir, evoluir, prescrever com segurança, virar o plantão e interpretar o básico. Para condutas e doses atualizadas, o guia aponta para o CondutAI e o ATBguia.</p>
      <div class="abreAcoes"><button type="button" class="btn" onclick="ir('cap','${SEC[0].id}')"><i class="ti ti-player-play" aria-hidden="true"></i> Começar pelo capítulo 1</button><button type="button" class="btn fantasma" onclick="ir('mentor')"><i class="ti ti-message-chatbot" aria-hidden="true"></i> Perguntar ao mentor</button></div></section>
      <label class="bsearch"><i class="ti ti-search" aria-hidden="true"></i><input id="q" type="search" placeholder="Buscar: prescrição, gasometria, SBAR" autocomplete="off" spellcheck="false" enterkeyhint="go" aria-label="Buscar tema"><kbd>/</kbd></label>
      <div class="bInfo" id="bInfo" aria-live="polite"></div>
      <div class="grid" id="grade"></div>`;
    const inp=document.getElementById('q');inp.value=busca;
    inp.addEventListener('input',()=>home(inp.value));
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){const b=document.querySelector('#grade .cap');if(b){e.preventDefault();b.click();}}
      else if(e.key==='Escape'){if(inp.value){e.preventDefault();limparBusca();}else inp.blur();}
    });
  }
  document.getElementById('bInfo').textContent=termo?(lista.length?lista.length+(lista.length===1?' capítulo encontrado':' capítulos encontrados'):''):(matchMedia('(pointer:fine)').matches?'Escolha um capítulo. Tecle / para buscar.':'Toque num capítulo para ler.');
  document.getElementById('grade').innerHTML=lista.length?lista.map(s=>{const i=SEC.indexOf(s);
    return `<button type="button" class="cap" style="--c:${corDe(i)}" onclick="ir('cap','${s.id}')"><span class="ic"><i class="ti ${s.ic}" aria-hidden="true"></i></span><span><span class="ttl">${s.t}</span><span class="sub">${s.s}</span></span></button>`;}).join('')
    :`<div class="vazio"><i class="ti ti-search-off" aria-hidden="true"></i><b>Nada encontrado para “${esc(busca.trim())}”</b><span>Tente outro termo ou pergunte ao mentor.</span><button type="button" class="btn btn-light" onclick="limparBusca()">Limpar busca</button></div>`;
}
function limparBusca(){busca='';const i=document.getElementById('q');if(i){i.value='';home('');i.focus();}}
function open_(id){ir('cap',id);}
function renderCap(id){
  const i=SEC.findIndex(x=>x.id===id),s=SEC[i],ant=SEC[i-1],prox=SEC[i+1];
  main.innerHTML=`<button type="button" class="voltar" onclick="ir('capitulos')"><i class="ti ti-arrow-left" aria-hidden="true"></i> Capítulos</button>
   <article class="view" style="--c:${corDe(i)}"><div class="vTopo"><span class="selo"><i class="ti ${s.ic}" aria-hidden="true"></i></span><div><small>Capítulo ${i+1} de ${SEC.length}</small><h1>${s.t}</h1></div></div>
   ${s.html}
   <div class="aviso"><i class="ti ti-info-circle" aria-hidden="true"></i><span>Conteúdo educacional e de apoio. Não substitui a supervisão nem o protocolo do seu serviço. Doses e condutas específicas: confirme no CondutAI ou no ATBguia.</span></div>
   <div class="vAcoes"><button type="button" class="btn btn-p" onclick="perguntarSobre('${s.id}')"><i class="ti ti-message-chatbot" aria-hidden="true"></i> Tirar dúvida sobre este tema</button></div></article>
   <nav class="navCap" aria-label="Outros capítulos">${ant?`<button type="button" onclick="ir('cap','${ant.id}')"><small><i class="ti ti-arrow-left" aria-hidden="true"></i> Anterior</small><b>${ant.t}</b></button>`:''}${prox?`<button type="button" class="prox" onclick="ir('cap','${prox.id}')"><small>Próximo <i class="ti ti-arrow-right" aria-hidden="true"></i></small><b>${prox.t}</b></button>`:''}</nav>`;
}
function perguntarSobre(id){const s=SEC.find(x=>x.id===id);mentorEstado.q=s?s.t+': ':'';mentorEstado.out='';ir('mentor');
  setTimeout(()=>{const t=document.getElementById('iaq');if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length);}},60);}

const SUGESTOES=['Como estruturo uma evolução SOAP?','O que não pode faltar numa prescrição?','Passo a passo para ler uma gasometria','Como dar uma má notícia?'];
function renderMentor(){
  main.innerHTML=`<section class="mentor"><div class="mTopo"><span class="selo"><i class="ti ti-message-chatbot" aria-hidden="true"></i></span><div><h1>Pergunte ao mentor</h1><p>Dúvidas práticas do dia a dia, respondidas como um residente sênior.</p></div></div>
   <label class="rotulo" for="iaq">Sua dúvida</label>
   <textarea id="iaq" placeholder="Ex.: Como faço a prescrição de profilaxia de TEV? Como organizo a passagem de um paciente instável?"></textarea>
   <div class="sugs" aria-label="Sugestões">${SUGESTOES.map(t=>`<button type="button" onclick="askChip(this)">${t}</button>`).join('')}</div>
   <div class="linhaBt"><button type="button" class="btn btn-p" id="iaBtn" onclick="ask()"><i class="ti ti-send" aria-hidden="true"></i> Perguntar</button><span class="dica">Ctrl + Enter envia</span></div>
   <div id="iaOut">${mentorEstado.out}</div>
   <div class="aviso"><i class="ti ti-info-circle" aria-hidden="true"></i><span>Para conduta de uma doença específica, o mentor explica o raciocínio e indica o app certo. Revise sempre: é apoio, não substitui a supervisão.</span></div></section>`;
  const t=document.getElementById('iaq');t.value=mentorEstado.q;
  t.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();ask();}});
}
function guardarMentor(){const t=document.getElementById('iaq'),o=document.getElementById('iaOut');if(t)mentorEstado.q=t.value;if(o)mentorEstado.out=o.innerHTML;}
function bindIA(){}
function askChip(el){document.getElementById('iaq').value=el.textContent;ask();}
function iaErro(msg){document.getElementById('iaOut').innerHTML='<div class="iaErro" role="alert"><i class="ti ti-alert-triangle" aria-hidden="true"></i><span>'+msg+'</span></div>';guardarMentor();}
function copiarResposta(){const el=document.getElementById('iaTexto');if(!el)return;const txt=el.textContent;
  const ok=()=>aviso('Resposta copiada'),ruim=()=>aviso('Não consegui copiar. Selecione o texto e copie.','erro');
  const reserva=()=>{try{const a=document.createElement('textarea');a.value=txt;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();const r=document.execCommand('copy');a.remove();r?ok():ruim();}catch(e){ruim();}};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(ok,reserva);else reserva();}
async function ask(){
  if(!window.MT||!MT.user){iaErro('Entre na sua conta MedTech para usar o mentor. Os capítulos funcionam sem conta.');return;}
  const q=document.getElementById('iaq').value.trim();if(!q){document.getElementById('iaq').focus();aviso('Escreva a dúvida ou toque numa sugestão.');return;}
  const b=document.getElementById('iaBtn');b.innerHTML='<span class="spin" aria-hidden="true"></span> Pensando';b.disabled=true;document.getElementById('iaOut').innerHTML='';
  const prompt='Você é um RESIDENTE SÊNIOR / preceptor experiente orientando um INTERNO de medicina (ou R1) no Brasil. Responda à dúvida de forma PRÁTICA, objetiva e didática, com passos acionáveis para o dia a dia da enfermaria/plantão. Tom de mentor: encorajador e seguro. REGRAS: priorize segurança do paciente; quando a pergunta envolver DOSE ou CONDUTA de uma doença específica, dê o raciocínio geral mas oriente confirmar a dose/conduta atual no app CondutAI ou ATBguia (não invente doses específicas); reforce "faça sob supervisão" quando for procedimento; use português do Brasil. FORMATAÇÃO: texto limpo, sem markdown (sem # nem *); títulos curtos em maiúsculas seguidos de dois-pontos quando ajudar.\n\nDÚVIDA DO INTERNO: '+q;
  try{const t=await MT.ai(prompt,'gemini-2.5-pro');const o=document.getElementById('iaOut');
    if(o){o.innerHTML='<div class="iaout" id="iaTexto">'+(t||'').replace(/[<>]/g,s=>({'<':'&lt;','>':'&gt;'}[s]))+'</div><div class="iaAcoes"><button type="button" class="btn btn-light" onclick="copiarResposta()"><i class="ti ti-copy" aria-hidden="true"></i> Copiar resposta</button></div>';guardarMentor();}
    else{mentorEstado.out='<div class="iaout" id="iaTexto">'+(t||'').replace(/[<>]/g,s=>({'<':'&lt;','>':'&gt;'}[s]))+'</div>';aviso('O mentor respondeu. Abra a aba Mentor.');}}
  catch(e){if(document.getElementById('iaOut'))iaErro((e.message||'O mentor não respondeu.')+' Tente de novo em alguns segundos.');else aviso('O mentor não respondeu. Tente de novo.','erro');}
  const b2=document.getElementById('iaBtn');if(b2){b2.innerHTML='<i class="ti ti-send" aria-hidden="true"></i> Perguntar';b2.disabled=false;}
}
/* atalhos: "/" busca, Esc volta */
document.addEventListener('keydown',e=>{
  const t=e.target,dig=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
  if(e.key==='/'&&!dig&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();if(location.hash)ir('capitulos');setTimeout(()=>{const q=document.getElementById('q');if(q)q.focus();},0);}
  else if(e.key==='Escape'&&!dig&&location.hash.indexOf('#cap-')===0)ir('capitulos');
});
rota();
</script>
</body>
</html>
