<script>
const SEC=[
{id:'admissao',ic:'ti-clipboard-plus',t:'Admissão do paciente',s:'Anamnese estruturada e primeira ficha',html:`
<h3>Estrutura da anamnese</h3>
<ul>
<li><b>Identificação:</b> nome, idade, sexo, procedência, profissão.</li>
<li><b>Queixa principal (QP):</b> nas palavras do paciente, com duração.</li>
<li><b>HDA:</b> conte a história em <b>texto corrido e cronológico</b> — início, fatores, evolução, sintomas associados, tratamentos e resposta. Evite só tópicos soltos.</li>
<li><b>Antecedentes pessoais:</b> registre o <b>diagnóstico real</b> (HAS, DM2, DLP…), não a fala literal. Cirurgias, internações, alergias.</li>
<li><b>Medicações em uso:</b> liste os <b>nomes</b> (dose/posologia ajudam).</li>
<li><b>Hábitos:</b> tabagismo (maços-ano), álcool, drogas, atividade.</li>
<li><b>História familiar</b> e <b>social</b> relevantes.</li>
<li><b>Exame físico:</b> sinais vitais + por sistemas (estado geral, AC, AP, abdome, neuro, extremidades, pele).</li>
<li><b>Hipóteses diagnósticas</b> e <b>conduta</b> inicial (exames, tratamento, monitorização).</li>
</ul>
<div class="tip">Dica: foque no que muda a conduta. "Negar sintomas relevantes" (pertinentes negativos) também é informação.</div>
<div class="xref"><i class="ti ti-bolt"></i> Quer agilizar? O <a href="consultai.html">ConsultAI</a> grava o atendimento e estrutura a anamnese; o <a href="enfermaria.html">EnfermarIA</a> faz a admissão por voz e a ficha do internado.</div>`},

{id:'evolucao',ic:'ti-notes',t:'Evolução (SOAP)',s:'Como evoluir o paciente internado',html:`
<p>Evolua <b>por problemas</b> e seja objetivo.</p>
<h3>S — Subjetivo</h3><ul><li>Queixas e intercorrências das últimas 24h; aceitação de dieta, sono, dor, evacuação/diurese.</li></ul>
<h3>O — Objetivo</h3><ul><li>Sinais vitais (faixas das 24h), exame físico dirigido, <b>balanço hídrico/diurese</b>, drogas e doses em curso, <b>exames novos</b>.</li></ul>
<h3>A — Avaliação</h3><ul><li>Impressão <b>por problema ativo</b> (ex.: "1) Pneumonia — melhora; 2) LRA — estável; 3) Anemia — investigar").</li></ul>
<h3>P — Plano</h3><ul><li>Conduta de cada problema, ajustes, exames pedidos, <b>pendências</b> e o que falta para a alta.</li></ul>
<div class="tip">Date os antibióticos (DI/D1) e reavalie diariamente as pendências e a previsão de alta.</div>
<div class="xref"><i class="ti ti-bolt"></i> <a href="enfermaria.html">EnfermarIA</a> extrai a evolução, sugere oportunidades de melhoria e gera a passagem de plantão.</div>`},

{id:'prescricao',ic:'ti-prescription',t:'Prescrição segura',s:'Estrutura e itens que não podem faltar',html:`
<h3>Estrutura da prescrição</h3>
<ol>
<li><b>Dieta</b> (oral/enteral/zero; restrições).</li>
<li><b>Hidratação</b> (se indicada — volume e velocidade).</li>
<li><b>Medicações</b>: nome, <b>dose, via e intervalo</b> (evite abreviaturas perigosas).</li>
<li><b>Sintomáticos "se necessário" (SOS)</b>: dor, febre, náusea, insônia — com dose e intervalo mínimo.</li>
<li><b>Profilaxias</b> quando indicadas: <b>TEV</b> (avaliar risco/sangramento), protetor gástrico (só com indicação real).</li>
<li><b>Cuidados</b>: cabeceira, sinais vitais, glicemia capilar, controle de diurese, curativos.</li>
</ol>
<div class="warn">Antes de assinar: confira <b>alergias</b>, <b>interações</b>, <b>dose pela função renal</b> (use CKD-EPI 2021) e se cada item ainda é necessário (reconciliação). Não copie a prescrição do dia anterior no automático.</div>
<div class="xref"><i class="ti ti-bolt"></i> Doses/escalonamento de antibiótico → <a href="atbguia.html">ATBguia</a>. Clearance e escores → <a href="calcmed.html">CalcMed</a>. Conduta da doença → <a href="condutai.html">CondutAI</a>.</div>`},

{id:'plantao',ic:'ti-clock-hour-4',t:'Plantão e intercorrências',s:'Organizar e abordar o que mais chamam',html:`
<p>Organize a lista, <b>priorize o instável</b> (ABCDE no grave) e reavalie. Saiba <b>quando chamar o staff</b>: instabilidade, dúvida diagnóstica, ou conduta acima da sua autonomia.</p>
<h3>Abordagem inicial das chamadas comuns</h3>
<ul>
<li><b>Dor:</b> caracterizar, tratar conforme intensidade; dor torácica/abdominal nova = avaliar à beira-leito.</li>
<li><b>Febre:</b> examinar e buscar <b>foco</b>; se sinais de sepse, hemoculturas + ATB precoce (ver CondutAI), não só antitérmico.</li>
<li><b>PA alta:</b> diferenciar urgência × emergência (lesão de órgão-alvo) — ver protocolo no CondutAI.</li>
<li><b>Hipoglicemia:</b> consciente → 15 g de carboidrato VO; rebaixado/sem VO → glicose IV; reavaliar.</li>
<li><b>Hiperglicemia:</b> checar cetonas/pH se muito alta; ajustar esquema.</li>
<li><b>Dispneia:</b> O₂ se SpO₂ baixa, examinar, pensar em causa (congestão, TEP, broncoespasmo, pneumonia).</li>
<li><b>Agitação/delirium:</b> procurar causa (dor, retenção, hipóxia, infecção, drogas); medidas não-farmacológicas primeiro.</li>
<li><b>Náusea, constipação, insônia:</b> medir, tratar a causa, sintomático.</li>
</ul>
<div class="warn">Reavalie sempre após a conduta. Registre a intercorrência e o que foi feito.</div>`},

{id:'passagem',ic:'ti-arrows-exchange',t:'Passagem de plantão (SBAR)',s:'Transmitir o caso sem perder informação',html:`
<h3>Modelo SBAR</h3>
<ul>
<li><b>S — Situação:</b> quem é, leito, problema atual.</li>
<li><b>B — Background:</b> diagnóstico, comorbidades, o relevante da internação.</li>
<li><b>A — Avaliação:</b> como está agora (estável/instável), o que preocupa.</li>
<li><b>R — Recomendação:</b> o que o próximo turno precisa fazer/vigiar.</li>
</ul>
<p>Priorize os <b>instáveis</b>, as <b>pendências em aberto</b>, exames a checar e tarefas com horário.</p>
<div class="xref"><i class="ti ti-bolt"></i> <a href="enfermaria.html">EnfermarIA</a> gera o resumo de passagem de plantão agrupado por setor.</div>`},

{id:'procedimentos',ic:'ti-needle',t:'Procedimentos à beira-leito',s:'Princípios e passos gerais (com supervisão)',html:`
<div class="warn">No início, faça todo procedimento <b>com supervisão</b>. Sempre: consentimento, identificação correta, assepsia/paramentação, material conferido e "time-out".</div>
<h3>Acesso venoso periférico</h3><ul><li>Garrote, antissepsia, bisel para cima, fixar bem; descartar perfurocortante com segurança.</li></ul>
<h3>Gasometria arterial</h3><ul><li>Radial (teste de Allen), 45–90°, seringa heparinizada, comprimir 5 min após; identificar e levar em gelo se demora.</li></ul>
<h3>Sondagem vesical</h3><ul><li>Técnica estéril; insira até retorno de urina e progrida antes de insuflar o balão; fixe; sistema fechado.</li></ul>
<h3>Sonda nasogástrica/enteral</h3><ul><li>Medir comprimento, lubrificar, paciente sentado, deglutir; <b>confirmar posição</b> antes de usar (raio-X é o padrão para sonda fina/enteral).</li></ul>
<div class="tip">Conheça as contraindicações e complicações antes; na dúvida, chame quem tem experiência.</div>`},

{id:'exames',ic:'ti-microscope',t:'Interpretação rápida',s:'Gasometria, eletrólitos, hemograma, ECG',html:`
<h3>Gasometria — passo a passo</h3>
<ol>
<li><b>pH:</b> acidemia (&lt;7,35) ou alcalemia (&gt;7,45)?</li>
<li><b>Distúrbio primário:</b> olhe <b>pCO₂</b> (respiratório) e <b>HCO₃</b> (metabólico) — qual explica o pH?</li>
<li><b>Compensação:</b> adequada ou há distúrbio misto?</li>
<li><b>Ânion-gap</b> (Na − [Cl + HCO₃]) na acidose metabólica; depois o delta-delta.</li>
</ol>
<h3>Eletrólitos e função renal</h3><ul><li>Aborde Na⁺ pela <b>osmolaridade + volemia</b>; K⁺ pela gravidade + ECG. TFG pela <b>CKD-EPI 2021</b>.</li></ul>
<h3>Hemograma</h3><ul><li>Anemia (VCM → micro/normo/macro), leucocitose/leucopenia, plaquetas.</li></ul>
<h3>ECG — leitura sistemática</h3><ul><li>Ritmo → FC → eixo → P/PR/QRS/QT → ST-T (isquemia) → comparar com prévio.</li></ul>
<div class="xref"><i class="ti ti-bolt"></i> Cálculos (gaso, clearance, escores) no <a href="calcmed.html">CalcMed</a>; distúrbios eletrolíticos/ECG no <a href="condutai.html">CondutAI</a>.</div>`},

{id:'comunicacao',ic:'ti-messages',t:'Comunicação',s:'Com paciente, família e equipe',html:`
<h3>Com o paciente/família</h3><ul><li>Linguagem simples; <b>ask-tell-ask</b> (pergunte o que sabe → informe → confirme entendimento).</li></ul>
<h3>Más notícias — SPIKES</h3><ul><li>Setting (ambiente) · Perception · Invitation · Knowledge · Emotions · Strategy/Summary.</li></ul>
<h3>Emoções — NURSE</h3><ul><li>Nomear · Compreender · Respeitar · Apoiar · Explorar.</li></ul>
<h3>Com a equipe</h3><ul><li>Objetivo, sem culpabilizar; comunique <b>valores críticos</b> e dúvidas cedo; registre o combinado.</li></ul>
<div class="xref"><i class="ti ti-bolt"></i> Reunião familiar / objetivos de cuidado → <a href="paliai.html">PaliAI</a> gera um roteiro estruturado.</div>`},

{id:'seguranca',ic:'ti-shield-check',t:'Segurança do paciente',s:'Erros comuns e como evitá-los',html:`
<ul>
<li><b>Identifique</b> o paciente (2 identificadores) antes de qualquer ato.</li>
<li><b>Higiene das mãos</b> nos 5 momentos.</li>
<li>Confira <b>alergia, dose, via e função renal</b> em toda prescrição.</li>
<li><b>Reconciliação medicamentosa</b> na admissão/transferência/alta.</li>
<li>Profilaxia de <b>TEV</b> e de úlcera de estresse <b>quando indicadas</b> (não em todos).</li>
<li>Evite <b>prescrição verbal</b>; se inevitável, leia de volta (read-back).</li>
<li>Comunique <b>valores críticos</b> e documente.</li>
</ul>
<div class="tip">Na dúvida sobre dose/segurança, pare e cheque — pedir ajuda é prática segura, não fraqueza.</div>`},

{id:'organizacao',ic:'ti-checklist',t:'Organização e bem-estar',s:'Render o dia sem se perder (nem se esgotar)',html:`
<ul>
<li>Comece o dia com uma <b>lista</b> (pacientes, tarefas, exames a checar, horários).</li>
<li><b>Priorize</b> o instável e o que destrava a alta.</li>
<li>Registre <b>na hora</b> (não confie só na memória).</li>
<li>Feche pendências e atualize a equipe.</li>
<li><b>Autocuidado:</b> sono, alimentação, pausas; peça ajuda cedo; conheça seus limites e os canais de apoio.</li>
</ul>
<div class="tip">Use o <a href="foco.html" style="color:var(--primary);font-weight:600">Foco</a> para organizar tarefas/agenda do dia.</div>`},
];

const main=document.getElementById('main');
function home(q){
  const list = q ? SEC.filter(s=>(s.t+' '+s.s+' '+s.html).toLowerCase().includes(q.toLowerCase())) : SEC;
  main.innerHTML=`
   <div class="hero"><span class="ic"><i class="ti ti-book-2"></i></span><div><b>Seu manual de bolso do internato</b><p>Como admitir, evoluir, prescrever com segurança, virar o plantão e interpretar o básico — e um mentor por IA para tirar dúvidas. Para condutas e doses atualizadas, o guia aponta para o CondutAI/ATBguia.</p></div></div>
   <div class="sec-title">Temas</div>
   <div class="grid">${list.map(s=>`<button class="card" onclick="open_('${s.id}')"><span class="ic"><i class="ti ${s.ic}"></i></span><span><span class="ttl">${s.t}</span><span class="sub">${s.s}</span></span></button>`).join('')||'<p style="color:var(--muted)">Nada encontrado.</p>'}</div>
   ${iaHTML()}`;
  bindIA();
}
function open_(id){
  const s=SEC.find(x=>x.id===id);if(!s)return;
  main.innerHTML=`<div class="view"><button class="back" onclick="home()"><i class="ti ti-arrow-left"></i> Voltar aos temas</button>
   <h1><i class="ti ${s.ic}"></i> ${s.t}</h1>${s.html}
   <div class="disclaimer">⚠️ Conteúdo educacional e de apoio — não substitui a supervisão nem o protocolo do seu serviço. Doses/condutas específicas: confirme no CondutAI/ATBguia.</div></div>
   ${iaHTML()}`;
  bindIA();window.scrollTo(0,0);
}
function filter(v){home(v);}
function iaHTML(){return `<div class="iabox"><h2><i class="ti ti-sparkles"></i> Pergunte ao Guia</h2>
   <div class="hint">Dúvidas práticas do dia a dia (mentor estilo residente sênior). Para conduta de doença específica, ele te direciona ao app certo.</div>
   <textarea id="iaq" placeholder="Ex.: Como faço a prescrição de profilaxia de TEV? Como organizo a passagem de um paciente instável?"></textarea>
   <div class="chips">
     <span class="chip" onclick="askChip(this)">Como estruturo uma evolução SOAP?</span>
     <span class="chip" onclick="askChip(this)">O que não pode faltar numa prescrição?</span>
     <span class="chip" onclick="askChip(this)">Passo a passo para ler uma gasometria</span>
     <span class="chip" onclick="askChip(this)">Como dar uma má notícia?</span>
   </div>
   <button class="btn" id="iaBtn" onclick="ask()"><i class="ti ti-send"></i> Perguntar</button>
   <div id="iaOut"></div></div>`;}
function bindIA(){}
function askChip(el){document.getElementById('iaq').value=el.textContent;ask();}
async function ask(){
  if(!window.MT||!MT.user){alert('Entre na sua conta MedTech para usar a IA.');return;}
  const q=document.getElementById('iaq').value.trim();if(!q){document.getElementById('iaq').focus();return;}
  const b=document.getElementById('iaBtn');b.innerHTML='<span class="spin"></span> Pensando…';b.disabled=true;
  const prompt='Você é um RESIDENTE SÊNIOR / preceptor experiente orientando um INTERNO de medicina (ou R1) no Brasil. Responda à dúvida de forma PRÁTICA, objetiva e didática, com passos acionáveis para o dia a dia da enfermaria/plantão. Tom de mentor: encorajador e seguro. REGRAS: priorize segurança do paciente; quando a pergunta envolver DOSE ou CONDUTA de uma doença específica, dê o raciocínio geral mas oriente confirmar a dose/conduta atual no app CondutAI ou ATBguia (não invente doses específicas); reforce "faça sob supervisão" quando for procedimento; use português do Brasil. FORMATAÇÃO: texto limpo, sem markdown (sem # nem *); títulos curtos em maiúsculas seguidos de dois-pontos quando ajudar.\n\nDÚVIDA DO INTERNO: '+q;
  try{const t=await MT.ai(prompt,'gemini-2.5-pro');document.getElementById('iaOut').innerHTML='<div class="iaout">'+(t||'').replace(/[<>]/g,s=>({'<':'&lt;','>':'&gt;'}[s]))+'</div>';}
  catch(e){alert('⚠️ '+(e.message||'Falha na IA.'));}
  b.innerHTML='<i class="ti ti-send"></i> Perguntar';b.disabled=false;
}
home();
</script>
</body>
</html>
