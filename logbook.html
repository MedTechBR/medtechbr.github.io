<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logbook — registro de procedimentos e casos | MedTech</title>
<meta name="description" content="Logbook do residente: registre procedimentos e casos com papel (executei/auxiliei/observei), supervisor e contexto. Contadores automáticos por procedimento e exportação CSV para comprovação de competências.">
<meta name="theme-color" content="#FAFAF8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<link rel="icon" type="image/png" href="favicon.png">
<script src="_mtfb.js?v=1"></script>
<script>window.MT_APP={id:"logbook",name:"Logbook"};</script>
<script type="module" src="_mtauth.js?v=16"></script>
<link rel="stylesheet" href="_mttokens.css?v=3">
<style>
:root{--primary:#B0532F;--primary-dark:#8C4225;--ink:#23272E;--muted:#5E646B;--dim:#767C84;--bg:#FAFAF8;--surface:#FFFFFF;--panel2:#F1F1EC;--soft:rgba(176,83,47,.10);--line:#E8E8E2;--line-strong:#DDDDD5;--ok:#1D7A46;--danger:#C6453D;--shadow:0 1px 3px rgba(20,24,30,.07)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
input:-webkit-autofill{-webkit-box-shadow:0 0 0 100px #FFF inset;-webkit-text-fill-color:#23272E}
header{background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 0;position:sticky;top:0;z-index:20}
.wrap{max-width:820px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:11px;font-weight:700;font-size:20px}
.logo .mark{width:36px;height:36px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center;flex:0 0 auto;font-size:20px}
.logo small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
main{padding:20px 0 70px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card h2{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h2 .ti{color:var(--primary)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow .full{grid-column:1/-1}
.field label{display:block;font-weight:600;font-size:12.5px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line-strong);border-radius:10px;font-size:16px;font-family:inherit;background:var(--surface);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(176,83,47,.13)}
textarea{min-height:56px;resize:vertical}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:10px 6px;font:600 13px 'Figtree',sans-serif;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--soft);border-color:var(--primary);color:var(--primary-dark)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:10px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;padding:12px 18px;background:var(--primary);color:#fff}
.btn:hover{background:var(--primary-dark)}
.btn-g{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}
.btn-g:hover{border-color:var(--primary);color:var(--primary)}
/* contadores */
.counts{display:flex;flex-wrap:wrap;gap:8px}
.count{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer}
.count b{font-size:15px;color:var(--primary)}
.count small{color:var(--muted)}
.count.on{border-color:var(--primary);background:var(--soft)}
.empty{text-align:center;color:var(--muted);padding:26px;border:1px dashed var(--line-strong);border-radius:12px;font-size:14px}
/* lista */
.entry{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:none}
.entry .dt{min-width:52px;text-align:center;background:var(--panel2);border-radius:9px;padding:6px 4px}
.entry .dt b{display:block;font-size:16px;line-height:1.1}
.entry .dt span{font-size:10.5px;color:var(--muted);text-transform:uppercase}
.entry .mid{flex:1;min-width:0}
.entry .nm{font-weight:600;font-size:14.5px}
.entry .det{font-size:12.5px;color:var(--muted);margin-top:2px}
.entry .notas{font-size:12.5px;margin-top:4px;background:var(--panel2);border-radius:8px;padding:5px 9px;display:inline-block}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:1px}
.p-exec{background:rgba(29,122,70,.12);color:var(--ok)}
.p-aux{background:rgba(176,83,47,.12);color:var(--primary)}
.p-obs{background:var(--panel2);color:var(--muted)}
.p-caso{background:rgba(43,92,230,.10);color:#2B5CE6}
.entry .del{background:none;border:1px solid var(--line);border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--muted);flex:0 0 auto}
.entry .del:hover{color:var(--danger);border-color:var(--danger)}
.listbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.listbar .n{font-size:13px;color:var(--muted)}
@media(max-width:560px){.frow{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap top">
  <div class="logo"><span class="mark"><i class="ti ti-notebook" aria-hidden="true"></i></span><div>Logbook<small>Procedimentos e casos do residente · MedTech</small></div></div>
</div></header>

<main class="wrap">
  <div class="card">
    <h2><i class="ti ti-plus"></i> Registrar</h2>
    <div class="frow">
      <div class="field full"><label>Tipo</label><div class="seg" id="segTipo">
        <button data-v="procedimento" class="on"><i class="ti ti-vaccine"></i> Procedimento</button>
        <button data-v="caso"><i class="ti ti-file-description"></i> Caso clínico</button>
      </div></div>
      <div class="field full"><label>Nome <span style="font-weight:400">(procedimento ou diagnóstico do caso)</span></label>
        <input id="f_nome" list="procs" placeholder="Ex.: Intubação orotraqueal, Punção lombar, IAM com supra…" maxlength="120">
        <datalist id="procs">
          <option>Intubação orotraqueal</option><option>Acesso venoso central</option><option>Punção lombar</option>
          <option>Paracentese</option><option>Toracocentese</option><option>Drenagem de tórax</option>
          <option>Sutura de ferida</option><option>Sondagem vesical</option><option>Sondagem nasogástrica</option>
          <option>Gasometria arterial</option><option>Cardioversão elétrica</option><option>Desfibrilação</option>
          <option>RCP (parada cardiorrespiratória)</option><option>POCUS (ultrassom à beira-leito)</option>
          <option>Anestesia local / bloqueio</option><option>Parto vaginal</option><option>Auxílio em cesariana</option>
        </datalist>
      </div>
      <div class="field"><label>Papel</label><div class="seg" id="segPapel">
        <button data-v="executei" class="on">Executei</button>
        <button data-v="auxiliei">Auxiliei</button>
        <button data-v="observei">Observei</button>
      </div></div>
      <div class="field"><label>Data</label><input id="f_data" type="date"></div>
      <div class="field"><label>Contexto / setor <span style="font-weight:400">(opcional)</span></label><input id="f_ctx" placeholder="Ex.: UTI, PS, enfermaria, CC" maxlength="60"></div>
      <div class="field"><label>Supervisor <span style="font-weight:400">(opcional)</span></label><input id="f_sup" placeholder="Ex.: Dr(a). …" maxlength="60"></div>
      <div class="field full"><label>Notas <span style="font-weight:400">(opcional — intercorrências, aprendizado)</span></label><textarea id="f_notas" maxlength="500"></textarea></div>
      <div class="field full"><button class="btn" id="btnAdd" style="width:100%"><i class="ti ti-check"></i> Registrar no logbook</button></div>
    </div>
  </div>

  <div class="card">
    <h2><i class="ti ti-chart-bar"></i> Contadores por procedimento</h2>
    <div class="counts" id="counts"></div>
  </div>

  <div class="card">
    <div class="listbar"><h2 style="margin:0"><i class="ti ti-history"></i> Registros</h2>
      <div style="display:flex;gap:8px;align-items:center"><span class="n" id="nReg"></span>
      <button class="btn-g btn" style="padding:8px 12px;font-size:13px" id="btnCsv"><i class="ti ti-download"></i> CSV</button></div>
    </div>
    <div id="lista"></div>
  </div>
</main>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let state={entries:[]}, filtro=null, applyingCloud=false;

function normalize(d){d=d&&typeof d==='object'?d:{};return {entries:Array.isArray(d.entries)?d.entries:[],_tomb:(d._tomb&&typeof d._tomb==='object')?d._tomb:{}};}
function persist(){ if(applyingCloud)return; if(window.MT&&MT.save)MT.save(state); }
function whenMT(cb){ if(window.MT){cb();} else setTimeout(()=>whenMT(cb),40); }
whenMT(()=>{ MT.mergeFn=(r,l)=>MT.mergeState(r,l,['entries']); MT.onData(d=>{ applyingCloud=true; state=normalize(d); applyingCloud=false; render(); }); });

/* segmented controls */
function segVal(id){ return document.querySelector('#'+id+' button.on').dataset.v; }
['segTipo','segPapel'].forEach(id=>{ document.querySelectorAll('#'+id+' button').forEach(b=>{ b.onclick=()=>{ document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); }; }); });

function hojeStr(){ const d=new Date(); return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
$('f_data').value=hojeStr();

$('btnAdd').onclick=()=>{
  const nome=$('f_nome').value.trim();
  if(!nome){ $('f_nome').focus(); return; }
  state.entries.push({ id:uid(), tipo:segVal('segTipo'), nome, papel:segVal('segPapel'),
    date:$('f_data').value||hojeStr(), ctx:$('f_ctx').value.trim(), sup:$('f_sup').value.trim(),
    notas:$('f_notas').value.trim(), updatedAt:Date.now() });
  persist();
  $('f_nome').value='';$('f_ctx').value='';$('f_sup').value='';$('f_notas').value='';
  render();
  $('btnAdd').innerHTML='<i class="ti ti-check"></i> Registrado!'; setTimeout(()=>$('btnAdd').innerHTML='<i class="ti ti-check"></i> Registrar no logbook',1400);
};

function delEntry(id){
  if(!confirm('Excluir este registro?'))return;
  MT.markDeleted(state,id);
  state.entries=state.entries.filter(e=>e.id!==id);
  persist();render();
}

const PAPEL={executei:['p-exec','Executei'],auxiliei:['p-aux','Auxiliei'],observei:['p-obs','Observei']};
function render(){
  const es=[...state.entries].sort((a,b)=>(b.date||'').localeCompare(a.date||'')|| (b.updatedAt||0)-(a.updatedAt||0));
  /* contadores por nome (só procedimentos) */
  const g={};
  es.filter(e=>e.tipo==='procedimento').forEach(e=>{ const k=e.nome.trim(); (g[k]=g[k]||{t:0,ex:0}).t++; if(e.papel==='executei')g[k].ex++; });
  const keys=Object.keys(g).sort((a,b)=>g[b].t-g[a].t);
  $('counts').innerHTML = keys.length ? keys.map(k=>`<div class="count${filtro===k?' on':''}" onclick="setFiltro('${esc(k).replace(/'/g,"\\'")}')"><b>${g[k].t}×</b> ${esc(k)} <small>· executei ${g[k].ex}</small></div>`).join('')
    : '<div class="empty" style="width:100%">Registre o primeiro procedimento — os contadores aparecem aqui (útil pra comprovação de competências).</div>';
  /* lista */
  const list = filtro ? es.filter(e=>e.nome.trim()===filtro) : es;
  $('nReg').textContent = list.length + ' registro' + (list.length===1?'':'s') + (filtro?(' · filtro: '+filtro):'');
  $('lista').innerHTML = list.length ? list.map(e=>{
    const d=(e.date||'').split('-'); const dia=d[2]||'—', mes=['','JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'][+d[1]||0]||'';
    const p=PAPEL[e.papel]||PAPEL.observei;
    return `<div class="entry">
      <div class="dt"><b>${dia}</b><span>${mes}</span></div>
      <div class="mid">
        <div class="nm">${esc(e.nome)}${e.tipo==='caso'?'<span class="pill p-caso">Caso</span>':`<span class="pill ${p[0]}">${p[1]}</span>`}</div>
        <div class="det">${[e.ctx,e.sup].filter(Boolean).map(esc).join(' · ')||''}</div>
        ${e.notas?`<div class="notas">${esc(e.notas)}</div>`:''}
      </div>
      <button class="del" title="Excluir" onclick="delEntry('${e.id}')"><i class="ti ti-trash"></i></button>
    </div>`;}).join('')
    : '<div class="empty">Nenhum registro'+(filtro?' com esse filtro':'')+'.</div>';
}
function setFiltro(k){ filtro = (filtro===k?null:k); render(); }

/* CSV com escape + anti-injeção de fórmula */
const csvField=v=>{let s=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
$('btnCsv').onclick=()=>{
  const rows=[['Data','Tipo','Nome','Papel','Contexto','Supervisor','Notas']]
    .concat(state.entries.map(e=>[e.date,e.tipo,e.nome,e.papel,e.ctx,e.sup,e.notas]));
  const csv=rows.map(r=>r.map(csvField).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
  a.download='logbook-medtech.csv'; a.click(); URL.revokeObjectURL(a.href);
};
render();
</script>
</body>
</html>
