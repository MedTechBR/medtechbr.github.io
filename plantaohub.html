<style>
:root{--petrol:#4C8DFF;--petrol-dark:#2f6ae0;--ink:#E7EEF7;--mint:#4C8DFF;--mint-dark:#2f6ae0;--bg:#0A0E14;--surface:#111823;--panel2:#0E141D;--soft:rgba(76,141,255,.12);--line:rgba(140,160,185,.16);--line-strong:rgba(140,160,185,.22);--muted:#8A98AC;--dim:#7E8EA6;--glow:rgba(76,141,255,.42);--green:#3FB950;--green-bg:rgba(63,185,80,.15);--amber:#E3B341;--amber-bg:rgba(227,179,65,.15);--red:#F85149;--red-bg:rgba(248,81,73,.15);--violet:#b39df5;--violet-bg:rgba(139,110,240,.16)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:-.011em;color:var(--ink);background-color:#0A0E14;background-image:radial-gradient(1100px 460px at 84% -10%,rgba(76,141,255,.12),transparent 60%),radial-gradient(840px 460px at 4% 110%,rgba(56,225,198,.06),transparent 55%),linear-gradient(rgba(140,160,185,.032) 1px,transparent 1px),linear-gradient(90deg,rgba(140,160,185,.032) 1px,transparent 1px);background-size:auto,auto,34px 34px,34px 34px;background-attachment:fixed}
input:-webkit-autofill,input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 100px #0E141D inset;-webkit-text-fill-color:#E7EEF7;caret-color:#E7EEF7;transition:background-color 99999s}
header{background:rgba(10,14,20,.72);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--ink);border-bottom:1px solid var(--line);padding:14px 0;padding-top:calc(14px + env(safe-area-inset-top))}
.wrap{max-width:960px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.5px;font-family:'Space Grotesk','Inter',sans-serif}
.logo .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(150deg,#4C8DFF,#2f6ae0);display:grid;place-items:center;flex:0 0 auto;box-shadow:0 6px 20px var(--glow)}
.logo .mark svg{width:22px;height:22px}
.logo b{color:var(--petrol)}
.subtitle{color:var(--muted);font-size:12.5px;margin-top:3px}
.usr{display:flex;align-items:center;gap:10px}
.usr .who{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.3;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usr a,.usr button{color:var(--ink);text-decoration:none;font-size:13px;font-weight:600;background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;font-family:inherit}
.usr a:hover,.usr button:hover{background:var(--soft);border-color:var(--petrol);color:var(--petrol)}
main{max-width:960px;margin:0 auto;padding:18px 18px 60px}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:16px;width:fit-content}
.tabs button{border:none;background:none;padding:9px 20px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted);font-family:inherit}
.tabs button.on{background:linear-gradient(150deg,#4C8DFF,#2f6ae0);color:#fff;box-shadow:0 4px 14px var(--glow)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.bar .nav{display:flex;align-items:center;gap:10px}
.bar h2{font-size:18px;text-transform:capitalize;font-family:'Space Grotesk','Inter',sans-serif}
.bar .arr{background:rgba(140,160,185,.05);border:1px solid var(--line);border-radius:9px;width:38px;height:38px;font-size:18px;cursor:pointer;color:var(--petrol)}
.bar .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select.flt,.btn{font-family:inherit}
select.flt{padding:9px 12px;border:1px solid var(--line-strong);border-radius:9px;font-size:13.5px;background:var(--panel2);color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:10px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer}
.btn-p{background:linear-gradient(150deg,#4C8DFF,#2f6ae0);color:#fff;box-shadow:0 4px 14px var(--glow)}.btn-p:hover{background:linear-gradient(150deg,#5a97ff,#2f6ae0)}
.btn-g{background:rgba(140,160,185,.05);color:var(--petrol);border:1px solid var(--line)}
.btn-sm{padding:8px 12px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:16px}
.kpi{background:linear-gradient(160deg,var(--surface),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.kpi .v{font-size:21px;font-weight:800;color:var(--petrol);margin-top:4px;font-family:'JetBrains Mono',monospace}
.kpi.green .v{color:var(--green)}.kpi.amber .v{color:var(--amber)}.kpi.red .v{color:var(--red)}
.shift{background:linear-gradient(160deg,var(--surface),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px;display:flex;align-items:center;gap:14px}
.shift .day{text-align:center;min-width:50px}
.shift .day .d{font-size:21px;font-weight:800;line-height:1;font-family:'JetBrains Mono',monospace}
.shift .day .w{font-size:11px;color:var(--muted);text-transform:uppercase}
.shift .mid{flex:1;min-width:0}
.shift .mid .loc{font-weight:700;font-size:15px}
.shift .mid .det{color:var(--muted);font-size:13px;margin-top:2px}
.shift .mid .obs{font-size:12.5px;color:var(--ink);margin-top:4px;background:var(--soft);padding:4px 9px;border-radius:7px;display:inline-block}
.shift .val{text-align:right;font-weight:800;color:var(--petrol);white-space:nowrap;font-family:'JetBrains Mono',monospace}
.shift .acts{display:flex;gap:6px}
.shift .acts button{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer;font-size:13px}
.stat{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;margin-top:4px;cursor:pointer}
.s-ag{background:var(--amber-bg);color:var(--amber)}.s-pg{background:var(--green-bg);color:var(--green)}
.empty{text-align:center;color:var(--muted);padding:36px;background:linear-gradient(160deg,var(--surface),var(--panel2));border:1px dashed var(--line-strong);border-radius:14px}
.note{background:var(--soft);border-radius:12px;padding:13px 16px;font-size:13px;color:var(--ink);margin-top:16px}
.note b{color:var(--petrol)}
table.yr{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
table.yr th,table.yr td{padding:11px 13px;text-align:right;font-size:13.5px;border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace}
table.yr th{background:var(--soft);color:var(--petrol);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em}
table.yr td:first-child,table.yr th:first-child{text-align:left;text-transform:capitalize;font-weight:700}
table.yr tr:last-child td{border-bottom:none}
table.yr tr.tot td{background:rgba(76,141,255,.1);font-weight:800;color:var(--petrol)}
.locgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:11px;margin-top:14px}
.loccard{background:linear-gradient(160deg,var(--surface),var(--panel2));border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.loccard .ln{font-weight:700;font-size:14px}.loccard .lv{color:var(--muted);font-size:12.5px;margin-top:3px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .hd{text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:2px 0}
.cal .cell{background:var(--panel2);border:1px solid var(--line);border-radius:10px;min-height:90px;padding:6px;position:relative;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cal .cell:hover{border-color:var(--mint)}
.cal .cell.out{background:rgba(10,14,20,.5);opacity:.5}
.cal .cell .dn{font-size:12px;font-weight:700;color:var(--muted);align-self:flex-start;font-family:'JetBrains Mono',monospace}
.cal .cell.today .dn{background:var(--petrol);color:#fff;border-radius:6px;padding:0 6px}
.cal .cell .cp{position:absolute;top:5px;right:5px;font-size:12px;background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:0 6px;cursor:pointer;opacity:0;transition:opacity .12s;color:var(--petrol)}
.cal .cell:hover .cp{opacity:1}
.cal .chip{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 6px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;line-height:1.25;font-family:'JetBrains Mono',monospace}
.cal .chip .ch-h{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .chip .ch-l{font-weight:600;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .chip.c-ag{background:var(--amber-bg);color:var(--amber)}
.cal .chip.c-pg{background:var(--green-bg);color:var(--green)}
.cal.pasting .cell{border-style:dashed;border-color:var(--mint)}
.cal.pasting .cell:hover{background:var(--soft);box-shadow:0 0 0 2px var(--mint)}
.clipbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--violet-bg);color:var(--violet);border:1px solid rgba(139,110,240,.35);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;margin-bottom:12px}
.clipbar button{background:#8b6ef0;color:#fff;border:none;border-radius:7px;padding:5px 11px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
@media(max-width:520px){.cal{gap:3px}.cal .cell{min-height:60px;padding:3px;border-radius:8px}.cal .chip{font-size:9px;padding:1px 4px}.cal .cell .cp{opacity:1}}
.modal{position:fixed;inset:0;background:rgba(2,6,12,.66);display:flex;align-items:center;justify-content:center;padding:18px;z-index:60}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:460px;width:100%;max-height:92vh;overflow:auto}
.modal h3{margin-bottom:16px;font-family:'Space Grotesk','Inter',sans-serif}
.field{margin-bottom:13px}.field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1px solid var(--line-strong);border-radius:10px;font-size:15px;font-family:inherit;background:var(--panel2);color:var(--ink)}
.field textarea{resize:vertical;min-height:52px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--mint);box-shadow:0 0 0 3px rgba(76,141,255,.15)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
footer{text-align:center;color:var(--muted);font-size:13px;padding:24px}
footer a{color:var(--petrol);font-weight:600;text-decoration:none}
@media(max-width:760px){.cards{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:520px){.cards{grid-template-columns:1fr 1fr}.shift{flex-wrap:wrap}}
/* ===== modo app (PWA mobile): bottom nav ===== */
@media(max-width:640px){
  .subtitle{display:none}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:55;width:auto;max-width:none;margin:0;border-radius:0;border:none;border-top:1px solid var(--line);padding:6px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:rgba(10,14,20,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 -6px 22px rgba(0,0,0,.45)}
  .tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:7px 2px;font-size:10.5px;font-weight:600;border-radius:10px}
  .tabs button i{font-size:21px;line-height:1}
  .tabs button.on{background:var(--soft);color:var(--petrol);font-weight:700}
  main{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
  footer{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
  .field input,.field select,.field textarea{font-size:16px}
}
</style>

<body>
<header>
  <div class="wrap top">
    <div>
      <div class="logo"><span class="mark"><svg viewBox="0 0 96 96"><path d="M18 50 h13 l7 -20 9 38 8 -26 5 8 h13" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></span> Plantão<b>Hub</b></div>
      <div class="subtitle">Seus plantões, horas e ganhos sob controle · por MedTech</div>
    </div>
    <div class="usr" id="usr"></div>
  </div>
</header>

<main>
  <div class="tabs">
    <button id="tab-mes" class="on" onclick="setTab('mes')"><i class="ti ti-clipboard-list"></i> Competência</button>
    <button id="tab-cal" onclick="setTab('cal')"><i class="ti ti-calendar-month"></i> Calendário</button>
    <button id="tab-ano" onclick="setTab('ano')"><i class="ti ti-calendar-stats"></i> Ano</button>
  </div>
  <div id="view"></div>
  <div class="note"><i class="ti ti-pin" aria-hidden="true"></i> <b id="storenote">Carregando…</b> Suas horas, seus recebimentos e o que já caiu — por mês, por ano e por local.</div>
</main>

<footer>© 2026 <a href="index.html">MedTech</a> · <a href="privacidade.html">Privacidade</a></footer>

<script>
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MESC=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const WD=['dom','seg','ter','qua','qui','sex','sáb'];
let state={shifts:[],locais:{},compDay:1};
let cur=new Date();                       // referência da competência exibida
let calCur=new Date();calCur.setDate(1);  // 1º dia do mês exibido no calendário
let curY=new Date().getFullYear();
let tab='mes';
let fltLocal='';
let dayClip=null;                         // {from:'YYYY-MM-DD', shifts:[{local,start,end,value,note}]}

const money=v=>'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=v=>'R$ '+Number(v||0).toLocaleString('pt-BR',{maximumFractionDigits:0});
const hnum=h=>h.toLocaleString('pt-BR',{maximumFractionDigits:1});
const esc=MTUI.esc; /* compartilhado em _mtui.js */
function hoursOf(s){const[a,b]=s.start.split(':').map(Number);const[c,d]=s.end.split(':').map(Number);let h=(c*60+d)-(a*60+b);if(h<=0)h+=1440;return h/60;}
function monthKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const pad2=n=>String(n).padStart(2,'0');

/* competência conforme o dia de corte (compDay). compDay<=1 => mês civil. */
function compDayVal(){return Math.min(28,Math.max(1,state.compDay||1));}
function compRange(ref){
  const cd=compDayVal();
  if(cd<=1){
    const s=new Date(ref.getFullYear(),ref.getMonth(),1);
    const e=new Date(ref.getFullYear(),ref.getMonth()+1,0);
    return {s,e,civil:true,label:MES[s.getMonth()]+' '+s.getFullYear()};
  }
  let sy=ref.getFullYear(),sm=ref.getMonth();
  if(ref.getDate()<cd){sm--;if(sm<0){sm=11;sy--;}}
  const s=new Date(sy,sm,cd);
  const e=new Date(sy,sm+1,cd-1);
  return {s,e,civil:false,label:`${pad2(s.getDate())}/${pad2(s.getMonth()+1)} – ${pad2(e.getDate())}/${pad2(e.getMonth()+1)} · ${e.getFullYear()}`};
}
function inComp(sh,r){return sh.date>=ymd(r.s)&&sh.date<=ymd(r.e);}

function sampleSeed(){const t=new Date();const f=dd=>{const x=new Date(t);x.setDate(dd);return x.toISOString().slice(0,10);};
  return {shifts:[
   {id:uid(),date:f(5),local:'UPA Central',start:'19:00',end:'07:00',value:1200,status:'pago',note:''},
   {id:uid(),date:f(12),local:'Hospital São Lucas — PS',start:'07:00',end:'19:00',value:1100,status:'pago',note:''},
   {id:uid(),date:f(20),local:'UPA Central',start:'19:00',end:'07:00',value:1200,status:'agendado',note:''},
   {id:uid(),date:f(26),local:'Clínica Vida — ambulatório',start:'08:00',end:'12:00',value:500,status:'agendado',note:'Levar carimbo'}
  ],locais:{'UPA Central':{start:'19:00',end:'07:00',value:1200},'Hospital São Lucas — PS':{start:'07:00',end:'19:00',value:1100}},compDay:1};
}

/* ---------- boot via MT (login + nuvem ou demo) ---------- */
function whenMT(cb){if(window.MT){cb();}else{setTimeout(()=>whenMT(cb),30);}}
whenMT(()=>{
  MT.onData(d=>{
    if(d&&typeof d==='object'){state={shifts:d.shifts||[],locais:d.locais||{},compDay:d.compDay||1};}
    else{state=(MT.mode==='demo')?sampleSeed():{shifts:[],locais:{},compDay:1};if(MT.mode==='demo')MT.save(state);}
    renderUser();render();
  });
  renderUser();
});
function persist(){MT.save(state);}
function renderUser(){
  const el=document.getElementById('usr');if(!el)return;
  document.getElementById('storenote').textContent=(MT.mode==='demo')?'Modo demonstração — dados salvos neste navegador.':'Conectado — seus dados sincronizam na nuvem.';
  if(MT.mode==='demo'){el.innerHTML='<span class="who">Modo demo</span><a href="index.html">← MedTech</a>';return;}
  const u=MT.user;const nm=u?(u.displayName||u.email||'Conta'):'';
  el.innerHTML=`<span class="who">${esc(nm)}</span><button onclick="MT.signOut()">Sair</button>`;
}

/* ---------- tabs ---------- */
function setTab(t){tab=t;
  document.getElementById('tab-mes').className=t==='mes'?'on':'';
  document.getElementById('tab-cal').className=t==='cal'?'on':'';
  document.getElementById('tab-ano').className=t==='ano'?'on':'';
  render();}
function render(){tab==='ano'?renderYear():tab==='cal'?renderCal():renderComp();}

/* ---------- COMPETÊNCIA (período por dia de corte) ---------- */
function renderComp(){
  const r=compRange(cur);
  let ms=state.shifts.filter(s=>inComp(s,r));
  const locs=[...new Set(state.shifts.map(s=>s.local))].sort();
  if(fltLocal)ms=ms.filter(s=>s.local===fltLocal);
  ms.sort((a,b)=>a.date.localeCompare(b.date));
  const horas=ms.reduce((s,x)=>s+hoursOf(x),0);
  const prev=ms.reduce((s,x)=>s+Number(x.value||0),0);
  const receb=ms.filter(x=>x.status==='pago').reduce((s,x)=>s+Number(x.value||0),0);
  const areceber=prev-receb;
  const opts=['<option value="">Todos os locais</option>'].concat(locs.map(l=>`<option value="${esc(l)}" ${fltLocal===l?'selected':''}>${esc(l)}</option>`)).join('');
  const cd=compDayVal();
  const cutOpts=['<option value="1"'+(cd===1?' selected':'')+'>Mês civil (dia 1)</option>'].concat(
     Array.from({length:27},(_,i)=>i+2).map(n=>`<option value="${n}" ${cd===n?'selected':''}>fecha dia ${n}</option>`)).join('');
  let html=`<div class="bar">
    <div class="nav"><button class="arr" onclick="moveComp(-1)">‹</button><h2>${r.label}</h2><button class="arr" onclick="moveComp(1)">›</button></div>
    <div class="right"><select class="flt" title="Período da competência" onchange="setCompDay(this.value)">${cutOpts}</select><select class="flt" onchange="fltLocal=this.value;render()">${opts}</select><button class="btn btn-g btn-sm" onclick="exportCSV()"><i class="ti ti-download"></i> CSV</button><button class="btn btn-p btn-sm" onclick="openForm()">+ Novo plantão</button></div>
  </div>
  <div class="cards">
    <div class="kpi"><div class="l">Plantões</div><div class="v">${ms.length}</div></div>
    <div class="kpi"><div class="l">Horas</div><div class="v">${hnum(horas)}h</div></div>
    <div class="kpi amber"><div class="l">Previsto</div><div class="v" style="font-size:18px">${money0(prev)}</div></div>
    <div class="kpi green"><div class="l">Recebido</div><div class="v" style="font-size:18px">${money0(receb)}</div></div>
    <div class="kpi red"><div class="l">A receber</div><div class="v" style="font-size:18px">${money0(areceber)}</div></div>
  </div>`;
  if(!ms.length){html+=`<div class="empty">Nenhum plantão ${fltLocal?'deste local ':''}nesta competência.<br>Toque em <b>+ Novo plantão</b> para começar.</div>`;}
  else{html+=ms.map(s=>{const dt=new Date(s.date+'T00:00:00');return `<div class="shift">
    <div class="day"><div class="d">${String(dt.getDate()).padStart(2,'0')}</div><div class="w">${WD[dt.getDay()]}</div></div>
    <div class="mid"><div class="loc">${esc(s.local)}</div>
      <div class="det">${s.start}–${s.end} · ${hnum(hoursOf(s))}h</div>
      ${s.note?`<div class="obs">${esc(s.note)}</div>`:''}
      <span class="stat ${s.status==='pago'?'s-pg':'s-ag'}" onclick="toggleStatus('${s.id}')">${s.status==='pago'?'✓ recebido':'agendado'}</span>
    </div>
    <div class="val">${money(s.value)}</div>
    <div class="acts"><button title="Duplicar p/ semana seguinte" onclick="dup('${s.id}')"><i class="ti ti-copy"></i></button><button title="Editar" onclick="openForm('${s.id}')"><i class="ti ti-pencil"></i></button><button title="Excluir" onclick="del('${s.id}')"><i class="ti ti-trash"></i></button></div>
  </div>`;}).join('');}
  document.getElementById('view').innerHTML=html;
}
function moveComp(n){const r=compRange(cur);cur=new Date(r.s);cur.setMonth(cur.getMonth()+n);render();}
function setCompDay(v){state.compDay=Math.min(28,Math.max(1,parseInt(v)||1));persist();render();}
function toggleStatus(id){const s=state.shifts.find(x=>x.id===id);s.status=s.status==='pago'?'agendado':'pago';persist();render();}
function del(id){if(confirm('Excluir este plantão?')){state.shifts=state.shifts.filter(x=>x.id!==id);persist();render();}}
function delFromForm(id){if(confirm('Excluir este plantão?')){state.shifts=state.shifts.filter(x=>x.id!==id);persist();closeModal();render();}}
function dup(id){const s=state.shifts.find(x=>x.id===id);const d=new Date(s.date+'T00:00:00');d.setDate(d.getDate()+7);
  state.shifts.push({...s,id:uid(),date:d.toISOString().slice(0,10),status:'agendado'});persist();cur=new Date(d);calCur=new Date(d.getFullYear(),d.getMonth(),1);render();}

/* ---------- CALENDÁRIO (com copiar/colar dia) ---------- */
function fmtH(t){t=t||'';return /:00$/.test(t)?t.slice(0,2)+'h':t;}
function shiftsOn(dstr){return state.shifts.filter(s=>s.date===dstr).sort((a,b)=>(a.start||'').localeCompare(b.start||''));}
function renderCal(){
  const r=compRange(cur);                                   // mesma competência da aba Competência
  const gs=new Date(r.s);gs.setDate(gs.getDate()-gs.getDay());        // domingo na/antes do início
  const ge=new Date(r.e);ge.setDate(ge.getDate()+(6-ge.getDay()));    // sábado na/após o fim
  const nCells=Math.round((ge-gs)/86400000)+1;
  const today=ymd(new Date());
  const sYmd=ymd(r.s),eYmd=ymd(r.e);
  const mm=state.shifts.filter(s=>inComp(s,r));
  const horas=mm.reduce((s,x)=>s+hoursOf(x),0);
  const prev=mm.reduce((s,x)=>s+Number(x.value||0),0);
  const receb=mm.filter(x=>x.status==='pago').reduce((s,x)=>s+Number(x.value||0),0);
  let cells='';
  for(let i=0;i<nCells;i++){
    const d=new Date(gs);d.setDate(gs.getDate()+i);
    const ds=ymd(d);const out=ds<sYmd||ds>eYmd;             // fora da competência → esmaecido
    const sh=shiftsOn(ds);
    const chips=sh.map(s=>{const t=(s.start||s.end)?`<span class="ch-h">${esc(fmtH(s.start))}–${esc(fmtH(s.end))}</span>`:'';return `<div class="chip ${s.status==='pago'?'c-pg':'c-ag'}" title="${esc(s.local)} · ${s.start}–${s.end} · ${money(s.value)} — toque para editar" onclick="event.stopPropagation();openForm('${s.id}')">${t}<span class="ch-l">${esc((s.local||'').split('—')[0].trim()).slice(0,18)}</span></div>`;}).join('');
    const cp=sh.length?`<button class="cp" title="Copiar este dia" onclick="event.stopPropagation();copyDay('${ds}')">⧉</button>`:'';
    cells+=`<div class="cell ${out?'out':''} ${ds===today?'today':''}" onclick="event.stopPropagation();cellClick('${ds}')"><div class="dn">${d.getDate()}</div>${cp}${chips}</div>`;
  }
  const heads=WD.map(w=>`<div class="hd">${w}</div>`).join('');
  const cd=compDayVal();
  const cutOpts=['<option value="1"'+(cd===1?' selected':'')+'>Mês civil (dia 1)</option>'].concat(
     Array.from({length:27},(_,i)=>i+2).map(n=>`<option value="${n}" ${cd===n?'selected':''}>fecha dia ${n}</option>`)).join('');
  let clip='';
  if(dayClip){const fd=new Date(dayClip.from+'T00:00:00');
    clip=`<div class="clipbar"><span>📋 Copiado: ${dayClip.shifts.length} plantão(ões) de ${pad2(fd.getDate())}/${pad2(fd.getMonth()+1)} — toque num dia para colar. Clique fora do calendário para cancelar.</span><button onclick="clearClip()">Limpar</button></div>`;}
  let html=`<div class="bar">
    <div class="nav"><button class="arr" onclick="moveComp(-1)">‹</button><h2>${r.label}</h2><button class="arr" onclick="moveComp(1)">›</button></div>
    <div class="right"><select class="flt" title="Período da competência" onchange="setCompDay(this.value)">${cutOpts}</select><button class="btn btn-p btn-sm" onclick="openForm()">+ Novo plantão</button></div>
  </div>
  ${clip}
  <div class="cards">
    <div class="kpi"><div class="l">Plantões</div><div class="v">${mm.length}</div></div>
    <div class="kpi"><div class="l">Horas</div><div class="v">${hnum(horas)}h</div></div>
    <div class="kpi amber"><div class="l">Previsto</div><div class="v" style="font-size:18px">${money0(prev)}</div></div>
    <div class="kpi green"><div class="l">Recebido</div><div class="v" style="font-size:18px">${money0(receb)}</div></div>
    <div class="kpi red"><div class="l">A receber</div><div class="v" style="font-size:18px">${money0(prev-receb)}</div></div>
  </div>
  <div class="cal ${dayClip?'pasting':''}">${heads}${cells}</div>
  <div class="note" style="margin-top:12px">Dica: toque numa <b>etiqueta</b> do dia para editar/excluir o plantão. Toque em <b>⧉</b> para copiar o dia e depois em outros dias para colar (ótimo para plantões fixos) — clique fora do calendário para cancelar. Toque num dia vazio para adicionar.</div>`;
  document.getElementById('view').innerHTML=html;
}
function moveCal(n){calCur.setMonth(calCur.getMonth()+n);render();}
function copyDay(ds){const sh=shiftsOn(ds);if(!sh.length)return;dayClip={from:ds,shifts:sh.map(s=>({local:s.local,start:s.start,end:s.end,value:s.value,note:s.note||''}))};render();}
function clearClip(){dayClip=null;render();}
function cellClick(ds){
  if(dayClip){
    if(ds===dayClip.from)return;          // não recolar no dia de origem
    dayClip.shifts.forEach(s=>state.shifts.push({id:uid(),date:ds,local:s.local,start:s.start,end:s.end,value:s.value,status:'agendado',note:s.note||''}));
    persist();render();return;           // mantém o clipboard p/ colar em vários dias
  }
  openForm(null,ds);
}

/* ---------- ANO ---------- */
function renderYear(){
  const ys=state.shifts.filter(s=>s.date.slice(0,4)==String(curY));
  const rows=[];let tP=0,tR=0,tH=0,tN=0;
  for(let m=0;m<12;m++){
    const mm=ys.filter(s=>Number(s.date.slice(5,7))===m+1);
    const h=mm.reduce((a,x)=>a+hoursOf(x),0);
    const p=mm.reduce((a,x)=>a+Number(x.value||0),0);
    const r=mm.filter(x=>x.status==='pago').reduce((a,x)=>a+Number(x.value||0),0);
    tP+=p;tR+=r;tH+=h;tN+=mm.length;
    rows.push(`<tr><td>${MES[m]}</td><td>${mm.length||''}</td><td>${mm.length?hnum(h)+'h':''}</td><td>${mm.length?money0(p):''}</td><td>${mm.length?money0(r):''}</td></tr>`);
  }
  const porLocal={};
  ys.forEach(s=>{porLocal[s.local]=(porLocal[s.local]||0)+Number(s.value||0);});
  const topLoc=Object.entries(porLocal).sort((a,b)=>b[1]-a[1]);
  let html=`<div class="bar">
    <div class="nav"><button class="arr" onclick="moveYear(-1)">‹</button><h2>${curY}</h2><button class="arr" onclick="moveYear(1)">›</button></div>
    <div class="right"><button class="btn btn-g btn-sm" onclick="exportCSV(true)"><i class="ti ti-download"></i> CSV do ano</button></div>
  </div>
  <div class="cards">
    <div class="kpi"><div class="l">Plantões</div><div class="v">${tN}</div></div>
    <div class="kpi"><div class="l">Horas</div><div class="v">${hnum(tH)}h</div></div>
    <div class="kpi amber"><div class="l">Previsto</div><div class="v" style="font-size:18px">${money0(tP)}</div></div>
    <div class="kpi green"><div class="l">Recebido</div><div class="v" style="font-size:18px">${money0(tR)}</div></div>
    <div class="kpi red"><div class="l">A receber</div><div class="v" style="font-size:18px">${money0(tP-tR)}</div></div>
  </div>
  <table class="yr"><thead><tr><th>Mês</th><th>Plantões</th><th>Horas</th><th>Previsto</th><th>Recebido</th></tr></thead>
  <tbody>${rows.join('')}<tr class="tot"><td>Total ${curY}</td><td>${tN}</td><td>${hnum(tH)}h</td><td>${money0(tP)}</td><td>${money0(tR)}</td></tr></tbody></table>`;
  if(topLoc.length){html+=`<div class="locgrid">`+topLoc.map(([l,v])=>`<div class="loccard"><div class="ln">${esc(l)}</div><div class="lv">${money(v)} no ano</div></div>`).join('')+`</div>`;}
  document.getElementById('view').innerHTML=html;
}
function moveYear(n){curY+=n;render();}

/* ---------- form ---------- */
function openForm(id,presetDate){
  const s=id?state.shifts.find(x=>x.id===id):{date:presetDate||new Date().toISOString().slice(0,10),local:'',start:'19:00',end:'07:00',value:'',status:'agendado',note:''};
  const dl=Object.keys(state.locais||{}).map(l=>`<option value="${esc(l)}">`).join('');
  modal(`<h3>${id?'Editar':'Novo'} plantão</h3>
   <div class="field"><label>Data</label><input id="f_date" type="date" value="${s.date}"></div>
   <div class="field"><label>Local / instituição</label><input id="f_local" list="locdl" value="${esc(s.local)}" placeholder="Ex.: UPA Central" oninput="fillLocal()"><datalist id="locdl">${dl}</datalist></div>
   <div class="two"><div class="field"><label>Início</label><input id="f_start" type="time" value="${s.start}"></div>
   <div class="field"><label>Fim</label><input id="f_end" type="time" value="${s.end}"></div></div>
   <div class="two"><div class="field"><label>Valor (R$)</label><input id="f_value" type="number" step="0.01" value="${s.value}" placeholder="0,00"></div>
   <div class="field"><label>Status</label><select id="f_status"><option value="agendado" ${s.status==='agendado'?'selected':''}>Agendado</option><option value="pago" ${s.status==='pago'?'selected':''}>Recebido</option></select></div></div>
   <div class="field"><label>Observação (opcional)</label><textarea id="f_note" placeholder="Ex.: levar carimbo, escala dupla...">${esc(s.note||'')}</textarea></div>
   <div class="row"><button class="btn btn-p" onclick="saveForm('${id||''}')">Salvar</button><button class="btn btn-g" onclick="closeModal()">Cancelar</button>${id?`<button class="btn" style="background:rgba(248,81,73,.14);color:var(--red);margin-left:auto" onclick="delFromForm('${id}')"><i class="ti ti-trash"></i> Excluir</button>`:''}</div>`);
}
function fillLocal(){const v=document.getElementById('f_local').value;const m=(state.locais||{})[v];if(m){document.getElementById('f_start').value=m.start;document.getElementById('f_end').value=m.end;if(!document.getElementById('f_value').value)document.getElementById('f_value').value=m.value;}}
function saveForm(id){
  const o={date:document.getElementById('f_date').value,local:document.getElementById('f_local').value.trim()||'Plantão',start:document.getElementById('f_start').value,end:document.getElementById('f_end').value,value:parseFloat(document.getElementById('f_value').value)||0,status:document.getElementById('f_status').value,note:document.getElementById('f_note').value.trim()};
  if(!o.date){alert('Informe a data.');return;}
  if(id){Object.assign(state.shifts.find(x=>x.id===id),o);}else{state.shifts.push({id:uid(),...o});}
  if(!state.locais)state.locais={};state.locais[o.local]={start:o.start,end:o.end,value:o.value};
  persist();closeModal();const od=new Date(o.date+'T00:00:00');cur=new Date(od);calCur=new Date(od.getFullYear(),od.getMonth(),1);if(tab==='ano')curY=od.getFullYear();render();
}
const modal=MTUI.modal, closeModal=MTUI.closeModal; /* compartilhados em _mtui.js (com fix de modal empilhado) */

/* ---------- export CSV ---------- */
function exportCSV(year){
  let list,fname;
  if(year){list=state.shifts.filter(s=>s.date.slice(0,4)==String(curY));fname='plantoes-'+curY;}
  else{const r=compRange(cur);list=state.shifts.filter(s=>inComp(s,r));fname='plantoes-'+ymd(r.s)+'_a_'+ymd(r.e);}
  const rows=[['Data','Local','Início','Fim','Horas','Valor','Status','Observação']];
  list.sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>rows.push([s.date,s.local,s.start,s.end,hnum(hoursOf(s)),String(s.value||0).replace('.',','),s.status==='pago'?'Recebido':'Agendado',s.note||'']));
  const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=fname+'.csv';a.click();URL.revokeObjectURL(a.href);
}

/* Clicar FORA do calendário desativa o modo copiar/colar (os cliques dentro do
   calendário dão stopPropagation, então só cliques externos chegam aqui). */
document.addEventListener('click',e=>{ if(dayClip && !e.target.closest('.clipbar')) clearClip(); });
</script>
</body>
