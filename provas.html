<style>
/* ============================================================
   Portal no tema vivo (23/09/2026), modelo ClínicaMed "camada viva".
   A grade compacta de ícones continua (pedido dele: grade, não cartões);
   cada app agora tem o ícone em círculo na cor do próprio app (--c, vindo
   do catálogo). Cadeados, "Meus apps" e Assinatura seguem iguais.
   Cor do portal: índigo (MedTech App) ou laranja (MedTech Provas), via --ac.
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:clip}
.install[hidden]{display:none}
body{font-size:15px;line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit}
.ti{line-height:1}

/* ---------- cabeçalho: uma linha ---------- */
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;min-height:calc(64px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top)}
.wrap{max-width:960px;margin:0 auto;padding:0 24px;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wm{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.02em;white-space:nowrap}
.wm .mk{width:36px;height:36px;border-radius:50%;background:var(--ac);color:var(--acTxt);display:grid;place-items:center;font-size:19px;box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 35%,transparent)}
.wm b{font-weight:700;color:var(--acInk)}
.top-r{display:flex;align-items:center;gap:8px}
.usr{display:flex;align-items:center;gap:8px}
.usr .who{font-size:13px;color:var(--tinta2);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usr button,.ghost{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--sup2);color:var(--tinta);
  font-weight:500;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:background-color .2s,color .2s,transform .18s var(--mola)}
.usr button:hover,.ghost:hover{background:var(--acSup);color:var(--acInk)}
.usr button i,.ghost i,.install i{font-size:18px;line-height:1}
.install{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--ac);color:var(--acTxt);
  font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 28%,transparent)}
.install:hover{filter:brightness(1.08);transform:translateY(-1px)}

/* ---------- saudação ---------- */
main{padding:44px 0 calc(24px + env(safe-area-inset-bottom))}
.hello{text-align:center;margin-bottom:36px}
.hello h1{font-size:clamp(28px,4vw,36px);font-weight:750;letter-spacing:-.035em;line-height:1.1}
.hello .dt{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--acInk);background:var(--acSup);padding:5px 14px;border-radius:999px;margin-top:12px}
.hello .dt:empty{display:none}

/* ---------- grade de apps: compacta, ícone em círculo na cor do app ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:28px 12px;justify-items:center;max-width:800px;margin:0 auto;padding:0 22px}
.app{--c:var(--ac);--t:#fff;display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:inherit;width:100%;border-radius:22px;padding:6px 2px}
.app .ic{position:relative;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:30px;color:var(--t);background:var(--c);
  box-shadow:0 10px 22px color-mix(in srgb,var(--c) 30%,transparent);transition:transform .3s var(--mola),box-shadow .25s}
.app:hover .ic{transform:translateY(-4px) scale(1.04) rotate(-5deg);box-shadow:0 16px 30px color-mix(in srgb,var(--c) 38%,transparent)}
.app:active .ic{transform:scale(.94)}
.app .nm{font-size:13px;font-weight:600;color:var(--tinta);text-align:center;line-height:1.25}
.app .nm b{font-weight:600;color:inherit}
.app:focus-visible{outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 28%,transparent)}
.grid.anima>*{animation:vvSobe .5s var(--suave) both;animation-delay:calc(var(--i,0) * 35ms)}
/* fora do plano: ícone apagado com cadeado */
.app.trav .ic{background:var(--sup3);color:var(--tinta2);box-shadow:none}
.app.trav .nm{color:var(--tinta2)}
.app .lk{position:absolute;right:-4px;top:-4px;width:24px;height:24px;border-radius:50%;background:var(--tinta);color:var(--sup);display:grid;place-items:center;font-size:13px;box-shadow:0 0 0 3px var(--papel)}
.fine{text-align:center;font-size:13px;color:var(--tinta2);margin-top:36px;padding:0 22px}
footer{text-align:center;font-size:13px;padding:24px 22px calc(24px + env(safe-area-inset-bottom));margin-top:48px}
footer a{text-decoration:none;display:inline-block;padding:10px 2px}

/* ---------- modais ---------- */
.sug-modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;z-index:80}
.cfg-cpf{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}.cfg-cpf .lbl{flex:0 0 100%;display:block;font-weight:600;font-size:13px;margin:12px 0 2px;color:var(--tinta2)}.cfg-cpf .val{font-size:16px;font-weight:600;letter-spacing:.02em;color:var(--tinta)}.cfg-cpf .as-mini{flex:1 1 100%;margin-top:2px}.cfg-cpf .b{margin-top:6px}
.sug-box{padding:24px;max-width:480px;width:100%;max-height:92vh;overflow:auto}
.sug-box h3{margin-bottom:6px;font-weight:700;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.sug-box h3 .ti{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--acSup);color:var(--acInk);font-size:19px;flex:0 0 auto}
.sug-box p.sub{color:var(--tinta2);font-size:13.5px;margin-bottom:8px;line-height:1.5}
.sug-box label{display:block;font-weight:600;font-size:13px;margin:12px 0 6px;color:var(--tinta2)}
html[data-viva^=portal][lang] body .sug-box :is(select,input,textarea){width:100%;padding:11px 14px;font-size:16px}
.sug-box textarea{min-height:110px;resize:vertical;line-height:1.5}
.sug-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.sug-box .b{border:1.5px solid transparent;border-radius:999px;padding:10px 16px;min-height:44px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:filter .2s,transform .18s var(--mola),background-color .2s}
.sug-row .b{flex:1}
.sug-box a.b{text-decoration:none}
.sug-box .ok{background:var(--ac);color:var(--acTxt);box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 28%,transparent)}
.sug-box .ok:hover{filter:brightness(1.08);transform:translateY(-1px)}
.sug-box .cancel{background:var(--sup);color:var(--tinta);border-color:var(--fioF)}
.sug-box .cancel:hover{background:var(--acSup);color:var(--acInk)}
.sug-box .perigo{background:var(--errSup);color:color-mix(in srgb,var(--errV) 70%,var(--tinta))}
.sug-box .perigo:hover{filter:brightness(.97)}
/* .cfg-msg.ok dentro do modal herdava o fundo do botão .ok */
.sug-box .cfg-msg.ok{background:none;box-shadow:none;filter:none;transform:none}
.sug-row.dados .b{flex:1 1 170px}
.sug-box ul.lista{margin:4px 0 10px 20px;font-size:13.5px;color:var(--tinta2);line-height:1.5}
.sug-box ul.lista li{margin-bottom:3px}
.cfg-sec .desc a,.sug-box p.sub a{color:var(--acInk);font-weight:600}
.cfg-sec{border-radius:20px;padding:16px;margin-bottom:12px;background:var(--sup2)}
.cfg-sec h4{font-size:15px;font-weight:650;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.cfg-sec h4 i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--sup);color:var(--acInk);font-size:16px}
.cfg-sec .desc{font-size:13px;color:var(--tinta2);margin:2px 0 8px;line-height:1.5}
.cfg-msg{font-size:13px;margin-top:8px;min-height:14px;line-height:1.5}
.cfg-msg.ok{color:color-mix(in srgb,var(--okV) 70%,var(--tinta))}.cfg-msg.err{color:color-mix(in srgb,var(--errV) 80%,var(--tinta))}
/* Meus apps: catálogo com interruptores */
.link{background:none;border:0;color:var(--acInk);font-weight:600;font-size:13.5px;cursor:pointer;padding:10px 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.link:hover{background:var(--acSup)}
.apps-cat{font-size:13px;font-weight:650;color:var(--tinta2);margin:16px 0 4px}
.apps-cat:first-child{margin-top:4px}
.sug-box .apps-row{display:flex;align-items:center;gap:12px;padding:7px 6px;margin:0;cursor:pointer;color:var(--tinta);font-size:14px;font-weight:400;border-radius:14px}
.sug-box .apps-row:hover{background:var(--sup2)}

.apps-row .k{--c:var(--ac);--t:#fff;width:38px;height:38px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:19px;color:var(--t);flex:0 0 auto}
.apps-row .t{flex:1;min-width:0}
.apps-row .t b{display:block;font-weight:600;font-size:14.5px}
.apps-row .t small{display:block;font-size:12.5px;color:var(--tinta2);margin-top:1px}
.sw{position:relative;width:46px;height:28px;flex:0 0 auto}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--sup3);transition:background-color .2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s var(--mola)}
.sw input:checked+span{background:var(--ac)}
.sw input:checked+span::after{transform:translateX(18px)}
.sw input:disabled+span{opacity:.45}
.sw input:focus-visible+span{box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 28%,transparent)}
.apps-tools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
.apps-tools .b{flex:0 0 auto;min-height:40px;padding:0 16px;font-size:13px}
.apps-vazio{grid-column:1/-1;text-align:center;color:var(--tinta2);padding:34px 16px;background:var(--sup);border:1px solid var(--fio);border-radius:var(--rG);font-size:14px;line-height:1.5;box-shadow:var(--sombraV)}
.apps-vazio .b{display:inline-flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;min-height:44px;padding:0 20px;border-radius:999px;background:var(--ac);color:var(--acTxt);border:0;font-weight:600;font-size:14px;cursor:pointer}
.aviso{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(20px + env(safe-area-inset-bottom));z-index:90;max-width:min(520px,calc(100vw - 32px));padding:12px 18px;border-radius:18px;
  background:var(--tinta);color:var(--sup);font-size:14px;line-height:1.45;box-shadow:var(--sombraM);animation:vvSobe .35s var(--suave) both}
@media(max-width:560px){
  .ghost .lbl{display:none}.ghost{width:44px;padding:0;justify-content:center}.ghost i{font-size:19px}
  .wrap{padding:0 16px}.wm{font-size:17px}.wm .mk{width:32px;height:32px;font-size:17px}.top-r{gap:6px}.install .lbl{display:none}.install{width:44px;padding:0}.usr button{width:44px;padding:0}#btnOut{display:none}
  .grid{grid-template-columns:repeat(4,1fr);gap:22px 6px;padding:0 12px}.app .ic{width:60px;height:60px;font-size:27px}.app .nm{font-size:11.5px}
  .hello{margin-bottom:28px}.hello h1{font-size:26px}main{padding-top:30px}.usr .who{display:none}
}

/* ---------- faixa do plano (sob a saudação) ---------- */
.faixa{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
.faixa:empty{display:none}
.fx{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--fioF);background:var(--sup);color:var(--tinta);font-weight:600;font-size:13.5px;text-decoration:none;cursor:pointer}
.fx i{font-size:17px}
.fx:hover{background:var(--acSup);color:var(--acInk)}
.fx.ok i{color:color-mix(in srgb,var(--okV) 75%,var(--tinta))}
.fx.pend{background:var(--avSup);border-color:transparent;color:color-mix(in srgb,var(--avV) 55%,var(--tinta))}
.fx.cta{background:var(--ac);border-color:var(--ac);color:var(--acTxt);box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 28%,transparent)}
.fx.cta:hover{filter:brightness(1.08);color:var(--acTxt);background:var(--ac)}
.fx.adm{border-color:var(--tinta);color:var(--tinta)}
.fx:focus-visible,.of-o:focus-visible,.inst-x:focus-visible,.sug-box .b:focus-visible,.sug-box a:focus-visible,.link:focus-visible{outline:3px solid var(--anel,var(--ac));outline-offset:2px}

/* ---------- Minha assinatura ---------- */
.cfg-sec.assin{background:var(--sup);border:1.5px solid var(--fioF)}
.cfg-sec h4[tabindex]{outline:none}
.as-txt{font-size:14px;color:var(--tinta2);line-height:1.5}
.as-st{border-radius:16px;background:var(--sup2);padding:12px 14px;margin-top:10px}
.as-st h5{font-size:15.5px;font-weight:700;margin:6px 0 0;color:var(--tinta)}
.as-st p{font-size:14px;color:var(--tinta2);margin-top:4px;line-height:1.5}
.as-st p b{color:var(--tinta)}
.as-st .sug-row{margin-top:10px}
.as-st > .b{margin-top:10px;width:100%;text-decoration:none}
.sel{display:inline-flex;align-items:center;font-size:12px;font-weight:700;letter-spacing:.02em;padding:3px 10px;border-radius:999px;background:var(--sup3);color:var(--tinta)}
.sel.ok{background:var(--okSup);color:color-mix(in srgb,var(--okV) 60%,var(--tinta))}
.sel.pend{background:var(--avSup);color:color-mix(in srgb,var(--avV) 50%,var(--tinta))}
.as-mini{font-size:12.5px!important;color:var(--tinta2);margin-top:10px;line-height:1.5}
.as-mini a{color:var(--acInk);font-weight:600}
.as-of{margin-top:16px}
.as-of > h5{font-size:15px;font-weight:700;margin-bottom:2px}
.as-of > h6.as-pub{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta2);margin:16px 0 0}
.of{margin-top:10px}
.of + .of{padding-top:12px;border-top:1px solid var(--fio)}
.of-h b{display:block;font-size:15px;font-weight:700}
.of-h small{display:block;font-size:13px;color:var(--tinta2);line-height:1.45;margin-top:1px}
.of-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
@media(max-width:430px){.of-g{grid-template-columns:1fr}}
.sug-box .of-o{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:12px 14px;border-radius:16px;border:1.5px solid var(--fioF);background:var(--sup);color:var(--tinta);cursor:pointer;min-height:44px;font:inherit}
.sug-box .of-o:hover{border-color:var(--ac);background:var(--acSup)}
.sug-box .of-o.dest{border-color:color-mix(in srgb,var(--ac) 55%,var(--fioF))}
.of-o .t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tinta2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.of-o .t em{font-style:normal;text-transform:none;letter-spacing:0;background:var(--okSup);color:color-mix(in srgb,var(--okV) 60%,var(--tinta));border-radius:999px;padding:1px 8px}
.of-o .v{font-size:20px;font-weight:750;letter-spacing:-.01em}
.of-o .v small{font-size:12.5px;font-weight:500;color:var(--tinta2)}
.of-o .pm{font-size:12.5px;font-weight:600;color:color-mix(in srgb,var(--okV) 60%,var(--tinta))}
.of-o .c{font-size:12.5px;color:var(--tinta2);line-height:1.4}
.of-o .cta{margin-top:6px;align-self:stretch;text-align:center;padding:9px 12px;border-radius:999px;background:var(--ac);color:var(--acTxt);font-weight:700;font-size:13.5px}
.of-o:not(.dest) .cta{background:var(--sup2);color:var(--tinta);border:1.5px solid var(--fioF)}
.of-sec{margin-top:4px;padding:10px 4px;min-height:44px;font-size:13px}
.as-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.as-links .b{flex:1 1 200px;text-decoration:none;font-size:13.5px}

/* ---------- confirmação de compra e volta do pagamento ---------- */
.sug-box h3[tabindex]{outline:none}
html[data-viva] body .sug-box :is(h3,h4)[tabindex]:focus{outline:none!important;box-shadow:none!important}
.cp-res{display:flex;flex-direction:column;gap:2px;border-radius:16px;background:var(--acSup);padding:14px 16px;margin:10px 0 8px}
.cp-res .t{font-size:13.5px;font-weight:700;color:var(--acInk)}
.cp-res .v{font-size:26px;font-weight:750;letter-spacing:-.02em;color:var(--tinta)}
.cp-res .v small{font-size:14px;font-weight:500;color:var(--tinta2)}
.cp-res .pm{font-size:13px;font-weight:600;color:var(--tinta2)}
.cp-aviso{background:var(--sup2);border-radius:12px;padding:10px 12px}
.sug-box .cp-ir{font-size:15.5px;min-height:50px}
.cp-fino{font-size:12.5px!important;margin-top:12px}
.sug-box .ret-ok .ti{background:var(--okSup);color:color-mix(in srgb,var(--okV) 65%,var(--tinta))}
.ret-big{font-size:17px;font-weight:650;color:var(--tinta);margin:4px 0 6px}
.ret-apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:12px 6px;margin:14px 0 4px}
.ret-apps .app .ic{width:52px;height:52px;font-size:24px}
.ret-apps .app .nm{font-size:12px}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--acSup);border-top-color:var(--ac);flex:0 0 auto;animation:giro .8s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}

/* ---------- instalar no celular ---------- */
#instCard{max-width:560px;margin:28px auto 0;padding:0 16px}
#instCard:empty{display:none}
.inst{border-radius:20px;background:var(--sup);border:1px solid var(--fio);padding:14px 16px;box-shadow:var(--sombraV);text-align:left}
.sug-box .inst{margin-top:16px;background:var(--sup2);border:0;box-shadow:none}
.inst-h{display:flex;align-items:center;gap:10px}
.inst-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--acSup);color:var(--acInk);font-size:19px;flex:0 0 auto}
.inst h4{flex:1;font-size:15px;font-weight:700;margin:0;display:block}
.inst-x{width:44px;height:44px;border-radius:50%;border:0;background:none;color:var(--tinta2);font-size:18px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;margin:-8px -10px -8px 0}
.inst-x:hover{background:var(--sup2);color:var(--tinta)}
.inst p{font-size:14px;color:var(--tinta2);margin-top:6px}
.inst-p{margin:8px 0 0 20px;font-size:14px;color:var(--tinta2);line-height:1.6}
.inst-p b{color:var(--tinta)}
.inst-p .ti{font-size:16px;vertical-align:-2px;color:var(--acInk)}
.inst-r{margin-top:10px}
.inst-r .b{min-width:150px}
#instCard .inst-r .b{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 20px;border-radius:999px;border:0;background:var(--ac);color:var(--acTxt);font-weight:600;font-size:14px;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.grid.anima>*,.aviso,.spin{animation:none!important}}
</style>

<body>
<header>
  <div class="wrap top">
    <span class="wm"><span class="mk" aria-hidden="true"><i class="ti ti-apps"></i></span><span>MedTech <b>Provas</b></span></span>
    <div class="top-r">
      <button class="ghost" id="btnApps" onclick="openMeusApps()" title="Escolher quais apps aparecem aqui" aria-label="Meus apps"><i class="ti ti-layout-grid-add" aria-hidden="true"></i><span class="lbl">Meus apps</span></button>
      <button class="ghost" id="btnSug" onclick="openSug()" aria-label="Sugestão"><i class="ti ti-bulb" aria-hidden="true"></i><span class="lbl">Sugestão</span></button>
      <button class="install" id="btnInstall" hidden aria-label="Instalar o app" title="Instalar o app"><i class="ti ti-download" aria-hidden="true"></i><span class="lbl">Instalar</span></button>
      <div class="usr" id="usr"></div>
    </div>
  </div>
</header>

<main>
  <div class="hello"><h1 id="hello">Bem-vindo</h1><div class="dt" id="issueDate"></div><div class="faixa" id="faixa"></div></div>
  <div class="grid" id="grid"></div>
  <div class="fine"><button class="link" onclick="openMeusApps()"><i class="ti ti-layout-grid-add" aria-hidden="true"></i> Escolher quais apps aparecem aqui</button></div>
  <div id="instCard"></div>
</main>

<footer>© 2026 <a href="index.html">MedTech</a> · <a href="privacidade.html">Privacidade</a> · <a href="termos.html">Termos</a></footer>

<script>
const BASE = 'https://medtechbr.com.br/';
/* Catálogo de TUDO que o MedTech oferece. O id é o mesmo do trocador de funções (_mtauth.js).
   O que aparece na página é a escolha do usuário (salva na conta, sincroniza entre aparelhos). */
const CATALOGO = [
  { id:'condutai',      nm:'CondutAI',         ic:'ti-stethoscope',      url:BASE+'condutai.html',         cat:'Referência clínica',   linha:'clinica' , c:'var(--c-azul)' },
  { id:'paliai',        nm:'PaliAI',           ic:'ti-heart-handshake',  url:BASE+'paliai.html',           cat:'Referência clínica',   linha:'clinica' , c:'var(--c-rosa)' },
  { id:'laudai',        nm:'LaudAI',           ic:'ti-report-medical',   url:BASE+'laudai.html',           cat:'Hospital e imagem',    linha:'clinica' , c:'var(--c-cobalto)' },
  { id:'plantaohub',    nm:'PlantãoHub',       ic:'ti-clock',            url:BASE+'plantaohub.html',       cat:'Rotina do médico',     linha:'clinica' , c:'#4D7C0F' },
  { id:'granae',        nm:'Granaê',           ic:'ti-wallet',           url:BASE+'granae.html',           cat:'Rotina do médico',     linha:'clinica' , c:'#7C4DE8' },
  { id:'clinicamed',    nm:'ClínicaMed',       ic:'ti-heartbeat',        url:BASE+'clinicamed/',           cat:'Prova de título',      linha:'provas', sub:'título de Clínica Médica (TECM) e acesso R+' , c:'var(--c-indigo)' },
  { id:'cirurgiamed',   nm:'CirurgiaMed',      ic:'ti-cut',              url:BASE+'cirurgiamed/',          cat:'Prova de título',      linha:'provas', sub:'título de Cirurgia Geral (CBC), R+ cirúrgico e concursos' , c:'#33479E' },
  { id:'trafegotitulo', nm:'TráfegoTítulo',    ic:'ti-car',              url:BASE+'trafego-titulo/',       cat:'Prova de título',      linha:'provas', sub:'título de Medicina do Tráfego' , c:'var(--c-teal)' },
  { id:'flashmed',      nm:'FlashMed',         ic:'ti-cards',            url:BASE+'flashmed/',         cat:'Residência e concursos', linha:'provas' , c:'var(--c-coral)' },
  /* farmácia (10/10/2026): público diferente; fora do PADRAO, aparece para quem escolhe ou compra */
  { id:'farmauti',      nm:'FarmaUTI',         ic:'ti-pill',             url:BASE+'farmauti/',             cat:'Farmácia',             linha:'provas', sub:'residência em Farmácia em Terapia Intensiva', c:'#4545D8' },
  { id:'enarefarmacia', nm:'Banca ENARE Farmácia', ic:'ti-vaccine-bottle',        url:BASE+'quiz-enare-farmacia/',  cat:'Farmácia',             linha:'provas', sub:'residência multiprofissional em Farmácia (ENARE)', c:'#0A3F3B' },
  { id:'sosfarmacia',   nm:'SOS Farmácia Comercial', ic:'ti-first-aid-kit', url:BASE+'sos-farmacia/',         cat:'Farmácia',             linha:'provas', sub:'farmácia comercial: MIP, Portaria 344, RDC 471, interações e POPs', c:'#C8373C' }
];
/* Linha deste portal. provas.html é GERADO deste arquivo por _gera_provas.py — editar aqui. */
const LINHA = 'provas';
const CATALOGO_LINHA = CATALOGO.filter(a => a.linha === LINHA);
const CATEGORIAS = LINHA === 'provas' ? ['Prova de título','Residência e concursos','Farmácia'] : ['Referência clínica','Hospital e imagem','Rotina do médico'];
/* Quem nunca escolheu vê o conjunto padrão da linha. */
const PADRAO = LINHA === 'provas'
  ? ['clinicamed','cirurgiamed','trafegotitulo','flashmed']
  : ['condutai','laudai','paliai','plantaohub','granae'];
const CACHE_APPS = 'mt.portal.apps.' + LINHA;   // lido também pelo trocador de funções (_mtauth.js), mesmo domínio
const CAMPO_SEL = LINHA === 'provas' ? 'appsProvas' : 'apps';   // no doc da conta, um campo por linha

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function fmtName(nm){ return /(AI|IA)$/.test(nm) ? esc(nm.slice(0,-2))+'<b>'+nm.slice(-2)+'</b>' : esc(nm); }
function dados(){ return (window.MT && MT._data && typeof MT._data==='object') ? MT._data : null; }
/* Contratação: se a conta tiver `contratados` (lista de ids), o catálogo só oferece esses.
   Sem o campo, tudo está disponível — é onde a cobrança se encaixa quando existir. */
function disponiveis(){
  const d = dados(); const c = d && Array.isArray(d.contratados) ? d.contratados : null;
  return (c ? CATALOGO_LINHA.filter(a => c.includes(a.id)) : CATALOGO_LINHA).concat(extrasDeEstudo());
}
/* MedTech App (10/10/2026): app de estudo que a conta pagou (ou recebeu liberação) também
   pode ser escolhido para a grade daqui, numa categoria própria. Só entra se a pessoa marcar
   em "Meus apps"; o portal Provas continua sendo a casa deles. Administração vê todos. */
const CAT_ESTUDO = 'Seus apps de estudo';
function extrasDeEstudo(){
  if (LINHA !== 'clinica' || !ACESSO || !ACESSO.mt || !window.MTAcesso) return [];
  const mt = ACESSO.mt, P = ACESSO.P, ag = Math.floor(Date.now() / 1000), ids = new Set();
  if (mt.adm) CATALOGO.forEach(a => { if (a.linha !== LINHA) ids.add(a.id); });
  Object.entries(mt.p || {}).forEach(([id, ate]) => { if (!(Number(ate) > ag)) return;
    MTAcesso.appsDoProduto(P, MTAcesso.produtoPorId(P, id)).forEach(x => ids.add(x)); });
  return CATALOGO.filter(a => a.linha !== LINHA && ids.has(a.id)).map(a => Object.assign({}, a, { cat: CAT_ESTUDO }));
}
function selecao(){
  const d = dados();
  let sel = (d && d[CAMPO_SEL] && Array.isArray(d[CAMPO_SEL].sel)) ? d[CAMPO_SEL].sel : null;
  if (!sel) { try { const c = JSON.parse(localStorage.getItem(CACHE_APPS)||'null'); if (Array.isArray(c)) sel = c; } catch(e){} }
  if (!sel) sel = PADRAO;
  /* apps da linha vêm da escolha da linha; apps de estudo só da escolha própria deles
     (campo separado): ids antigos de outra linha guardados na escolha não reaparecem */
  const daLinha = new Set(CATALOGO_LINHA.map(a => a.id));
  const ok = new Set(disponiveis().map(a=>a.id));
  return sel.filter(id => daLinha.has(id) && ok.has(id)).concat(selecaoEstudo().filter(id => ok.has(id)));
}
const CAMPO_SEL_ESTUDO = 'appsEstudo', CACHE_ESTUDO = 'mt.portal.apps.estudo';
function selecaoEstudo(){
  if (LINHA !== 'clinica') return [];
  const d = dados();
  let s = (d && d[CAMPO_SEL_ESTUDO] && Array.isArray(d[CAMPO_SEL_ESTUDO].sel)) ? d[CAMPO_SEL_ESTUDO].sel : null;
  if (!s) { try { const c = JSON.parse(localStorage.getItem(CACHE_ESTUDO)||'null'); if (Array.isArray(c)) s = c; } catch(e){} }
  return s || [];
}
/* acesso por produto: ACESSO = {P, venda, mt} vindo do _mtacesso.js (null até carregar) */
let ACESSO = null;
function travado(id){
  if (!ACESSO || !ACESSO.venda || ACESSO.falha || !window.MTAcesso) return null;
  const r = MTAcesso.liberado(ACESSO.P, ACESSO.mt, id);
  return r.ok ? null : r;
}
function appItem(a){
  const tv = travado(a.id);
  return `<a class="app${tv?' trav':''}" href="${a.url}" data-id="${esc(a.id)}" style="${corApp(a)}"${tv?' aria-label="'+esc(a.nm)+' (fora do seu plano)"':''}>
    <span class="ic"><i class="ti ${a.ic}" aria-hidden="true"></i>${tv?'<span class="lk"><i class="ti ti-lock" aria-hidden="true"></i></span>':''}</span>
    <span class="nm">${fmtName(a.nm)}</span>
  </a>`;
}
/* conta de administração: a Administração entra como o primeiro app da grade (abre na mesma janela do app instalado) */
function itemAdmin(){
  const u = window.MT && MT.user;
  if (!u || u.demo || !ACESSO || !ACESSO.mt || !ACESSO.mt.adm) return '';
  return `<a class="app" href="admin.html" data-id="admin" style="--c:var(--tinta);--t:var(--papel)">
    <span class="ic"><i class="ti ti-shield-cog" aria-hidden="true"></i></span>
    <span class="nm">Administração</span>
  </a>`;
}
/* cor do app: círculo na cor dele, com o ícone em branco (ou escuro, no âmbar) */
function corApp(a){ return a.c ? `--c:${a.c};--t:${a.t||'#fff'}` : ''; }
let _gradeAnimada=false;
/* apps cobertos por compra vigente nesta linha (não conta admin nem cortesia "*") */
function comprados(){
  if (!ACESSO || !ACESSO.venda || !ACESSO.mt || !window.MTAcesso) return [];
  const P = ACESSO.P, ag = Math.floor(Date.now() / 1000), ids = new Set(CATALOGO_LINHA.map(a => a.id)), out = new Set();
  Object.entries(ACESSO.mt.p || {}).forEach(([id, ate]) => { if (!(Number(ate) > ag)) return;
    MTAcesso.appsDoProduto(P, MTAcesso.produtoPorId(P, id)).forEach(a => { if (ids.has(a)) out.add(a); }); });
  return [...out];
}
const ehFarmacia = id => (CATALOGO.find(a => a.id === id) || {}).cat === 'Farmácia';
/* Públicos não se misturam: quem comprou só app de farmácia e nunca escolheu os apps vê só os dele. */
function soFarmacia(){
  const d = dados(), c = comprados();
  return !!c.length && c.every(ehFarmacia) && !(ACESSO.mt && ACESSO.mt.adm) && !(d && d[CAMPO_SEL] && Array.isArray(d[CAMPO_SEL].sel));
}
function renderGrid(){
  const sel = soFarmacia() ? new Set(comprados()) : new Set(selecao());
  /* app comprado entra sozinho só enquanto a pessoa nunca escolheu; depois de escolher em
     "Meus apps", aparece exatamente o que ela marcou (pedido do Matheus, 10/10/2026) */
  const d0 = dados(), escolheu = !!(d0 && d0[CAMPO_SEL] && Array.isArray(d0[CAMPO_SEL].sel));
  if (!escolheu) comprados().forEach(id => sel.add(id));
  const lista = disponiveis().filter(a => sel.has(a.id));
  const g = document.getElementById('grid');
  g.innerHTML = itemAdmin() + (lista.length ? lista.map(appItem).join('')
    : `<div class="apps-vazio">Nenhum app na sua página ainda.<br><button class="b" onclick="openMeusApps()"><i class="ti ti-layout-grid-add" aria-hidden="true"></i> Escolher apps</button></div>`);
  /* de onde o app foi aberto: os apps de estudo mostram "Início" para voltar (/_mtvoltar.js) */
  g.onclick = e => { if (e.target.closest && e.target.closest('a.app')) { try { sessionStorage.setItem('mt.voltar', location.pathname); } catch(_){} } };
  /* entrada escalonada só na primeira pintura (os re-render da nuvem não piscam) */
  if (!_gradeAnimada && lista.length && !matchMedia('(prefers-reduced-motion: reduce)').matches) { _gradeAnimada = true; [...g.children].forEach((c,k)=>c.style.setProperty('--i',k)); g.classList.add('anima'); }
  try { localStorage.setItem(CACHE_APPS, JSON.stringify([...sel])); } catch(e){}
}
function openMeusApps(){
  const sel = new Set(selecao());
  const disp = disponiveis();
  const wrap = document.createElement('div'); wrap.className='sug-modal'; wrap.id='appsModal';
  const linhas = CATEGORIAS.concat(LINHA === 'clinica' ? [CAT_ESTUDO] : []).map(cat => {
    const itens = disp.filter(a => a.cat===cat);
    if (!itens.length) return '';
    return `<div class="apps-cat">${esc(cat)}</div>` + itens.map(a => `
      <label class="apps-row">
        <span class="k" style="${corApp(a)}"><i class="ti ${a.ic}" aria-hidden="true"></i></span>
        <span class="t"><b>${esc(a.nm)}</b>${a.sub?`<small>${esc(a.sub)}</small>`:''}</span>
        <span class="sw"><input type="checkbox" data-id="${esc(a.id)}" ${sel.has(a.id)?'checked':''}><span></span></span>
      </label>`).join('');
  }).join('');
  wrap.innerHTML = `<div class="sug-box">
    <h3><i class="ti ti-layout-grid-add" aria-hidden="true"></i>Meus apps</h3>
    <p class="sub">Escolha o que aparece na sua página. Vale em todos os seus aparelhos.</p>
    <div class="apps-tools"><button class="b cancel" onclick="marcarApps(true)">Todos</button><button class="b cancel" onclick="marcarApps(false)">Nenhum</button><button class="b cancel" onclick="marcarApps('padrao')">Padrão</button></div>
    <div id="appsLista">${linhas}</div>
    <div class="sug-row"><button class="b ok" onclick="salvarApps()">Salvar</button><button class="b cancel" onclick="closeApps()">Cancelar</button></div>
    <div class="cfg-msg" id="appsMsg"></div>
  </div>`;
  wrap.onclick = e => { if (e.target===wrap) closeApps(); };
  document.body.appendChild(wrap);
}
function marcarApps(modo){
  document.querySelectorAll('#appsLista input[type=checkbox]').forEach(i => {
    i.checked = modo===true ? true : modo===false ? false : PADRAO.includes(i.dataset.id);
  });
}
function closeApps(){ const m=document.getElementById('appsModal'); if (m) m.remove(); }
async function salvarApps(){
  const todos = [...document.querySelectorAll('#appsLista input[type=checkbox]:checked')].map(i => i.dataset.id);
  const daLinha = new Set(CATALOGO_LINHA.map(a => a.id));
  const sel = todos.filter(id => daLinha.has(id)), estudo = todos.filter(id => !daLinha.has(id));
  const msg = document.getElementById('appsMsg'); msg.className='cfg-msg'; msg.textContent='Salvando';
  try { localStorage.setItem(CACHE_APPS, JSON.stringify(todos)); if (LINHA === 'clinica') localStorage.setItem(CACHE_ESTUDO, JSON.stringify(estudo)); } catch(e){}
  try {
    const base = dados() || {};
    const extra = LINHA === 'clinica' ? { [CAMPO_SEL_ESTUDO]: { sel: estudo, v:1, updatedAt: Date.now() } } : {};
    if (window.MT && MT.save) await MT.save(Object.assign({}, base, { [CAMPO_SEL]: { sel, v:1, updatedAt: Date.now() } }, extra));
    closeApps(); renderGrid();
  } catch(e) { msg.className='cfg-msg err'; msg.textContent='Não foi possível salvar: '+(e.message||e); }
}
renderGrid();
document.getElementById('issueDate').textContent=(s=>s.charAt(0).toUpperCase()+s.slice(1))(new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}));

/* ===== Sugestões de funções (vão por e-mail para a equipe MedTech) ===== */
const SUG_EMAIL = 'contato@medtechbr.com.br';
function openSug(){
  const u = window.MT && window.MT.user;
  const opts = ['Geral / portal'].concat(CATALOGO_LINHA.map(a=>a.nm)).map(n=>`<option>${esc(n)}</option>`).join('');
  const wrap = document.createElement('div'); wrap.className='sug-modal'; wrap.id='sugModal';
  wrap.innerHTML = `<div class="sug-box">
    <h3><i class="ti ti-bulb" aria-hidden="true"></i>Sugerir uma função</h3>
    <p class="sub">Conte o que você gostaria de ver nos apps MedTech. Sua ideia vai direto para a equipe.</p>
    <label for="sugApp">App</label><select id="sugApp">${opts}</select>
    <label for="sugTxt">Sua sugestão</label><textarea id="sugTxt" placeholder="Ex.: no CondutAI, poder salvar condutas por especialidade"></textarea>
    <label for="sugContato">Seu contato (opcional)</label><input id="sugContato" value="${esc((u&&u.email)||'')}" placeholder="e-mail ou WhatsApp para retorno">
    <div class="sug-row"><button class="b ok" onclick="enviarSug()">Enviar sugestão</button><button class="b cancel" onclick="closeSug()">Cancelar</button></div>
  </div>`;
  wrap.onclick = e => { if(e.target===wrap) closeSug(); };
  document.body.appendChild(wrap);
  setTimeout(()=>{const t=document.getElementById('sugTxt'); if(t) t.focus();},50);
}
function closeSug(){ const m=document.getElementById('sugModal'); if(m) m.remove(); }
function enviarSug(){
  const app = document.getElementById('sugApp').value;
  const txt = document.getElementById('sugTxt').value.trim();
  const contato = document.getElementById('sugContato').value.trim();
  if(!txt){ alert('Escreva sua sugestão antes de enviar.'); return; }
  const u = window.MT && window.MT.user;
  const subject = 'Sugestão MedTech — ' + app;
  const body = 'App: '+app+'\n\nSugestão:\n'+txt+'\n\nContato: '+(contato||'(não informado)')+'\nUsuário logado: '+((u&&u.email)||'(não logado)');
  window.location.href = 'mailto:'+SUG_EMAIL+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  closeSug();
}

/* ===== Configurações (perfil, senha, assinatura) ===== */
/* área do cliente do meio de pagamento: campo area_cliente do /planos.json */
const SUPORTE_EMAIL = 'contato@medtechbr.com.br';
function cfgVal(id){ const e = document.getElementById(id); return e ? e.value.trim() : ''; }
function openCfg(){
  const u = window.MT && window.MT.user;
  if (!u || u.demo){ alert('Entre na sua conta MedTech para acessar as configurações.'); return; }
  const perfil = (window.MT && MT._data && MT._data.perfil) || {};
  closeCfg();
  const wrap = document.createElement('div'); wrap.className='sug-modal'; wrap.id='cfgModal'; wrap.dataset.fechavel='1';
  wrap.innerHTML = `<div class="sug-box" role="dialog" aria-modal="true" aria-labelledby="cfgTit">
    <h3 id="cfgTit"><i class="ti ti-settings" aria-hidden="true"></i>Configurações</h3>
    <div class="cfg-sec assin" id="secAssin">
      <h4 id="assinTit" tabindex="-1"><i class="ti ti-credit-card" aria-hidden="true"></i>Minha assinatura</h4>
      <div id="cfgAssin"></div>
      <div class="cfg-msg" id="cfgPagMsg" role="status"></div>
    </div>
    <div class="cfg-sec">
      <h4><i class="ti ti-user" aria-hidden="true"></i>Perfil e cadastro</h4>
      <div class="desc">Seu nome aparece em todos os apps MedTech.</div>
      <label for="cfgNome">Nome</label><input id="cfgNome" value="${esc(u.displayName||'')}" placeholder="Seu nome">
      <label for="cfgEmail">E-mail (login)</label><input id="cfgEmail" value="${esc(u.email||'')}" disabled style="opacity:.65">
      <div class="cfg-cpf" id="cfgCpf" aria-live="polite"><span class="lbl">CPF</span><span class="as-txt">Consultando…</span></div>
      <label for="cfgFone">Telefone / WhatsApp</label><input id="cfgFone" value="${esc(perfil.fone||'')}" placeholder="(11) 99999-9999">
      <label for="cfgCrm">CRM</label><input id="cfgCrm" value="${esc(perfil.crm||'')}" placeholder="Ex.: 123456/SP">
      <label for="cfgEsp">Especialidade</label><input id="cfgEsp" value="${esc(perfil.esp||'')}" placeholder="Ex.: Clínica Médica">
      <label for="cfgInst">Instituição</label><input id="cfgInst" value="${esc(perfil.inst||'')}" placeholder="Hospital / faculdade">
      <div class="sug-row"><button class="b ok" onclick="salvarPerfil()">Salvar perfil</button></div>
      <div class="cfg-msg" id="cfgPerfilMsg"></div>
    </div>
    <div class="cfg-sec">
      <h4><i class="ti ti-lock" aria-hidden="true"></i>Senha</h4>
      <div class="desc">Defina uma nova senha (mín. 6 caracteres) ou receba um link de redefinição por e-mail.</div>
      <label for="cfgPass1">Nova senha</label><input id="cfgPass1" type="password" placeholder="Nova senha" autocomplete="new-password">
      <label for="cfgPass2">Confirmar nova senha</label><input id="cfgPass2" type="password" placeholder="Repita a nova senha" autocomplete="new-password">
      <div class="sug-row"><button class="b ok" onclick="alterarSenha()">Alterar senha</button><button class="b cancel" onclick="enviarResetSenha()">Link por e-mail</button></div>
      <div class="cfg-msg" id="cfgSenhaMsg"></div>
    </div>
    <div class="cfg-sec">
      <h4><i class="ti ti-shield-lock" aria-hidden="true"></i>Seus dados</h4>
      <div class="desc">Baixe uma cópia do que a sua conta guarda na nuvem MedTech ou peça a exclusão da conta. Veja a <a href="privacidade.html#direitos">Política de Privacidade</a>.</div>
      <div class="sug-row dados"><button class="b ok" id="btBaixarDados" onclick="baixarMeusDados()"><i class="ti ti-download" aria-hidden="true"></i> Baixar meus dados</button><button class="b perigo" onclick="abrirExcluirConta()"><i class="ti ti-trash" aria-hidden="true"></i> Excluir minha conta</button></div>
      <div class="cfg-msg" id="cfgDadosMsg" role="status"></div>
    </div>
    <div class="sug-row"><button class="b cancel" onclick="window.MT.signOut()"><i class="ti ti-logout" aria-hidden="true"></i> Sair da conta</button><button class="b cancel" onclick="closeCfg()">Fechar</button></div>
  </div>`;
  wrap.onclick = e => { if (e.target===wrap) closeCfg(); };
  document.body.appendChild(wrap);
  preencheAssinatura();
  preencheCpf();
}
/* CPF da conta (10/10/2026): vem do servidor já mascarado (mtCpf {ver}); nunca fica no aparelho */
async function preencheCpf(){
  const el = document.getElementById('cfgCpf'); if (!el || !window.MTAcesso || !MT.user) return;
  const lin = h => { el.innerHTML = '<span class="lbl">CPF</span>' + h; };
  try {
    const s = await MTAcesso.chamar('mtCpf', { ver: true }, MT.user);

  'clinicamed_coord','cirurgiamed','cirurgiamed_resumo','trafego-titulo','radio-titulo','farmauti','enare-farmacia'];

function limpaFs(v){

  if (typeof v.toDate === 'function') { try { return v.toDate().toISOString(); } catch(e) { return String(v); } }

async function coletarMeusDados(){
  const u = window.MT && MT.user, fb = window.MT && MT._fb;
  if (!u || u.demo || !fb || !fb.db || !fb.F) throw new Error('Entre na sua conta MedTech para baixar seus dados.');
  const { db, F } = fb, uid = u.uid;
  const md = u.metadata || {};
  const out = {
    formato: 'medtech-meus-dados', versao: 1, geradoEm: new Date().toISOString(),
    conta: { uid, email: u.email || null, nome: u.displayName || null, emailVerificado: !!u.emailVerified,
      criadaEm: md.creationTime || null, ultimoAcesso: md.lastSignInTime || null,
      provedores: (u.providerData || []).map(p => p && p.providerId).filter(Boolean) },
    perfil: null, registroDaConta: null, apps: {}, naoLidos: []
  };
  const falha = (onde, e) => out.naoLidos.push({ onde, erro: (e && (e.code || e.message)) || String(e) });
  const tarefas = [];
  tarefas.push((async () => { try { const s = await F.getDoc(F.doc(db, 'users', uid)); if (s.exists()) out.registroDaConta = limpaFs(s.data()); } catch(e) { falha('users/'+uid, e); } })());

    try { const s = await F.getDoc(F.doc(db, 'users', uid, 'apps', id)); if (s.exists()) out.apps[id] = Object.assign(out.apps[id] || {}, docDoApp(s.data())); }
    catch(e) { falha('apps/'+id, e); }

  MEUS_DADOS_SYNC.forEach(id => tarefas.push((async () => {
    try {
      const q = await F.getDocs(F.collection(db, 'users', uid, 'apps', id, 'sync'));
      if (!q.empty) { const itens = {}; q.forEach(d => { itens[d.id] = limpaFs(d.data()); }); out.apps[id] = Object.assign(out.apps[id] || {}, { sync: itens }); }
    } catch(e) { falha('apps/'+id+'/sync', e); }
  })()));
  await Promise.all(tarefas);
  const ord = {}; Object.keys(out.apps).sort().forEach(k => { ord[k] = out.apps[k]; }); out.apps = ord;

async function abrirCompra(op, bt, msgEl){
  if (!op) return;
  if (bt) bt.disabled = true;
  const diz = (t, err) => { if (msgEl) { msgEl.className = 'cfg-msg' + (err ? ' err' : ''); msgEl.textContent = t; } else if (t) aviso(t); };
  const cartao = MTAcesso.ehCartao && MTAcesso.ehCartao(op);
  diz(cartao ? 'Abrindo o formulário do cartão…' : op.modo === 'link' ? 'Abrindo o Mercado Pago para você assinar…' : 'Abrindo o pagamento seguro do Mercado Pago…');
  try {
    const res = await MTAcesso.comprar(op, MT.user);
    if (!res || typeof res !== 'object') return;              // redirecionou ao Mercado Pago
    if (bt) bt.disabled = false;
    if (res.cancelado) { diz(''); return; }
    ACESSO.mt = res.mt || await MTAcesso.lerMt(MT.user, true).catch(() => ACESSO.mt);
    const doModal = !!(msgEl && msgEl.closest('#cpModal'));
    ASSIN_MP = null; document.getElementById('cpModal')?.remove();

    const m = doModal ? null : (msgEl || document.getElementById('cfgPagMsg'));
    if (m && document.body.contains(m)) { m.className = 'cfg-msg ok'; m.textContent = t; } else aviso(t);
  }

}

/* ---------- volta do Mercado Pago: ?pago=1|0 + status/collection_status, payment_id, preapproval_id ---------- */
function lerRefMP(s){ const p = String(s || '').split('|'); return p.length === 5 && p[0] === 'mt1' ? { produto: p[2], periodo: p[3] } : null; }
async function chegadaPagamento(){
  if (!VOLTA_PAG || chegadaPagamento.feito) return;
  chegadaPagamento.feito = true;
  const q = Q0, st = (q.get('collection_status') || q.get('status') || '').toLowerCase();
  history.replaceState(null, '', location.pathname);
  if (!ACESSO || !ACESSO.venda || !MT.user) return;
  if (q.get('via') === 'plano') { chegadaPlano(q); return; }
  const P = ACESSO.P, ref = lerRefMP(q.get('external_reference'));
  const antes = (() => { const a = lsLer('mt.pag.antes'); return a && Date.now() - (a.em || 0) < 3 * 86400000 ? a : null; })();
  const produto = (ref && ref.produto) || (antes && antes.produto) || '';
  const periodo = (ref && ref.periodo) || (antes && antes.periodo) || '';
  const prod = MTAcesso.produtoPorId(P, produto);
  const nome = prod ? prod.nome : 'seu plano';
  const tentar = prod ? MTAcesso.opcoes(P, prod).find(o => o.periodo === periodo && (o.modo || '') === ((antes && antes.produto === produto && antes.modo) || '')) : null;
  if (VOLTA_PAG === '0' || ['rejected', 'cancelled', 'null', 'failure'].includes(st)) { telaNaoConcluido(nome, tentar); return; }
  if (['pending', 'in_process', 'in_mediation'].includes(st)) {
    if (produto) lsGravar('mt.pag.pendente', { produto, periodo, em: Date.now(), ate: Number(((ACESSO.mt || {}).p || {})[produto] || 0), tipo: (q.get('payment_type') || '').toLowerCase() });
    renderFaixa(); telaPendente(nome, (q.get('payment_type') || '').toLowerCase());
    return;
  }
  /* aprovado (ou assinatura mensal, que volta só com preapproval_id): o webhook libera em segundos */
  const base = (antes && antes.p) || {};
  const mudou = mt => { const ps = (mt && mt.p) || {}; return produto ? Number(ps[produto] || 0) > Math.max(Number(base[produto] || 0), agoraS()) : Object.entries(ps).some(([id, a]) => a > Math.max(Number(base[id] || 0), agoraS())); };
  const terminar = mt => { ACESSO.mt = mt; lsGravar('mt.pag.antes', null); lsGravar('mt.pag.pendente', null); ASSIN_MP = null; renderGrid(); preencheAssinatura(); telaAprovado(prod, mt); };
  if (mudou(ACESSO.mt)) { terminar(ACESSO.mt); return; }
  const w = modal('retModal', `<h3 id="retModal-t" tabindex="-1"><span class="spin" aria-hidden="true"></span>Confirmando o pagamento</h3>
    <p class="sub" role="status">Recebemos a sua volta do Mercado Pago. Estamos liberando o acesso ao ${esc(nome)}. Leva alguns segundos.</p>`, { fechavel: false });
  const pausas = [1500, 2500, 3000, 3000, 4000, 4000, 5000, 5000, 5000, 6000];   // ~40 s
  for (const ms of pausas) {
    await new Promise(r => setTimeout(r, ms));
    if (!document.body.contains(w)) break;
    try { const mt = await MTAcesso.lerMt(MT.user, true); if (mudou(mt)) { terminar(mt); return; } } catch(e) {}
  }
  if (!document.body.contains(w)) return;
  const w2 = modal('retModal', `<h3 id="retModal-t" tabindex="-1"><i class="ti ti-clock-hour-4" aria-hidden="true"></i>Ainda confirmando</h3>
    <p class="sub">Ainda não recebemos a confirmação do Mercado Pago. Se você concluiu o pagamento, o acesso libera sozinho em alguns minutos. Se não concluiu, nada foi cobrado.</p>
    <div class="sug-row"><button type="button" class="b ok" id="retDeNovo"><i class="ti ti-refresh" aria-hidden="true"></i>Conferir de novo</button>${tentar ? '<button type="button" class="b cancel" id="retTentar">Tentar pagar de novo</button>' : ''}</div>
    <div class="cfg-msg" id="retMsg" role="status"></div>
    <p class="sub">Se não liberar em 1 hora, escreva para <a href="mailto:${SUPORTE_EMAIL}?subject=${encodeURIComponent('Pagamento sem liberação')}">${SUPORTE_EMAIL}</a>.</p>
    <div class="sug-row"><button type="button" class="b cancel" data-fecha>Fechar</button></div>`);
  w2.querySelector('#retDeNovo').onclick = async e => {
    const m = w2.querySelector('#retMsg'); e.currentTarget.disabled = true; m.className = 'cfg-msg'; m.textContent = 'Conferindo…';
    try { const mt = await MTAcesso.lerMt(MT.user, true); if (mudou(mt)) { terminar(mt); return; } m.textContent = 'Ainda não chegou. Tente de novo em um minuto.'; }
    catch(err) { m.className = 'cfg-msg err'; m.textContent = 'Não foi possível conferir agora.'; }
    e.currentTarget.disabled = false;
  };
  const bt = w2.querySelector('#retTentar'); if (bt) bt.onclick = e => abrirCompra(tentar, e.currentTarget, w2.querySelector('#retMsg'));
}
/* ---------- volta do "Assinar pelo Mercado Pago" (link do plano) ----------
   ?pago=1&via=plano&produto=<id>&preapproval_id=<id da assinatura no MP>
   O link do plano não leva a conta MedTech: o portal liga a assinatura à conta
   logada (mpCheckout {acao:'vincular'}). O endereço já foi limpo acima. */
const ERRO_DE_REGRA = ['PERMISSION_DENIED', 'FAILED_PRECONDITION', 'INVALID_ARGUMENT', 'UNAUTHENTICATED'];
const regraDe = e => ERRO_DE_REGRA.includes(String((e && e.status) || '').toUpperCase());

  lsGravar('mt.pag.plano', null); lsGravar('mt.pag.antes', null);
  ACESSO.mt = await MTAcesso.lerMt(MT.user, true).catch(() => ACESSO.mt);
  ASSIN_MP = null; renderGrid(); preencheAssinatura();
  return true;
}
async function chegadaPlano(q){
  const P = ACESSO.P, produto = q.get('produto') || '';
  const pre = (q.get('preapproval_id') || q.get('preapproval-id') || '').trim();
  const prod = MTAcesso.produtoPorId(P, produto), nome = prod ? prod.nome : 'seu plano';
  lsGravar('mt.pag.plano', { preapproval: pre, produto, em: Date.now() });
  const w = modal('retModal', `<h3 id="retModal-t" tabindex="-1"><span class="spin" aria-hidden="true"></span>Estamos confirmando com o Mercado Pago…</h3>
    <p class="sub" role="status">Recebemos a sua volta. Estamos ligando a assinatura do ${esc(nome)} à sua conta MedTech. Leva alguns segundos.</p>`, { fechavel: false });
  const pausas = [0, 2000, 3000, 4000, 5000, 6000, 8000];   // ~28 s
  for (const ms of pausas) {
    if (ms) await new Promise(r => setTimeout(r, ms));
    if (!document.body.contains(w)) return;
    try { if (await confirmarPlano(pre, produto)) { telaAprovado(prod, ACESSO.mt, { plano: true }); return; } }
    catch(e) { if (regraDe(e)) { lsGravar('mt.pag.plano', null); telaPlanoErro(nome, e.message); return; } }
  }
  if (!document.body.contains(w)) return;
  const w2 = modal('retModal', `<h3 id="retModal-t" tabindex="-1"><i class="ti ti-clock-hour-4" aria-hidden="true"></i>Ainda confirmando</h3>
    <p class="sub">O Mercado Pago ainda não confirmou a assinatura do ${esc(nome)}. Se você concluiu, ela é ligada à sua conta sozinha em alguns minutos. Se não concluiu, nada foi cobrado.</p>
    <div class="sug-row"><button type="button" class="b ok" id="retDeNovo"><i class="ti ti-refresh" aria-hidden="true"></i>Conferir de novo</button></div>
    <div class="cfg-msg" id="retMsg" role="status"></div>
    <p class="sub">Se não liberar em 1 hora, escreva para <a href="mailto:${SUPORTE_EMAIL}?subject=${encodeURIComponent('Assinatura pelo Mercado Pago sem liberação')}">${SUPORTE_EMAIL}</a>.</p>
    <div class="sug-row"><button type="button" class="b cancel" data-fecha>Fechar</button></div>`);
  w2.querySelector('#retDeNovo').onclick = async e => {
    const m = w2.querySelector('#retMsg'), b = e.currentTarget; b.disabled = true; m.className = 'cfg-msg'; m.textContent = 'Conferindo…';
    try { if (await confirmarPlano(pre, produto)) { telaAprovado(prod, ACESSO.mt, { plano: true }); return; } m.textContent = 'Ainda não chegou. Tente de novo em um minuto.'; }
    catch(err) { if (regraDe(err)) { lsGravar('mt.pag.plano', null); telaPlanoErro(nome, err.message); return; } m.className = 'cfg-msg err'; m.textContent = 'Não foi possível conferir agora.'; }
    b.disabled = false;
  };
}

    <p class="sub">Conta MedTech: <b>${esc(MT.user.email || '')}</b>. Se precisar, escreva para <a href="mailto:${SUPORTE_EMAIL}?subject=${encodeURIComponent('Assinatura pelo Mercado Pago')}">${SUPORTE_EMAIL}</a>.</p>

}
/* voltou do Mercado Pago mas a ligação não fechou (aba fechada, rede): tenta de novo em silêncio por 2 dias */
async function retomarPlano(){
  if (VOLTA_PAG || retomarPlano.feito || !ACESSO || !ACESSO.venda || !MT.user) return;
  retomarPlano.feito = true;
  const pd = lsLer('mt.pag.plano'); if (!pd) return;
  if (Date.now() - (pd.em || 0) > 2 * 86400000) { lsGravar('mt.pag.plano', null); return; }
  try { if (await confirmarPlano(pd.preapproval || '', pd.produto || '')) aviso('Assinatura de ' + nomeProd(ACESSO.P, pd.produto) + ' confirmada. Ela renova sozinha todo mês.'); }
  catch(e) { if (regraDe(e)) lsGravar('mt.pag.plano', null); }
}
function telaAprovado(prod, mt, opts){
  const ate = prod ? Number(((mt && mt.p) || {})[prod.id] || 0) : 0;
  const apps = prod ? MTAcesso.appsDoProduto(ACESSO.P, prod) : [];
  const unicoApp = apps.length === 1 ? CATALOGO.find(a => a.id === apps[0]) : null;
  const atalhos = apps.length > 1 ? `<div class="ret-apps">${apps.map(id => CATALOGO.find(a => a.id === id)).filter(Boolean).map(a => `<a class="app" href="${a.url}" style="${corApp(a)}"><span class="ic"><i class="ti ${a.ic}" aria-hidden="true"></i></span><span class="nm">${fmtName(a.nm)}</span></a>`).join('')}</div>` : '';
  const plano = !!(opts && opts.plano);
  const w = modal('retModal', `<h3 id="retModal-t" tabindex="-1" class="ret-ok"><i class="ti ti-circle-check" aria-hidden="true"></i>${plano ? 'Assinatura confirmada' : 'Pagamento aprovado'}</h3>
    <p class="ret-big">Seu acesso está liberado.</p>
    <p class="sub">${plano ? (prod ? 'A assinatura mensal do ' + esc(prod.nome) + ' renova sozinha todo mês pela sua conta do Mercado Pago. ' : '') + 'A cobrança é confirmada em instantes e o recibo chega no seu e-mail. Para cancelar, use Minha assinatura.'
      : (prod ? esc(prod.nome) + (ate ? ' · válido até ' + dataBR(ate) : '') + '. ' : '') + 'O recibo do Mercado Pago chega no seu e-mail.'}</p>
    ${atalhos}
    <div class="sug-row">${unicoApp ? `<a class="b ok" href="${unicoApp.url}">Abrir o ${esc(unicoApp.nm)}</a>` : '<button type="button" class="b ok" data-fecha>Abrir os apps</button>'}</div>
    ${htmlInstalar('ret')}`);
  ligaInstalar(w);
}
function telaPendente(nome, tipo){

  modal('retModal', `<h3 id="retModal-t" tabindex="-1"><i class="ti ti-hourglass" aria-hidden="true"></i>Recebemos o pedido</h3>
    <p class="ret-big">${esc(nome)}: pagamento em análise.</p>
    <p class="sub">Assim que o pagamento compensar (boleto: até 3 dias úteis${boleto ? '' : '; Pix: alguns minutos'}), o acesso libera sozinho e você recebe o recibo do Mercado Pago.</p>

    <div class="sug-row"><button type="button" class="b ok" data-fecha>Entendi</button><a class="b cancel" href="${RECIBOS_URL}" target="_blank" rel="noopener">Ver no Mercado Pago</a></div>`);

function telaNaoConcluido(nome, tentar){
  const w = modal('retModal', `<h3 id="retModal-t" tabindex="-1"><i class="ti ti-alert-circle" aria-hidden="true"></i>O pagamento não foi concluído</h3>

    <div class="sug-row">${tentar ? '<button type="button" class="b ok" id="retTentar">Tentar de novo</button>' : ''}<button type="button" class="b ${tentar ? 'cancel' : 'ok'}" id="retOutro">Escolher outro meio</button></div>
    <div class="cfg-msg" id="retMsg" role="status"></div>
    <div class="sug-row"><button type="button" class="b cancel" data-fecha>Fechar</button></div>`);
  const bt = w.querySelector('#retTentar'); if (bt) bt.onclick = e => abrirCompra(tentar, e.currentTarget, w.querySelector('#retMsg'));
  w.querySelector('#retOutro').onclick = () => { w.remove(); openAssinatura(); };
}

/* ---------- modal acessível: um por vez, foco no título, Tab preso, Esc fecha (se fechável) ---------- */
function modal(id, inner, opts){
  opts = opts || {};
  document.querySelectorAll('.sug-modal').forEach(m => m.remove());
  const w = document.createElement('div'); w.className = 'sug-modal'; w.id = id;
  w.innerHTML = `<div class="sug-box" role="dialog" aria-modal="true" aria-labelledby="${id}-t">${inner}</div>`;
  if (opts.fechavel !== false) { w.dataset.fechavel = '1'; w.onclick = e => { if (e.target === w || e.target.closest('[data-fecha]')) w.remove(); }; }
  document.body.appendChild(w);
  setTimeout(() => { const h = w.querySelector('h3'); if (h) h.focus({ preventScroll: true }); }, 30);
  return w;
}
document.addEventListener('keydown', e => {
  const m = [...document.querySelectorAll('.sug-modal')].pop(); if (!m) return;
  if (e.key === 'Escape' && m.dataset.fechavel) { m.remove(); return; }
  if (e.key !== 'Tab') return;
  const f = [...m.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea')].filter(x => x.offsetParent !== null);
  if (!f.length) return;
  if (!m.contains(document.activeElement)) { e.preventDefault(); f[0].focus(); return; }
  if (e.shiftKey && (document.activeElement === f[0] || document.activeElement.tagName === 'H3')) { e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
});

/* ---------- instalar no celular ----------
   Android/Chrome: usa o beforeinstallprompt (botão Instalar). iPhone/iPad: passos do Safari.
   Some se já estiver instalado (display-mode standalone) ou se a pessoa dispensar. */
let deferredPrompt = null;
const instalado = () => { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch(e) { return false; } };
const ehIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const ehCelular = () => ehIOS() || /Android|Mobi/i.test(navigator.userAgent);
function htmlInstalar(onde){
  if (instalado() || lsLer('mt.instalar.dispensado')) return '';
  const nome = (window.MT_APP && MT_APP.name) || 'MedTech';
  let corpo;
  if (deferredPrompt) corpo = `<p>Abre como app, em tela cheia, direto da tela inicial.</p><div class="inst-r"><button type="button" class="b ok" data-instalar><i class="ti ti-download" aria-hidden="true"></i>Instalar</button></div>`;
  else if (ehIOS()) corpo = `<ol class="inst-p"><li>No Safari, toque em <b>Compartilhar</b> <i class="ti ti-share-2" aria-hidden="true"></i> (na barra de baixo ou de cima).</li><li>Toque em <b>Adicionar à Tela de Início</b>.</li><li>Toque em <b>Adicionar</b>.</li></ol>`;
  else if (ehCelular()) corpo = `<ol class="inst-p"><li>Abra o menu do navegador <i class="ti ti-dots-vertical" aria-hidden="true"></i>.</li><li>Toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</li></ol>`;
  else return '';
  return `<section class="inst${onde === 'ret' ? ' no-ret' : ''}" aria-labelledby="inst-t-${onde}"><div class="inst-h"><span class="inst-ic" aria-hidden="true"><i class="ti ti-device-mobile-down"></i></span><h4 id="inst-t-${onde}">Instale o ${esc(nome)} no celular</h4>
    <button type="button" class="inst-x" data-dispensar aria-label="Dispensar: não mostrar de novo"><i class="ti ti-x" aria-hidden="true"></i></button></div>${corpo}</section>`;
}
function ligaInstalar(raiz){
  (raiz || document).querySelectorAll('[data-instalar]').forEach(b => b.onclick = async () => {
    if (!deferredPrompt) return; const ev = deferredPrompt; deferredPrompt = null;
    ev.prompt(); try { await ev.userChoice; } catch(e) {}
    renderInstalar(); const hb = document.getElementById('btnInstall'); if (hb) hb.hidden = true;
  });
  (raiz || document).querySelectorAll('[data-dispensar]').forEach(b => b.onclick = () => { lsGravar('mt.instalar.dispensado', Date.now()); b.closest('.inst').remove(); });
}
function renderInstalar(){ const c = document.getElementById('instCard'); if (!c) return; c.innerHTML = htmlInstalar('portal'); ligaInstalar(c); }
/* apps escolhidos na calculadora do site: aplicados assim que a compra liberar vagas */
async function escolhaPendente(){
  let pend = null; try { pend = JSON.parse(localStorage.getItem('mt.escolha.pendente') || 'null'); } catch(e){}
  if (!pend || !ACESSO || !ACESSO.venda || !ACESSO.mt || pend.linha !== LINHA) return;
  const vg = MTAcesso.vagas(ACESSO.P, ACESSO.mt, LINHA); if (!vg) return;
  const atuais = MTAcesso.escolhidos(ACESSO.P, ACESSO.mt, LINHA);
  const novos = [...new Set(atuais.concat(pend.apps))].slice(0, vg);
  try { await MTAcesso.chamar('mtEscolherApps', { linha: LINHA, apps: novos }, MT.user); await MT.user.getIdToken(true); ACESSO.mt = await MTAcesso.lerMt(MT.user, false); localStorage.removeItem('mt.escolha.pendente'); renderGrid(); } catch(e) { console.warn('escolha pendente', e); }
}
function aviso(txt){
  const d = document.createElement('div'); d.className = 'aviso'; d.setAttribute('role', 'status'); d.textContent = txt;
  document.body.appendChild(d); setTimeout(() => d.remove(), 7000);
}
async function carregaAcesso(){
  if (ACESSO !== null || !window.MT || !MT.user || MT.user.demo) return;
  ACESSO = false;   // em andamento
  try { ACESSO = (await MT.acessoEstado()) || { venda: false }; } catch(e) { ACESSO = { venda: false }; }
  renderGrid(); preencheAssinatura(); renderFaixa(); planoDaURL(); escolhaPendente(); chegadaPagamento(); retomarPlano();
}

    el.innerHTML = '';
    hello.textContent = 'Bem-vindo';

}
let perfilOferecido = !!(PLANO_URL || VOLTA_PAG);   // chegando para pagar ou voltando do pagamento: sem o modal de perfis por cima
document.addEventListener('click', e => {
  const a = e.target.closest('.app.trav'); if (!a) return;

});
(function waitMT(){ if(window.MT){ MT.onData(function(){
  refreshUser(); renderGrid(); renderFaixa(); carregaAcesso();

  const u = MT.user, d = dados();
  if (!perfilOferecido && u && !u.demo && !(d && d[CAMPO_SEL] && Array.isArray(d[CAMPO_SEL].sel))) { perfilOferecido = true; setTimeout(() => { if (!document.getElementById('appsModal')) openMeusApps(); }, 500); }
}); refreshUser(); } else setTimeout(waitMT,40); })();

/* PWA: service worker + botão instalar */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferredPrompt = e;
  const b = document.getElementById('btnInstall'); b.hidden = false;
  b.onclick = async () => { if (!deferredPrompt) return; const ev = deferredPrompt; deferredPrompt = null; b.hidden = true; ev.prompt(); try { await ev.userChoice; } catch(err) {} renderInstalar(); };
  renderInstalar();
  const r = document.querySelector('#retModal .ret-ok') && document.querySelector('#retModal .sug-box');
  if (r && !r.querySelector('.inst')) { r.insertAdjacentHTML('beforeend', htmlInstalar('ret')); ligaInstalar(r); }
});
window.addEventListener('appinstalled', () => { const b=document.getElementById('btnInstall'); if(b) b.hidden=true; deferredPrompt = null; document.querySelectorAll('.inst').forEach(x => x.remove()); });
renderInstalar();
</script>
