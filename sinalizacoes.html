<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Questões sinalizadas — administração MedTech</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>window.MT_APP={id:"admin-sinalizacoes",name:"Sinalizações",linha:"admin"};</script>
<script src="_mtfb.js?v=1"></script>
<script type="module" src="_mtauth.js?v=26"></script>
<style>
/* Caixa central das questões sinalizadas pelos apps de estudo (26/09/2026). Mesmo visual do acessos.html.
   Só a administração consegue listar: a função mtSinal confere o e-mail de admin a cada chamada. */
:root{--fg:#fff;--m:rgba(255,255,255,.66);--l:rgba(255,255,255,.12);--p:rgba(255,255,255,.06);--vermelho:#FF8A80;--verde:#7EE2A8;--ambar:#FFD27A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:var(--fg);font:15px/1.5 Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:calc(56px + env(safe-area-inset-top)) 16px 48px}
main{max-width:920px;margin:0 auto}
h1{font-size:26px;font-weight:500;letter-spacing:-.02em}
.sub{color:var(--m);margin-top:6px;max-width:700px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.bar span{color:var(--m);font-size:13px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.filtros select,.filtros input{min-height:42px;padding:0 12px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:#141416;color:#fff;font:inherit;font-size:14px}
.filtros input{flex:1 1 200px}
button{min-height:42px;padding:0 18px;border-radius:999px;border:0;background:#fff;color:#000;font:500 14px Inter,system-ui,sans-serif;cursor:pointer}
button.g{background:rgba(255,255,255,.12);color:#fff}
button:disabled{opacity:.5;cursor:wait}
.resumo{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.resumo span{padding:6px 12px;border-radius:999px;background:var(--p);font-size:13px;color:var(--m)}
.resumo b{color:#fff;font-weight:600}
.item{margin-top:12px;padding:16px;border-radius:16px;background:var(--p);border:1px solid transparent}
.item.aberta{border-color:rgba(255,138,128,.35)}
.topo{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px}
.app{font-weight:600}
.tipo{color:var(--vermelho);font-weight:600}
.st{margin-left:auto;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(255,255,255,.1)}
.st.aberta{color:var(--vermelho)}.st.corrigida{color:var(--verde)}.st.descartada{color:var(--m)}
.q{margin-top:8px;font-size:15px}
.nota{margin-top:8px;padding:10px 12px;border-radius:10px;background:#141416;white-space:pre-wrap;font-size:14px}
.meta{margin-top:8px;font-size:12.5px;color:var(--m);word-break:break-all}
.acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.acoes input{flex:1 1 220px;min-height:40px;padding:0 12px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:#141416;color:#fff;font:inherit;font-size:14px}
.acoes button{min-height:40px;padding:0 14px}
.resp{margin-top:8px;font-size:13px;color:var(--verde)}
.vazio,.erro{margin-top:22px;padding:18px;border-radius:14px;background:var(--p);color:var(--m)}
.erro{color:var(--vermelho)}
textarea.rel{width:100%;min-height:200px;margin-top:12px;padding:12px;border-radius:12px;border:1px solid var(--l);background:#0B0B0C;color:#fff;font:12.5px/1.5 ui-monospace,Menlo,monospace}
@media (max-width:600px){.st{margin-left:0}}
</style>
</head>
<body>
<main>
  <h1>Questões sinalizadas</h1>
  <p class="sub">Tudo o que os usuários marcaram com a bandeira de erro no TráfegoTítulo, RadioTítulo, ClínicaMed, FlashMed, Banca ENARE Farmácia e FarmaUTI. Marque como corrigida ou descartada; se a pessoa sinalizar a mesma questão de novo, ela volta a ficar aberta.</p>
  <div class="bar"><span id="quem">Entrando…</span><button class="g" id="btAtualiza">Atualizar</button></div>
  <div class="filtros">
    <select id="fStatus" aria-label="Situação"><option value="aberta">Abertas</option><option value="corrigida">Corrigidas</option><option value="descartada">Descartadas</option><option value="">Todas</option></select>
    <select id="fApp" aria-label="App"><option value="">Todos os apps</option></select>
    <input id="fBusca" type="search" placeholder="Buscar no enunciado, nota, tema ou e-mail" aria-label="Buscar">
    <button class="g" id="btCopia">Copiar relatório</button>
  </div>
  <div class="resumo" id="resumo"></div>
  <div id="lista"><p class="vazio">Carregando…</p></div>
  <div id="saida"></div>
</main>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const TIPO = {gabarito:'Gabarito errado', texto:'Erro no enunciado ou nas alternativas', desatualizada:'Desatualizada (norma ou diretriz mudou)', comentario:'Erro no comentário ou na explicação', outro:'Outro problema'};
  const quando = iso => { try { return new Date(iso).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'}); } catch(e){ return ''; } };
  let TODOS = [], APPS = {};
  async function A(){ if (!window.MTAcesso) await import('/_mtacesso.js?v=1'); return window.MTAcesso; }
  async function chama(dados){ const M = await A(); return M.chamar('mtSinal', dados, MT.user); }

  async function carrega(){
    $('btAtualiza').disabled = true;
    try {
      const r = await chama({op:'listar'});          /* traz todas; os filtros são aqui */
      TODOS = r.itens || []; APPS = r.apps || {};
      const ap = $('fApp').value;
      $('fApp').innerHTML = '<option value="">Todos os apps</option>' + Object.keys(APPS).map(k => `<option value="${k}">${esc(APPS[k].nome)}</option>`).join('');
      $('fApp').value = ap;
      desenha();
    } catch (e) {
      $('lista').innerHTML = `<p class="erro">${esc(e.message || e)}${/permission|administra/i.test(e.message||'') ? '<br>Entre com a conta de administração do MedTech.' : ''}</p>`;
    } finally { $('btAtualiza').disabled = false; }
  }
  function filtrados(){
    const st = $('fStatus').value, ap = $('fApp').value, b = $('fBusca').value.trim().toLowerCase();
    return TODOS.filter(x => (!st || x.status === st) && (!ap || x.app === ap) &&
      (!b || [x.q, x.nota, x.tema, x.email, x.extra, x.chave].join(' ').toLowerCase().includes(b)));
  }
  function desenha(){
    const cont = {aberta:0, corrigida:0, descartada:0}; TODOS.forEach(x => cont[x.status] = (cont[x.status]||0) + 1);
    $('resumo').innerHTML = `<span><b>${cont.aberta}</b> abertas</span><span><b>${cont.corrigida}</b> corrigidas</span><span><b>${cont.descartada}</b> descartadas</span>`;
    const L = filtrados();
    if (!L.length) { $('lista').innerHTML = `<p class="vazio">Nenhuma sinalização ${$('fStatus').value ? ({aberta:'aberta',corrigida:'corrigida',descartada:'descartada'})[$('fStatus').value] : ''} com esses filtros.</p>`; return; }
    $('lista').innerHTML = L.map(x => `
      <div class="item ${esc(x.status)}" data-id="${esc(x.id)}">
        <div class="topo"><span class="app">${esc(x.appNome || x.app)}</span><span class="tipo">${esc(TIPO[x.tipo] || x.tipo)}</span>${x.tema ? `<span>${esc(x.tema)}</span>` : ''}<span class="st ${esc(x.status)}">${esc(x.status)}</span></div>
        <div class="q">${esc(x.q)}</div>
        ${x.nota ? `<div class="nota">${esc(x.nota)}</div>` : ''}
        <div class="meta">${esc(x.email || ('aparelho ' + (x.dispositivo || '').slice(0, 8)))} · ${esc(quando(x.em))}${x.vezes > 1 ? ` · sinalizada ${x.vezes}×` : ''}${x.retiradaPeloUsuario ? ' · a pessoa tirou a bandeira depois' : ''}<br>chave: ${esc(x.chave)}${x.extra ? ' · ' + esc(x.extra) : ''}</div>
        ${x.resposta ? `<div class="resp">Resposta: ${esc(x.resposta)}${x.tratadaEm ? ' (' + esc(quando(x.tratadaEm)) + ')' : ''}</div>` : ''}
        <div class="acoes">
          <input type="text" maxlength="600" placeholder="Nota da correção (opcional)" value="${esc(x.resposta || '')}" aria-label="Nota da correção">
          ${x.status !== 'corrigida' ? '<button data-st="corrigida">Corrigida</button>' : ''}
          ${x.status !== 'descartada' ? '<button class="g" data-st="descartada">Descartar</button>' : ''}
          ${x.status !== 'aberta' ? '<button class="g" data-st="aberta">Reabrir</button>' : ''}
        </div>
      </div>`).join('');
    $('lista').querySelectorAll('[data-st]').forEach(b => b.onclick = async () => {
      const it = b.closest('.item'); const id = it.dataset.id;
      it.querySelectorAll('button').forEach(x => x.disabled = true);
      try {
        await chama({op:'marcar', id, status: b.dataset.st, resposta: it.querySelector('input').value.trim()});
        const x = TODOS.find(y => y.id === id); x.status = b.dataset.st; x.resposta = it.querySelector('input').value.trim(); x.tratadaEm = new Date().toISOString();
        desenha();
      } catch (e) { alert('Não gravou: ' + (e.message || e)); it.querySelectorAll('button').forEach(x => x.disabled = false); }
    });
  }
  function relatorio(){
    const L = filtrados();
    return [`Questões sinalizadas — ${L.length} — ${new Date().toLocaleDateString('pt-BR')}`, ''].concat(L.map((x, i) =>
      `${i + 1}. [${x.appNome || x.app}] [${TIPO[x.tipo] || x.tipo}] ${x.tema ? '(' + x.tema + ') ' : ''}${x.q}\n   chave: ${x.chave}${x.extra ? ' · ' + x.extra : ''} · ${x.status}` +
      (x.nota ? `\n   nota: ${String(x.nota).replace(/\s+/g, ' ')}` : ''))).join('\n');
  }
  $('btAtualiza').onclick = carrega;
  ['fStatus','fApp'].forEach(id => $(id).onchange = desenha);
  $('fBusca').oninput = desenha;
  $('btCopia').onclick = async () => {
    const t = relatorio();
    try { await navigator.clipboard.writeText(t); $('btCopia').textContent = 'Copiado!'; setTimeout(() => $('btCopia').textContent = 'Copiar relatório', 2000); }
    catch (e) { $('saida').innerHTML = '<textarea class="rel" readonly></textarea>'; const ta = $('saida').querySelector('textarea'); ta.value = t; ta.select(); }
  };
  (async function espera(){
    if (!window.MT || !MT.ready) return setTimeout(espera, 60);
    await MT.ready;
    MT.onData(() => { if (MT.user && !MT.user.demo) { $('quem').textContent = 'Conta: ' + (MT.user.email || MT.user.uid); if (!TODOS.length) carrega(); } });
    if (MT.user && !MT.user.demo) carrega();
  })();
})();
</script>
</body>
</html>
